机信息系统数据案评价的“侵入”行为，非法获取计算机信息系统数据罪中的“侵入”，是指违背被害人意愿、非法进入计算机信息系统的行为，其表现形式既包括采用技术手段破坏系统防护进入计算机信息系统，也包括未取得被害人授权擅自进入计算机系统，还包括超出被害人授权范围进入计算机信息系统。⑤</p>\n<p>（一）关于法条竞合侵犯公民个人信息罪和非法获取计算机信息系统数据罪是法条竞合的关系，公民个人信息数据相比于一般数据信息更具私密性，《刑法》对公民个人信息数据予以特别保护，属于特别法。根据特别法优于普通法的法条竞合处理原则，非法获取的信息是公民个人信息的，涉嫌我国《刑法》第253条之一的侵犯公民个人信息罪；如果非法获取的信息是公民个人信息之外的其他信息的，则涉嫌我国《刑法》第285条第2款的非法获取计算机信息系统数据罪。</p>\n<p>（二）关于想象竞合若被告人骗取他人游戏密码，非法侵入他人计算机信息系统，窃取他人的虚拟币价值达到数额较大，情节严重，被告人一行为触犯数罪名该如何定罪？是构成非法获取计算机信息系统数据罪还是盗窃抑或诈骗罪？例如：被害人游戏账号内的虚拟币被转移是否可以认定为盗窃罪？此类行为在2009年以前往往被定为盗窃罪。2009年《刑法修正案（七）》出台后有了“量身定做”的本罪名，但司法实践中存在不同观点，认为可能存在想象竞合的情况，直到2013年最高院给出明确答复后，才不再以盗窃罪论处，但理论界仍存在争议。</p>\n<p>2013年最高院、最高检在起草《关于办理盗窃刑事案件适用法律若干问题的解释》过程中，有意见认为：对盗窃游戏币等虚拟财产的，应该以盗窃罪定罪处罚。”最高院针对此类意见，研究后的结论是：此意见不妥。此后，2017年9月4日央行等七部委出台《关于防范代币发行融资风险的公告》：代币或“虚拟货币”是不由货币当局发行，不具有法偿性与强制性等货币属性，不具有与货币等同的法律地位，不能也不应作为货币在市场上流通使用。该公告进一步明确，包括比特币在内的相关虚拟货币，并不是真正的货币，其本质属于计算机信息系统数据。</p>\n<p>如此说来，诈骗罪的犯罪对象也是财物，诈骗虚拟货币也不应以诈骗罪来论处。而且，若要符合诈骗罪的其他构成要件，应当明确行为人与被害人在进行交易之前，行为人主观上是否具有非法占有他人钱财的故意，客观上是否实施了虚构事实或隐瞒真相的行为；另外，被害人将游戏账号密码告诉行为人，此行为是否能够等同于其将游戏账号里的游戏币也一同处分？即被害人是否基于错误的认识做出了相应的财产处分行为。笔者认为，行为人的主观故意还是需要通过在案证据具体分析判断，并不能一概而论。</p>\n<p>“通过有罪与无罪的判断、对义务与权利分配的判断，使人民在精神上相信自己生活在正义的环境里，从而获得对社会的信赖”，没有对网络健康有序环境的基本信赖，用户的网络失范行为将日益增多。⑥司法的判决就是一个判断的过程，无论是民事判决还是刑事判决，对不当使用爬虫技术的行为均持否定态度。</p>\n<p>冯某在常某邀请其通过qq远程方式帮忙操作“阿希币”钱包参加空投项目期间，未经常某允许，将常某存放于电脑中的“阿希币”钱包密码非法获取，后将该钱包中的54868个“阿希币”分批次转走并变卖，法院最终以有利于上诉人的原则将财产损失按最低价值标准来计算被害人的经济损失。⑦</p>\n<p>《关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》第十一条第三款规定：本解释所称“经济损失”，包括危害计算机信息系统犯罪行为给用户直接造成的经济损失，以及用户为恢复数据、功能而支出的必要费用。类似于“阿希币”、“比特币”等虚拟财产与金钱财物等有形财产、电力燃气等有相对恒定价值的无形财产存在明显差别，这些虚拟财产并不是我国认可流通领域的货币，不宜以侵犯财产法益的角度进行评价，应以侵犯公共秩序法益进行评价，且虚拟财产也存在相应价值，作为用户拥有的计算机数据而存在，其法律属性是计算机信息系统数据。对于被害人损失价值的认定，笔者认为从被害人购入价格、被告人变卖价格、案发时交易平台价格这三个价格中，根据有利于被告人原则，选取最低值来认定被害人的财产损失是适当的，且此类犯罪中被害人损失价值的认定对于定罪量刑至关重要，其中还涉及证据如何认定的问题。</p>\n<p>数据运用的广泛外部性和信息保护的隐秘性需求极具对抗的现实，督促互联网企业在企业发展道路上必须建立起有效的合规数据管理和应用流程。</p>\n<p>（一）规范爬虫技术的信息收集对于近年来出现的个人信息收集、泄露乱象，国家针对个人信息收集与使用已经陆续出台了一系列法律法规，例如网络安全法、个人信息保护法、数据安全管理办法（试行及再次征求意见稿）、数据安全标准体系建设指南等。结合上述文件精神，互联网企业在收集个人信息时必须遵循“合法正当”、“知情同意”和“最小必要”原则，而实践中，互联网公司应当从以下几个方面对于相关原则予以落实：首先，公开收集、使用个人信息的规则⑧，便于公民查询、修改、注销；其次，用户在首次注册或运行网页时以弹窗等明显的方式，通过设置最低阅读时限引导用户阅读隐私政策，在隐私政策中必须明示收集个人信息的目的、方式、范围等，并取得用户明确授权；再次，个人用户在拒绝授权时不得频繁征求用户同意干扰其正常使用或以开启业务功能等方式强行捆绑收集个人信息；最后，在涉及收集用户个人敏感信息时，应逐项获得主体的明示授权，特别是涉及收集个人生物识别信息时，明确收集的范围、方式、时间，应当按照直接关联、最低频率、最少数量的标准收集、使用，逐项征得个人用户的明示同意并向所在地网信部门备案。规范性收集行为，方可为互联网公司收集个人信息后的整合、分析、使用数据等行为创设合规性的基础⑨。</p>\n<p>（二）规范获取数据的技术设置及措施确保获取数据技术规范合规是互联网企业设置合规计划的重要环节。简单而言就是规范应用爬虫技术。那么，需要满足以下条件：首先，优化robots协议，设置受法律保护的特定类型信息不受抓取，并且加强反爬虫技术；其次，对于网络爬虫的行为应当以不阻碍被访问网页正常运作为标准；最后，对于抓取的信息中包含个人敏感信息或商业秘密等，在未明确授权的基础上应当及时停止并删除。</p>\n<p>随着网络大数据时代的来临,数据增长给人们日常生活带来诸多红利的同时也衍生了许多风险和危机。比如：互联网用户企业数据、个人信息被泄露、滥用甚至盗用。如果“对数据抓取行为不加以限制约束，收集、处理、经营数据的相关平台以及提供优质内容用户的权益便都无法得到保障，从长远来看必将对互联网内容产业产生负面影响”⑩。基于维护法律秩序与互联网产业健康发展的需要，对网络爬虫行为涉刑案件进行研究，由此提出合规性建议，能充分有效预防利益驱使下数据滥用带来的涉刑风险。</p>\n<p>无论是规范信息收集还是获取数据的技术规范，互联网公司在信息的获取、存储和使用环节均承担着保障信息与数据安全的义务。企业需要明确获取数据的主要技术——网络爬虫，可能涉及的刑事风险与行为边界，并以此作为互联网企业或个人的合规指引，设置规范化管理路径，从而找到数据红利与信息危机之间的平衡。</p>\n<p>参考文献：</p>\n<p>①刘鹏：《利用网络爬虫技术获取他人数据行为的法律性质分析》，《信息安全研究》2019年第5期。</p>\n<p>②徐宗新、陈沛文：《数据红利与信息危机——兼论网络爬虫的罪与罚》，《上海法学研究》集刊2021年第7卷。</p>\n<p>③游涛、计莉卉：《使用网络爬虫获取数据行为的刑事责任认定——以“晟品公司”非法获取计算机信息系统数据罪为视角》，《法律适用》2019年第10期。</p>\n<p>④参见北京市海淀区人民法院(2017)京0108刑初2384号刑事判决书。</p>\n<p>⑤参见深圳市中级人民法院(2021)粤03刑终1657号刑事裁定书。</p>\n<p>⑥刘艳红：网络爬虫行为的刑事规制研究——以侵犯公民个人信息犯罪为视角，《政治与法律》2019年第11期。</p>\n<p>⑦参见河南省济源中级人民法院（2020）豫96刑终7号刑事裁定书。</p>\n<p>⑧参见洪延清：《网络运营者隐私条款的多角色平衡和创新》，《中国信息安全》2017年第9期；郑佳宁：《知情同意原则在信息采 集中的适用与规则构建》，《东方法学》2020年第2期。</p>\n<p>⑨徐宗新、陈沛文：《数据红利与信息危机——兼论网络爬虫的罪与罚》，《上海法学研究》集刊2021年第7卷。</p>\n<p>⑩杨东、吴之洲:《数据抓取行为的法律性质——“马蜂窝事件”案例分析》，《中国社会科学报》2018年12月5日，第5版。</p>\n<h2>全国法院典型案例 |涉“网络爬虫非法抓取电子书”侵犯著作权罪案（附音频）</h2>\n<p>在第21个世界知识产权月，China IP 特别策划推出“2020年度全国法院知识产权典型案例”，此次策划涵盖了近30家全国各地法院推荐的170个典型案例，以供读者更加详实地了解我国知识产权案件的审判趋势及发展特点。</p>\n<h3>涉“网络爬虫非法抓取电子书”侵犯著作权罪案</h3>\n<p>一审案号：（2020）京0108刑初237号</p>\n<p>涉“网络爬虫非法抓取电子书”侵犯著作权03:38</p>\n<p>被告单位：北京鼎阅文学信息技术有限公司（简称鼎阅公司）</p>\n<p>被告人：覃某某、柯某、刘某等12人</p>\n<p>被告单位鼎阅公司自2018年开始，在覃某某等12名被告人负责管理或参与运营下，未经掌阅科技股份有限公司、北京幻想纵横网络技术有限公司等权利公司许可，利用网络爬虫技术爬取正版电子图书后，在其推广运营的“鸿雁传书”“TXT全本免费小说”等10余个App中展示，供他人访问并下载阅读，并通过广告收入、付费阅读等方式进行牟利。根据经公安机关依法提取收集并经勘验、检查、鉴定的涉案侵权作品信息数据、账户交易明细、鉴定结论、广告推广协议等证据，法院查明，涉案作品侵犯掌阅科技股份有限公司、北京幻想纵横网络技术有限公司享有独家信息网络传播权的文字作品共计4603部，侵犯中文在线数字出版集团股份有限公司享有独家信息网络传播权的文字作品共计469部。被告人覃某某等12人于2019年3月被抓获归案。公诉机关于2020年1月10日向北京知识产权法院提起公诉。</p>\n<p>一审法院认为，鼎阅公司、直接负责的主管人员覃某某等12名被告人以营利为目的，未经著作权人许可，复制发行他人享有著作权的文字作品，情节特别严重，其行为均已构成侵犯著作权罪，应予惩处。公诉机关指控鼎阅公司及覃某某等12名被告人犯有侵犯著作权罪的事实清楚，证据确实充分，指控罪名成立。据此，一审法院判决：鼎阅公司及覃某某等12名被告人均犯侵犯著作权罪，判处鼎阅公司罚金150万元；判处覃某某等四人有期徒刑三年，罚金80至20万元不等；判处陈某等五人有期徒刑一年十个月，罚金15万元；判处陈某某、梁某某二人有期徒刑一年六个月、缓刑二年，罚金分别为8万元、5万元；判处王某某有期徒刑一年三个月、缓刑一年六个月，罚金3万元。一审宣判后，各方均服判，未提起上诉。</p>\n<h3>典型意义</h3>\n<p>本案是北京市近年来破获的涉案人员最多、涉案作品种类最多、影响最大的一起网络侵犯著作权犯罪案件。本案涉及网络电子书侵权的新类型犯罪，其犯罪手段、对象及途径新颖，既涉及网络爬虫及自营App推广运营专业技术问题，又涉及网络电子证据收集评价、电子书权属及数量认定等法律专业问题，具有典型性和研究价值。 本案审理中，针对爬虫技术网络抓取行为的“非法性”论证，侵权作品“同一性”对比鉴定检材提取形式、手段及鉴定结论合法性认定，电子书与实体纸质书在证据收集认定、性质评价、作品数量认定及危害情节评定方面的差异论述，法院突破传统办案思维，提出许多较为新颖有据的裁判观点，有理有据，契合打击新型知识产权犯罪的现实需求，为类似案件的审理提供了借鉴。 本案入选“2020年度北京法院知识产权司法保护十大案例”。</p>\n<h2>利用“爬虫软件\"获取某 TOP 级平台 11.8 亿条数据!嫌疑人被判刑!</h2>\n<p>逯某，男，1978年出生，河南省商丘市人，本科文化，无业。因涉嫌非法获取计算机信息系统数据、非法控制计算机信息系统罪，于2020年8月15日被商丘市公安局新城分局刑事拘留，2020年9月22日被逮捕。</p>\n<p>黎某，男，1983年出生，湖南省浏阳市人，初中毕业，个体。因涉嫌侵犯公民个人信息罪，2020年8月21日被抓获，于2020年8月22日被商丘市公安局新城分局刑事拘留，同年9月22日被逮捕。</p>\n<p>黎某在湖南省浏阳市成立了浏阳市泰创网络科技有限公司（自然人独资），该公司设有返利部、客服部、招商部等部门。</p>\n<p>逯某受雇于黎某，作为公司技术员，每月工资一万元。</p>\n<p>自2019年11月，逯某在商丘市睢阳区其家中利用自己开发的爬虫软件，通过网页接口爬取客户信息，并将手机号码提供给黎某，用于浏阳市泰创网络科技有限公司用于经营活动，该公司自2019年11月份至2020年7月份利用该信息经营共获利340187.68元。</p>\n<p>经司法鉴定，逯某通过其开发的软件爬取数字ID、昵称、手机号码等信息共计1180738048条，逯某将其爬取信息中的手机号码通过微信文件的形式发送给黎某使用共计19712611条。</p>\n<h3>证据：</h3>\n<p>受案登记表、立案决定证实，某公司报称警，在2020年7月6日到2020年7月13日时，有黑产通过订单评价接口绕过风控爬取加密数据，爬取内容包括买家用户昵称，用户评价内容，昵称等。经排查发现，逯某有重大作案嫌疑，作案地点河南省商丘市睢阳区新城街道长江路民政局家属院，立为刑事案件。</p>\n<p>国家林业局森林公安司法鉴定中心物证检验报告证实，对逯某、黎某手机数据恢复、提取、鉴定。</p>\n<p>福建中证司法鉴定中心司法鉴定意见，（逯某台式主机1台）在送检台式主机中检出MYsq1数据，数据库中只包含一张数据表“userinfo”,在”userinfo”表中提取出1180738048条记录。</p>\n<p>情况说明证实，（调取逯某电脑数据库中数据的真实性说明）逯某数据库数据统计，共有12亿条数据，据抽样1W条数据进行排查属正确关系对数据。主要字段包含用户ID，用户昵称，手机号，注册时间等信息。</p>\n<p>浏阳市泰创网络科技有限公司员工花名册证实，浏阳市泰创网络科技有限公司总经理为黎某，综合管理部有5人、招商部有4人、一组人员有12人、二组人员有10人，该公司共32人。</p>\n<h3>证人证言，其系平台安全风控员：</h3>\n<p>2020年7月13日，其在工作中发现，平台的评价接口存在异常流量行为，经排查后发现有黑产通过破解接口的形式进行加密数据的爬取，在2020年7月13日至2020年7月20日之间爬取了3500万条数据。平台派工作人员前往商丘市公安局犯罪侦查支队直属二大队协查调查，通过嫌疑人逯某的电脑硬盘信息分析统计，共计12亿条手机号、用户昵称等加密相关信息。</p>\n<h3>逯某供述与辩解：</h3>\n<p>2017年7月在QQ群里认识了黎某，黎某当时在做推广，需要一些推广软件。我为黎某编了个“微信加人”软件，没收钱，黎某承诺说算我技术入股，等以后成立公司了再与我算钱。2019年3月份黎某成立了公司，我成为公司技术员，一直在家远程办公，也就是从2019年3月份黎某给我每月1万元报酬。</p>\n<p>2019年11月份我开始用自写软件“X评评”，通过商品详细信息接口和信息分享接口，可以爬取客户的数字ID和昵称，通过分享接口可以爬取客户手机号信息。其中爬取的客户手机号码信息我都提供给黎某了，爬取的客户ID和昵称我都存在了自己的电脑硬盘里，没有提供给黎某和外泄。且自2019年11月份起，逯某爬取采集成功的数据最起码有5000万条，每条分为3个字段包含UID、昵称、用户手机号。</p>\n<p>公司做平台宝返利，主要用这些手机号加对方微信好友进行推广商品，让用户领取优惠券，对方使用优惠券成功购买商品，我们公司会获得返利。</p>\n<h3>黎某供述与辩解：</h3>\n<p>自2012年开始做推稿生意，通过做推广赚取佣金，因为做推广需要大量客户联系方式。2017年7月在网上认识的逯某，他帮我做了个“微信加人”软件，因没怎么挣到钱，我俩商量每月给逯某1万元工资，后来我成立了浏阳市泰创网络科技公司，逯某作为技术员，在2019年底，逯某利用自写软件通过技术手段爬取信息后，不定时的通过微信文件把公司需要的手机号码直接发送给我。我在收到手机号码之后会把这些信息数据导入“微信加人”软件，加微信好友成功后，由浏阳市泰创网络科技有限公司的员工负责发送广告链接，用户在该公司的广告群里购买商品，该公司获得佣金。</p>\n<p>关于逯某辩称，只采集了五千万条。经查，某公司报警称，自2020年7月6日至7月13日每天被侵犯信息都有500万条，逯某供述其自2019年11月开始爬取信息的，在提取逯某电脑硬盘检测有11亿多条信息，两证据能相互印证逯某采集的信息数量。其辩解与事实不符，法院不予采信。</p>\n<h3>法院裁决：</h3>\n<p>逯某受雇于黎某，二人违反国家规定，非法获取公民个人信息，情节特别严重，其行为均已构成侵犯公民个人信息罪。公诉机关指控罪名成立。且系共同犯罪，逯某、黎某有坦白情节，且认罪认罚，对其均可从轻处罚。综合其犯罪情节及社会危害性，依照《中华人民共和国刑法》第二百五十三条之一、第二十五条第一款、第六十七条第三款、第五十二条、第五十三条、第六十四条之规定，判决如下：</p>\n<p>黎某犯侵犯公民个人信息罪，判处有期徒刑三年六个月，并处罚金人民币三十五万元。</p>\n<p>逯某犯侵犯公民个人信息罪，判处有期徒刑三年三个月，并处罚金人民币十万元。</p>\n<p>黎某、逯某违法所得依法继续予以追缴上缴国库。</p>\n<h2>通过爬虫程序大量获取用户信息涉嫌违反犯罪——最高检发布第三批涉案企业合规典型案例之一</h2>\n<p>近日，最高人民检察院发布第三批涉案企业合规典型案例，这也是今年4月最高检部署在全国范围全面推开涉案企业合规改革试点工作之后，首次发布涉案企业合规典型案例。该批典型案例从检察机关近期办理完结的案件中选出，充分考虑大中小微不同企业类型合规特点，既有针对大中型企业开展的专项合规，也有对小微企业开展的简式合规，典型案例更具代表性。</p>\n<h3>案例一</h3>\n<p>上海Z公司、陈某某等人非法获取计算机信息系统数据案</p>\n<p>检察机关针对互联网科创企业的数据合规漏洞，深入开展社会调查，积极引导涉案企业开展数据合规。综合考虑涉案企业行业属性、技术行为合规规则，组建独立、专业的第三方组织，提升涉案企业数据合规监督评估有效性。能动创新优化合规考察模式，在疫情期间灵活运用智慧检务开展“云听证”，兼顾办案的公开与效率，助力复工复产。多措并举推动行业治理，促进互联网行业建立健全数据合规经营体系，助力构建健康清朗的网络生态环境。</p>\n<h3>一、基本案情</h3>\n<p>上海Z网络科技有限公司（以下简称“Z公司”）成立于2016年1月，系一家为本地商户提供数字化转型服务的互联网大数据公司。Z公司现有员工1000余人，年纳税总额1000余万元，已帮助2万余家商户完成数字化转型，拥有计算机软件著作权10余件，2020年被评定为高新技术企业。被不起诉人陈某某、汤某某、王某某等人分别系该公司首席技术官、核心技术人员。</p>\n<p>2019年至2020年，在未经上海E信息科技有限公司（以下简称“E公司”，系国内特大型美食外卖平台企业）授权许可的情况下，Z公司为了以提供超范围数据服务吸引更多的客户，由公司首席技术官陈某某指使汤某某等多名公司技术人员，通过“外爬”“内爬”等爬虫程序（按照一定的规则，在网上自动抓取数据的程序），非法获取E公司运营的外卖平台（以下简称“E平台”）数据。其中，汤某某技术团队实施“外爬”，以非法技术手段，或利用E平台网页漏洞，突破、绕开E公司设置的IP限制、验证码验证等网络安全措施，通过爬虫程序大量获取E公司存储的店铺信息等数据。王某某技术团队实施“内爬”，利用掌握的登录E平台商户端的账号、密码及自行设计的浏览器插件，违反E平台商户端协议，通过爬虫程序大量获取E公司存储的订单信息等数据。上述行为造成E公司存储的具有巨大商业价值的海量商户信息被非法获取，同时造成E公司流量成本增加，直接经济损失人民币4万余元。</p>\n<p>案发后，Z公司、陈某某等人均认罪认罚，Z公司积极赔偿被害单位经济损失并取得谅解。2020年8月14日，上海市公安局普陀分局以陈某某等人涉嫌非法获取计算机信息系统数据罪提请上海市普陀区检察院审查逮捕。8月21日，普陀区检察院经审查认为，陈某某等人不具有法律规定的社会危险性，依法决定不批准逮捕。2021年6月25日，上海市公安局普陀分局以陈某某等人涉嫌非法获取计算机信息系统数据罪移送普陀区检察院审查起诉。2022年5月，普陀区检察院依法对犯罪嫌疑单位Z公司、犯罪嫌疑人陈某某等14人作出不起诉决定。</p>\n<h3>二、企业合规整改情况及效果</h3>\n<p><strong>一是介入侦查，把准案件定性。</strong>因本案罪名涉及专业领域、作案手法复杂，侦查之初，普陀区检察院即应公安机关邀请介入侦查，引导取证，明确鉴定方向。一方面，引导公安机关固定Z公司爬虫程序、云服务器电子数据，以查清爬虫的运行模式、被爬取的数据属性等关键事实并加以鉴定。同时，走访被害企业，深入核实被害企业数据防护措施、直接经济损失等，为认定案件事实补充完善证据链条。另一方面，引导公安机关在讯问时关注作案动机、Z公司现状及发展前景等与企业合规相关的问题，督促Z公司积极赔偿被害企业损失，消除影响，同时会同执法司法机关、监管部门、专家学者，围绕爬虫的技术原理、合法性边界、法律适用及数据合规重点、难点，深入开展研讨交流，为案件定性、开展企业合规整改奠定工作基础。</p>\n<p><strong>二是认真审查，启动合</strong><strong>规</strong><strong>考察。</strong>案件移送审查起诉后，普陀区检察院经实地走访Z公司查看经营现状以及会同监管部门研商公司运营情况发现，Z公司管理层及员工存在重技术开发、轻数据合规等问题，此次爬取数据出于自身拓展业务的动机，未进行二次售卖。考虑到Z公司系成长型科创企业，陈某某等14名涉案人员均认罪认罚，积极赔偿E公司经济损失并取得谅解，Z公司合规整改意愿强烈，提交了《适用刑事合规不起诉申请书》及企业经营情况、社会贡献度等书面证明材料，检察机关经审查对Z公司作出合规考察决定。</p>\n<p><strong>三是因案制宜，围绕数据合</strong><strong>规</strong><strong>专项计划精准“开方”，对涉案企业开展专业第三方监督评估。</strong>经走访座谈、办案调研，普陀区检察院发现，Z公司存在管理盲区、制度空白、技术滥用等合规风险，遂向Z公司制发《合规检察建议书》，从数据合规管理、数据风险识别、评估与处理、数据合规运行与保障等方面提出整改建议。Z公司积极整改，并聘请法律顾问制定数据合规专项整改计划。同时，鉴于开展数据合规的专业性要求较高，本案第三方组织吸纳网信办、知名互联网安全企业、产业促进社会组织等的专家成员，通过询问谈话、走访调查、审查资料、召开培训会等形式，全程监督Z公司数据合规整改工作。第一，数据来源合规。Z公司与E公司达成合规数据交互约定，彻底销毁相关爬虫程序及源代码，对非法获取的涉案数据进行无害化处理，并与E平台API数据接口直连，实现数据来源合法化。第二，数据安全合规。Z公司设立数据安全官，专项负责数据安全及个人信息安全保护工作；构建数据安全管理体系，制定、落实《数据分类分级管理制度》《员工安全管理等级》；加入区级态势感知平台，提升安全威胁的识别、响应处置能力，分拆服务，提高云访问权限，数据及时脱敏、加密，增强网络攻击防护能力。第三，数据管理制度合规。Z公司建立数据合规委员会，制定常态化合规管理制度，开展合规年度报告。</p>\n<p><strong>四是“云听证”，确保监督评估考察公正透明。</strong>三个月考察期限届满，第三方组织评估认为，涉案企业与个人积极进行合规整改，建立合规组织、完善制度规范、提升技术能级，已完成数据合规建设的整改措施。2022年2月，评定Z公司合规整改合格。普陀区检察院通过听取汇报、现场验收、公开评议等方式对监督考察结果予以充分审查。为保障涉案企业及时复工复产，同年4月28日，普陀区检察院因应疫情开展“云听证”，邀请全国人大代表、人民监督员、侦查机关、第三方组织、被害单位等线上参加或旁听。经评议，参与听证各方一致同意对涉案人员作出不起诉决定。同年5月10日，检察机关经审查后认为，因本案犯罪情节轻微，Z公司及犯罪嫌疑人具有坦白、认罪认罚等法定从宽处罚情节，积极退赔被害企业损失并取得谅解，系初犯，主观恶性小，社会危害性不大，且Z公司合规整改经第三方考察评估合格，依法对Z公司、陈某某等人分别作出不起诉决定。</p>\n<p><strong>五是企业合</strong><strong>规整改见实效</strong><strong>、显长效。</strong>为确保企业将数据合规内化为长效机制，根据检察机关不定期回访工作了解，Z公司认真落实合规整改，与E平台达成数据交互合作，通过API数据接口直连，合法合规获取平台数据。同时，Z公司将其与E平台的合作模式进行复制、移植，与3家大型互联网企业达成数据合作。Z公司通过扎实开展企业合规，建立健全数据合规长效机制，公司实现稳步发展，分支机构在全国覆盖面进一步扩大，员工人数比2020年底增加400余人，2021年度全年营收2亿余元，纳税总额1700余万元。</p>\n<h3>三、典型意义</h3>\n<p><strong>1.合</strong><strong>规</strong><strong>准备工作前移，积极推动侦查过程中合</strong><strong>规</strong><strong>准备工作，为审查起诉阶段的合</strong><strong>规</strong><strong>监督考察奠定基础。</strong>本案中检察机关积极利用提前介入侦查，引导公安机关收集合规信息与材料，为后续合规工作的高效开展奠定坚实基础。对于挽救企业而言，早合规优于晚合规，检察机关应当与侦查机关密切配合、相向而行，综合运用好介入侦查引导取证、审查逮捕、强制性措施适用等法定职权，把促进合规的工作做在前面，推动合规改革释放出最优效果。</p>\n<p><strong>2.组建专业化第三方组织，提升涉案企业数据合</strong><strong>规</strong><strong>监督评估的有效性。</strong>检察机关立足区域内互联网产业集聚特点，推动设立涉互联网第三方专业人员名录库。针对涉及“网络爬虫”等数据合规专业领域情况，检察机关经社会调查认定涉案企业符合企业合规第三方机制适用条件，商请第三方机制管委会从专类名录库中抽取了由互联网行业管理部门、行业龙头企业和专业协会人员组成的第三方组织，为第三方机制运转提供专业性、公正性、协同性支撑。检察机关依托第三方组织的专业优势，以召开评估工作现场会的形式对涉案企业合规计划的可信性、有效性与全面性进行充分审查，围绕案件反映的数据获取问题开展“因罪施救”“因案明规”，督促涉案企业构建有效的数据合规整改体系，做到“真合身”“真管用”。</p>\n<p><strong>3.能动履职强化审查把关，多</strong><strong>措</strong><strong>并举保障企业有效推进合规整改。</strong>本案中，检察机关在依法适用第三方机制的基础上，一是强化主导责任，因案制宜加强合规考察的审查把关，主动听取第三方组织对企业合规整改的考察情况，协调有关行政机关将涉案企业纳入监测平台，统筹数据专项合规与全面合规，确保企业合规整改措施全方位落实落细，避免出现“纸面合规”“形式合规”。二是延伸合规激励，秉持惩治与挽救并重，加强检企沟通对接，充分听取被害企业意见，积极推动双方企业实现和解，促成涉案企业与数据来源方达成合规数据交互协议，确保数据来源的合法化，最大限度维护涉案企业正常生产经营。三是深化科技赋能，立足疫情防控常态化下的办案要求，通过“云听证”审查方式兼顾办案公开与效率，召开由全国人大代表、第三方组织、涉案企业参加的线上座谈，听取各方意见，延伸办案效果，实现线上线下对接、场内场外联动，以公开促公正赢公信。</p>\n<p><strong>4.由点及</strong><strong>面推动</strong><strong>行业治理，助力构建健康清朗的网络生态环境。</strong>推动网络空间法治化治理，促进互联网企业守法经营，是检察机关依法能动履职、促进诉源治理肩负的重要责任。数字化转型背景下衍生出的数据侵权、网络犯罪问题，亟需规范引导以保障数字经济高质量发展。本案中，涉案企业与被害企业均为大型互联网科创企业，普陀区检察院深化社会综合治理，依法打击网络灰黑产业链的同时，推动促进互联网行业建立数据合规经营体系。一方面，通过案件办理、检察建议、法治宣传等方式，深入涉案企业所在园区引导广大互联网企业树立数据合规意识，从源头防止再次发生类似违法犯罪。另一方面，以“我管”促“都管”助力营造企业合规文化，推动区政府相关部门、司法机关及30余家区内互联网企业深入落实《普陀区互联网企业合规共识框架》，发布《互联网企业常见刑事法律风险防控提示》，为企业风险防范、合规经营提供法律支持，努力实现“办理一个案件、形成一个合规标准、规范一个行业”的良好效果。</p>\n<h2>因爬虫滥用，CTO和程序员被刑拘</h2>\n<p>数据行业乱象丛生并不是新鲜事，从大规模数据窃取到“流量劫持”，从App超范围信息收集到“大数据杀熟”，数据行业的乱象不止对网络安全和公民个人隐私带来威胁，更是促进了“数据黑产”的发展，“数据黑产”中的主要生产工具就是爬虫程序。作为一个历史悠久的技术，爬虫可以有效地提升信息收集效率，但是近年来，出现了多起因爬虫技术而被判刑的案例。在我国目前的法律法规中，对爬虫技术并没有准确定性，即便有这些判罚案例，大多数人还是摸不着头脑。有些看似罪大恶极却无事发生，有些看似平常无奇却得到了重罚，爬虫的使用尺度到底怎么判断？如何使用爬虫才不会违法呢？</p>\n<p>匹夫无罪？</p>\n<p>2018年8月，由于爬虫失控，对居住证、派出所等系统造成重大影响，KG公司的CTO、程序员被捕。KG公司的主营业务是“助贷”，也就是为按揭贷款购房的客户提供赎楼及债务置换贷款等服务。由于手动查询效率低下，公司产品组选择使用爬虫软件自动查询。CTO安排新入职的程序员负责这个项目，他提供给程序员一个抓取数据的程序源代码，要求程序员修改并用其查询、下载网上的数据。</p>\n<p>2018年4月，居住证系统的承建单位发现系统出现宕机现象，追踪到请求应用服务器端口编号，但因日志缺失而无法定位IP来源，当时怀疑是人为攻击。同年5月，系统再次遭遇攻击，这次管理人员成功地截取了IP地址并报案。</p>\n<p>案发时，某市居住证服务平台的注册用户超过530万。居住证系统受攻击瘫痪期间：软件对某市居住证系统查询访问量为每秒183次，共计查询信息约151万条次，窃取大量建筑物编码数据，造成政府信息泄漏；所有居住证办理、居住登记申报、信息查询、对外服务功能均无法正常工作，影响面极广；市民无法办理居住证和居住登记，相关生产生活秩序受到严重影响。除了此次攻击，还有一些派出所出具证明证实5月期间经常出现系统无法登陆，录入过程频繁出现掉线、系统数据异常等情况。居住证系统无法正常使用、出现异常情况的时间长达一个多月。</p>\n<p>最终，法院认为，二人违反国家规定，对计算机信息系统进行干扰，造成为5万以上用户提供服务的计算机信息系统不能正常运行累计1小时以上，属于后果特别严重，应以破坏计算机信息系统罪追究其刑事责任。CTO，负责并授权程序员开发涉案爬虫软件，系主犯，判处有期徒刑三年；程序员受指派开发爬虫软件，在共同犯罪中起次要作用，系从犯，判处有期徒刑一年六个月。</p>\n<p>另一起案件也反映了滥用爬虫的危害，2019年，某公司发现服务器连续几天压力倍增，导致公司内部系统崩溃不能访问。技术人员调查后发现，公司的客户信息被抓取，并且某个接口访问量巨大，在经过更细致的调查后，最终发现其源头竟然是一家知名的互联网公司——巧达数据集团，该公司的主营业务是出售简历数据库，其高管多半出身于百度，在2017年净赚1.86亿元。2019年，巧达数据集团的200多位员工无差别送进看守所，最终36人被捕，其中多数是程序员，设计爬虫的工程师至今仍在等待审判。</p>\n<p>怀璧其罪！</p>\n<p>有趣的是，这两起案件中，无论是KG公司的CTO及程序员，还是巧达公司的爬虫工程师，最初都不认为自己使用爬虫是违法行为，巧达的工程师也因此失去了“取保候审”的机会。当然，巧达集团涉及的不仅是爬虫滥用，还包括窃取个人隐私及非法买卖数据等，但是，KG公司的两位员工只是遵守上级的要求，没有爬取个人信息，也没有对数据进行买卖，为什么单单只是他们两位受到处罚呢？这就涉及到单位犯罪和个人犯罪。</p>\n<p>除了自然人犯罪，还有单位犯罪，是指公司、企业、事业单位、机关、团体为单位谋取利益，经单位决策机构或者负责人决定实施的，法律规定应当负刑事责任的危害社会的行为。我国刑法对单位犯罪原则上采取双罚制度，即单位犯罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员判处刑罚。相关司法解释规定，在审理单位故意犯罪案件时，对其直接负责的主管人员和其他直接责任人员，可不区分主犯、从犯，按照其在单位犯罪中所起的作用判处刑罚。因此，公司犯罪有可能会牵连员工，尤其是该案件中对非法获取数据有直接责任的CTO和程序员。</p>\n<p>很多时候，身为执行层的程序员在公司人微言轻，对于上级安排的工作不得不服从。即便如此，真正涉及到违法犯罪时，程序员也会作为主犯受到法律的制裁。并且，无论是CTO还是程序员，都很清楚的知道，爬虫软件如果超过服务器承载能力肯定会引起系统卡顿或瘫痪，因此并不是他们不清楚爬虫软件滥用的后果，只不过是心存侥幸，疏于管理，最终自食恶果。</p>\n<p>所以，可以从两个方面判断爬虫软件是否有害，一个是数据类型，这其中包括是否涉及到个人隐私以及同类公司的公开数据，个人隐私受到《个人信息保护法》的保护，未经本人授权是无权处理相关数据；同类公司的公开数据则可能涉及到《反不正当竞争法》，主要业务高度相似的两家企业在处理相关数据更需要谨慎。另一方面就是是否会造成重大影响，据刑法286条“破坏计算机信息系统罪”显示，违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，后果严重的，处五年以下有期徒刑或者拘役；后果特别严重的，处五年以上有期徒刑。该罪的主观要件必须出于故意，过失不能构成本罪，对于KG公司的两位，即便主观上并不是攻击行为，但是他们在清楚失控的后果，因此也是主管犯罪；该罪的客观要件是表现为违反国家规定，并造成严重后果。因此，无论公司决策还是居住证系统承载是否有客观责任，作为主观开发并使用的二人一定会承担相应的法律惩罚。</p>\n<p>“法律总是滞后的”，虽然目前尚无生效法律法规对爬虫程序进行规范，但是，随着爬虫技术的发展，其所能带来的商业利益和损害将会越来越大，国家也势必将祭出更多的立法资源对爬虫进行治理，未来几年的立法资源也势必向这一领域倾斜。或许在未来三五年内，随着《数据安全管理办法》的出台，必将有专门规制及监管“以自动化手段访问收集网站数据”（爬虫程序）的法规出现，以明确爬虫程序中的合规界限。</p>\n<p>或许有人会说技术中立，可是基于我国互联网行业现状，大部分头部企业的网站均设置了反爬虫措施，并且在服务器端也部署了防抓取措施，他人只能经授权，通过API端口获取数据，而不能随意爬取网站服务器上的数据。如果爬虫程序通过伪装等方式，绕过或破解反爬虫措施，接入API端口，从而实现访问网站服务器并读取数据的目的。爬虫技术中立，但是爬虫程序所负载的“外挂”早已失去了中立的地位，无论理由多么冠冕堂皇，欺骗、绕过、破解永远都是违法犯罪的切实罪证。</p>\n<p>或许还会有人说要低调行事，只要不对着政府等相关机构使用爬虫，就不会受到关注和制约。小心驶得万年船永远没错，但是这个小心不是只筛选对象，而是要正视爬虫技术，robots协议不是用来脱罪的理由，一种约定俗成的告示并没有任何法律效力，正确的使用才是救赎之道。</p>\n<p>我国相关法律法规正在逐渐完善，以前可能处于灰色阶段的行业，现在几乎都不能做了。技术本来是无罪的，爬虫技术的主要目的还是为了减少人工成本，提高工作效率，但是用在了错误的地方，就会造成错误的后果。对于程序员而言，首先要对相关的法律法规保持敬畏，尤其是近年来更新频率逐渐提升，一定要全面了解，不能含糊其辞。另一方面，在企业中一定要建立下通上达的沟通渠道，把相关的风险告知给决策层，敢于对有较大风险的工作内容提出质疑和拒绝，毕竟看起来是“集体决策”的决策最后往往并不是集体买单，避免因心存侥幸受牢狱之灾。</p>\n<h2>一起使用爬虫技术抓取数据构成犯罪的案件（裁判文书）</h2>\n<p>望峰君按：网络上的海量信息，森罗万象。如果仍然只是靠两只手，一双眼来点击每一个网页，然后再复制粘贴，那是难以为继的。一种能够在短时间内自动获取网页内容并可以按照指定规则提取相应内容的程序应运而生，这就是“爬虫”。对于技术的新发展，法律要及时给一个“说法”……</p>\n<p>被告单位上海晟品网络科技有限公司，统一社会信用代码×××，住所地上海市徐汇区宜山路810号17幢101A室，法定代表人张洪禹。</p>\n<p>诉讼代表人潘娟，上海晟品网络科技有限公司行政主管。</p>\n<p>辩护人李智慧，北京市冠衡律师事务所律师。</p>\n<p>被告人张洪禹，男，1982年3月5日出生于黑龙江省五常县，公民身份号码×××，汉族，大学肄业，上海晟品网络科技有限公司法定代表人，户籍所在地黑龙江省五常市。因涉嫌犯非法获取计算机信息系统数据罪，于2017年3月4日被羁押，2017年4月7日被取保候审。</p>\n<p>辩护人王珺，北京市兰台律师事务所律师。</p>\n<p>辩护人陈怡，上海宏翰律师事务所律师。</p>\n<p>被告人宋健，男，1984年9月20日出生于山东省莘县，公民身份号码×××，汉族，硕士研究生，曾任北京字节跳动网络技术有限公司视频项目经理、上海晟品网络科技有限公司联席CEO，案发前筹备创立上海右划网络有限公司，户籍所在地山东省聊城市莘县。因涉嫌犯非法获取计算机信息系统数据罪，于2017年2月27日被羁押，2017年4月6日被逮捕。现羁押在北京市海淀区看守所。</p>\n<p>辩护人张佳春，北京天达共和律师事务所律师。</p>\n<p>辩护人陈燕，北京天达共和律师事务所律师。</p>\n<p>被告人侯明强，男，1980年2月14日出生于河南省新乡市，公民身份号码×××，汉族，硕士研究生，曾任北京字节跳动网络技术有限公司视频项目技术负责人、上海晟品网络科技有限公司CTO，案发前筹备创立上海右划网络有限公司，户籍所在地河北省承德市。因涉嫌犯非法获取计算机信息系统数据罪，于2017年2月27日被羁押，2017年4月6日被逮捕。现羁押在北京市海淀区看守所。</p>\n<p>辩护人贾浩天，北京市隆安律师事务所律师。</p>\n<p>被告人郭辉，男，1991年5月19日出生于安徽省霍邱县，公民身份号码×××，汉族，高中文化程度，上海晟品网络科技有限公司职员，户籍所在地安徽省六安市。因涉嫌犯非法获取计算机信息系统数据罪，于2017年3月4日被羁押，2017年4月7日被逮捕。现羁押在北京市海淀区看守所。</p>\n<p>辩护人唐烈文，北京市兰台律师事务所律师。</p>\n<p>辩护人冯珏，上海宏翰律师事务所律师。</p>\n<h3>审理经过</h3>\n<p>北京市海淀区人民检察院以京海检科技刑诉〔2017〕82号起诉书指控被告单位上海晟品网络科技有限公司，被告人张洪禹、宋健、侯明强、郭辉犯非法获取计算机信息系统数据罪，本院于2017年9月15日立案，并依法组成合议庭，适用普通程序，按照认罪认罚从宽制度，公开开庭审理了本案。北京市海淀区人民检察院指派检察员白磊出庭支持公诉，被告单位上海晟品网络科技有限公司及其诉讼代表人潘娟、诉讼代理人李智慧，被告人张洪禹及其辩护人王珺、陈怡，被告人宋健及其辩护人张佳春、陈燕，被告人侯明强及其辩护人贾浩天，被告人郭辉及其辩护人唐烈文（第二次开庭前解除委托）、冯珏到庭参加诉讼。现已审理终结。</p>\n<h3>一审请求情况</h3>\n<p>北京市海淀区人民检察院指控，2016年至2017年间，被告人张洪禹、宋健、侯明强作为被告单位上海晟品网络科技有限公司主管人员，在上海市共谋采用技术手段抓取被害单位北京字节跳动网络技术有限公司（办公地点位于本市海淀区北三环西路43号中航广场）服务器中存储的视频数据，并由侯明强指使被告人郭辉破解北京字节跳动网络技术有限公司的防抓取措施、实施视频数据抓取行为，造成被害单位北京字节跳动网络技术有限公司损失技术服务费人民币2万元。2017年2月27日，被告人宋健、侯明强被公安机关抓获；3月4日，被告人张洪禹、郭辉被公安机关抓获。</p>\n<p>针对上述指控，公诉机关向本院提供了相应的证据材料，认为被告单位上海晟品网络科技有限公司，被告人张洪禹、宋健、侯明强、郭辉的行为已构成非法获取计算机信息系统数据罪，且能如实供述犯罪事实，提请本院依照《中华人民共和国刑法》第二百八十五条第二款、第四款、第三十条、第三十一条、第六十七条第三款之规定，对被告单位上海晟品网络科技有限公司，被告人张洪禹、宋健、侯明强、郭辉定罪处罚。公诉机关提出对被告人张洪禹判处一年二个月以下有期徒刑，并处罚金，适用缓刑的量刑建议；对被告人宋健、侯明强提出判处一年二个月以下有期徒刑，并处罚金的量刑建议；对被告人郭辉提出判处一年以下有期徒刑，并处罚金的量刑建议。被告人张洪禹、宋健、侯明强、郭辉自愿如实供述自己的罪行，对指控的犯罪事实没有异议，同意量刑建议，签署具结书。</p>\n<p>被告单位上海晟品网络科技有限公司，被告人张洪禹、宋健、侯明强、郭辉及其各辩护人对公诉机关指控的事实及罪名没有提出异议。被告单位上海晟品网络科技有限公司的辩护人认为被告单位对于违法性认识不足，取得了被害人谅解，认罪悔罪态度较好，建议从轻处罚；被告人张洪禹的辩护人认为本案系单位犯罪，社会危害性不大，取得了被害人谅解，认罪悔罪态度较好，建议从轻处罚并适用缓刑；被告人宋健的辩护人认为本案系单位犯罪，宋健作用相对较小，违法性认识不足，取得被害单位的谅解，认罪悔罪态度较好，建议从轻处罚；被告人侯明强的辩护人认为本案系单位犯罪，侯明强违法性认识不足，犯罪危害性不大，作用相对较小，建议从轻处罚；被告人郭辉的辩护人认为郭辉认罪态度较好，犯罪情节较轻，社会危害性不大，取得被害单位的谅解，建议从轻处罚。</p>\n<h3>本院查明</h3>\n<p>经审理查明，被告单位上海晟品网络科技有限公司系有限责任公司，经营计算机网络科技领域内的技术开发、技术服务、电子商务、电子产品等业务。被告人张洪禹系上海晟品网络科技有限公司法定代表人兼CEO，负责公司整体运行；被告人宋健于2016年8月至2017年2月任职上海晟品网络科技有限公司，担任联席CEO，系产品负责人；被告人侯明强于2016年8月至2017年2月任上海晟品网络科技有限公司CTO，系技术负责人；被告人郭辉系上海晟品网络科技有限公司职员。被告人张洪禹、宋健、侯明强经共谋，于2016年至2017年间采用技术手段抓取被害单位北京字节跳动网络技术有限公司（办公地点位于本市海淀区北三环西路43号中航广场）服务器中存储的视频数据，并由侯明强指使被告人郭辉破解北京字节跳动网络技术有限公司的防抓取措施，使用“tt_spider”文件实施视频数据抓取行为，造成被害单位北京字节跳动网络技术有限公司损失技术服务费人民币2万元。经鉴定，“tt_spider”文件中包含通过头条号视频列表、分类视频列表、相关视频及评论3个接口对今日头条服务器进行数据抓取，并将结果存入到数据库中的逻辑。在数据抓取的过程中使用伪造device_id绕过服务器的身份校验，使用伪造UA及IP绕过服务器的访问频率限制。2017年2月27日，被告人宋健、侯明强被公安机关抓获；3月4日，被告人张洪禹、郭辉被公安机关抓获。后四人均如实供述了上述事实。本案审理期间，鉴于被告人张洪禹、宋健、侯明强、郭辉真诚悔罪、认罪，坦白相关犯罪事实，被害单位北京字节跳动网络技术有限公司出具刑事谅解书，对被告人张洪禹、宋健、侯明强、郭辉的行为表示谅解。</p>\n<p>法庭审理过程中，公诉人当庭宣读并出示了被告人张洪禹、宋健、侯明强、郭辉的供述，证人常某、汪某的证言，现场勘验检查工作笔录，扣押决定书、清单，北京信诺司法鉴定所司法鉴定意见书，到案经过，北京字节跳动网络技术有限公司关于购买技术服务费发票及损失说明，宋健、侯明强的劳动合同、保密合同，北京字节跳动网络技术有限公司办公场所租赁合同，身份信息等证据材料。经庭审质证，被告单位上海晟品网络科技有限公司，被告人张洪禹、宋健、侯明强、郭辉及其各辩护人对上述证据均未提出异议。上述证据的来源及形式合法，内容客观真实，对其证明效力，本院予以确认。</p>\n<h3>本院认为</h3>\n<p>本院认为，被告单位上海晟品网络科技有限公司违反国家规定，采用技术手段获取计算机信息系统中存储的数据，情节严重，其行为已构成非法获取计算机信息系统数据罪，应予惩处；被告人张洪禹、宋健、侯明强作为直接负责的主管人员，被告人郭辉作为其他直接责任人员，亦应惩处。北京市海淀区人民检察院指控被告单位上海晟品网络科技有限公司及被告人张洪禹、宋健、侯明强、郭辉犯有非法获取计算机信息系统数据罪的事实清楚，证据确实充分，指控罪名成立，量刑建议适当。被告人宋健、侯明强作用相当，但相对被告人张洪禹较小，被告人郭辉较之宋健、侯明强作用次之，在量刑时酌情考虑。鉴于被告单位上海晟品网络科技有限公司及被告人张洪禹、宋健、侯明强、郭辉能够如实供述自己的犯罪事实，违法性认识不足，认罪态度较好；被告人张洪禹、宋健、侯明强、郭辉获得被害单位谅解，加之本案适用认罪认罚从宽制度，故本院依法对其均从轻处罚，并对张洪禹适用缓刑。被告人张洪禹、宋健、侯明强、郭辉的辩护人的辩护意见，本院酌予采纳。对被告人张洪禹依照《中华人民共和国刑法》第二百八十五条第二款、第四款，第三十条，第三十一条，第六十七条第三款，第七十二条，第七十三条第二款、第三款，第五十三条之规定；对被告单位上海晟品网络科技有限公司及宋健、侯明强、郭辉依照《中华人民共和国刑法》第二百八十五条第二款、第四款，第三十条，第三十一条，第六十七条第三款，第五十三条，判决如下：</p>\n<h3>裁判结果</h3>\n<p>一、被告单位上海晟品网络科技有限公司犯非法获取计算机信息系统数据罪，判处罚金人民币二十万元。（罚金限自本判决生效后第二日起十日内缴纳。）</p>\n<p>二、被告人张洪禹犯非法获取计算机信息系统数据罪，判处有期徒刑一年，缓刑一年，罚金人民币五万元。（缓刑考验期从判决确定之日起计算；罚金限自本判决生效后第二日起十日内缴纳。）</p>\n<p>三、被告人宋健犯非法获取计算机信息系统数据罪，判处有期徒刑十个月，罚金人民币四万元。（刑期从本判决执行之日起计算，判决执行以前先行羁押的，羁押一日折抵刑期一日，即自2017年2月27日起至2017年12月26日止；罚金限自本判决生效后第二日起十日内缴纳。）</p>\n<p>四、被告人侯明强犯非法获取计算机信息系统数据罪，判处有期徒刑十个月，罚金人民币四万元。（刑期从本判决执行之日起计算，判决执行以前先行羁押的，羁押一日折抵刑期一日，即自2017年2月27日起至2017年12月26日止；罚金限自本判决生效后第二日起十日内缴纳。）</p>\n<p>五、被告人郭辉犯非法获取计算机信息系统数据罪，判处有期徒刑九个月，罚金人民币三万元。（刑期从本判决执行之日起计算，判决执行以前先行羁押的，羁押一日折抵刑期一日，即自2017年3月4日起至2017年12月3日止；罚金限自本判决生效后第二日起十日内缴纳。）</p>\n<p>如不服本判决，可在接到判决书的第二日起十日内，通过本院或者直接向北京市第一中级人民法院提出上诉。书面上诉的，应当提交上诉状正本一份，副本五份。</p>\n<p>审判人员：审判长 游涛；人民陪审员 梁铭全；人民陪审员 陆友才 </p>\n<p>裁判日期 ：二〇一七年十一月二十四日 </p>\n<p>书记员 ：书记员王珏</p>\n<h2>全国首例网络“爬虫”案件宣判，网络爬虫从入门到坐牢要多久？</h2>\n<p>如今，我们都生活在拥有海量信息的互联网时代，而你是否经常会有种“心想事成”“聊啥来啥”的恍惚和错觉，一边惊讶于接受贴心服务的同时也越发感到后背凉凉，难道APP真的能“偷听”我们聊天？难道软件都能智能化到“人机合一”的程度？其实，这都要归功于大数据时代下的网络“爬虫”技术，而随着爬虫犯罪的不断发生，爬虫技术逐步走进大众视野，网络“爬虫”技术爬取个人信息是否合法？在大数据时代，爬虫技术应用的法律红线又在哪里？</p>\n<h3>全国首例短视频平台网络“爬虫”案件</h3>\n<p>江苏省无锡市梁溪区人民法院公开审理了一起提供侵入计算机信息系统程序罪的案件。被告人丁某是前述获客软件的代理之一，该获客软件是一种爬虫软件，在未经授权的情况下，非法获取了短视频平台的后台数据。法院认为，丁某已构成提供侵入计算机信息系统程序罪，当庭判处丁某有期徒刑一年六个月，缓刑两年，并处罚金3万元。在缓刑期间，丁某被禁止从事互联网相关经营活动。据悉，该案系全国首例短视频平台领域网络“爬虫”案件。 </p>\n<h3>网络“爬虫”是何物？</h3>\n<p>网络爬虫，又被称为网页蜘蛛、网络机器人，网页追逐者，是一种按照一定的规则，自动抓取网络信息资源的程序或者脚本。就像一个小虫子一样，在各个网站上来回溜达，将其搜索到的各种链接、信息等“带”回来交给施放“爬虫”的人。简单来说，它包含三个步骤：采集信息、数据存储和信息提取。 </p>\n<h3>技术是中立的，但技术应用不是</h3>\n<p>在如今的大数据时代，网络“爬虫”技术日益成为不可或缺的一部分，其应用领域很多，如搜索引擎、数据采集、广告过滤、大数据分析等。网络“爬虫”作为一项技术手段本身并不违法，但未经许可进入被害单位的计算机系统，通过这种手段非法获取互联网信息，进而实施各类电信网络违法犯罪活动，则涉嫌《刑法》中相关罪名的“侵入”行为。</p>\n<h3>不要在“爬虫”犯罪边缘疯狂试探</h3>\n<p>现如今，互联网成了海量信息的载体，数据采集以及分析能力已成为驱动业务决策的关键技能，网络爬虫技术则成为这个时代不可或缺的一部分。但是如若使用爬虫技术应用不当，不仅涉嫌违反《网络安全法》《个人信息保护法》《民法典》中关于个人信息保护和未经用户同意的情况下大量抓取用户的个人信息；不得非法收集、使用、加工、传输他人个人信息的规定，相关的企业公司还会涉嫌以下罪名：</p>\n<p>（一）非法获取计算机信息系统数据、非法控制计算机信息系统罪根据《刑法》第二百八十五条规定，非法获取计算机信息系统数据、非法控制计算机信息系统罪，是指违反国家规定，侵入国家事务、国防建设、尖端科学技术领域以外的计算机信息系统或者采用其他技术手段，获取该计算机信息系统中存储、处理或者传输的数据，情节严重的行为。刑法第二百八十五条第二款明确规定，犯本罪的，处三年以下有期徒刑或者拘役，并处或者单处罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。</p>\n<p>（二）非法侵入计算机信息系统罪《刑法》第二百八十六条还规定，违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，后果严重的，构成犯罪，处五年以下有期徒刑或者拘役；后果特别严重的，处五年以上有期徒刑。而违反国家规定，对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，后果严重的，也构成犯罪，依照前款的规定处罚。</p>\n<p>（三）侵犯商业秘密罪《反不正当竞争法》第九条，以不正当手段获取他人商业秘密的行为即已经构成侵犯商业秘密。而后续如果进一步利用，或者公开该等信息，则构成对他人商业秘密的披露和使用，同样构成对权利人的商业秘密的侵犯。</p>\n<p>（四）侵犯公民个人信息罪利用爬虫技术收集公民个人信息数据，应当获得被收集人的同意，尤其是在数据中包含身份证号、信用信息等敏感数据的情况下，还需要获得明示同意。同时，利用网络漏洞非法下载、非法购买等行为，都属于“非法获取”公民个人信息。《刑法》修正案（九）中将刑法第二百五十三条进行了修订，明确规定违反国家有关规定，向他人出售或者提供公民个人信息，情节严重的，构成犯罪；在未经用户许可的情况下，非法获取用户的个人信息，情节严重的也将构成“侵犯公民个人信息罪”。</p>\n<p>“爬虫学得好，牢饭吃到饱”虽然是句戏谑调侃，但每一位互联网参与者在享受互联网带来便捷的同时，都要增强法律意识，要让技术成为社会的的指引，而不是违法犯罪的帮凶。</p>\n<h2>爬虫普法丨程序员 183 并发爬取官方网站，直接获刑 3 年？</h2>\n<p>我国目前并未出台专门针对网络爬虫技术的法律规范，但在司法实践中，相关判决已屡见不鲜，K 哥特设了“K哥爬虫普法”专栏，本栏目通过对真实案例的分析，旨在提高广大爬虫工程师的法律意识，知晓如何合法合规利用爬虫技术，做一个守法、护法、有原则的技术人员。</p>\n<h3>案情介绍</h3>\n<p>深圳市快鸽互联网科技有限公司 2014 年成立，早期做互联网金融，2017 年转型做互联网科技公司，主营业务是“助贷”，也就为按揭贷款购房的客户提供赎楼及债务置换贷款等服务。</p>\n<p>公司的业务需要经常性地访问深圳市政府居住证网站，查询房产地址、房屋编码和学区房的使用情况，用于做房产的市场评估和客户风险评估。因为手动查询效率低下，公司产品组经讨论后提出了一个建议——用爬虫技术自动查询。</p>\n<p>2017 年 12 月，CTO 安排新入职的程序员负责这个项目，要求他研发一个自动定时抓取的小程序，主要用来查询、下载网上的数据。</p>\n<p>2018 年 1 月，项目经理给程序员一个抓取数据的小程序源代码，程序员开始修改。</p>\n<p>2018 年 3 月，程序被部署在阿某云服务器上自动运行，其内置的“网络爬虫”对接了深圳市公安局人口管理处的居住证系统，可以在深圳市居住证网站上查询到房产地址、房屋编码等对应的资料，软件对网站访问量能达到每小时数十万次，查询的信息都被下载保存到公司购买的阿某云服务器上。</p>\n<p>2018 年 4 月 27 日 10:43-12:00 左右，居住证系统的承建单位发现系统出现宕机现象，追踪到请求应用服务器端口编号，但因日志缺失而无法定位 IP 来源，当时怀疑是人为攻击。</p>\n<p>2018 年 5 月 2 日 10:00-12:00 左右，系统再次遭遇攻击，这次管理人员成功地截取了 IP 地址并报案。</p>\n<p>2018 年 5 月 17 日晚上 11 点，服务器维护人员接到了阿某云客服的电话。阿某云说他们公司的服务器 IP 被网警锁定了，因有攻击行为，让他们赶紧联系网警。</p>\n<p>2018 年 8 月，CTO、程序员被捕。</p>\n<p>案发时，深圳市居住证服务平台的注册用户超过 530 万，服务面包括：所有市民的网上自助受理系统、151个派出所、街道办居住证受理点的现场受理系统、后台接口为市网格办、市交警局、市民政局，市交委等多个政府部门提供居住证、居住登记条件查询和审核。</p>\n<p>居住证系统受攻击瘫痪期间，软件对深圳市居住证系统查询访问量为每秒 183 次，共计查询信息约 151 万条次，抓取了大量建筑物编码数据，造成政府信息泄漏；所有居住证办理、居住登记申报、信息查询、对外服务功能均无法正常工作，影响面极广，市民无法办理居住证和居住登记，相关生产生活秩序受到严重影响。除了此次攻击，还有一些派出所出具证明证实 5 月期间经常出现系统无法登陆，录入过程频繁出现掉线、系统数据异常等情况。居住证系统无法正常使用、出现异常情况的时间长达一个多月。</p>\n<h3>供述情况</h3>\n<p>CTO 的部分供述和辩解：我司查询并下载深圳市居住证网上的数据信息没有进行市场买卖，没有跟其他公司进行资源置换，也没有通过查询信息行为获利。我不清楚这款爬虫软件对深圳市居住证网站及系统造成的影响、深圳市居住证网站及系统的承载能力、爬虫软件的具体的启动和部署情况，但我知道从技术上来讲如果超过服务器承载能力的查询肯定会引起系统卡顿或瘫痪，所以我口头要求注意查询时间、控制查询频率，我司并无任何恶意去主观进行攻击。</p>\n<p>程序员的部分供述和辩解：抓取数据的原程序是谁研发的我不知道，当时我接到这个任务时，是公司领导把源代码给我后让我修改的。这个程序查询信息的频率我不清楚，共查询多少条信息我也不清楚，我没有因查询深圳市居住证网站的信息而获利，这是我的工作任务。</p>\n<h3>判决情况</h3>\n<p>法院认为，被告人违反国家规定，对计算机信息系统功能进行干扰，造成为 5 万以上用户提供服务的计算机信息系统不能正常运行累计 1 小时以上，后果特别严重，其行为已构成破坏计算机信息系统罪。</p>\n<p>CTO 负责并授权程序员开发涉案爬虫软件，系主犯，判处有期徒刑三年；程序员受指派开发爬虫软件，在共同犯罪中起次要作用，系从犯，判处有期徒刑一年六个月。</p>\n<h3>反思总结</h3>\n<p>爬虫程序日志记录、监控告警的重要性：本案中，在被捕之前就有过一次目标网站宕机的情况，这时候请求成功率、数据量大小、目标网站服务器的响应情况等肯定会出现异常。正确的做法是有一定的告警策略，连续出现多少次无数据、目标网站访问异常的时候，就应该告警通知到程序员，特别是政府网站。本案中的程序显然没有这些功能，导致程序员未能及时发现问题并进行处理，要知道这次对方运维人员并没有成功定位到 IP，及时处理完全可以避免成为“爬虫牢玩家”，给过一次机会都把握不住，警察上门才知道酿成大祸，到那时候一切都晚了。</p>\n<p>爬虫代码的健壮性：根据本案中程序员的供述，目标网站更新了验证码登录的功能，但是程序并没有针对这种情况做处理，也没有及时更新，导致程序出现死循环，进而导致短时间内出现了大量请求，这就体现了代码健壮性的重要性。在编写程序时就要综合考虑到可能出现的情况，检测到某个接口异常，无法拿到正确的数据，重试是正常的，但不能任何情况都重试，也不能一直重试出现死循环的情况，应该有合理的规则，合理的重试次数，超过设定的次数就应该告警并停止程序的运行。一部分程序员喜欢直接暴力使用 try except 语句直接捕获所有异常，然后 except 里就直接重试，正确的做法是针对不同可能出现的异常做不同处理，取值异常应该怎么处理、连接异常应该怎么处理等等。</p>\n<p>避免单一真实 IP 采集：本案中的程序使用一个固定 IP 采集了约 151 万条次的数据信息，很显然目标网站没有封 IP 的策略，但这并不意味着我们程序就不用使用代理。当然使用代理，也得建立在合法合规的请求之上，部分代理商也会协助你判断请求是否合规，完善的请求统计也能帮助你判断是否出现异常情况。</p>\n<p>爬虫频率控制：本案中，造成目标服务器宕机时，程序的并发是每秒 183 次，在普通的爬虫程序中这点儿并发确实不是很大，但要注意的是，目标网站是政府网站，尤其是地方政府的专属职能系统。这些网站在软硬件上都不会投入太多资源，加上该网站为151个派出所、街道办等多个部门提供服务，某个时刻可能会出现多个部门同时大量处理事务的情况，再加上你的爬虫程序，服务器撑不住很正常。案例中程序设置了凌晨1时至2时进行采集是比较正确的做法，政府网站降低频率、错峰采集，一定程度上也能避免爬宕机的情况。</p>\n<p>对需求的风险评估及把控不足：CTO 自述中表明意识到这么操作会破坏深圳市公安局居住证服务平台，但是为了方便以后的查询，就着急着去做了，没有考虑那么多的后果。也就是在明知道可能存在风险的情况下，还未对该需求进行严格的监管，正因为抱有侥幸心理，为以后埋下了“定时炸弹”。正确的做法应当是做细致严谨的规划，研究该需求的合理性，再考虑要不要下发实施，而程序员也没对下发需求做可行性分析，拿着需求和基础代码就去做了，还未进行监控管理，这提醒我们立项时多问一句“我们这么做有没有风险”没坏处，特别是爬虫工程师们要多对需求进行理性分析，隐患大的需求该拒绝就拒绝，毕竟有些事看起来是“集体”的决策最后往往并不是集体买单，如果公司因此威胁辞退你，那赶紧拿钱跑路，这种公司迟早得出问题！</p>\n<p>温馨提醒：以上案例提醒我们，在工作中碰到类似情况后，建议在事前咨询公司法务或者专业人士，不要想当然，不要自以为是。谨记一点，公司是老板的，自由是自己的，法律是不容触犯的！</p>\n<h2>2022年度十大典型案例之四：全国首例短视频平台领域网络“爬虫”案</h2>\n<p>刷个短视频，个人信息和需求竟被人知道得一清二楚？不久后，私人信箱中还会收到仿佛“量身定制”的推销信息，这都源于一款神奇的“爬虫”软件。</p>\n<p>2022年5月10日，江苏省无锡市梁溪区人民法院以提供侵入计算机信息系统程序罪判处被告人丁某有期徒刑一年六个月，缓刑两年，并处罚金三万元。据悉，该案系全国首例短视频平台领域网络“爬虫”案件。</p>\n<p>2022年6月，江苏省无锡市梁溪区人民法院审结了一起提供侵入计算机信息系统程序罪案件，该案系全国首例短视频平台领域网络“爬虫”案。图为庭审现场 供图 江苏省无锡市梁溪区人民法院。</p>\n<p>2021年9月，某信息公司员工吴先生在网上巡查时发现有人在兜售一款名为“汇易获客”的软件，遂通过对方官网及电话购买了该款软件。使用后，吴先生惊讶地发现该软件居然可以“爬取”自己公司后台数据和直播间用户的相关信息，吴先生随即报警。经侦查，公安机关发现售卖该软件的某信息咨询公司老板丁某及销售人员有重大作案嫌疑。</p>\n<p>经查，2019年，丁某成立该信息咨询公司，后公司因经营不善处于停业状态。2021年，丁某从丁某某（另案处理）处以9800元的价格购进“汇易获客”软件并成为代理商。利用该软件，使用者可以入侵某些短视频平台的服务器，通过关键词搜索快速抓取包括用户名、UID、签名及评论等在内的平台信息，再通过软件将UID转换成二维码，以精准定位客户。丁某对该软件进行了重新包装，“改头换面”后对外销售，违法所得共计2.4万余元。</p>\n<p>据介绍，“爬虫”是一种用于抓取网络资源的程序，能将其搜索到的各种链接、信息等“带”回来，交给施放“爬虫”的人。使用者以电商公司、培训机构和传媒公司为主，他们在非法获取用户数据后，为自己的产品、服务进行推广引流，其中不乏生产销售假冒伪劣商品的不良商家，风险隐患极大。</p>\n<p>“‘网络爬虫’作为一项技术手段本身并不违法，但由于本案的软件采取了避开或突破计算机信息系统的安全保护措施，未经许可进入被害单位的计算机系统，即属于‘侵入’行为。”无锡市梁溪区人民检察院检察官林虹介绍。</p>\n<p>本案承办法官、梁溪法院刑庭副庭长黎鹏表示，侵入计算机信息系统程序罪是《中华人民共和国刑法修正案（七）》新增的一个罪名，主要针对向他人提供专门用于侵入或非法控制计算机信息系统工具或程序，或是明知他人实施侵入、非法控制计算机信息系统的违法犯罪行为而为其提供程序、工具，情节严重的行为处以刑罚。该案中涉及的“爬虫”软件是利用技术手段突破短视频平台的“反爬”措施，非法获取后台服务器内指定的数据文件。互联网行业的从业人员，要高度重视信息系统安全，严格落实相关法律法规要求，合法合规开展自身业务。</p>\n<h2>为数据技术运用划定明确的刑事合规红线</h2>\n<p>文 | 北京师范大学法学院博士生导师、中国互联网协会研究中心副主任 吴沈括</p>\n<p>数据“爬虫”，是一种可以进行自动化访问并收集目标计算机信息系统数据的程序，设计初衷是为编纂网络搜索引擎，通过数据“爬虫”更新自身的网站内容或对其他网站进行索引。目前，根据部署环境，数据“爬虫”可分为“服务器爬虫”“客户端爬虫”等多种类型。随着数字经济的快速发展与网络信息技术的普及应用，数据“爬虫”凭借着高效、可定制化、适用性等特点，已经成为当下运用最为广泛的技术方式之一，与此相关的各种热点事件层出不穷，反映了数字时代与数据流转利用和数据治理生态相关的诸多深层次问题。</p>\n<p>一方面，“爬虫”技术在运用中可能对数据的流转利用带来以下三种系统性风险：</p>\n<p>其一，“爬虫”技术往往会消耗目标计算机信息系统的带宽和计算资源，导致计算机信息系统响应缓慢甚至瘫痪。</p>\n<p>其二，作为自动访问收集数据的技术应用，“爬虫”一旦僭越数据访问和获取相关的权限，便会侵害相关方的合法权益。</p>\n<p>其三，“爬虫”在自动获取数据过程中可能触及受到法律特别保护的数据类型，如个人信息、商业秘密乃至国家秘密等。</p>\n<p>另一方面，随着《中华人民共和国网络安全法》《中华人民共和国数据安全法》《中华人民共和国个人信息保护法》等新一代数字立法的颁布施行，我国与数据治理生态相关的规则设计日益丰富，在数据安全保障、个人信息保护及数据竞争利益等各个方面形成规范体系。而近年有关数据“爬虫”的刑事司法与民事司法坚持以数据开发利用和产业发展促进数据安全，以数据安全保障数据开发利用和产业发展，持续为“爬虫”等数据技术的规范使用提供了更为具体的规则指引。</p>\n<p>该案作为全国首例短视频平台领域网络“爬虫”案，为判断数据“爬虫”的刑事风险提供了清晰的评价思路，也为各类数据技术运用划定了明确的刑事合规红线：一是数据“爬虫”访问和收集数据的方法手段和相关权限必须遵循刑法与其他法律的规定要求；二是数据“爬虫”访问和收集的信息内容与数据使用不得侵害法律特别保护的各类法益；三是数据“爬虫”应用中产生的客观后果不得对目标计算机信息系统及相关主体造成损害性影响。</p>\n<p>进一步而言，该案的更深层启示意义在于，数据“爬虫”乃至企业涉数据刑事合规风控的建立和完善，应当以刑事责任预防为目标，对“爬虫”等数据技术的机理特质、应用场景、伴随情形等要素进行类型化分析，在全面建立企业数据治理框架的基础上，追踪司法裁判案例、比对数据“爬虫”的业务场景与司法判例的定性，研判可能侵害的法益内容及相应的法律风险类型，找寻并遵从现行法律规范提供的合法性依据，进而设计和引入与自身业务生态相匹配的刑事合规举措。</p>\n<h2>“爬虫”第一案，判了！</h2>\n<p>明明只是进直播间看了眼带货，结果其他销售同类产品的商家却精准找上了门，此时请注意，你的信息可能已被非法爬取！</p>\n<p>近日，江苏省无锡市梁溪区人民法院审结了一起提供侵入计算机信息系统程序罪案件，被告人丁某因向他人售卖非法获取某短视频平台用户数据的“爬虫”软件，被判处有期徒刑1年6个月，缓刑2年。据悉，该案系全国首例短视频平台领域网络“爬虫”案件。</p>\n<p>2021年9月，丁某在网上结识了丁某某，丁某某表示其有一款“爬虫”软件可以获取某短视频平台用户数据，通过输入关键词搜索，可以快速抓取用户信息，主要包括用户名、评论、账户UID等。如果丁某感兴趣，可以购买代理权，做软件的推广，从中赚取差价。</p>\n<p>丁某在试用后觉得不错，便决定代理，并对软件“改头换面”后对外进行销售。</p>\n<p>某信息公司员工吴先生在网上巡查时发现有人在兜售一款“爬虫”软件，该软件居然可以“爬取”自己公司后台数据和直播间用户的相关信息，随即报警。经侦查，公安机关很快锁定了丁某。</p>\n<p>梁溪法院经审理查明，被告人丁某在经营公司期间，从丁某某（另案处理）处购买一款“爬虫”软件代理权后，在明知该款软件系未经授权、专门用于入侵某短视频服务器后非法获取用户昵称、UID等数据的情况下对外销售。2021年10月至12月期间，丁某组织公司销售人员通过网络向多人销售上述软件，违法所得共计24360元。</p>\n<p>图为庭审现场</p>\n<p>法院认为，被告人丁某伙同他人提供专门用于侵入计算机信息系统的程序，情节严重，其行为已构成提供侵入计算机信息系统程序罪。最后，法院判处被告人丁某有期徒刑1年6个月，缓刑2年，并处罚金3万元，没收丁某的违法所得。同时，禁止丁某在缓刑考验期内从事互联网相关经营活动。</p>\n<p>江苏省无锡市梁溪区人民法院刑庭副庭长黎鹏表示，在互联网大数据的时代背景下，网民在使用互联网享受生活便捷的同时，个人的数据、信息也在源源不断地被提供到互联网上，但相关信息、数据并不是无条件、无限制地向所有人员开放，是需要在数据提供者知情并同意、数据保管者许可并授权，遵守合理合法运用、保密使用、限制扩散等规则的前提下，有限制、有边界地合法使用。</p>\n<p>在网络环境中，计算机信息系统控制人往往会设置密码防护、防火墙、身份认证、数据加密等各种安全保护措施，在未经授权的情况下，一般人利用普通技术手段无法避开或突破。而“专门用于侵入、非法控制计算机信息系统的程序、工具”的违法性体现在可以利用破解、盗取密码、病毒或后门攻击、协议漏洞渗透等手段，避开、绕开或突破计算机信息系统的安全措施，在没有获得许可的情况下，违背计算机信息系统控制人的意愿，强行或隐蔽的“侵入”他人计算机信息系统。</p>\n<p>该案中的“爬虫”软件本质上是“专门用于侵入、非法控制计算机信息系统的程序、工具”，属于网络爬虫技术过界使用、非法使用。</p>\n<p>网络不是法外之地，人民法院对利用互联网危害网络安全的违法犯罪行为予以惩处，既明确了法律边界，督促互联网从业人员重视信息系统安全，合法合规开展业务，又体现了对网民的信息保护，对互联网平台的系统安全、数据安全的维护。同时也警示了相关互联网企业提高安全意识，强化网络安全措施。</p>\n<p>江南大学法学院副教授胡杰认为，本案系面对短视频网站的兴起，如何通过刑法保护公民隐私和信息安全方面开展的有益探索和实践。随着科技的进步与网络的发展，法律对隐私权的保障网越织越密。在刑法中对隐私的保护，必须以保障公民的隐私作为出发点，不能将个人信息与隐私的牺牲作为科技不断发展的代价。</p>\n<p>在本案中，提供侵入计算机信息系统程序罪，由于其构成要件以“情节严重”为必要条件，作为共犯正犯化中不完整正犯化的规定，在判断其可罚的类型危险性时，法官从被告人帮助的正犯行为的违法构成要件进行了具有说服力的论述。被告人提供的软件直接进入服务器后台，获取数据权限，可以突破短视频隐私设置看到普通用户看不到的用户隐私的数据，这种行为符合“侵入计算信息系统”的成立条件。面对现代科技与隐私权保障的拉锯战，本案在个案中探索公民权利保障与科技发展的平衡，强化了对公民隐私权和个人信息的保护。</p>\n<h2>【刑法案例共读】|全国首例“爬虫”技术侵入计算机系统犯罪案</h2>\n<p>全国首例“爬虫”技术侵入计算机系统犯罪案</p>\n<p>事件时间：2016年</p>\n<p>事件结果：判处有期徒刑一年至九个月不等</p>\n<p>案件类属：2019年十大重大刑事案件</p>\n<p>案件简介：上海某网络科技有限公司经营技术开发、技术服务等业务。该公司主要负责人员张某等人经共谋，于2016年至2017年间采用“爬虫”技术非法抓取北京某网络技术有限公司服务器中存储的视频数据。</p>\n<p>法院以非法获取计算机信息系统数据罪分别判处被告单位罚金20万元，判处被告人张某等四人一年至九个月不等的有期徒刑，并处罚金。据悉，该案系全国首例利用“爬虫”技术非法入侵其他公司服务器抓取数据，进而实施复制被害单位视频资源的案件。</p>\n<p>案件审理：法院经审理查明，被告单位上海某网络科技有限公司系有限责任公司，经营计算机网络科技领域内的技术开发、技术服务、电子商务、电子产品等业务。</p>\n<p>被告人张某系上海某网络科技有限公司法定代表人兼CEO，负责公司整体运行；被告人宋某于2016年8月至2017年2月任职上海某网络科技有限公司，担任联席CEO，系产品负责人；被告人侯某于2016年8月至2017年2月任上海某网络科技有限公司CTO，系技术负责人；被告人郭某系上海某网络科技有限公司职员。</p>\n<p>被告人张某、宋某、侯某经共谋，于2016年至2017年间采用技术手段抓取被害单位北京某网络技术有限公司服务器中存储的视频数据，并由侯某指使被告人郭某破解北京某网络技术有限公司的防抓取措施，使用“tt_spider”文件实施视频数据抓取行为，造成被害单位北京某网络技术有限公司损失技术服务费2万元。</p>\n<p>法院经审理认为，被告单位上海某网络科技有限公司采用技术手段获取计算机信息系统中存储的数据的行为已构成非法获取计算机信息系统数据罪，应予惩处；被告人张某、宋某、侯某作为直接负责的主管人员，被告人郭某作为其他直接责任人员，亦应惩处。</p>\n<p>鉴于被告单位上海某网络科技有限公司及被告人张某、宋某、侯某、郭某能够如实供述自己的犯罪事实，违法性认识不足，认罪态度较好；被告人张某、宋某、侯某、郭某获得被害单位谅解，加之本案适用认罪认罚从宽制度，故法院依法对其均从轻处罚。</p>\n<p>2017年11月24日，海淀法院判决，被告单位上海晟品网络科技有限公司犯非法获取计算机信息系统数据罪，判处罚金人民币二十万元。被告人张某某犯非法获取计算机信息系统数据罪，判处有期徒刑一年，缓刑一年，罚金人民币五万元。被告人宋某犯非法获取计算机信息系统数据罪，判处有期徒刑十个月，罚金人民币四万元。被告人侯某某犯非法获取计算机信息系统数据罪，判处有期徒刑十个月，罚金人民币四万元。被告人郭某犯非法获取计算机信息系统数据罪，判处有期徒刑九个月，罚金人民币三万元。</p>\n<p>据悉，该案系全国首例利用“爬虫”技术非法入侵其他公司服务器抓取数据，进而实施复制被害单位视频资源的案件。</p>\n<p>案件审理：根据《刑法》第二百八十五条规定，非法获取计算机信息系统数据罪是指违反国家规定，侵入前款规定（国家事务、国防建设、尖端科学技术领域的计算机信息系统）以外的计算机信息系统或者采用其他技术手段，获取该计算机信息系统中存储、处理或者传输的数据，情节严重的行为。</p>\n<p>在此类案件中，法院主要从以下方面认定相关主体构成非法获取计算机信息系统数据罪：第一，爬虫企业利用网络爬虫技术获取数据信息构成违反国家规定侵入计算机信息系统获取数（“侵入+获取”）或采用其他技术手段获取计算机信息系统数据（“采用其他技术手段+获取”）。第二，爬虫企业非法获取计算机信息系统数据达到“情节严重”或“情节特别严重”的标准。</p>\n<p>随着计算机技术与网络空间的兴起，人类社会正在迈入数据时代。数据作为生产要素，正不断激发着各产业之活力。在发展中，我们需要法律规范对数据的生产、流转、融合、使用等各个环节予以明确、合理的规制。作为全国首例“爬虫”技术侵入计算机信息系统犯罪案件，强调了数据之处理应在法律的框架内展开。所谓中立的技术在非法意图的支配下仍然具有成立犯罪的可能。</p>\n<p>随着计算机技术与网络空间的兴起，人类社会正在迈入数据时代。数据作为生产要素，正不断激发着各产业之活力，在发展中，我们需要法律规范对数据的生产、流转、融合、使用等各个环节予以明确、合理的规制。作为全国首例“爬虫”技术侵入计算机信息系统犯罪案件，强调了数据之处理应在法律的框架内展开。</p>\n<p>在网络空间内，“授权”这一法律用语往往由一项明确并受到广泛认同的技术措施予以呈现——用户身份信息认证机制。在以往的刑事案件中，司法人员通过分析用户身份认证信息机制明确访问者的授权状态和范围，并在此基础之上对行为人是否具备授权或超越授权进行论证的模式形成了刑法二百八十五条第二款司法适用的常态。在本案中，法官突破性地将“反爬虫”机制认定为与用户身份信息认证机制同态的计算机信息系统安全措施，并将常见的对抗“反爬虫”措施的技术行为认定为“侵入”计算机信息系统行为，这实际上等于创设数据流转领域新的规则，为规范数据流转行为起到了一定的积极意义。</p>\n<h2>破解安全措施、爬取数据，获利 100 余万：2 人各判五年、四年八个月</h2>\n<p>被告人：吴某某，男，1993年出生；李某，男，1991年出生。</p>\n<p>法院查明：2019年至2020年间，吴某某、李某破解并绕过北京五八信息技术有限公司网站的安全措施，爬取该公司服务器上的房源及用户手机号码等信息数据，并以重庆和致网络科技有限公司的名义通过网络向他人有偿提供，获取违法所得共计人民币100余万元。2021年6月3日，吴某某、李某被公安机关查获归案，二人持有的手机2部、笔记本电脑1台、电脑主机1个被起获并扣押在案。上述事实，吴某某、李某在开庭审理过程中没有异议，且有证人贺某某的证言、被害单位北京五八信息技术有限公司提供的报案材料、证明、营业执照、重庆和致网络科技有限公司工商资料、公司章程、互联网安全管理服务平台备案信息、银行交易明细、支付宝交易明细、微信交易明细、北京信诺司法鉴定所出具的司法鉴定意见书及发票等附随电子数据、起赃经过、扣押决定书、吴某某、李某在公安机关的供述、到案经过、工作记录、户籍材料等证据予以证明，足以认定。</p>\n<p>法院裁定：法院认为，吴某某、李某违反国家规定，采用技术手段获取计算机信息系统中存储的数据，情节特别严重，其行为均已构成非法获取计算机信息系统数据罪，依法应予惩处。北京市朝阳区人民检察院指控吴某某、李某犯罪的事实清楚，证据确实、充分，指控罪名成立。关于辩护人所提二被告人系自首的辩护意见，经查，二被告人系被公安机关查获归案，并非自动投案，依法不构成自首，辩护人的上述辩护意见，法院不予采纳。关于吴某某的辩护人所提被害单位的不当处置措施扩大了被告人行为危害后果的意见，经查，被害单位所采取的救济措施并非导致被告人继续实施犯罪行为的原因，相反，被告人在明知被害单位已经采取救济措施的情况下，仍继续非法获取被害单位数据，足以证明二被告人主观上具有非法故意，吴某某的辩护人所提的上述意见，法院不予采纳。鉴于吴某某、李某如实供述所犯罪行，认罪认罚，故法院依法对二人从轻处罚。二辩护人所提的合理辩护意见，法院酌予采纳。吴某某、李某的违法所得，依法予以追缴并没收。在案扣押手机、电脑等物品依法处理。综上，法院依照《中华人民共和国刑法》第二百八十五条第二款、第六十七条第三款、第五十二条、第五十三条、第六十一条、第六十四条、《中华人民共和国刑事诉讼法》第十五条及《最高人民法院、最高人民检察院关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》第一条之规定，判决如下：</p>\n<p>一、吴某某犯非法获取计算机信息系统数据罪，判处有期徒刑五年，罚金人民币五万元</p>\n<p>二、李某犯非法获取计算机信息系统数据罪，判处有期徒刑四年八个月，罚金人民币五万元</p>\n<p>三、追缴吴某某、李某的违法所得，予以没收。</p>\n<p>四、在案之手机二部、笔记本电脑一台、电脑主机一个，予以没收。</p>\n<h2>【网络爬虫犯罪的量刑问题及对策】</h2>\n<p>近年来，随着科技水平的高速发展，人工智能越来越多地进入人们的日常生活中。但是，科学技术在给人们带来便捷的同时，也同样带来了风险和危机。网络爬虫就是这样一种便捷与风险并存的技术：一方面，爬虫能够快速地在网络中爬取大量数据，节约大量的人力物力并快速锁定、分析有价值的数据信息；另一方面，利用爬虫所实施的相关犯罪也呈增多趋势，非法获取的数据信息量更是呈爆发式上升。在北大法宝司法案例库中以“爬虫”为关键词检索，并排除不相关犯罪后，得到判决书共88份。其中，近五年以来的爬虫类犯罪就有82件，占全部案件的93%。现有的研究大都关注网络爬虫犯罪的定罪问题，忽视了相关犯罪的量刑。网络爬虫行为如此高发的今天，即使不考虑数额，其行为本身是否具有足够的刑罚可罚性？使用网络爬虫行为实施犯罪能否作为一种从重情节加以考量？有必要认真审视该类行为方式的危害性，并在具体个案的司法中给予其应有的评价。</p>\n<h3>一、问题：网络爬虫犯罪量刑的司法现状</h3>\n<p>通过对88份样本案例进行分析，可以发现网络爬虫犯罪在司法实践中量刑较轻，其原因在于网络爬虫手段没有引起司法机关特殊的重视，主要体现在以下两个方面：一是网络爬虫手段未能与牟利目的一同作为量刑情节等同视之；二是犯罪数额在网络爬虫犯罪量刑中具有关键性作用，而忽视了网络爬虫手段本身的社会危害性。</p>\n<p>（一）网络爬虫犯罪与牟利目的</p>\n<p>在样本案例中，网络爬虫犯罪所涉及的罪名包括侵犯著作权罪、侵犯公民个人信息罪、传播淫秽物品牟利罪等。其中，除了刑法第三百六十三条规定的贩卖、传播淫秽物品牟利罪之外，其余各罪均无须以牟利为目的。但是，在司法实践中，诸多判决将是否出于“牟利目的”作为罪与非法、罪轻罪重的依据，未将爬虫方式作为量刑的依据，行为人虽然利用网络爬虫进行犯罪，但最终因无牟利目的而罪轻或无罪。例如，Z公司在未经E公司许可的情况下，采用“外爬”“内爬”等爬虫程序，非法获取E公司运营的外卖平台数据，导致E公司存储的具有巨大商业价值的海量商户信息被非法获取，同时造成E公司流量成本增加，直接经济损失4万余元。对于该案，公诉机关认为，Z公司此次爬取数据出于自身拓展业务的动机，没有牟利目的，对犯罪嫌疑单位Z公司及其员工作了不起诉决定。又如，马某用“网络爬虫”程序在互联网上获取公民个人信息，并伙同他人利用收集的公民个人信息牟利。二审法院认为，虽然马某非法获取了公民个人信息，但因没有牟利目的，从有期徒刑三年改判成二年。在这些样本案例中，都没有将网络爬虫手段当做单独的犯罪情节加以考量，而只是单方面强调了无牟利目的的重要性。</p>\n<p>（二）网络爬虫犯罪与犯罪数额</p>\n<p>犯罪数额作为传统的量刑情节，在多个罪名的司法解释中都具有重要的量刑意义。但是，司法机关在处理网络爬虫犯罪时，过于强调犯罪数额所起的决定性作用，而没能将网络爬虫行为本身纳入到量刑的考量范围中，导致量刑普遍较轻。例如，龚某利用网络爬虫技术爬取网上的淫秽视频BT种子文件并且建立相关网站以供人下载，通过投放网站广告的方式牟利。在本案的二审判决中，法院认为提供淫秽视频的BT种子与直接提供淫秽视频有所不同，不能直接作为司法解释所规定的犯罪数量，因此，即使BT种子的数量很大，也不能按照司法解释的相关规定认定为“情节特别严重”。同时，又认为网络爬虫手段不是从重处罚的要素，将龚某的刑罚从十年有期徒刑降为三年有期徒刑，未考虑到利用爬虫这一方式的危害性。</p>\n<h3><strong>二、对策：网络爬虫作为独立之从重情节的理由</strong></h3>\n<p>对于上述案例的分析可以看到，虽然对于侵犯著作权罪、传播淫秽物品牟利罪等犯罪而言，牟利目的和数额是很关键的量刑因素，但是，判决大都忽视了作为网络爬虫行为本身对于网络安全这一新兴法益的侵害及其在量刑中的应有作用。笔者认为，应当将如今应用广泛的网络爬虫技术作为独立的从重情节在网络爬虫犯罪中加以考虑。</p>\n<p>（一）网络爬虫犯罪侵犯的法益</p>\n<p>网络爬虫作为互联网的热门技术，对其运用必然会对网络安全造成一定的影响。因此，网络爬虫犯罪本身不仅侵害如个人信息、著作权等具体法益，还侵犯了数据安全这一特殊法益。因此，在实践中就会出现，一个行为同时触犯了非法获取计算机信息系统数据罪和侵犯公民个人信息罪。对于这种情况，样本案例中有法院认为，其中针对计算机的相关犯罪行为是一种手段行为，这种情况下属于一行为侵害数个法益，触犯多个罪名，属于想象竞合犯，应择一重罪论处。但是，想象竞合为了坚守禁止重复评价原则，定一罪也导致无法全面评价行为的性质，无法周延地保护法益。因此，如果将网络爬虫犯罪中的行为本身设定为从重情节，则在具体量刑时就可以同时评价网络爬虫犯罪给网络数据安全造成的法益侵害，从而全面地对行为人的犯罪进行评价和量刑。</p>\n<p>（二）网络爬虫犯罪的预防成本：法律经济学的视角</p>\n<p>牟利目的和犯罪数额已经成为网络爬虫犯罪的重要量刑依据，网络爬虫犯罪与当下快速发展的经济社会不无关系。现代法律经济学从科斯定理出发，认为法律的作用在于润滑交易，减少交易成本，以期实现效率的最大化。因此，要想网络爬虫犯罪的治理效果实现最大化，就需要首先厘清网络爬虫犯罪所导致的净损失，并且分析预防该犯罪所需的成本，才能判断出网络爬虫作为独立的从重情节是否必要。</p>\n<p>首先，网络爬虫犯罪所造成的净损失较大。所谓净损失，就是指犯罪所造成的最终的社会损害。这就要求对网络爬虫犯罪的成本和收益进行分析。北京市通州区人民法院曾在判决中强调，以网络爬虫为手段的侵犯著作权罪具有“侵权行为成本低、传播面广且涉及作品的数量大”的特点。网络爬虫技术之所以能够得到越来越多的关注，与上述特点密不可分。网络爬虫的主要作用是在海量的互联网信息中进行爬取，抓取有效信息并存储。网络爬虫的主要建立方式，是行为人在电脑上进行编程，并不需要高端的仪器。尤其是传播淫秽物品牟利罪的部分样本案例，只需要一台笔记本电脑，一部手机就可以完成犯罪。还有的案件，行为人需要在国外租赁服务器，但租金每月仅几十欧元，与其所获得的收益相比差距巨大。并且，基于主题爬虫的专业搜索引擎成为搜索引擎发展的主要趋势之一。因此，可以预见的是，随着主题爬虫的不断发展和应用，其精度和速度会显著提升，操作也会变得越来越简便。这给使用者带来方便的同时，实施相关犯罪的成本也会越来越低。</p>\n<p>但同时，使用爬虫进行犯罪的收益却大大超过所需的成本。在笔者收集的样本案例中，网络爬虫犯罪两年间的收益金额最高可达405.35414万元。侵犯公民个人信息罪因单个信息的价格不高，一条只有0.4元，所以在几类犯罪中相对收益较低。即使如此，样本案例中的收益也可达到平均16万元之多。因为爬虫的优势在于短时间内的大量数据的爬取，其依靠数量的优势也能得到较大的收益。并且如前所述，主题爬虫的发展和应用将为网络爬虫犯罪带来更高的收益。随着技术的发展，网络爬虫犯罪的净损失（成本与收益的差距）是不断升高的。</p>\n<p>其次，预防网络爬虫犯罪的成本越来越高。预防犯罪的成本，包括政府以及潜在的犯罪受害者所支出的用于保护免受犯罪侵害的资源，可以分为个人成本与社会成本。</p>\n<p>就个人成本而言，面对日益增长的网络风险，企业与个人都试图采取措施保护自己的数据安全，包括建立公司内部的加密系统，设立IP/端口防火墙、加密算法、页面渲染等方式进行反爬虫设计。让个人承担过高的预防成本是不合适的，也实际上无法起到相应的预防效果。例如，在有的样本案件中，公司的安全系统存在较为巨大的漏洞，以致行为人通过很普通的技术行为就能够攻克，并通过员工的权限绕开客户端直接获得后台的用户数据。公司虽然也经常升级系统并修复相关的漏洞，但由于业务发展非常迅速，变数很多，导致更新速度赶不上安保的需要。这无疑会给个人和企业带来巨大的维护成本，我国的网络科学技术相对还不成熟，如果给个人和企业施加过高的预防成本，则可能会削弱我国企业发展的整体活力。</p>\n<p>就社会成本而言，在网络爬虫犯罪净损失不断增大，而个人预防成本又不能过高的情况下，加大社会成本是预防网络爬虫犯罪的必然趋势。这主要包括国家设立相关的监管机制，如工信部出台了《工业和信息化领域数据安全管理办法（试行）》。也包括具体的落地措施，例如，清华大学为了推进系统与网络空间安全相关问题的研究，成立了网络科学与网络空间研究院，并且以该研究院为核心，建立了一系列相关实验室、研究中心与创新平台。根据《中国互联网发展报告（2022）》，截至目前，我国网络安全服务市场已达2002.5亿元，增速为15.8%。根据第50次《中国互联网络发展状况统计报告》，2022年上半年网民遭受的网络安全问题比2021年下降了1.3%。但是另一方面，社会的预防效果仍难言显著。在报告中，遭遇个人信息泄露的公民数量仍居首位，达到21.8%，遭受网络诈骗的公民数量甚至以1.2个百分点的速度不降反增。因此，在社会成本投入如此高昂的情况下，社会所能达到的预防效果仍然有限。</p>\n<p>因此，在网络爬虫犯罪的危害性越来越大，预防该类犯罪的个人、社会成本越来越高且效果有限的现实背景下，适度从立法、司法上加大对该类行为的惩处，是有必要的，应将网络爬虫行为作为从重情节。</p>\n<h3>三、启示：作为人工智能的网络爬虫技术</h3>\n<p>虽然网络爬虫技术已经具有强大的采集数据能力，但在人工智能领域，还只能归类于弱人工智能。随着科技的发展，强人工智能时代终将来临。习近平总书记在中共中央政治局第九次集体学习时的讲话中强调：“人工智能是新一轮科技革命和产业变革的重要驱动力量，加快发展新一代人工智能是事关我国能否抓住新一轮科技革命和产业变革机遇的战略问题。”因此，我们应当如何应对人工智能带来的刑事风险，是迫切需要进行研究的课题。在应对网络爬虫犯罪时，作为未来可能出现的强人工智能犯罪的先行版，应当得到法律工作者足够的重视，从刑事立法、犯罪认定和量刑方面严厉打击人工智能犯罪的同时，维护我国的科技发展，保持良好的国家科技竞争力，为未来人工智能的良性发展与应用提供坚实的基础。</p></div>", "src": "《计算机犯罪》合集提取"}, {"cat": "研究解析", "title": "计算机网络犯罪研究（十一）：销售游戏外挂涉嫌破坏计算机信息系统罪的两个出罪要点", "html": "<div class=\"ref-render\"><h2>计算机网络犯罪研究（十一）：销售游戏外挂涉嫌破坏计算机信息系统罪的两个出罪要点</h2>\n<p>随着网游的迅速发展，销售游戏外挂涉刑的案件也日益增多，但对于该行为应适用何种罪名在司法实务中存在较大争议，有的观点认为游戏外挂是一种破坏性程序，销售游戏外挂的行为应当以破坏计算机信息系统罪予以处罚。根据我国《刑法》第286条的规定，破坏计算机信息系统罪最高可判处十五年有期徒刑，相较于计算机犯罪类其他罪名，该罪名是重罪。</p>\n<p>从辩护的角度而言，律师办理销售外挂被控破坏计算机信息系统罪的案件，打掉破坏计算机信息系统罪的指控是常用且实用的辩护策略。</p>\n<p>结合法律法规和办理相关案件的实务经验，笔者认为办理此类案件争取打掉破坏计算机信息系统罪的指控，可从以下两方面入手：</p>\n<p>第一，外挂的使用没有造成游戏的不能正常运行。《刑法》第二百八十六条第一款所规定的破坏计算机信息系统罪要求通过破坏行为（对功能进行删除、修改、增加、干扰）使计算机信息系统中的软件、硬件即相关配套设备发生故障，造成计算机信息系统不能正常运行。从外挂的运行原理来看，不管是键盘鼠标模拟器辅助性外挂、内挂抓包等修改数据流的外挂，还是更高级的HOOK挂钩，都只是对游戏客户端、数据包、服务器之一施加影响，并不会干扰游戏的正常运行。具体来说，键盘鼠标模拟器辅助性外挂相当于“游戏代练”，本质上是将大量繁琐和重复的游戏动作使用外挂自动完成，在功能上不会突破网络游戏原有设定的规则，在技术实现方式上，它并不会修改、伪造服务器传输中的数据包。至于修改数据流的外挂或者HOOK挂钩，通常都不会造成计算机信息系统不能正常运行。对于未造成系统功能实质性破坏或者不能正常运行的，根据最高人民法院指导案例145号张竣杰等非法控制计算机信息系统案的观点，不应当认定为破坏计算机信息系统罪。司法实务中，以破坏计算机信息系统罪提起公诉的游戏外挂案件，被改判其他罪名的主要理由集中在“外挂是否干扰游戏功能”上，比如成都侠义道游戏外挂案等。</p>\n<p>第二，行为人所造成的经济损失是否达到入罪标准。根据《刑法》第286条的规定，构成破坏计算机信息系统罪要求满足“后果严重”这一条件，而“后果严重”的标准，则规定在2011年最高检、最高院实施的《关于办理危害计算机信息系统安全形势案件应用法律若干问题的解释》（下称《解释》）第四条中，《解释》列举了五项标准，其中与外挂类案件有关的是第三项“违法所得5000元以上或者造成经济损失1万元以上的”。这里的“经济损失”，根据《解释》第十一条的规定，只包含“危害计算机信息系统犯罪行为给用户直接造成的经济损失，以及用户为恢复数据、功能而支出的必要费用”，这就意味着间接利益损失和可期待利益损失并不属于该罪“经济损失”的范畴。因此，律师办理此类案件时，可从“经济损失”入手，判断在案证据能否证明行为人是否达到“后果严重”的入罪标准，以此寻找辩护空间。综上，笔者认为销售游戏外挂的行为不构成破坏计算机信息系统罪，但不代表该行为不触犯刑律，律师办理此类案件可进行轻罪辩护，争取改判为量刑较轻的提供侵入、非法控制计算机信息系统的程序罪或侵犯著作权罪，为当事人争取最大化的合法权益。</p>\n<h2>浅谈破坏计算机信息系统罪的入罪条件</h2>\n<p>破坏计算机信息系统罪为实践中的高发罪名，由于该罪的认定与技术手段密切相关，而技术的发展日新月异，对实践中该罪的准确认定提出了诸多挑战。本文从真实案例出发，透过纷繁复杂的技术手段表象，探寻区分该罪名罪与非罪的实质着力点，厘清技术本身对该罪名认定的实质影响，避免因对该罪名做出不当类推解释而扩大入罪范围，对无辜当事人造成伤害。</p>\n<h3>一、法律规定</h3>\n<p>《刑法》第二百八十六条【破坏计算机信息系统罪】违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，后果严重的，处五年以下有期徒刑或者拘役；后果特别严重的，处五年以上有期徒刑。</p>\n<p>违反国家规定，对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，后果严重的，依照前款的规定处罚。</p>\n<p>故意制作、传播计算机病毒等破坏性程序，影响计算机系统正常运行，后果严重的，依照第一款的规定处罚。</p>\n<p>单位犯前三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚。</p>\n<h3>二、“破坏计算机信息系统”应是内部的破坏而非外部的干扰</h3>\n<p>一个主打手机维修功能的软件A，其中一项功能是可以对手机的串码进行伪装，使得购物平台无法识别手机本身的串码，从而可以搭配更换手机卡的操作伪装成新用户，反复使用平台仅限新用户使用的优惠券。如果不考虑该行为可能触及的财产罪，仅从破坏计算机信息系统的角度来讲，这样的行为能够被认定为破坏计算机信息系统罪吗？</p>\n<p>有观点认为，软件A向购物平台发送虚假信息，属于对系统中数据的修改，因为其传输伪装数据相当于修改了原本应当正确传递的数据，因此违反第二款规定，属于破坏计算机信息系统罪。笔者认为该种观点值得商榷。我们认为不应该对传输的数据进行正确与否的价值判断，系统只能对数据照单全收。行为人发送数据的真假与系统无关。</p>\n<p>从文义解释上看，第二款的表述为“违反国家规定，对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，后果严重的，依照前款的规定处罚。”笔者认为，该款“信息系统中”的说法，指的是将“手”伸向计算机信息系统内部，对于已经存在的内部数据做出删除、修改、增加的行为，仅仅从外部向某系统发送虚假信息并不会导致其内部已有的数据出现删除、修改、增加的操作。且，我们不应该预先虚设一个接受真实信息后应该产生的数据，进而认为由于发送了虚假信息导致该真实信息没有产生，因为该所谓的“真实信息”原本就不存在，这种行为不属于破坏。</p>\n<p>这样的一个行为，其实相当于是这一软件“骗了”计算机信息系统，是软件A利用自己的技术手段蒙蔽了购物软件，使它未能检测出手机真实串码。所谓的计算机信息系统其实可以理解为一个黑匣子，你对它输入数据，它通过自己的运行方式输出结果。比如一个加法器，你输入1+1，结果就会输出2，如果你输入的是1+2，那么结果就会输出3，但是如果你输入1+1的同时，对于加法器内部运行原理进行了更改，使其变成了一个减法器，最终输出0，那么这种行为肯定能够被认定为“破坏信息系统”，但如果只是在加法器外部首先加入一个乘法器，使得本来输入的1+1扩大两倍，变成了2+2，最后输出4，那么这样的行为显然没有使得原本的加法器受到任何干扰，不能被认定为是“破坏计算机信息系统”。</p>\n<p>也就是说，《刑法》第二百八十六条第二款规定的行为方式，必须是对信息系统内部的真实数据造成了删减、更改等破坏行为，对于系统外部数据的更改、删除、伪造等操作不能认定为破坏计算机信息系统的行为。</p>\n<p>同时需要明确的是，破坏计算机信息系统也并非完全不能通过物理手段实现，使用重锤摧毁信息系统重要运行硬件当然也能构成此罪。因为类似的物理性破坏，可能会导致系统内部数据无法读取，这种物理性破坏无异于对系统内部的数据造成删除。</p>\n<h3>三、司法解释与刑法规定的协调适用</h3>\n<p>2017年1月1日，最高人民法院、最高人民检察院联合发布了《关于办理环境污染刑事案件适用法律若干问题的解释》（以下简称“《环境类司法解释》”），笔者以为，对该司法解释的理解与适用，不能与刑法中破坏计算机信息系统罪名的规定出现不协调的情况，更不能突破罪刑法定原则。</p>\n<p>《环境类司法解释》第十条规定：违反国家规定，针对环境质量监测系统实施下列行为，或者强令、指使、授意他人实施下列行为的，应当依照刑法第二百八十六条的规定，以破坏计算机信息系统罪论处：</p>\n<p>（一）修改参数或者监测数据的；</p>\n<p>（二）干扰采样，致使监测数据严重失真的；</p>\n<p>（三）其他破坏环境质量监测系统的行为。</p>\n<p>重点排污单位篡改、伪造自动监测数据或者干扰自动监测设施，排放化学需氧量、氨氮、二氧化硫、氮氧化物等污染物，同时构成污染环境罪和破坏计算机信息系统罪的，依照处罚较重的规定定罪处罚。</p>\n<p>从事环境监测设施维护、运营的人员实施或者参与实施篡改、伪造自动监测数据、干扰自动监测设施、破坏环境质量监测系统等行为的，应当从重处罚。</p>\n<p>有这样一个真实案例：西安市长安区环境空气自动监测站（下称长安子站）系国家环境保护部确定的西安市13个国控空气站点之一。2016年2月4日，长安子站回迁至西安市长安区西安邮电大学南区动力大楼房顶。被告人多次进入长安子站内，用棉纱堵塞采样器的方法，干扰子站内环境空气质量自动监测系统的数据采集功能。陕西省西安市中级人民法院于2017年6月15日作出（2016）陕01刑初233号刑事判决，认为该行为属于破坏计算机信息系统行为，被告人构成破坏计算机信息系统罪。笔者以为，该案例的判定有失偏颇。</p>\n<p>案件裁判理由认为，被告人采用“用棉纱堵塞采样器的方法”干扰采样，致使数据严重失真，已经满足《环境类司法解释》第二款规定，可以直接认定为构成破坏计算机信息系统罪。但《环境类司法解释》的适用同样需要遵循罪刑法定原则，在《刑法》对于罪名已经限定的框架内适用，不能超出已有界定框架，认为只要干扰采样，造成数据严重失实的，不论其是通过何种手段，是否对于环境检测系统造成破坏，破坏达到何种程度，都直接认定为破坏计算机信息系统罪，这显然违背了罪刑法定原则。</p>\n<p>前文已论及，从行为方式上看，要认定行为人对于数据的操作违反《刑法》第二百八十六条第二款的规定，其行为必须是对于系统“内部数据”进行删除、修改、增加的操作，对于系统“外部数据”的操作不可能构成该罪。而本案中，被告人对数据的干扰方式为用棉纱堵塞采样器，这一行为属于在计算机信息系统外部对于数据先处理后再输入，并未对于系统内部已经存在的数据进行任何更改，不符合第二款的规定，不能认定为本罪。</p>\n<p>此外，虽然《刑法》第二百八十六条第二款规定并未与第一款、第三款一样，直接写明“造成计算机信息系统不能正常运行”“影响计算机系统正常运行”的后果，但这并不意味着以第二款方式入罪没有危害程度的要求。正如吴沈括教授所言：“如果不对数据操作行为的性质、后果加以区分，可能会导致本条款成为所有涉计算机类犯罪行为的兜底条款，不当扩大了该条款的适用范围。”最高人民法院第145号指导案例对于长久以来《刑法》第二百八十六条第二款是否需要程度要求的争论给出了明确回答。</p>\n<h3>四、最高院指导案例的出罪启示：二百八十六条</h3>\n<p>第二款对于行为方式及程度的双重要求</p>\n<p>最高院指导案例第145号：张竣杰等非法控制计算机信息系统案。</p>\n<p>案情摘要：自2017年7月开始，被告人张竣杰等人经事先共谋，为赚取赌博网站广告费用，对存在防护漏洞的目标服务器进行检索、筛查后，向目标服务器植入木马程序进行控制，再使用“菜刀”等软件链接该木马程序，获取目标服务器后台浏览、增加、删除、修改等操作权限，将添加了赌博关键字并设置自动跳转功能的静态网页上传至目标服务器，提高赌博网站广告被搜索引擎命中几率。截止2017年9月底，被告人张竣杰、彭玲珑、祝东、姜宇豪链接被植入木马程序的目标服务器共计113台，其中部分网站服务器还被植入了含有赌博关键词的广告网页。公诉机关以破坏计算机信息系统罪对四人提起公诉。</p>\n<p>裁判理由：法院认为，被告人行为虽然对目标服务器的数据实施了修改、增加的侵犯行为，但未造成该信息系统功能实质性的破坏，或不能正常运行，也未对该信息“系统内”有价值的数据进行增加、删改，其行为不属于破坏计算机信息系统犯罪中的对计算机信息系统中存储、处理或者传输的数据进行删除、修改、增加的行为，应认定为非法控制计算机信息系统罪。</p>\n<p>该案例为刑法第二百八十六条第二款的适用进行了明确限定，主要体现为以下两点：</p>\n<p>第一，从行为手段来看，必须严格限制为“对计算机信息系统中存储、处理或者传输的数据进行删除、修改、增加的行为”，欺骗计算机信息系统、在系统外对数据进行操作的行为不能纳入此规制范围。举重以明轻，进入系统，对数据进行删除、修改、增加的行为，只要没有达到“破坏”程度，尚且不能被认定为犯罪，没有直接进入系统进行操作的行为更不可能构成该罪。</p>\n<p>第二，从行为后果来看，必须达到“造成系统功能实质性破坏，或不能正常运行”的程度。这一判例有力回应了一直以来刑法第二百八十六条第二款对于后果认定方面是否与第一、三款存在不同的争议，维护了罪名的统一性，否定了司法实践中对于第二款“一刀切”式的审查模式。在此基础上，对于第二款的适用不仅需要行为手段上的“形式审查”，也需要后果严重性的“实质审查”。这直接为操作可恢复性数据等行为模式提供了出罪依据。</p>\n<h2>五、总结</h2>\n<p>结合法益保护及现有判例，《刑法》第二百八十六条第二款对于数据操作的入罪条件必须同时满足以下两点：1、行为方式：对于“系统内”的数据进行删除、修改、增加；2、行为后果：对信息系统功能造成实质性破坏，或使其不能正常运行。关于此罪名司法解释的适用同样需要遵循罪刑法定原则，严格在以上框架内对该条款进行适用，严防罪名不当扩大损害当事人合法权益。</p>\n<h2>JT&amp;N观点 | 非法获取计算机信息系统数据罪的行为构成</h2>\n<p>原创 ​闫莉  2022-12-06 17:20 发表于北京</p>\n<p>伴随着网络技术和数字经济的发展，虚拟财产在生活中的应用场景不断扩展，以虚拟财产为对象的违法行为也逐渐增多并受到司法界的关注。对于网络游戏装备、虚拟货币等能否被认定为财产犯罪保护对象的“财物”，理论与司法实践均长期存在争议。司法实务中，涉及虚拟财产的刑事案件被分别以财产犯罪和非法获取计算机信息系统数据罪处理。但由于司法的关注重点主要在虚拟财产的性质方面，部分案件对于非法获取计算机信息系统数据罪的行为本质反而有所忽略，在持有虚拟财产不属于刑法上的财物的观点的前提下，将涉及虚拟财产的违法行为一律认定为非法获取计算机信息系统数据罪，使得此罪名在司法实务中的适用逐渐呈现出“口袋罪”的趋势。</p>\n<p>但实际上并非所有利用计算机非法获取数据的行为均可以认定为非法获取计算机信息系统数据罪。在具体案件处理时，亦需要审视待评价行为是否符合非法获取计算机信息系统数据罪的构成要件，是否实质上侵犯了该罪名所保护的法益。</p>\n<h3>一、非法获取计算机信息系统数据罪保护的法益</h3>\n<p>我国刑法第二百八十五条第二款规定，违反国家规定，侵入前款规定以外（第一款规定为侵入国家事务、国防建设、尖端科学技术领域的计算机信息系统的行为）的计算机信息系统或者采用其他技术手段，获取该计算机信息系统中存储、处理或者传输的数据，构成非法获取计算机信息系统数据罪。其是为适应网络犯罪发展在2009年通过刑法修正案（七）增设的罪名。2011年最高人民法院、最高人民检察院《关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》中对该罪名的认定标准等做了进一步的明确。</p>\n<p>根据该条法律规定，本罪的具体犯罪构成包括：第一，前提要件是违反国家规定。第二，手段行为包括侵入计算机信息系统（涉国家安全等特殊计算机信息系统除外）获取该系统存储、处理或者传输的数据，以及采用其他技术手段获取上述数据。第三，犯罪对象是计算机信息系统存储、处理或者传输的数据。其中，实践中争议最大、理论上最值得关注的是对其手段行为的定义，即对“侵入”和“其他技术手段”的理解，即本文探讨的主题。</p>\n<p>某个罪名的行为本质和该罪名保护的法益息息相关，只有正确理解其保护的法益，才能准确认定某个行为是否为该罪名所涵摄。其背景是随着技术发展，使得数据集合产生了独立且重要的价值，使得网络安全成为社会正常运行的保障。某些数据既承载着经济利益也是某些实体运行发展的关键要素，故对于数据的保护既包括对其财产利益的保护，也包括对数据安全法益的保护。</p>\n<p>本罪规定在刑法第六章“妨害社会管理秩序罪”第一节“扰乱公共秩序罪”中，即立法者制订本条规定主要着眼于对网络安全和秩序的保护。对于网络安全在2017年起施行的《网络安全法》中有所阐述，其要求建设、运营网络或者通过网络提供服务，应当依照法律、行政法规的规定和国家标准的强制性要求，采取技术措施和其他必要措施，保障网络安全、稳定运行，有效应对网络安全事件，防范网络违法犯罪活动，维护网络数据的完整性、保密性和可用性。其对网络安全的界定，即通过采取必要措施，防范对网络的攻击、侵入、干扰、破坏和非法使用以及意外事故，使网络处于稳定可靠运行的状态，以及保障网络数据的完整性、保密性、可用性。</p>\n<p>也就是说，本罪主要着眼于对数据安全法益和网络运行秩序的保护，打击的是具有危害性的使用破坏网络运行秩序、危及网络安全性的手段获取数据的行为。反之，若获取数据的行为未对网络安全和秩序造成干扰或损害，则不属于本罪规制的范围。理解本罪的行为本质，亦应当着眼于此。本罪具有保护数据安全的价值，但并不意味着其承担了所有数据保护的职能，侵犯特定数据可以用侵犯公民个人信息、侵犯商业秘密等罪名规制，非法获取具有财产价值的电子数据、主要侵犯数据的财产法益的行为可考虑适用财产犯罪处置。若以上均不宜适用，亦不可一律直接归入本罪。此外，亦不可将利用计算机获取数据行为与本罪直接等同，而仍应考察其行为本质究竟为何。</p>\n<p>二、对本罪的行为构成的理解</p>\n<p>在上文所述的《关于办理危害计算机信息系统安全刑事案件应用若干问题的解释》中，没有对本罪中的“侵入”和“其他技术手段”做进一步进行界定，理论和实务界对于“侵入”和“其他技术手段”产生了不同的理解。若希望准确理解该罪名，还是应当回归相关规定的本源。</p>\n<p>首先，从文义解释和体系解释的角度观察。从字面意义上理解，“侵入”通常意味着突破了某些防护措施强行进入。而根据法条对本罪罪状的表述，侵入系和其他技术手段并列，从体系解释的角度“侵入”和“其他技术手段”在行为属性上应当具有一致性，“其他技术手段”应当是一种补充性质的描述，本罪中的“侵入”行为亦应具备技术性。故结合上述两点，这里的“侵入”应当指的是通过技术手段强行进入计算机信息系统的行为。</p>\n<p>第二，从相关司法解释的表述来看。在上文所述的《关于办理危害计算机信息系统安全刑事案件应用若干问题的解释》中，虽然没有对本罪的“侵入”进行界定，但在第二条对提供侵入、非法控制计算机信息系统的程序、工具罪中的“专门用于侵入计算机信息系统的程序、工具”做了描述，间接指出了“侵入”的涵义，即“避开或者突破计算机信息系统安全保护措施，未经授权或者超越授权获取计算机信息系统数据”。从上述司法解释的表述来看，“未经授权或者超越授权”应当是对“避开或者突破计算机信息系统安全保护措施”的进一步修饰和补充说明，“未经授权或者超越授权”和“避开或者突破计算机信息系统安全保护措施”并非是“或者”的关系，从逻辑上，“避开或者突破计算机信息系统安全保护措施”后一般而言即会产生“未经授权或者超越授权获取计算机信息系统数据”的结果，这样的表述更为周延，也排除了经过授权采用技术手段获取数据的行为。由于提供侵入、非法控制计算机信息系统程序、工具罪是非法获取计算机信息系统数据罪的帮助行为正犯化，因而可将非法获取计算机信息系统数据罪的“技术手段”理解为“避开或者突破计算机信息系统安全保护措施”，即不按照计算机信息系统中安全保护措施要求的正常登录方式访问、获取数据[1]。</p>\n<p>第三，上述结论有权威观点予以支持。2015年出版的由全国人大常委会法工委刑法室编著的《&lt;中华人民共和国刑法修正案（九）&gt;释解与适用》，对“侵入”的界定是“未经授权或者他人同意，通过技术手段进入计算机信息系统”，该书表示“将行为人非法获取他人计算机信息系统中的数据……的手段限定在‘侵入’或者‘其他技术手段’，是因为本罪是针对互联网上各种危害计算机网络安全的犯罪作出的规定，至于采用网络技术手段以外的其他手段……不属于本款规定的行为。”此外，2021年出版的由全国人大常委会法工委刑法室王爱立担任主编的修订后的《中华人民共和国刑法释义》，对于“侵入”的解释没有变化，亦是“未经授权或者他人同意，通过技术手段进入计算机信息系统，采用网络技术手段以外的其他手段……不属于本款规定的行为。”</p>\n<p>第四，结合本罪的保护法益。再回到本文第一部分论述的本罪保护的法益，本罪主要保护的是数据安全法益和网络安全秩序，打击的是使用具有危害性的破坏网络运行秩序、危及网络安全性的手段获取数据的行为。若行为人未采用技术手段，未避开或突破计算机信息系统安全保护措施获取数据，则难以称其对网络安全和秩序造成了干扰或损害，则不应当属于本罪的规制范围。</p>\n<p>三、司法实务对“侵入”的扩张界定</p>\n<p>2017年，最高人民检察院发布第九批指导案例，其中包括卫梦龙、龚旭、薛东东非法获取计算机信息系统数据案（检例第36号）。该案件的具体案情为：被告人卫梦龙曾于2012年至2014年在北京某大型网络公司工作，被告人龚旭供职于该大型网络公司运营规划管理部，两人原系同事。被告人薛东东系卫梦龙商业合作伙伴。因工作需要，龚旭拥有登录该大型网络公司内部管理开发系统的账号、密码、Token令牌（计算机身份认证令牌），具有查看工作范围内相关数据信息的权限。但该大型网络公司禁止员工私自在内部管理开发系统查看、下载非工作范围内的电子数据信息。2016年6月至9月，经事先合谋，龚旭向卫梦龙提供自己所掌握的该大型网络公司内部管理开发系统账号、密码、Token令牌。卫梦龙利用龚旭提供的账号、密码、Token令牌，违反规定多次在异地登录该大型网络公司内部管理开发系统，查询、下载该计算机信息系统中储存的电子数据。后卫梦龙将非法获取的电子数据交由薛东东通过互联网出售牟利，违法所得共计37000元。</p>\n<p>最高人民检察院在裁判要旨中指出：非法获取计算机信息系统数据罪中的“侵入”，是指违背被害人意愿、非法进入计算机信息系统的行为。其表现形式既包括采用技术手段破坏系统防护进入计算机信息系统，也包括未取得被害人授权擅自进入计算机信息系统，还包括超出被害人授权范围进入计算机信息系统。在论述本案的指导意义处，最高人民检察院进一步表示，非法获取计算机信息系统数据罪中的“侵入”，是指违背被害人意愿、非法进入计算机信息系统的行为。其表现形式既包括采用技术手段破坏系统防护进入计算机信息系统，也包括未取得被害人授权擅自进入计算机信息系统，还包括超出被害人授权范围进入计算机信息系统。本案中，被告人龚旭将自己因工作需要掌握的本公司账号、密码、Token令牌等交由卫梦龙登录该公司管理开发系统获取数据，虽不属于通过技术手段侵入计算机信息系统，但内外勾结擅自登录公司内部管理开发系统下载数据，明显超出正常授权范围。超出授权范围使用账号、密码、Token令牌登录系统，也属于侵入计算机信息系统的行为。</p>\n<p>该案例发布后引发了一定争议，尤其是裁判要旨将“侵入”的界定实质上进行了扩张，将“采用技术手段破坏系统防护进入计算机信息系统”和“未取得被害人授权、超出被害人授权范围进入计算机信息系统”并列，把“未取得授权”和“超越授权”事实上认定为侵入的另两种方式，似乎认为未采用技术手段也可被认定为“侵入”。由于目前司法实务界对“未经授权”和“超越授权”未做具体界定或限制性要求，仅凭字面意义可以对此做出相当广泛性的理解，完全排除他人对某计算机信息系统的访问，如此一来，“侵入”和“采用其他技术手段”要件即被架空，而“违反国家规定”这一要件在实际裁判中几乎起不到限定作用，使得本罪的适用范围被大幅扩张。如使用秘密窃取账号密码、未经同意使用他人电脑、拆卸系统硬盘或其他存储介质、违反网站意愿爬取数据等手段均可被认定为本罪。</p>\n<p>此后，陆续出现了一些将未采取技术手段的获取数据的行为认定为本罪的案件。在一定程度上，这种扩张是面对某些不能被其他罪名涵盖的具有一定社会危害性的行为，基于用刑事手段处置违法行为的冲动而采取的积极应对的策略。由于某些非法获取数据的行为无法被认定为其他犯罪，但又具有一定社会危害性，若不适用非法获取计算机信息系统数据罪进行处罚则将造成处置真空，为社会治理造成了一定的困境。当某种新型的危害行为发生时，刑事司法均会产生抑制该种行为的冲动，但随着司法水平和理论研究的不断进步，对犯罪的认定还是应当回归该罪名的本源，否则就是对罪刑法定原则的变相违背。</p>\n<p>在（2020）沪01刑终519号沈晓航涉职务侵占罪刑事二审案件刑事判决书[2]中，二审法院亦有注意到上述问题。此案被告人在某游戏公司任职期间，利用其运营管理权限，通过后台登录游戏玩家账户，为游戏玩家在其各自游戏账户内添加游戏币，获利人民币157,100元。一审公诉机关上海市浦东新区检察院认为构成破坏计算机信息系统罪，一审法院上海市浦东新区法院判决构成非法获取计算机信息系统数据罪，上海市人民检察院第一分院认为构成职务侵占罪，二审上海市第一中级法院最终以职务侵占罪作出判决。在二审判决中，除了对游戏币的财产属性进行论述外，还阐释了本案不构成破坏计算机信息系统罪和非法获取计算机信息系统数据罪的原因。关于是否构成非法获取计算机信息系统数据罪，其表示，认定关键在于原审被告人是否系侵入计算机信息系统。“本院认为，未经授权或同意，通过技术手段进入计算机信息系统的，应当认定为侵入。根据沈晓航的岗位职责，欢乐互娱公司为沈晓航配发的管理账号有登录游戏后台系统乃至向玩家账户发放游戏币的权限，沈进入后台系统无需上级审批，其未对计算机信息系统实施侵入。此外，沈晓航亦未采用其他技术手段拦截数据等，综上，其行为不符合非法获取计算机信息系统数据罪的构成要件。”即审判人员认为以技术手段进入才能被认定为侵入。</p>\n<p>综上，计算机信息系统具备一定的安全保护措施和采用技术手段进行侵入是构成本罪的两个关键点。首先，计算机信息系统只有设置了安全保护措施，才存在被技术性避开或突破的可能性，这种避开或突破的行为才意味着对计算机信息系统安全平稳运行的秩序造成了破坏，即对本罪保护的法益造成了破坏。其次，违法人员应系通过技术手段避开或突破了该技术安全保护措施进入计算机信息系统获取数据，若行为人只是利用计算机作为工具实施获取数据的行为，但未采取技术手段避开或突破计算机信息系统的安全保护措施，则该行为不属于本罪的处罚范围。</p>\n<p>[1] 杨志琼：《美国数据犯罪的刑法规制：争议及其启示》，载《中国人民大学学报》2021年第6期。[2] 详见裁判文书网。</p></div>", "src": "《计算机犯罪》合集提取"}];
const CATS = ["全部"].concat(Array.from(new Set(ITEMS.map(x=>x.cat))));
let curCat = "全部", kw = "";
function renderChips(){
  document.getElementById("chips").innerHTML = CATS.map(c =>
    '<span class="chip'+(c===curCat?' on':'')+'" onclick="setCat(\''+c+'\')">'+c+'</span>').join("");
}
function setCat(c){ curCat=c; renderChips(); renderList(); }
function renderList(){
  const q = kw.trim();
  const arr = ITEMS.filter(x => (curCat==="全部"||x.cat===curCat) &&
    (!q || (x.title||"").indexOf(q)>=0 || (x.html||"").indexOf(q)>=0));
  document.getElementById("count").textContent = "共 " + arr.length + " 项参考资料";
  const empty = document.getElementById("empty");
  empty.style.display = arr.length ? "none" : "block";
  document.getElementById("list").innerHTML = arr.map((x,i) =>
    '<div class="card" onclick="openM('+i+')"><div class="cat">'+x.cat+'</div>'+
    '<div class="tt">'+x.title+'</div><div class="src">来源：'+x.src+'</div></div>').join("");
}
function openM(i){
  const x = ITEMS[i];
  if (x.file) { window.open(x.file, "_blank"); return; }
  document.getElementById("mtitle").textContent = x.title;
  document.getElementById("mbody").innerHTML = x.html;
  document.getElementById("mnote").textContent = "已在框架内排版显示；来源：" + x.src;
  document.getElementById("modal").classList.add("open");
}
function closeM(){ document.getElementById("modal").classList.remove("open"); }
document.getElementById("q").addEventListener("input", e=>{ kw=e.target.value; renderList(); });
renderChips(); renderList();
</script>
</body>
</html>
