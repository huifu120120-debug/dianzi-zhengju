Ps为核心的基础上，对其进行了适当扩展，例如，从其中的“确保数据可靠性”要求中抽取出“数据质量原则”，并强调控制者应当主动履行更新职责；另外，考虑到个人信息的社会属性，在FIPs原有的知情同意原则的基础上增设“经法律授权”这一合法性基础，避免形成信息主体对其信息具的绝对控制权。此后，OECD又于2013年对其进行修订，增加了部分原则的具体实施要求，以期达到提高条文可操作性的目的。</p>\n<p>2.《关于涉及个人数据处理的个人保护以及此类数据自由流通的第95/46/EC/号指令》（1995）（以下简称“《95/46/EC指令》”）</p>\n<p>在《95/46/EC指令》第二章第一节“与数据质量相关的原则”中，规定了个人信息处理原则：</p>\n<p>（1）成员国应保证个人数据必须：（a）正当、合法处理；（b）为特定、明确和合法的目的而收集，并不得以与目的不符的方式作进一步处理。如果成员国可以提供适当的保障，那么可出于历史、统计或科学目的对数据作进一步处理；（c）进一步处理的目的相较于收集的目的而言，是适当、相关且不过度的；（d）准确，并在必要时保持最新；采取一切合理方式，确保那些相较于收集或进一步处理目的而言不准确、不完整的数据能够被删除或更正；（e）在以允许识别数据主体的形式保存时，存储期限不得超过出于收集目的或进一步处理目的所必需的时间；基于历史、统计或科学目的长期使用个人数据时，应采取充分的保护措施；（2）数据控制者应确保上述条款被遵守。《95/46/EC指令》的出台，进一步促进了FIPs原则在欧洲范围内的传播，虽然在内容上有些许变异，如补充了主体在信息收集和使用时的自主权利、对信息控制者保证数据质量作出了要求。值得注意的是，欧洲大陆虽然认为个人信息保护植根于基本权利保护，与人格保护密切有关，但同样承认这种保护不应当是漫无边际、不受限制的，因此增加了“为历史、统计或科学”等目的可对信息做超出收集目的的进一步处理和存储的例外规定等，但仍然延续了FIPs原则的基本内涵。此外，《95/46/EC指令》限制将个人信息传输到没有“足够的保护水平”的国家，这也在一定程度上鼓励了其他一些国家信息保护法律的完善。</p>\n<p>在信息跨境流通日益频繁的背景下，经合组织、欧洲理事会和欧盟都承认了国家隐私立法中存在差异可能会阻碍国家之间信息的自由流通，而“协调国民隐私标准是国际组织开展隐私活动的主要目的，保护个人隐私利益，统一的目标有助于提高商界对隐私的兴趣”。因此，确立相对统一并被国际社会广泛接受的立法价值理念，并制定和完善相应的个人信息处理原则就显得至关重要。</p>\n<p>21世纪以来：基础框架下处理原则统一机制的构建趋势</p>\n<p>21世纪，信息技术在人类发展历史上占据了前所未有的重要地位，作为先进生产力的代表，其不仅深刻地影响着经济结构与经济效率，还逐渐成为支撑经济活动和社会生活的基石。面对信息经济背后的巨大市场潜力和个人信息权益亟须有力保护的迫切需求，世界主要国家纷纷制定信息保护法。欧盟于2016年施行的《统一数据保护条例》（以下简称“GDPR”）无疑是其中最具影响力和代表性的立法。GDPR在前述框架下对原有规则进行了归纳和整合，相对全面地总结出了七项重要的个人信息处理原则，而在与各个国家和地区的个人信息保护法进行的横向对比分析中，这些原则亦广泛地存在不同程度的体现。GDPR中的个人信息处理原则包括：</p>\n<p>1.合法、正当、透明原则</p>\n<p>这一原则是对1995年《95/46/EC指令》A6（1）（a）.项的扩展，在合法正当原则的基础上扩充了透明度要求。为了使个人信息的处理合法，处理者需要确定处理的具体理由，这些理由即为“处理的合法性基础”，而非仅将主体同意作为信息处理行为的唯一合法性基础。根据处理者的目的和其与信息的关系不同而共有六种选择，处理某些特别敏感类型的信息也有特定的附加条件。而正当原则意味着信息控制者只能以人们合理预期的方式处理个人信息，而不能以对个人信息产生不合理的不利影响的方式使用它们；不仅要考虑如何使用，更要考虑是否应该使用个人信息。透明原则从根本上与正当原则是息息相关的，透明处理要求处理者指从一开始就对他人保持开放和诚实，令其了解处理者的身份、使用方式和原因。</p>\n<p>2.目的限制原则</p>\n<p>这项规定旨在确保信息控制者明确和公开其获取个人信息的目的与理由，以及其处理信息的做法符合主体的合理期望。根据这一原则的要求，信息控制者必须在其应保存的文件内指明处理个人信息的目的，以作为记录义务的一部分。如果其目的改变或将用于新目的，则必须保证新目的与原始目的兼容；除非取得了信息主体的同意或有明确的法律依据，此时才允许其出于公共利益的目的而进行进一步处理。</p>\n<p>3.最小必要原则</p>\n<p>这一原则要求信息控制者仅出于特定目的收集实际需要的个人信息，并保证有足够的个人信息来实现这些目的；此外，信息控制者还必须对持有的信息进行定期审查并删除不需要的内容。根据GDPR规定，个人有权完善相较于使用目的而言不充足的不完整信息，同时也有要求信息控制者删除对实现其目的而言无必要数据的权利，是信息主体更正权与删除权的体现。</p>\n<p>4.准确性原则</p>\n<p>虽然GDPR并未对“准确”一词作出定义，但通常而言应当认定“在事实问题上不正确或具有误导性”的信息为“不准确”信息。这意味着信息控制者必须采取合理步骤以确保一切个人信息的准确性，保证个人信息的来源和状态清晰，并仔细考虑对信息准确性的任何挑战以及是否有必要定期更新信息。在获取个人信息后，控制者必须对个人信息的处理、使用、修改过程等作详细的历史记录，以保证其状态变化的可追溯性。</p>\n<p>5.存储限制原则</p>\n<p>控制者保存个人信息，不得超过为实现其目的所需的必要时间。在保存过程中，控制者应该定期查看所保存的信息，并在不再需要时将其删除或做匿名化处理。GDPR并未规定信息控制者应将个人数据保留多长时间，因此控制者可以根据自己的处理目的来设定合理的时间。如果信息是以允许识别个人身份的形式保存的话，那么控制者必须说明以此种形式保存信息的合理理由，并在该理由不具备后及时对信息进行匿名化处理。同时GDPR也设定了例外情形，那就是如果控制者是出于公共利益的考虑，为科学、历史研究或统计目的保留个人信息，则时间可以适当延长。</p>\n<p>6.完整性和保密性原则</p>\n<p>作为GDPR的关键原则之一，安全原则指信息控制者通过“适当的技术和组织措施”安全地处理个人信息，在决定采取何种措施时，信息控制者可以考虑最新的技术水平和实施成本，但是这些措施必须既适合信息处理的实际情况，又可以应对处理过程中可能带来的风险。在适当的条件下，信息控制者应该考虑使用假名和加密等措施。此外，控制者还必须能够保证在发生物理或技术事件，这些措施能够及时恢复个人信息的可访问性和可用性。</p>\n<p>7.责任原则</p>\n<p>责任原则要求信息控制者对其处理个人信息并遵守其他原则承担责任，同时，还应当有适当的措施和记录，以证明其处理行为是合规的。在具体实施上，主要包括遵守GDPR条文、在适当时通过和实施信息保护措施、保留处理的记录、采取必要的安全措施、针对可能对信息主体利益带来威胁的个人信息处理进行信息保护影响评估等。此外，为了保障信息安全，应当在合理的时间间隔 内对问责机制进行审查和更新。</p>\n<p>三、总结——规则设计的殊途同归</p>\n<p>在2011年发表的《欧洲数据隐私标准对域外影响：108公约全球化含意》一文中，学者Greenleaf根据21世纪以来的国际数据保护立法现状，将经合组织《隐私保护和个人数据跨境流通指南》（OECD）、欧洲委员会个人数据自动化处理中的个人保护公约（CoE）和亚太经合组织的《隐私框架》（APEC）中共享并在后来被各国数据保护立法广泛吸收的原则称为数据保护立法的国际要素，并从中概括出了十大要素：</p>\n<p>这十个国际要素现在已被普遍接受为完整的“数据隐私法”原则的一部分，并且在此类法律中始终存在，共同构成当前全球通行的信息处理原则一基础框架。其所明确的既包括信息处理关系中处理者与信息主体之间的权利义务关系，如个人的知情权、访问权、更正权、拒绝权和删除权等信息权能，以及信息处理者的公开、保密以及安全保障等义务；也包括在信息流通的不同阶段对于信息处理行为的规制，如收集目的特定、明确，以及对存储期限和信息公开和共享行为的限制等。</p>\n<p>虽然这些要素所体现的原则在条文表述上经常有例外和区别，但总是以不同的形式出现和存在着。例如，作为关键原则之一的合法性原则在大多数国家中被概括地归纳为目的合法与方式合法，但也有一些国家与GDPR相同，在此基础上进一步规定了具体的信息处理合法性基础，例如荷兰和马来西亚的个人数据保护法、新西兰的隐私法、罗马尼亚个人数据处理和自由流通中的个人保护法和斯里兰卡《个人数据保护条例草案框架》等。再如，对最早于1980年的《OECD隐私指南》中被确认的目的限定原则，国内有学者认为，应当将目的限制原则与目的明确原则区分开，这两者虽然联系紧密，但目的明确原则旨在要求数据处理者进行处理应有明确的目的，而目的限制原则主要在于确保处理者对于个人数据的收集和处理受到该“明确目的”之限制。但也有学者对此提出反对意见，认为目的限制与目的明确要求虽然具有一定的独立性，但其关联性也不可忽视。目的明确是使用限制的逻辑前提，只有先确定了明确、特定、具体的目的，才能在该目的所确定的范围内对数据的收集使用作出限制；而仅有明确的目的亦无法确保处理者对于个人数据的限定在必要的最小范围内，还需要通过使用限制原则作进一步限定。而我国个人信息保护法第6条中分别通过两个条款对信息处理行为目的的明确性和使用限制分别作出规制，从各国信息保护立法例来看，多数国家亦是采取了此种做法。</p>\n<p>除上述基本原则外，还有一些国家依据其基本国情、结合本国法政策和个人信息保护形势，在这十个国际要素之外设定了新的个人信息处理原则。例如，为了推动经济发展，发挥信息产业潜力，巴西在统一数据保护法中确立了经济技术发展与创新原则和自由企业、自由竞争和消费者保护原则；墨西哥关于保护私人持有个人数据的联邦法在安全、责任原则外，为数据控制者增设了“忠诚义务原则”，以使其能够忠实、诚信地处理个人数据；新西兰隐私法和维多利亚州隐私和数据保护法则通过唯一标识符原则，要求数据控制者采取合理步骤，向身份明确的个人分配独特标识符等。但从总体趋势上看，信息处理原则的设置仍在逐渐走向相对统一的构建模式。究其原因，本质在于个人信息的多元利益属性和多方权属主体使得信息共享权利体系的建立成为现实需求， 为了推动社会治理和产业经济的数字化进程，信息主体对于信息的绝对控制必须让步于信息正当利益的实现，各国就信息处理原则的规范设计仍然是在平衡信息开发利用与主体权益保护这一基本导向的指引下进行。因此，以公平信息实践原则为基础框架，经不断完善发展后的主要处理原则在世界范围内走向相对统一，并将随着信息处理技术的发展和信息共享水平的提升作出及时回应。</p>\n<h2>郭艳东 马宗亮｜我国网络犯罪的犯罪化背景、变迁、思路与界限</h2>\n<p>郭艳东</p>\n<p>澳门科技大学法学博士研究生</p>\n<p>马宗亮</p>\n<p>中共上海市委党校科研处二级主任科员</p>\n<p>我国网络犯罪的犯罪化背景、变迁、思路与界限</p>\n<p>要目</p>\n<p>一、背景：网络的代际演变与网络犯罪异化二、变迁：网络犯罪犯罪化的调整与完善三、思路：严密法网与预防刑法观</p>\n<p>四、界限：司法限缩与立法类型化</p>\n<p>结语</p>\n<p>现今时代呈现出高度的网络社会化态势，犯罪也随之而披上了网络的外衣并与其共生共长。随着互联网技术从web1.0、web2.0到web3.0时代的代际演变，网络犯罪的形式与内容也出现了异化。我国刑法对网络犯罪的犯罪化从计算机犯罪到网络犯罪，再到如今的信息网络犯罪，可以说映射着网络技术的代际演化。考察这一犯罪化的变迁与内容变动，分析网络犯罪的类型与内容，并理清其背后刑法理论的争议与乱象，犯罪化的思路是严而不厉的刑事法网及预防的刑法立法观，传统刑法坚守行为刑法及罪刑法定原则，而面对网络犯罪应当吸收风险社会理论中“可容忍的风险”概念，由此化解传统刑法面对网络犯罪的异化之被动性、滞后性与失灵。唯有在传统刑法的基础上坚持并和论的立场，才是应对网络犯罪务实之举。最终以刑事立法类型化及司法限缩为视角对网络犯罪进行规范与解构，以明晰对网络犯罪进行司法认定的犯罪化边界。</p>\n<p>一、背景：网络的代际演变与网络犯罪异化</p>\n<p>自1994年4月20日我国正式接入国际互联网以来，互联网在中国的发展已逾二十七年之久，其飞速发展有目共睹。根据中国互联网络信息中心（CNNIC）于2021年2月发布的第47次《中国互联网络发展状况统计报告》显示，截至2020年12月，我国网民规模达9.89亿，较2020年3月增长8540万，互联网普及率达70.4%，较2020年3月提升5.9个百分点。我国手机网民规模达9.86亿，较2020年3月增长8885万，网民使用手机上网的比例达99.7%，可以说手机上网已经成为绝对常态化。可见，互联网庞大的规模已经形成。互联网的便捷带给了我们极大的便利，2020年面对突如其来的疫情，互联网显示出强大力量，对打赢疫情防控阻击战起到关键作用。疫情期间，全国一体化政府服务平台推出“防疫健康码”，累计申领近9亿人，使用次数超过400亿人次，支撑着全国绝大部分地区实现“一码通行”，对疫情防控和复工复产及社会运行起到了突出的作用。由此可见，我国人口众多的基数结合互联网时代的深入发展与普及，造就了今日我国互联网网民之众，以及当今时代呈现出的网络化典型特征。</p>\n<p>随着互联网技术的不断进步与发展，如果说Web1.0时代的本质在于网络互联，web2.0时代的本质是社交互动，那么web3.0时代就是建基于web2.0时代之上的聚合共享。但伴随互联网规模化的形成与web3.0时代的来临，加之脱胎于此的自媒体时代的冲击，“在互联网从‘联’向‘互’过渡的背景下，传统犯罪开始了网络变异”。网络犯罪已然成为当今时代犯罪的鲜明特征。“尤其随着三网融合的快速推进，网络犯罪几乎在所有传统领域和全新领域向社会秩序发起了挑战。”综观经济领域的犯罪态势，互联网金融犯罪成为主要特征，尤以非法集资类犯罪最为明显，自2017年以来非法集资类犯罪连续呈现井喷之势，其中通过互联网方式进行非法集资的比重占绝大多数，如广东东莞的“团贷网”非法集资案、上海浦东的“唐小僧”非法集资案、上海浦东的“财神爷爷”非法集资案等。面对这一日益严峻的互联网金融犯罪形势，2017年8月4日最高人民法院发布《关于进一步加强金融审判工作的若干意见》，提出要依法严厉打击涉互联网金融或者以互联网金融名义进行的违法犯罪行为，规范和保障互联网金融健康发展。据此，经济（金融）领域犯罪的网络化态势由此可兹管中窥豹。除此之外，传统犯罪的网络异化现象也很明显：如我国刑法第293条规定的寻衅滋事罪，传统领域本罪多发生于物理空间内针对个人的随意殴打、辱骂、恐吓他人等（当然，构成犯罪尚须达到情节恶劣或情节严重或严重破坏社会秩序等），或在公共场所起哄闹事造成公共场所秩序严重混乱等情形中，而近年来随着互联网的高速发展、普及，尤其伴以web3.0时代聚合共享形式的网络更新及以自媒体时代为特征的新型传播方式，一些不法分子将信息网络作为一种新的犯罪平台，有的在信息网络上捏造事实恶意诽谤他人，损害他人名誉；有的利用社会敏感热点问题，编造所谓的虚假信息在网络上大肆传播，严重扰乱社会秩序；有的甚至成立“网络公关公司”成为“网络推手”，专门从事造谣、炒作、有偿删帖等服务。鉴于此，2013年9月10日最高人民法院、最高人民检察院（以下简称“两高”）出台了《关于办理利用信息网络实施诽谤等刑事案件适用法律若干问题的解释》（法释（2013）21号文）为实践中依法应对并惩治利用信息网络实施寻衅滋事等犯罪提供了明确的法律依据。微细观察，该解释不仅涉及利用信息网络实施寻衅滋事违法犯罪行为，还包括诽谤、敲诈勒索、非法经营、故意传播虚假恐怖信息、煽动暴力抗拒法律实施、损害商业信誉、商品声誉等违法犯罪行为。又如传统盗窃罪，经检索北大法宝案例库发现，以上海法院为例，自2006年至2020年间一审判决刑事案件数量为843件，而其中仅2016年至2020年五年内，这一数据就合计490件，占比58.1%，传统盗窃罪网络化趋势也很凸显。除了盗窃行为的网络化方式、手段之外，也凸显在盗窃罪对象的变化上，盗窃罪对象原先限于“有体物”之公私财产，后随着科学技术的发展，自18世纪美国科学家富兰克林通过“风筝实验”发现了电以来，随着第二次工业革命的进程与“电气时代”的迈入，电从单纯的自然现象变为一种影响人类生活并被广泛使用、控制的有经济价值的财产，盗窃罪的犯罪对象也随之发生变化，盗窃电力（与此相似的还有水、天然气等）均构成盗窃罪。而随着互联网技术的进步与革新，伴随着网络游戏的兴盛，以“虚拟货币”“游戏级别装备”“q币”等为代表的网络虚拟财产层出不穷，有的游戏中从通过苦苦修炼、焦灼等待方可获得的“级别”“装备”转向了向网络游戏服务商现款即可购得，一个随时被可能被“秒杀”的“村民”转眼就可摇身一变称为可以发动“国战”的“国王”。从“社会相当”关系（或社会重要性）而言，相比较于以往靠“修炼”得来的“虚拟财产”，其传统型财产属性更加清晰了然。进而，盗窃网络虚拟财产逐渐成为盗窃罪的规制对象，凡此种种。不仅如此，网络媒介方式开始呈现多元化的倾向，不仅包括传统的“互联网技术媒介--计算机终端”方式，还拓展至以信息交换为核心的web2.0时代、web3.0时代的“信息网络技术媒介--电视机、固定电话机、移动电话机等电子设备终端”，即从普通网络化升级为信息网络化趋势，这也催生了大数据产业的发达与生成，人类开始步入“大数据时代”。如果说“犯罪的网络化”显现了web1.0时代到web2.0时代的进化，那么“犯罪的信息网络化”则显现出web2.0时代到web3.0时代的演化背景，这就是网络技术进步带给我们的时代性课题：智能互联网时代，“多重网络安全与风险并生共存。”故，当今社会尽显鲜明的网络社会化时代特征，而犯罪呈现出网络异化的二代特征：从传统犯罪网络化至犯罪信息网络化的进阶。</p>\n<p>二、变迁：网络犯罪犯罪化的调整与完善</p>\n<p>如果说web1.0时代带给人们的更多的是这个新奇虚拟网络世界的“启蒙”，那么web2.0与web3.0时代带给人们更多的便是网络世界的“水乳交融”。新一代网民不仅数量之巨，而且随着移动互联网自媒体时代的到来，每个个体都是一个信息源，每个个体又都是一个传播源，这种“聚合共享型网络生态”极大地影响着人们生活的格局与状态。与此同时，这种生态需要极大的“自律”来分解这种技术风险社会中种种违反法律、违反伦理的行为与言论。伴随着互联网技术这样不断地进化及随之犯罪的网络化、网络信息化，我国对网络犯罪的刑事处罚也呈现出一定的变化与适度的调整。</p>\n<p>我国刑法从“计算机犯罪”到“网络犯罪”的调整</p>\n<p>尽管说我国于1994年即已与世界互联网络，但在网络初级“启蒙”阶段的web1.0时代，计算机在我国普及率还很低，网民数量很少。直至2000年我国三大门户网站——搜狐、新浪、网易的上市方直接推动了我国计算机的普及及网民数量的骤增，那时的街头网吧一时风头无两，新奇的虚拟网络世界召唤着新时代的青年才俊们。逐渐地，犯罪作为一种社会现象，也如约随形。网络使得犯罪在形式上具有了新的特点：一是使传统犯罪在手段上“翻新”；二是产生了新的犯罪类型，如计算机犯罪，包括以计算机为手段的犯罪和以计算机系统为对象的犯罪，即通常所说的“黑客”犯罪。“犯罪形态会随着社会状况的变迁，而不断地更新。新科技的发明与运用，必然导致社会状况的变迁，而衍生新形态的犯罪。电脑科技的发明与运用，自亦不例外，至今已衍生不少以电脑为犯罪工具或以电脑为犯罪侵害客体的犯罪行为。这一新兴形态的犯罪行为，即是电脑犯罪所要加以研究的客体。”如上著述关于犯罪学、刑法学的研究，多称之为“计算机犯罪”或“电脑犯罪”，折射到我国刑事立法上，这一称谓有所影响。有论者指出：“计算机犯罪的概念几乎不再被提起，利用网络实施的传统犯罪在数量和社会影响上的绝对优势，让计算机犯罪一词几乎完全退出了历史舞台，网络犯罪成为一个更被广泛认可的术语。计算机犯罪与网络犯罪在概念上不再是一种并列关系，而演变为一种种属关系，计算机犯罪成为网络犯罪的下位概念。”于此，“从计算机犯罪到互联网犯罪的演变，也正好契合了以计算机为基础的互联网的技术发展，从而为网络犯罪提供了生存空间。”这一阐述还是很中肯的。</p>\n<p>我国现行刑法自1997年开始实施，相较于1979年刑法，新增第285条、286条即设立了非法侵入计算机信息系统罪和破坏计算机信息系统罪；同时，在第287条新增利用计算机实施犯罪的提示性规定：利用计算机实施金融诈骗、盗窃、贪污、挪用公款、窃取国家秘密或者其他犯罪的，依照本法有关规定定罪处罚。自此直至2000年12月28日全国人大常委会通过了《关于维护互联网安全的决定》才将该类型犯罪统称为“网络犯罪”并分为两类，第一类为以计算机为对象型的网络犯罪，即侵犯计算机信息系统安全的网络犯罪；第二类是以计算机为工具型的网络犯罪，即利用计算机或网络实施的其他网络犯罪。如此，“这样的立法规定凸显了我国网络犯罪‘两点一面’的立法结构与特点。”尽管如此，其并未改变我国现行刑法规定的前述两罪之现状：即彼时1997年刑法当中仅仅对当时互联网领域终端媒介——计算机进行了刑事保护。</p>\n<p>从网络犯罪到信息网络犯罪的进阶</p>\n<p>自此提出“网络犯罪”概念之后直至2009年的近十年间，社会发展变化加快，网络犯罪的手段与方式翻新加快，不同环节的网络犯罪涌现并呈现一定的相互独立性，经济领域网络犯罪开始呈现地下产业化等，这都对刑事立法提出了新课题。加之社会上泄露隐私、侵犯公民个人信息违法犯罪行为借助互联网的广泛传播与脱域化造成了恶劣的社会影响，网络空间社区亟须清理与净化。2009年2月28日我国刑法修正案（七）姗然而至，此次修正完善了刑法仅对互联网终端媒介计算机予以保护的立法思路，新增两款作为刑法第285条非法侵入计算机信息系统罪之第2款、第3款，分别为：“非法获取计算机信息系统数据、非法控制计算机信息系统罪”“提供侵入、非法控制计算机信息系统程序、工具罪”。由此，我国立法机关从关注传统计算机操作系统安全衍生至计算机系统存储、处理或者传输的“数据”等对象，行为手段方式也拓展至“非法控制”计算机信息系统行为与“提供相关程序、工具”之行为。质言之，刑法修正案（七）拓展了网络犯罪之犯罪对象、犯罪行为的手段方式，包括单独提供相关程序、工具之情形，凸显了网络犯罪不同环节之独立性与单独刑法评价，而实际上，这才是从网络犯罪到信息网络犯罪的肇始。</p>\n<p>如果说刑法修正案（七）只是对信息网络犯罪的初始关注，伴随着web2.0与web3.0时代的网络进化与互联网的代际演变，那么时隔六年之后2015年11月1日开始实施的刑法修正案（九）的修改则更加凸显了信息网络犯罪的客观现实。针对互联网平台公司的雨后春笋以及单位犯罪的客观实然，此次修正全面新增单位犯罪：单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照各该款规定处罚。不仅如此，在单位犯罪以外，还新增设了令各互联网平台公司引以为郁“达摩克利斯之剑”的第286条之一的“拒不履行信息网络安全管理义务罪”，即“网络服务提供者不履行法律、行政法规规定的信息网络安全管理义务，经监管部门责令采取改正措施而拒不改正，有下列情形之一的行为：（一）致使违法信息大量传播的；（二）致使用户信息泄露，造成严重后果的；（三）致使刑事案件证据灭失，情节严重的；（四）有其他严重情节的。本罪犯罪主体是一般主体，根据我国《刑法》规定，单位也可构成本罪。成为争议的是，本罪的义务来源是何者？一望可知的是，唯有我国立法法意义上的“法律、行政法规”方可有此担当与正当性，在此宜作狭义解释。2000年12月28日由全国人大常委会颁布、实施的《关于维护互联网安全的决定》（2009年8月27日修正）规定：“从事互联网业务的单位要依法开展活动，发现互联网上出现违法犯罪行为和有害信息时，要采取措施，停止传输有害信息，并及时向有关机关报告。”而于2017年6月1日起开始实施的网络安全法第9条明确规定：“网络运营者开展经营和服务活动，必须遵守法律、行政法规，尊重社会公德，遵守商业道德，诚实信用，履行网络安全保护义务，接受政府和社会的监督，承担社会责任。”网络安全法第45条也规定：“依法负有网络安全监督管理职责的部门及其工作人员，必须对在履行职责中知悉的个人信息、隐私和商业秘密严格保密，不得泄露、出售或者非法向他人提供。”第47条还规定：“网络运营者应当加强对其用户发布的信息的管理，发现法律、行政法规禁止发布或者传输的信息的，应当立即停止传输该信息，采取消除等处置措施，防止信息扩散，保存有关记录，并向有关主管部门报告。”等等，不一而足。这实际上明确并细化了网络服务提供者的“信息网络安全管理义务”。这一法定犯、行政犯的设定，应引起互联网服务行业、各单位及其高管等足够的重视与警醒，切实履行自身的“信息网络安全管理义务”，承担其社会责任，否则一旦引起严重后果或者情节严重的，则会引起单位的刑事法律风险，这无疑也反向促进了企业合规的建设与开展。</p>\n<p>如上，在刑法修正案（九）全面新增了网络犯罪的单位犯罪及“拒不履行信息网络安全管理义务罪”之外，还增设了两条规定：即作为第287条之一的非法利用信息网络罪和第287条之二的帮助信息网络犯罪活动罪。如果说前者是传统犯罪的网络化行为方式或预备行为等情形，仍在践行前述网络犯罪不同环节单独评价这一立法思路的话，那么后者则彻底践行了“帮助行为的正犯化”，网络犯罪不同环节单独评价的立法考量尽显。刑法修正之后，2019年11月1日最高人民法院、最高人民检察院发布《关于办理非法利用信息网络、帮助信息网络犯罪活动等刑事案件适用法律若干问题的解释》对该两罪专项进行了司法解释，且在新闻发布会上同时发布了四个指导性案例（如黄杰明、陶胜新等非法利用信息网络案等）。值得提出的是，该司法解释其实并非仅针对新增的该两罪进行了解释，还包括前述的“达摩克利斯之剑”--“拒不履行信息网络安全管理义务罪”之解释，如该罪中何谓网络服务提供者，其范围包括何者？同时，解释还列举、细化了拒不履行信息网络安全管理义务致使用户信息泄露，造成严重后果的情形：如致使泄露行踪轨迹信息、财产信息等500条以上的；又如致使泄露住宿信息、交易信息等用户信息5000条以上的，等等。可以得见，从传统的“计算机犯罪”到“网络犯罪”，再到如今的“信息网络犯罪”，不仅应和了互联网技术的进阶与变化，而且也凸显了我国刑法对网络犯罪规制的变迁，考察这一变迁，为我们分析刑法规制网络犯罪的思路与界限提供了绝佳范式。</p>\n<p>三、思路：严密法网与预防刑法观</p>\n<p>如前所述，异于传统物理空间犯罪，网络犯罪不同环节独立评价的立法思路尽显，而这正凸显了我国现行阶段“严而不厉”的刑法立法政策与预防的刑事立法观。网络空间中，上下家各个网络链接环节的行为人可能完全不存在统合的故意罪过，彼此之间的行为也不再联系紧密，甚至没有任何刑法上的因果关系，尤其随着“快播案”的影响，技术是否有罪的讨论甚嚣尘上，技术伦理化的限制与思考也备受关注。本文认为，针对网络犯罪的这一独特性质，我国传统刑法理论坚守的“社会关系说”或“社会危害性说”呈现出一定的滞后性与被动性。基于此，我国刑法理论界多有学者开始涌现并倡导积极预防的刑事立法观之主张，如我国学者付立庆教授提出：“积极主义刑法观既与现代社会发展的情势变化相关联，也部分地得到了立法实践的印证，还和刑法谦抑原则不冲突。刑法应该更加积极一些，采纳积极主义刑法观。”另，在“打早打小”等政策的支撑下，尤其在利用信息网络实施黑恶势力犯罪的领域，刑事司法部门也奔向着积极主义司法观，这在最高人民法院、最高人民检察院、公安部、司法部《关于办理利用信息网络实施黑恶势力犯罪刑事案件若干问题的意见》中已然得到了一定程度的彰显。</p>\n<p>本文认为，对于恐怖犯罪、网络犯罪等新形态犯罪领域，由于其具有强大的超出传统物理空间范围的严重影响与巨大风险，具有不可控性，一旦发生则将发生或足以发生重大的危险或严重后果。如云南火车站的暴恐犯罪，触目惊心，令人不可容忍。故，融入风险社会中“可容忍的风险”，结合传统罪责刑法理论的“并和论”立场才可以有效应对当前风险社会的风险，否则固守传统罪责刑法理论的被动性立场，将因面临社会治理的无可奈何而失灵，严重动摇刑法参与社会治理的功能与作用。“刑为盛世所不尚，亦为盛世所不可缺。”在“严而不厉”的刑法立法政策与预防刑法立法观的指引下，面对网络犯罪的代际更新与花样翻新，坚持网络犯罪不同环节独立评价的整体趋向，逐步严密刑事法网，形成“严而不厉”的刑事法网与适度提前预防的刑法保障，确然在打击网络犯罪上解决了实践中一些传统罪责刑法理论无法解决的突出问题，无可厚非，应予肯定。而出现的预备行为实行化、共犯正犯化等，也值得我们深入探究。</p>\n<p>预备行为实行化</p>\n<p>我国刑法第22条规定：为了犯罪，准备工具、制造条件的，是犯罪预备。对于预备犯，可以比照既遂犯从轻、减轻处罚或者免除处罚。预备行为实行化是将原本属于其他犯罪的预备行为按照实行行为予以处罚。“预备行为的实行化具有两个效果：一是对于预备行为处罚的独立化；二是刑法打击时点的前移。”如前述的“非法利用信息网络罪”，对利用网络设立违法犯罪的网站、通讯群组以及发布违法犯罪信息的行为予以定罪处理即是此例，这正是我国预备行为实行化的最新立法例，最先的立法例是我国刑法修正案（九）新增刑法第120条之二的准备实施恐怖活动罪。实际上，在网络犯罪领域，预备行为实行化其实是一种早已采用的做法。如我国现行1997年刑法第285条规定的非法侵入计算机信息系统罪中，非法侵入计算机信息系统的行为应当是一种为侵犯各种国家机密、国防秘密和尖端科学技术秘密的犯罪预备行为。由于其犯罪性质严重，一旦实施或实施完毕，危害性极大，危害后果也难以估测、无法评估和难以挽回。有鉴于此，我国刑法将这种实质的犯罪预备行为法定提前化，亦即将这些预备性质的犯罪行为提升为具体犯罪的犯罪构成之实行行为，以严厉打击此类犯罪。在我国刑法理论中，犯罪预备是一种犯罪未完成形态，而在以德日为代表的大陆法系刑法学中，预备犯分为形式预备犯和实质预备犯，形式预备犯通常附属于相关犯罪既遂论的构成要件；而实质预备犯则系指立法者在刑法中将相关犯罪预备行为独立成罪，进而成为独立的犯罪类型。实质预备犯又称为预备行为实行化，一般立法将其行为类型化，如同一般构成要件行为，由刑法典分则具体记述其构成要件，具有“实行行为性”之存在。既如此，那么形式预备犯就不应在本文探讨的范围内了。我国学者彭文华教授指出，实质预备犯应当是以预备性维持实质预备犯作为预备犯一种的品性，建立与形式预备犯之“目的”内涵相通之处，又以实行性超越形式预备犯，形成自己独立处罚的犯罪格局。仍然应当坚持从规范意义上与特定犯罪的关联来理解和掌握实质预备犯的问题。因此，就我国刑法中的预备行为实行化问题，即实质预备犯，仍需深化及进一步研究。但无论如何，预备行为实行化已然成为我国刑法法网中的一种重要现象，此应无疑义，颇值研究。</p>\n<p>共犯正犯化</p>\n<p>如果说“预备行为实行化”是现行刑法修正针对网络犯罪与暴恐犯罪等情形的一个重要特征，那么“共犯正犯化”现象则正是刑法修正呈现的另一个特征。正如有学者提出的，“网络空间中大量的帮助行为的社会危害性已经远远超过了实行行为的危害性，为犯罪行为提供网络技术帮助的行为越来越重要，已经逐渐占据了主导地位，开始突破帮助行为在犯罪中的从属地位，并主导犯罪和引领犯罪。”有鉴于此，学界有观点认为，应按照“共犯正犯化”的思路对网络犯罪进行制裁。与此相呼应，刑事立法和司法解释也把“共犯正犯化”当作一种有效的策略加以利用。“共犯正犯化”的前提是区分制体系，因为单一的正犯体系中每个行为参与人的可处罚性都是相互独立的，任何参与行为人都属于正犯。而我国究竟是“区分制”还是“单一制”的共犯体系，学界争论较大。而这又实质地影响着“共犯正犯化”的提出与根基问题。我国学者刘明祥教授指出：“我国刑法采取不区分正犯与共犯的单一正犯（或单一行为人）体系，不存在共犯从属性说赖以存在的犯罪参与体系之基础。刑法分则将教唆行为、帮助行为规定为独立的犯罪与实行行为同等对待，表明我国刑法并没有采取共犯从属性说，实行从属性原则不具有理论上的合理性。”既如此，那么我国刑法领域对共犯体系究竟坚持“共犯从属性说”还是“共犯独立性说”？根据我国刑法规定及刑法通说，一般认为我国采取的是“共犯独立性说”。我国刑法对共同犯罪人的分类是按照行为人的分工及其所起的作用大小的混合分类法来进行分类，包括主犯、从犯、胁从犯（此按照犯罪中所起的作用来分类）、教唆犯（与组织犯、帮助犯、实行犯等按照犯罪分工来分类）等。关于从犯而言，这里存有争议的是帮助犯是否都为从犯？根据我国刑法第27条之规定：在共同犯罪中，起次要作用或者辅助作用的，是从犯。这里需要注意的是从犯概念中用的是“辅助”而非“帮助”，“辅助”意味着帮助行为在共同犯罪中只是其次要作用。因此这里有必要区分具有辅助作用的“帮助行为”与“帮助犯”这两个概念，前者只能是从犯，而后者则并不必然一定是主犯。由此来看，我国实际上坚持的是“单一制”的共犯体系。正如我国学者江溯提出的：“我国现行立法采取的是单一正犯体系，应当摒弃区分制共犯理论，区分制共犯体系并不值得采用。”亦如“出于严密法网、解决共犯从属性地位导致的罪责不匹配问题的考虑，我国刑法所采纳的‘共犯正犯化’的处理路径，其实是对单层区分制下实质正犯理论的误用。”可以想见，“共犯正犯化”这一论题之争仍将继续，学界与实务界仍需持续深入研究与探讨。</p>\n<p>四、界限：司法限缩与立法类型化</p>\n<p>尽管说刑事立法中凸显出“预备行为实行化”与“共犯正犯化”现象，且理论界对此仍存较大争议。美国学者哈伯特·帕克教授在其《刑事制裁的界限》中提出刑事诉讼程序的两个模式，分别为“正当程序模式和犯罪控制模式”，但面对这一实然，我们还是希冀从“司法限缩”与“立法类型化”之双线视角提出一点看法。</p>\n<p>“共犯正犯化”易与共犯理论相悖，造成共犯理论体系混乱与定罪困境，进而消解共犯理论功能</p>\n<p>如网络服务提供者因其尚未构成单独的正犯之时（如刑法第287条之一的非法利用信息网络罪或之二的帮助信息网络犯罪活动罪），如果其行为却又符合主行为人实施的其他犯罪（比如传播淫秽物品罪、诽谤罪、诈骗罪、洗钱罪等），是否可以按照共犯理论来认定网络服务提供者的刑事责任？如果前后两个行为都构成犯罪的，那么根据刑法规定依照处罚较重的规定处罚即可，此自无疑义。倘若前者帮助行为构成犯罪，而共犯行为人又尚未构成犯罪的（如尚未达到罪量要素而不构成诈骗罪或传播淫秽物品罪的），所谓“共犯正犯化”的这一刑法规定确实也严密了刑事法网，疏而不漏，有效打击了这一犯罪行为。但是，如若前者不构成正犯而共犯行为人却构成诈骗等罪时，此时若按照共犯理论进行处罚即与“共犯正犯化”的意旨存在相悖。如果不处罚，则又有放纵犯罪之嫌。质言之，这正是“共犯正犯化”所造成的共犯理论体系之混乱与定罪意义上之困境。</p>\n<p>“共犯正犯化”的量刑难题</p>\n<p>如前例中，若网络服务提供者的行为不仅构成拒不履行信息网络安全管理义务罪，同时也仍可能触及传播淫秽物品罪、诽谤罪等，那么法官的司法适用与选择则成为摇摆。无论选择何者，看似法网严密，体系混乱不表，实则错综复杂法网交织一起，在量刑上难免出现法定刑的徘徊与不一致，这不失为一种司法乃至立法资源浪费，也背离了刑法从严治理网络服务提供者及帮助行为的初衷与美好设想。</p>\n<p>网络服务提供者的犯罪类型化之亟须</p>\n<p>如前述，我国刑法在拒不履行信息网络安全管理义务罪中采取了“列举+兜底”式的罪状表述，而我们对网络服务提供者的主体类型化却多无关注与侧重。实际上这一影响是很大的。从刑法教义学的立场出发，对现有刑法立法框架、内容、体系所存问题的深入反思，是为了更好地对现有刑法规范提出有针对性的解释与司法适用。如若缺乏类型化，体系性与明确性自然受制，也就必然导致法的不确定性，甚至与罪刑法定原则这一刑法的根基相悖反；其二也容易造成罪刑均衡原则的违反，不得“罚当其罪”之要领。就“拒不履行信息网络安全管理义务罪”而言，如有学者说：“网络服务提供者功能性类型区分应当作为一种法教义学资源引入现有的刑法学体系，以更好地实现对法律的解释与适用。”事实上，究竟什么是网络服务提供者并不明确，甚至有的网络服务提供者对自己的定位和性质更不自知。诸如互联网技术中的“互联网接入”“服务器托管”“网络存储”“通讯传输”“广告推广”“支付结算”等行为方式与概念，并未有相应类型之区分，故而现实中，这种一般性、积极性的义务并不明确也不具体，比如如何监控以及监控的义务程度如何，边界为何并无具体类型化之规定，具体到司法实践中，如何确定网络服务提供者，是存有一定的模糊性的。或许正如此，我国学者车浩教授才发出了灵魂之问：“要求企业履行网络警察的义务，这样一个社会分工的错位，最终可能会阻碍甚至窒息整个互联网行业的发展。”因此，以互联网独特的技术为标准与界限，区分网络接入服务者、网络内容提供者、存储服务提供者、网络缓存及云服务提供者应该是合适的，力求边界清晰，在网络安全与自由保障之间寻得平衡与妥适。总之，坚持类型化与技术区分标准，是本罪值得检讨与立法技术提升改善之所在。唯此，方可防止刑事司法的扩张与刑事责任的泛化，明确犯罪化的界限，进而限缩犯罪圈边界的扩张。</p>\n<p>结语</p>\n<p>互联网技术的发展仍在继续，代际演变也仍在延续。而网络犯罪也随之变动并呈现出新的样态，如何更好地修正与完善刑法立法并合理地进行司法适用，清晰犯罪化的边界，就必须要正视互联网的技术性特征，在刑法修正的思路上坚持类型化与体系化，坚守我国共犯理论的特殊区分制体系，谨守严而不厉的刑事法网与预防的刑法立法观立场，当以暴恐犯罪、网络犯罪、涉黑犯罪、毒品犯罪等可能会损害重大法益或严重损害法益等领域的犯罪进行犯罪化。而在刑事司法领域，有权机关对以“共犯正犯化”“预备行为实行化”等为特征的犯罪解释宜当秉守克制的限缩思路。必须认识到，国家公权力（包括刑罚权在内）只是网络社会治理的必要条件而非全部。作为主要为法定犯类型的网络犯罪，合理限定网络服务提供者的保证人地位和作为义务内容是防止该等犯罪发生的一个关键性因素，也是坚持法秩序统一原理的应然要求。总之，网络犯罪治理需要坚持刑法立法类型化与刑事司法限缩以实现刑事制裁边界的清晰化。</p>\n<h2>何孟圆｜电商平台知识产权侵权下的注意义务初探</h2>\n<p>何孟圆</p>\n<p>上海交通大学凯原法学院硕士研究生</p>\n<p>电商平台知识产权侵权下的注意义务初探</p>\n<p>要目</p>\n<p>一、问题的提出二、电商平台的发展与义务边界的拓展三、注意义务强化的正当性与可行性四、注意义务的强化结语</p>\n<p>在间接侵权理论背景下，电商平台的侵权责任需要依托注意义务的界定来划分过错的程度，注意义务不明将影响电商平台的义务履行和司法实践中侵权责任承担及责任范围的判断。随着技术的创新发展以及平台自治理念的推进，电商平台的技术不断扩大，电商平台注意义务的考量因素也有所发展，但共同侵权理论下注意义务界定不清给法律实践造成一定困扰。我国的电商平台注意义务应加强落实事前注意义务、事中注意义务和事后注意义务，通过探讨不同阶段的注意义务正当性及可行性强化技术发展背景下的注意义务。</p>\n<p>一、问题的提出</p>\n<p>在过去20年，以美国立法为代表的“避风港规则”作为规制互联网行业网络服务提供者的典型规则，深刻影响着各国互联网立法与实践。随着技术发展与平台多样化，平台经济在带动产业发展的同时获得优势地位、攫取经济利益，互联网平台权责不匹配的问题也日渐凸显。互联网作为物理空间的延伸，商务活动得以进一步向网络空间拓展，网络侵权行为随着电商平台的发展也逐步增多。</p>\n<p>电商平台的角色功能定位一直以来都存在一定争议，传统观点提出柜台出租者、交易场所提供方定性并不能完全涵盖网络服务提供者的平台属性。在实践操作中，电商平台也切实履行起了对平台交易经营者、非经营者身份核验和“看门人”的角色，此种不同于其他类型网络服务提供者特征使电商平台具备了不同的注意义务，包括电商平台对平台内经营者资格管控能力、对平台内商品和服务的控制能力和其具备的有法律依据的控制能力。这些因素都影响着电商平台的角色定位功能，将其作为一种市场的组织者和管理者，承担其比普通私人企业更多的综合性职能。在电商平台发挥巨大经济影响的同时，作为市场组织者和管理者的角色定位和功能需求也透露出对电商平台相较于其他网络服务提供者承担更多社会责任的期待。在利用“避风港规则”实现责任豁免的同时，电商平台在角色功能逐渐丰富的过程中是否应承担以及应如何承担与平台能力相匹配的注意义务值得进一步思考。</p>\n<p>二、电商平台的发展与义务边界的拓展</p>\n<p>注意义务是指“一种为了避免损害而加以合理注意的法定责任”，其重要性体现在作为过错侵权责任的核心要素，换言之，没有注意义务就没有过失行为 ，也没有过失责任的承担。大陆法系国家最先以“善良家父”标准来判断行为人是否存在过失，进而界定注意义务。英美法国家则贯彻“理性人”客观判断标准，在该标准下注意义务的确定即依赖客观情况下人们通常达到的注意程度。注意义务的设定则可通过服务类型、行为类型和权利客体三个维度进行限制。当下的网络服务可以细分为基础服务、信息定位服务、信息储存服务和开放平台服务，互联网作为双边市场，其商业模式和各类网络服务提供者提供等额商品或服务有差别，但均在于通过用户累积带来的流量获得广告或其他收益。</p>\n<p>电商平台应当被界定为一种网络服务提供者。电商平台的法律地位有居间人、柜台出租者和网络服务提供者三种学说。居间人说认为，电商平台提供交易信息，促进交易进行。柜台出租者说认为，电商平台与卖家之间是一种“网络空间租赁关系”。此种定性来源于展销会，特点在于展销会结束后，消保法出于消费者维权便利和利益保护考量，由展会的柜台出租方先行承担赔偿责任。网络服务提供者观点认为，电商平台是一个商品信息发布平台，是为买卖双方在网络上提供交易、磋商、信息互换的网络服务提供商。电商平台相较于接入服务、储存服务等服务而言距商品服务交易、卖家准入、第三方支付等服务更近一步，且作为网络服务空间的提供者与物理空间提供者存在本质上的区别。电子商务法关于平台立法的基础理论认为，平台应当是一种具有独立组织架构和独特权力机制的新型市场主体，且平台经营者逐步呈现出企业型框架，但其共同点体现在平台具有一种市场组织者属性。网络服务提供者说的合理性在于，电商平台并非极其纯粹的私人企业主体，具备了普通实体企业并不具备的用户聚集能力、社会影响力和信息传播能力，其作为一种市场的组织者和管理者，承担了比普通私人企业更多的综合性职能。</p>\n<p>美国最高院在Inwood Labs Ins.v.Ives Labs,inc.案件中确定了第三者责任的基础，在此后的侵权责任中，美国立法认为如果被告“故意”（intentionally）引诱他人侵权或持续生产、销售其知道或应当知道侵权的产品，则此种平台需要承担帮助侵权（contributory infringement）。此外，Louis Vuitton v.Akanoc Solutions案与Tiffany v. eBay案两个不同结果的标志性案件为第三人责任铺平了道路。第九巡回法院Louis Vuitton v. Akanoc Solutions案中，法院认为线上平台方应当承担责任，而第二巡回法院Tiffany v. eBay and Louis Vuitton v. Akanoc案，法院则认为平台无须承担责任。在第二巡回法院的Tiffany案中，法院明确了eBay没有对其网站上销售的额商品的真假（authenticity）进行调查和打击售假活动的义务，也没有达到需要承担第三方责任的“明确知道”侵权的主观过错程度。这种明确知道（specific knowledge）意味着超过“一般性了解和有理由知道其服务被用于侵权行为”的程度。此外，电商平台明知的证明责任也由原告方承担。欧盟于2000年出台的电子商务指令集中体现了欧洲议会及欧盟理事会对网络服务提供者注意义务的规定，第14条规定宿主服务就侵权责任豁免条件为“网络服务商如希望获得责任豁免，不仅需要满足对侵权行为或内容的知道，且需要在知道上述事实和情况后及时采取制止侵权的必要行动。”此后，2016年欧盟委员会指出，在维持“避风港”规则适用的同时应扩大平台责任，要求平台方在具体的情形下承担更多的注意义务。在L'Oreal v. eBay系列案中，比利时布鲁塞尔法院认为电商平台可以获得责任豁免，因为eBay没有对网站内容承担任何的监测义务。但法国法院认为eBay的性质更像一个拍卖网站，eBay在这一环节中扮演了两种角色，一是中立职能（neutral function），类似经纪人留存第三方的邀约，在此基础上eBay可以获得责任豁免，二是主动的角色（active role），尝试推销自己的活动，例如向用户发送商业邮件。而eBay也应当尽到最大努力保障自己的活动不侵害第三方利益，同时帮助权利人制止侵权，判决最终认定双方应当寻找一种折中的解决方式。在欧盟法院2011年发表的意见显示，host宿主服务商只有在局限于仅中立地对第三方数据技术和自动化处理平台服务的时候，才能免除责任。换言之，当平台作为一个积极主动的角色，对于数据知道或有能力控制之时，他们将不能再获得责任豁免。此外，欧盟法院还强调，宿主服务商有权适用“避风港”规则，但eBay同时也有勤勉运营的注意义务，保证平台不被用于非法目的。</p>\n<p>美国与欧盟的立法者最初均认同避风港规则对产业发展的支持作用，避免网络服务提供商因中立性技术提供服务承担责任。但随着互联网平台与服务内容联系愈发紧密，网络服务提供者不可能永远停留在避风港中。电商平台在知道或应当知道的事实下，或需要承担勤勉经济运营职责的基础上，或是没有及时移除或断开要约链接的情形，这些服务者们都不能得到避风港的庇护。</p>\n<p>我国立法的治理思路更倾向于增加平台经营者的治理功能，要求平台承担起治理的责任和义务，利用电商平台在环境治理中的高效和控制优势发挥出电商平台在网络交易环境中的主导作用。电商平台的角色随着三部法律的发展逐渐细化。在信息网络传播权保护条例及其司法解释出台时，针对网络服务提供者的归责和免责机制进行了规定。条例第15条第一次引入了避风港规则，明确“通知-删除”机制作为著作权责任豁免的条件。2018年电子商务法出台，第41条至第45条规定构建了我国电商平台知识产权保护法律制度，其中要求电商平台主动承担更多的知识产权治理责任与义务，例如增加平台自主管理、制定平台知识产权保护规则、实施平台治理措施等，发挥电商平台在网络环境中的高效率和掌控力，体现出了由平台扮演治理角色的趋势。这种通过自治权利赋予电子商务经营者自主管理能力的行为也同时作为电商平台的一种法定义务，一旦违反也要承担法律责任。此类规定奠定了电商平台并非单纯的网络服务中立性平台的基调，也为后续探讨电商平台的义务与责任预留下了空间。</p>\n<p>结合比较法与我国立法现状可知，美国和欧盟均采取了界定注意义务的模式来认定网络服务提供者的侵权责任。欧盟立法例相较美国立法更为抽象，但其规制路径也是通过确定网络服务提供者的注意义务来划定责任范围。就规制内容来看，美国、欧洲立法例并未就平台业务进行排除性规定，原则上著作权、商标侵权均可适用此类条文。注意义务的决定性因素在于网络服务提供者在侵权发生时的角色定位，如果其扮演的是一种技术性、自动性和被动的角色，主观缺乏知道并对储存数据没有控制力的情况下，避风港规则仍应得到适用。但如果电商平台的角色、主观知道状态和数据控制力发生变化，避风港规则的适用也将会调整，注意义务的边界也会随着电商平台角色的发展而变化。</p>\n<p>三、注意义务强化的正当性与可行性</p>\n<p>出于鼓励产业发展以及考虑现实操作可能性，以欧盟、美国为代表的通行做法均认为平台商对于其平台交易活动中的交易信息原则上无须承担一般性审查义务。近年来，要求其承担起与平台经济规模相适应、平台能力相匹配的责任，从不同注意义务层面加重互联网平台义务的声音时有发出。长期以来，电商平台尝试规避责任承担的理由主要有四点。一是保护互联网产业的发展。法律政策的经济分析认为不得克以电商平台过重的义务负担，以避免行业有过重负担。二是保护营业自由。义务设定的强弱在一定程度上会影响企业成本以及经营自由，提高义务标准可能使得平台在后续的侵权诉讼中因此种高标准审查义务的履行瑕疵而承担连带责任。如果降低审查标准，则又可能使得平台疏于履行义务，遗漏侵权行为，阻碍平台内经营者的发展，最终丧失活力和竞争力。三是义务履行欠缺可操作性，主要体现为技术不成熟以及技术成本过高。四是平台的中立性地位使其免于责任承担。即电商平台并未实际参与到在线交易中，作为网络服务提供者，在交易中应当保持被动，无需对交易双方的行为进行监控。</p>\n<p>注意义务强化的正当性分析</p>\n<p>随着理论发展，经济理论成为法律分析论证的一种支撑理论。支持网络服务提供者承担“通知-删除”规则以外的注意义务的理论主要包括危险控制理论、风险收益理论、社会成本理论和最佳守门员理论。</p>\n<p>危险控制力理论以危险控制能力的大小界定注意义务的高低。侵权人对危险的控制力通常大于受害人，因此在技术中立原则的指导下，网络服务提供者仅负有合理的注意义务。平台服务者对侵权行为的控制成本更低，相比于权利所有人更具备成本优势。传统侵权领域的控制力指行为人对自己的行为危险性应当有所预见和管控，当损害后果发生时，即认为行为人因其未施以相应的注意而存在过错。但网络环境下的控制力理论与传统侵权领域意义的控制力有所区别，网络服务提供者并不会因为网络平台存在侵权行为或可能存在侵权行为即认为其应当对侵权行为承担侵权控制。</p>\n<p>风险收益理论是传统侵权法基于“报偿理论”的责任承担理论。依据该理论，责任主体的收益与风险是相一致的，对于存在风险的领域，获得的利益越大，则其承担的风险也越大。网络服务提供者的经营性行为放大了权利者权利侵权的风险，由网络服务提供者来降低这一风险并承担合理的成本并不是毫无道理的诉求。具体到电商平台，电商平台提供的在线交易服务在交易对象、交易量上相比线下交易均有数量级的变化，著作权、商标侵权风险的扩大也显而易见，由电商平台这一风险扩大者采取降低风险的措施并非是不合理的机制设定。</p>\n<p>社会成本理论是法律经济学追求目标的具体体现，意在通过最小成本实现社会效益最大化。在这一权利保护过程中，既有服务商自身的技术开发、运营成本，也应当考量侵权发生后带来的网络传播效率、权利自由受限等社会成本。如果提高网络服务提供者的注意义务所带来的止损收益大于侵权所带的损失，则处于成本衡量上可以克以网络服务提供者更高的注意义务，形成总体成本最小化而效率最大化的机制。在成本最小化原则下，经济成本可以由权利受益者和网络服务提供者共同承担，而网络服务提供者在网络环境中在人力、物力、技术等方面均具备优势地位，在义务承担上更具经济合理性。</p>\n<p>最佳守门人理论认为网络平台上的知识产权侵权具有普遍性和匿名性的特点， 网络服务提供者基于其对于匿名网络用户的管控，是相对于单个权利人更适合的侵权看门人。电商平台侵权行为特点之一是侵权行为量大，用户量的增加，社交平台、交互平台的出现让信息的传播更加便捷，个体在权利维护中力量更微小。二是用户匿名性使得权利人较难确定传统侵权要素的主体、对象、侵权行为，而电商平台则能利用注册信息或后台更容易获得这些信息。基于此，网络服务提供者（ISP）可以在一定程度上以较为经济的方式承担起侵权防止的角色，平台无疑也是相较于权利人更适格的侵权防止看门人。</p>\n<p>加强注意义务的可行性分析</p>\n<p>注意义务的履行需要侵权人同时具备注意义务、注意能力，并切实保持谨慎注意。在上述加强注意义务的理论支撑下，注意义务加强的可行性分析则需通过对义务加强障碍进行辩驳加以展开。</p>\n<p><strong>一是针对互联网行业发展业态，互联网发展进入2020年已经不是产业发展的萌芽状态。</strong>前期立法中，“让子弹飞一会”的政策指引、不过多干涉产业发展的立法、司法中立态度均体现了一种产业政策导向的态度。在产业规模壮大后，规范化的发展才是发展的长远之道。互联网公司、电商平台的注意义务应当随着产业的成熟进一步扩张，而不是局限于我国十多年前制定的避风港规则之下。近年来，司法实践和区域立法都在电商平台乃至互联网平台的责任确定上有了新的发展，仅产业发展作为承担企业义务的阻却性事由是欠缺说服力的。</p>\n<p><strong>二是针对技术发展问题，司法实践中网络服务提供商表示，面对平台的海量数据其并无能力承担过滤义务。</strong>实证研究显示，在商业实践中，企业常常宣称其有能力采取某种过滤义务，以此作为企业宣传点，提高企业吸引力。但当进入司法程序后，却又以技术不可行作为抗辩事由，此种现象是否违反禁发言原则亦值得商榷。此外，经济利益的获取也使得注意义务有所提升。因此，在成本合理且有效的技术性手段下进行侵权行为的发现与制止时，电商平台应当引进并加以使用，让平台发挥出了应有的作用，推动电子商务各个主体共同参与市场治理。我国电子商务报告显示大型互联网企业也积极主动探索设立企业自查自纠模式，推动平台积极参与和配合知识产权执法，落实网站网店的排查、 源头治理和行业风险防范。</p>\n<p><strong>三</strong><strong>是电商平台并</strong><strong>非绝</strong><strong>对中立</strong><strong>地位</strong><strong>。</strong>无论从技术或内容上看，在互联网环境下都绝无纯粹的中立方，应当认为电商平台对内容和技术的控制力远不止一个中立角色。实践中平台提供商以“技术中立”为由拒绝承担责任，而实践中却通常通过用户协议获得内容控制权，这种内容控制权的要求基本得到了法院的佐证。另一方面，平台也可以从主体、聚集层面进行内容信息的获取与利用。一是用户准入阶段，平台可强制要求用户提供信息，在运营与监管过程中平台服务商也可通过元数据监控来获得信息，云服务、大数据、爬虫技术等均可让互联网平台服务商通过技术手段获得平台内容并以主体资格加以控制，还能借助技术措施限制用户进入平台和对平台内容的使用。</p>\n<p>可以看到，电商平台并非单纯的第三方服务方，尽管其并非合同的缔约方，但在平台搭建与运营、第三方支付、通知删除下的侵权管控等过程中均承担积极角色，出于社会责任和经济收入的影响应履行相应义务。电商平台属于网络服务提供者的一种，但其行为类型在许多方面已经远超普通网络服务提供者，主要收入也与平台内经营者的相关服务密不可分，例如广告收入、竞价排名等。因此，已不能仅以技术中立作为网络服务提供者豁免侵权责任的直接依据， 而应当其作为是承担间接侵权责任的限制条件。</p>\n<p>四、注意义务的强化</p>\n<p>侵权通知影响着间接侵权中“明知”与“应知”界定，服务于主观过错的认定。在合格通知送达后，电商平台唯有依法履行“通知-删除”规则相关的注意义务方可免责。以“通知-删除”规则为界，通知前的事前注意义务、“通知-删除”规则运行中的事中注意义务以及程序结束后的事后注意义务三个阶段可作为注意义务强化探讨的方向。</p>\n<p><strong>一是加强平台事前注意义务，明确“善良管理人”标准下的事前审查义务。</strong>首先，需要明确电商平台作为网络服务提供者无需承担一般性审核义务。美国、欧洲的立法例与司法实践均表明，电商平台不负有对网络环境中知识产权的一般性监控义务。北京市高级人民法院的文件也认可网络服务提供者不承担一般性事先审查义务。欧洲法院则认为，要求平台承担一般监控义务违背了知识产权指令第3条，现行的欧洲法并不能要求平台提供商采取事前防御性措施安装过滤系统。其次，应明确“善良管理人”标准下的事前审查义务。善良管理人注意义务标准的核心在于以更为主动的姿态履行义务，以高于普通人注意义务、自己事务的注意义务为标准，制定重复侵权的监督控制义务和平台自发实施的以此为标准的监督义务。在重复侵权中，随着通知次数与重复侵权行为的发生，主观“知道”与“应当知道”的可能性加大，平台应加强应当有针对性的加强对此种侵权主体的监控措施。此种特定注意义务的设定具备一定的正当性，减少平台以中立性作为实际并不中立的服务行为的免责理由，督促其以成本控制和效率最大化的方式发挥平台积极作用。此外，人工智能、大数据技术的发展也极大提高了义务履行的支撑力。</p>\n<p><strong>二是完善“通知-删除”规则中的注意义务。</strong>“避风港规则”下的主动注意义务主要以“红旗规则”为引导，当侵权行为无处遁形时，平台再对其视而不见则存在明显过错。民法典颁布后，于第1195条重申了通知删除的规则，但并未突破原侵权责任法36条对网络服务提供者的侵权责任认定。在电子商务法第42条至44条的规定中，电商平台需设置通知接受系统，在对合格通知、反通知进行适格审查后，采取断开连接、恢复内容等不同必要措施。事中注意义务即是进一步完善“反通知”中的审核义务。在首例电商涉“反通知”案中，一审法院认为，淘宝公司在收到网店申诉材料的时候应当有转送义务，未及时转送反通知而继续延续断开网店服务链接的处罚措施造成的损失，淘宝公司应当对扩大损失承担责任。二审法院则认为，在网店提供初步证据后，申诉应认定为有效，但淘宝公司未告知供货商进行下一步投诉或向人民法院起诉，且未终止已采取的必要措施，有违法律规定。判决书中反映出电商平台在三个方面的审核义务，包括初步证据的全面性的审核、以一般人的信任程度作为认定标准、对反通知的审核范围进行限定，此案反映出电商平台在“避风港”规则下早已不再是被动、无作为的履行通知与转通知角色，也指出了电商平台在反通知审核中的两点要求。一是明确审核标准为低于民事诉讼高度盖然性，采用“一般可能性”标准，即能让一般理性人也相信不侵权成立。二是对启动程序“初步证据”的认定标准不能仅要求收到证据，而需要满足“一般可能性”证明标准，即足以让普通人相信售卖产品的合法来源可能性。此种设定的正当性存在于三个方面。一是有利于侵权过错认定，电商平台的发展需要避免其承担无过错责任，回归“注意义务”违反来认定过错的模式，通知删除规则的制度作用在于作为一项免责事由，而非克以电商平台过重责任。二是抑制通知删除规则“通道化”倾向，电商法下的通知删除规则一定程度削弱了电商平台的控制力，理想状态下的电商平台应发挥出平台治理的角色，助力平台争议的解决。三是有效发挥平台争议处理作用，电商平台在成本与控制力上有作为争议处理机制的优势地位，“反通知”程序增加了通知删除程序的步骤，但却并未对反通知方的恶意反通知作出规制，强化对反通知的审核义务可推动电商平台积极发挥治理作用。</p>\n<p><strong>三是完善重复侵权的注意义务。</strong>重复侵权是指权利人在多次进行侵权通知之后，相同的侵权行为依然在电商平台中持续发生的现象。重复侵权的审查义务源于物权请求权，当此种绝对权的适用于网络服务提供者时，可要求权利人删除该侵权内容，要求网络服务提供者采取必要的措施防止相同侵权行为再次发生。美国为了实现责任限制，立法对于重复侵权责任作出了一定要求，通过重复侵权的处理机制来实现责任平衡。在欧盟，对于重复侵权审查义务同样得到了认可。在德国司法实践中，法院以妨害权利为依据，对网络服务提供者接到通知后的义务作出修改，不仅需要删除被投诉内容，还应当通过合理且可能的措施防范重复的侵权行为发生。此外，欧盟最新颁布的指令也指出，重复侵权行为的出现将作为侵权免责要件之一。</p>\n<p>我国对重复侵权的规制尚无明文规定，依据最高人民法院关于审理网络侵权民事案件若干问题的规定的第9条第6项规定，法院衡量“知道”这一主观状态时，需要同步考量网络服务提供者设置的侵权处理机制，对于网络服务提供者是否尽到审查义务的关键点正是重复侵权的防范。一是对同一网络用户的重复侵权信息，二是对同一侵权信息的防控。此外，最高人民法院也指出，恶意侵权、重复侵权情形作为侵权行为的具体情节，也被纳入侵权可能性以及侵权初步证据的考量范围。在我国司法实践中，司法机关在认定电商平台在重复侵权中的责任在衣恋诉淘宝案、黄佳会、奢悦公司诉王忠明案、康恩泰公司诉清江服饰市场案中依次呈现出细微变化。在依恋案中，法院仅将重复侵权作为一个侵权判断因素，判断明知的存在，进而认定主观过错。在后两个案件中，法院的态度则表明平台需主动采取有效措施，有积极防控的义务。如果仅将重复侵权作为判断明知的因素，则连带责任的成立还需要依托过错判断的其他因素。换言之，在先案例认为，出现重复侵权即可认定过错，而在后案例则认为未采取积极措施才构成过错。因此，重复侵权注意义务内容宜设置重复侵权防御机制，电商平台在特定情况下负有监控义务，特别是电商平台中的特定经营者反复实施侵权行为的时候。避风港规则作为网络服务提供者免于承担赔偿责任的条件并非是充分条件，更应采取进一步防范重复侵权的必要措施。此种侵权防范措置需要结合电商网络服务类型、重复侵权过滤系统的信息收集与比对、技术与系统开发成本以及侵权情节的考量加以确定。但结合电商平台特点和技术可行性与成本因素的考量，电商平台在实践中有能力构建此种侵权防御机制。</p>\n<p>结语</p>\n<p>在寻求利益平衡的过程中，平台自治的理念逐渐得到落实，网络在改变社会关系和社会运行方式的同时也冲击着原有的单纯的政府单向监管的社会治理结构。电商平台正是基于其所具备的效率优势、资格准入审核优势、信息管理与控制优势成了互联网治理体系中关键的协同者，在自治能力与法律框架的协调下逐步构建起电商平台的知识产权保护机制。</p>\n<p>国内外理论和实践均认同排除电商平台一般性的审查义务，此种观点应当一以贯之。但应注意到技术和产业的发展引起的三大趋势，一是电商平台的角色变化。电商平台在一定程度上摆脱了被动而中立的角色，承担起更多的平台管理义务与责任。二是技术发展和创新使得义务的履行可能性发生变化，过滤技术的优化、算法的引入都为知识产权侵权防范、重复侵权规制赋能，减少人力成本的同时提高筛查效率。三是平台治理理念的变化。不同于由政府作为执法主体，平台共治理念的贯彻落实使得平台承担起了更多的管理义务，对于注意义务的认定，电商平台在危险控制能力、风险收益理论、社会成本控制和义务履行效率层面都具备一定优势，电商平台的注意义务应进一步强化并落实。</p>\n<p>也正是基于电商平台技术和角色的发展，电商平台的注意义务可从三个层面重新加以审视。一是事前注意义务，即电商平台在接到侵权通知前的注意义务探讨，此种特殊情形下的审查义务以电商平台所具备的过滤能力和既存的侵权情形为依托，要求电商平台引入“善良管理人”标准，承担在标准引导下实现事前审查义务，而此种标准下注意义务的加重情节主要考量电商平台存在直接经济利益、存在人工编辑与推荐行为、商标具备较高知名度三种情节。二是事中注意义务，接受权利人提交的侵权“通知”启动的被动审查义务。此种“通知”将电商平台的主观状态由未知转为应知，如未履行此义务将引发电商平台对扩大损失承担连带责任的可能性。在“反通知”规则引入后，由反通知规则引起的注意义务扩大了电商平台的注意义务范畴，电商平台需抑制通道化发展趋势，提高对转通知的注意义务。三是事后注意义务，即针对重复侵权行为，要求电商平台改变被动的责任启动机制，对同一侵权者、类似侵权行为承担主动筛查义务。结合电商平台在技术措施、成本承担、司法实践上的可行性，在平台自治理念和电子商务法的引导下可将重复侵权规制从过错认定因素提升为注意义务，在过错认定中更具直观性，更有利于电商平台侵权责任的规制。</p>\n<h2>魔蝎爬虫案:存储数据2000万+，罚金3000万+没收所得3000万｜判决书</h2>\n<p>2019年9月，杭州知名大数据服务公司杭州魔蝎数据科技有限公司被杭州警方调查。<strong>2020年9月10日</strong>，杭州市西湖区人民检察院以杭州魔蝎数据科技有限公司、被告人周某、袁某犯侵犯公民个人信息罪，向西湖区人民法院提起公诉。</p>\n<p><strong>法院查明</strong>，魔蝎公司...未经用户许可仍采用技术手段长期保存用户各类账号和密码在自己租用的阿里云服务器上......截至2019年9月案发时，对魔蝎公司租用的阿里云服务器进行勘验检查，发现以明文形式非法保存的个人贷款用户各类账号和密码条数多达<strong>2124</strong>1504条。</p>\n<p><strong>2021年1月14日</strong>，<strong>杭州西湖法院</strong><strong>作出</strong><strong>判决，</strong>对魔蝎数据公司判处罚金人民币30000000元（罚金限判决生效后十日内缴清），对被告人周某、袁某判处有期徒刑三年，分别缓刑四年和三年......魔蝎数据公司退缴的违法所得款人民币30000000元予以没收，并上缴国库等。</p>\n<p>关于爬虫技术：</p>\n<p>通俗来说就是抓取网页数据，只要网页上有的，都可以通过爬虫爬取下来。</p>\n<p>一般而言，爬虫需要以下几步：</p>\n<p>1.找到需要爬取内容的网页URL</p>\n<p>2.打开该网页的检查页面（即查看HTML代码）</p>\n<p>3.在HTML代码中找到要提取的数据</p>\n<p>4.写代码进行网页请求、解析</p>\n<p>5.存储数据</p>\n<p>爬虫技术具有收集用户数据的特性，信息数据具备无形财产的属性，属于应当<strong>受反不正当竞争法保护的法益</strong>。未经用户同意和平台授权，获取并使用用户信息的行为往往构成<strong>不正当竞争</strong>，甚至<strong>犯罪</strong>。</p>\n<p>PS：非法爬取专利数据、商标数据的也要注意了</p>\n<h2><strong>《中华人民共和国反不正当竞争法》</strong></h2>\n<p>（1993年9月2日第八届全国人民代表大会常务委员会第三次会议通过　2017年11月4日第十二届全国人民代表大会常务委员会第三十次会议第一次修订  2019年4月23日第十三届全国人民代表大会常务委员会第十次会议第二次修订）</p>\n<p>　　目录</p>\n<p>　　第一章　总则</p>\n<p>　　第二章　不正当竞争行为</p>\n<p>　　第三章　对涉嫌不正当竞争行为的调查</p>\n<p>　　第四章　法律责任</p>\n<p>　　第五章　附则</p>\n<p>　　第一章　总则</p>\n<p>第一条　为了促进社会主义市场经济健康发展，鼓励和保护公平竞争，制止不正当竞争行为，保护经营者和消费者的合法权益，制定本法。</p>\n<p>第二条　经营者在生产经营活动中，应当遵循自愿、平等、公平、诚信的原则，遵守法律和商业道德。</p>\n<p>本法所称的不正当竞争行为，是指经营者在生产经营活动中，违反本法规定，扰乱市场竞争秩序，损害其他经营者或者消费者的合法权益的行为。</p>\n<p>本法所称的经营者，是指从事商品生产、经营或者提供服务（以下所称商品包括服务）的自然人、法人和非法人组织。</p>\n<p>第三条　各级人民政府应当采取措施，制止不正当竞争行为，为公平竞争创造良好的环境和条件。</p>\n<p>国务院建立反不正当竞争工作协调机制，研究决定反不正当竞争重大政策，协调处理维护市场竞争秩序的重大问题。</p>\n<p>第四条　县级以上人民政府履行工商行政管理职责的部门对不正当竞争行为进行查处；法律、行政法规规定由其他部门查处的，依照其规定。</p>\n<p>第五条　国家鼓励、支持和保护一切组织和个人对不正当竞争行为进行社会监督。</p>\n<p>国家机关及其工作人员不得支持、包庇不正当竞争行为。</p>\n<p>行业组织应当加强行业自律，引导、规范会员依法竞争，维护市场竞争秩序。</p>\n<p>　　第二章　不正当竞争行为</p>\n<p>第六条　经营者不得实施下列混淆行为，引人误认为是他人商品或者与他人存在特定联系：</p>\n<p>（一）擅自使用与他人有一定影响的商品名称、包装、装潢等相同或者近似的标识；</p>\n<p>（二）擅自使用他人有一定影响的企业名称（包括简称、字号等）、社会组织名称（包括简称等）、姓名（包括笔名、艺名、译名等）；</p>\n<p>（三）擅自使用他人有一定影响的域名主体部分、网站名称、网页等；</p>\n<p>（四）其他足以引人误认为是他人商品或者与他人存在特定联系的混淆行为。</p>\n<p>第七条　经营者不得采用财物或者其他手段贿赂下列单位或者个人，以谋取交易机会或者竞争优势：</p>\n<p>（一）交易相对方的工作人员；</p>\n<p>（二）受交易相对方委托办理相关事务的单位或者个人；</p>\n<p>（三）利用职权或者影响力影响交易的单位或者个人。</p>\n<p>经营者在交易活动中，可以以明示方式向交易相对方支付折扣，或者向中间人支付佣金。经营者向交易相对方支付折扣、向中间人支付佣金的，应当如实入账。接受折扣、佣金的经营者也应当如实入账。</p>\n<p>经营者的工作人员进行贿赂的，应当认定为经营者的行为；但是，经营者有证据证明该工作人员的行为与为经营者谋取交易机会或者竞争优势无关的除外。</p>\n<p>第八条　经营者不得对其商品的性能、功能、质量、销售状况、用户评价、曾获荣誉等作虚假或者引人误解的商业宣传，欺骗、误导消费者。</p>\n<p>经营者不得通过组织虚假交易等方式，帮助其他经营者进行虚假或者引人误解的商业宣传。</p>\n<p>第九条　经营者不得实施下列侵犯商业秘密的行为：</p>\n<p>（一）以盗窃、贿赂、欺诈、胁迫、电子侵入或者其他不正当手段获取权利人的商业秘密；</p>\n<p>（二）披露、使用或者允许他人使用以前项手段获取的权利人的商业秘密；</p>\n<p>（三）违反保密义务或者违反权利人有关保守商业秘密的要求，披露、使用或者允许他人使用其所掌握的商业秘密；</p>\n<p>（四）教唆、引诱、帮助他人违反保密义务或者违反权利人有关保守商业秘密的要求，获取、披露、使用或者允许他人使用权利人的商业秘密。</p>\n<p>经营者以外的其他自然人、法人和非法人组织实施前款所列违法行为的，视为侵犯商业秘密。</p>\n<p>第三人明知或者应知商业秘密权利人的员工、前员工或者其他单位、个人实施本条第一款所列违法行为，仍获取、披露、使用或者允许他人使用该商业秘密的，视为侵犯商业秘密。</p>\n<p>本法所称的商业秘密，是指不为公众所知悉、具有商业价值并经权利人采取相应保密措施的技术信息、经营信息等商业信息。</p>\n<p>第十条　经营者进行有奖销售不得存在下列情形：</p>\n<p>（一）所设奖的种类、兑奖条件、奖金金额或者奖品等有奖销售信息不明确，影响兑奖；</p>\n<p>（二）采用谎称有奖或者故意让内定人员中奖的欺骗方式进行有奖销售；</p>\n<p>（三）抽奖式的有奖销售，最高奖的金额超过五万元。</p>\n<p>第十一条　经营者不得编造、传播虚假信息或者误导性信息，损害竞争对手的商业信誉、商品声誉。</p>\n<p>第十二条　经营者利用网络从事生产经营活动，应当遵守本法的各项规定。</p>\n<p>经营者不得利用技术手段，通过影响用户选择或者其他方式，实施下列妨碍、破坏其他经营者合法提供的网络产品或者服务正常运行的行为：</p>\n<p>（一）未经其他经营者同意，在其合法提供的网络产品或者服务中，插入链接、强制进行目标跳转；</p>\n<p>（二）误导、欺骗、强迫用户修改、关闭、卸载其他经营者合法提供的网络产品或者服务；</p>\n<p>（三）恶意对其他经营者合法提供的网络产品或者服务实施不兼容；</p>\n<p>（四）其他妨碍、破坏其他经营者合法提供的网络产品或者服务正常运行的行为。</p>\n<p>　　第三章　对涉嫌不正当竞争行为的调查</p>\n<p>第十三条　监督检查部门调查涉嫌不正当竞争行为，可以采取下列措施：</p>\n<p>（一）进入涉嫌不正当竞争行为的经营场所进行检查；</p>\n<p>（二）询问被调查的经营者、利害关系人及其他有关单位、个人，要求其说明有关情况或者提供与被调查行为有关的其他资料；</p>\n<p>（三）查询、复制与涉嫌不正当竞争行为有关的协议、账簿、单据、文件、记录、业务函电和其他资料；</p>\n<p>（四）查封、扣押与涉嫌不正当竞争行为有关的财物；</p>\n<p>（五）查询涉嫌不正当竞争行为的经营者的银行账户。</p>\n<p>采取前款规定的措施，应当向监督检查部门主要负责人书面报告，并经批准。采取前款第四项、第五项规定的措施，应当向设区的市级以上人民政府监督检查部门主要负责人书面报告，并经批准。</p>\n<p>监督检查部门调查涉嫌不正当竞争行为，应当遵守《中华人民共和国行政强制法》和其他有关法律、行政法规的规定，并应当将查处结果及时向社会公开。</p>\n<p>第十四条　监督检查部门调查涉嫌不正当竞争行为，被调查的经营者、利害关系人及其他有关单位、个人应当如实提供有关资料或者情况。</p>\n<p>第十五条　监督检查部门及其工作人员对调查过程中知悉的商业秘密负有保密义务。</p>\n<p>第十六条　对涉嫌不正当竞争行为，任何单位和个人有权向监督检查部门举报，监督检查部门接到举报后应当依法及时处理。</p>\n<p>监督检查部门应当向社会公开受理举报的电话、信箱或者电子邮件地址，并为举报人保密。对实名举报并提供相关事实和证据的，监督检查部门应当将处理结果告知举报人。</p>\n<p>　　第四章　法律责任</p>\n<p>第十七条　经营者违反本法规定，给他人造成损害的，应当依法承担民事责任。</p>\n<p>经营者的合法权益受到不正当竞争行为损害的，可以向人民法院提起诉讼。</p>\n<p>因不正当竞争行为受到损害的经营者的赔偿数额，按照其因被侵权所受到的实际损失确定；实际损失难以计算的，按照侵权人因侵权所获得的利益确定。经营者恶意实施侵犯商业秘密行为，情节严重的，可以在按照上述方法确定数额的一倍以上五倍以下确定赔偿数额。赔偿数额还应当包括经营者为制止侵权行为所支付的合理开支。</p>\n<p>经营者违反本法第六条、第九条规定，权利人因被侵权所受到的实际损失、侵权人因侵权所获得的利益难以确定的，由人民法院根据侵权行为的情节判决给予权利人五百万元以下的赔偿。</p>\n<p>第十八条　经营者违反本法第六条规定实施混淆行为的，由监督检查部门责令停止违法行为，没收违法商品。违法经营额五万元以上的，可以并处违法经营额五倍以下的罚款；没有违法经营额或者违法经营额不足五万元的，可以并处二十五万元以下的罚款。情节严重的，吊销营业执照。</p>\n<p>经营者登记的企业名称违反本法第六条规定的，应当及时办理名称变更登记；名称变更前，由原企业登记机关以统一社会信用代码代替其名称。</p>\n<p>第十九条　经营者违反本法第七条规定贿赂他人的，由监督检查部门没收违法所得，处十万元以上三百万元以下的罚款。情节严重的，吊销营业执照。</p>\n<p>第二十条　经营者违反本法第八条规定对其商品作虚假或者引人误解的商业宣传，或者通过组织虚假交易等方式帮助其他经营者进行虚假或者引人误解的商业宣传的，由监督检查部门责令停止违法行为，处二十万元以上一百万元以下的罚款；情节严重的，处一百万元以上二百万元以下的罚款，可以吊销营业执照。</p>\n<p>经营者违反本法第八条规定，属于发布虚假广告的，依照《中华人民共和国广告法》的规定处罚。</p>\n<p>第二十一条  经营者以及其他自然人、法人和非法人组织违反本法第九条规定侵犯商业秘密的，由监督检查部门责令停止违法行为，没收违法所得，处十万元以上一百万元以下的罚款；情节严重的，处五十万元以上五百万元以下的罚款。</p>\n<p>第二十二条　经营者违反本法第十条规定进行有奖销售的，由监督检查部门责令停止违法行为，处五万元以上五十万元以下的罚款。</p>\n<p>第二十三条　经营者违反本法第十一条规定损害竞争对手商业信誉、商品声誉的，由监督检查部门责令停止违法行为、消除影响，处十万元以上五十万元以下的罚款；情节严重的，处五十万元以上三百万元以下的罚款。</p>\n<p>第二十四条　经营者违反本法第十二条规定妨碍、破坏其他经营者合法提供的网络产品或者服务正常运行的，由监督检查部门责令停止违法行为，处十万元以上五十万元以下的罚款；情节严重的，处五十万元以上三百万元以下的罚款。</p>\n<p>第二十五条　经营者违反本法规定从事不正当竞争，有主动消除或者减轻违法行为危害后果等法定情形的，依法从轻或者减轻行政处罚；违法行为轻微并及时纠正，没有造成危害后果的，不予行政处罚。</p>\n<p>第二十六条　经营者违反本法规定从事不正当竞争，受到行政处罚的，由监督检查部门记入信用记录，并依照有关法律、行政法规的规定予以公示。</p>\n<p>第二十七条　经营者违反本法规定，应当承担民事责任、行政责任和刑事责任，其财产不足以支付的，优先用于承担民事责任。</p>\n<p>第二十八条　妨害监督检查部门依照本法履行职责，拒绝、阻碍调查的，由监督检查部门责令改正，对个人可以处五千元以下的罚款，对单位可以处五万元以下的罚款，并可以由公安机关依法给予治安管理处罚。</p>\n<p>第二十九条　当事人对监督检查部门作出的决定不服的，可以依法申请行政复议或者提起行政诉讼。</p>\n<p>第三十条　监督检查部门的工作人员滥用职权、玩忽职守、徇私舞弊或者泄露调查过程中知悉的商业秘密的，依法给予处分。</p>\n<p>第三十一条　违反本法规定，构成犯罪的，依法追究刑事责任。</p>\n<p>第三十二条  在侵犯商业秘密的民事审判程序中，商业秘密权利人提供初步证据，证明其已经对所主张的商业秘密采取保密措施，且合理表明商业秘密被侵犯，涉嫌侵权人应当证明权利人所主张的商业秘密不属于本法规定的商业秘密。</p>\n<p>商业秘密权利人提供初步证据合理表明商业秘密被侵犯，且提供以下证据之一的，涉嫌侵权人应当证明其不存在侵犯商业秘密的行为：</p>\n<p>（一）有证据表明涉嫌侵权人有渠道或者机会获取商业秘密，且其使用的信息与该商业秘密实质上相同；</p>\n<p>（二）有证据表明商业秘密已经被涉嫌侵权人披露、使用或者有被披露、使用的风险；</p>\n<p>（三）有其他证据表明商业秘密被涉嫌侵权人侵犯。</p>\n<p>　　第五章　附则</p>\n<p>第三十三条　本法自2018年1月1日起施行。</p>\n<p>杭州市西湖区人民法院</p>\n<p>刑 事 判 决 书（2020）浙0106刑初437号</p>\n<p>公诉机关杭州市西湖区人民检察院。被告单位杭州魔蝎数据科技有限公司，住所地杭州市滨江区滨安路******。法定代表人周某，总经理。诉讼代表人金某，******。被告人周******。因本案于2019年9月7日被刑事拘留，同年10月13日被逮捕。被告人袁******。因本案于2019年9月7日被刑事拘留，同年10月13日被逮捕。 杭州市西湖区人民检察院以西检一部刑诉〔2020〕1629号起诉书指控被告单位杭州魔蝎数据科技有限公司（以下简称魔蝎公司）、被告人周某、袁某犯侵犯公民个人信息罪，于2020年9月10日向本院提起公诉。本院依法组成合议庭，公开开庭审理了本案。杭州市西湖区人民检察院检察员裘少波、检察官助理庄远出庭支持公诉，被告单位魔蝎公司诉讼代表人金某及辩护人孙建保、陈沛文，被告人周某及其辩护人徐传水、吴卫明，被告人袁某及其辩护人姚品信、魏紫琼均到庭参加诉讼。现已审理终结。</p>\n<p>杭州市西湖区人民检察院指控，2016年初，被告单位魔蝎公司由周某等人出资成立，被告人周某系魔蝎公司法定代表人、总经理，负责公司整体运营，被告人袁某系魔蝎公司技术总监，系技术负责 人，负责相关程序设计。魔蝎公司主要与各网络贷款公司、小型银行进行合作，为网络贷款公司、银行提供需要贷款的用户的个人信息及多维度信用数据。方式是魔蝎公司将其开发的前端插件嵌入上述网贷平台A**中，在网贷平台用户使用网贷平台的APP借款时，贷款用户需要在魔蝎公司提供的前端插件上，输入其通讯运营商、社保、公积金、淘宝、京东、学信网、征信中心等网站的账号、密码，经过贷款用户授权后，魔蝎公司的爬虫程序代替贷款用户登录上述网站，进入其个人账户，利用各类爬虫技术，爬取（复制）上述企、事业单位网站上贷款用户本人账户内的通话记录、社保、公积金等各类数据，并按与用户的约定提供给网贷平台用于判断用户的资信情况，并从网贷平台获取每笔0.1元至0.3元不等的费用。期间， 魔蝎公司在和个人贷款用户签订的《数据采集服务协议》中明确告知贷款用户“不会保存用户账号密码， 仅在用户每次单独授权的情况下采集信息”，但未经用户许可仍采用技术手段长期保存用户各类账号和密码在自己租用的阿里云服务器上。被告人周某明知公司存在保存用户账户密码的行为，未尽管理职责；被告人袁某负责编写具有保存用户账户密码功能的网关程序。截至2019年9月案发时，对魔蝎公司租用的阿里云服务器进行勘验检查，发现以明文形式非法保存的个人贷款用户各类账号和密码条数多达<strong>21241504条</strong>。其中大部分账号密码，如淘宝、京东等，无法二次使用，仅有邮箱等部分账号密码存在未经用户授权被魔蝎公司二次使用的情况。上述事实，有被告人供述和辩解、证人证言及相关书证等证据予以证实。认为被告单位魔蝎公司的行为已构成侵犯公民个人信息罪。被告人周某、袁某分别系对被告单位魔蝎公司侵犯公民个人信息行为直接负责的主管人员和其他直接责任人员，其行为均已构成侵犯公民个人信息罪。建议判处被告单位魔蝎公司罚金人民币3000万元；判处被告人周某、袁某有期徒刑三年， 适用缓刑，并处罚金。被告单位魔蝎公司诉讼代表人、被告人周某、袁某对指控的犯罪事实和罪名均无异议且签字具结。被告单位魔蝎公司的辩护人提出，被告单位犯罪作用较轻，未产生严重后果，也尽到了一定的注意义务，请求判处较轻的罚金刑。被告人周某的辩护人提出，被告人周某具有坦白情节、自愿认罪认罚，请求对刑期及罚金均从轻处罚并适用缓刑。被告人袁某的辩护人提出，被告人袁某具有坦白情节，自愿认罪认罚，家庭困难，请求从轻处罚并适用缓刑。经审理查明：2016年初，被告单位魔蝎公司由周某等人出资成立，被告人周某系魔蝎公司法定代表人、总经理，负责公司整体运营，被告人袁某系魔蝎公司技术总监，系技术负责人，负责相关程序设计。魔蝎公司主要与各网络贷款公司、小型银行进行合作，为网络贷款公司、银行提供需要贷款的用户的个人信息及多维度信用数据。方式是魔蝎公司将其开发的前端插件嵌入上述网贷平台A**中，在网贷平台用户使用网贷平台的APP借款时，贷款用户需要在魔蝎公司提供的前端插件上，输入其通讯运营商、社  保、公积金、淘宝、京东、学信网、征信中心等网站的账号、密码，经过贷款用户授权后，魔蝎公司的爬虫程序代替贷款用户登录上述网站，进入其个人账户，利用各类爬虫技术，爬取（复制）上述企、事业单位网站上贷款用户本人账户内的通话记录、社保、公积金等各类数据，并按与用户的约定提供给网贷平台用于判断用户的资信情况，并从网贷平台获取每笔0.1元至0.3元不等的费用。期间，魔蝎公司在和个人贷款用户签订的《数据采集服务协议》中明确告知贷款用户“不会保存用户账号密码，仅在用户每次单独授权的情况下采集信息”，但未经用户许可仍采用技术手段长期保存用户各类账号和密码在自己租用的阿里云服务器上。被告人周某明知公司存在保存用户账户密码的行为，未尽管理职责；被告人袁某负责编写具有保存用户账户密码功能的网关程序。截至2019年9月案发时，对魔蝎公司租用的阿里云服务器进行勘验检查，发现以明文形式非法保存的个人贷款用户各类账号和密码条数多达21241504条。其中大部分账号密码，如淘宝、京东等，无法二次使用，仅有邮箱等部分账号密码存在未经用户授权被魔蝎公司二次使用的情况。2019年9月6日下午，被告人周某、袁某被抓获归案。庭审中，被告单位魔蝎公司确认因本案犯罪，被告单位魔蝎公司的违法所得为人民币3000万元。审理过程中，被告单位魔蝎公司退出违法所得人民币3000万元。上述事实，被告单位魔蝎公司及被告人周某、袁某在开庭审理过程中亦无异议，并有证人江某1、刘某1、郭某、周某1、翁某、缪某、张某1、费某、李某1、李某2、潘某1、江某2、程某、严某、杜某、梁某、陈某、张某2、宦某、凌某、葛某、游某、潘某2、李某3、张某3、周某2、黄某1、郑某、沈某、刘某2、邹某、黄某2、刘某3、张某4、李某4、王某的证言，调取证据通知书、远程勘验工作记录、杭州魔蝎数据科技有限公司工商信息、数据采集服务协议、查封、冻结、扣押决定书及清单、杭州吸铁石科技有限公司、杭州信邦科技有限公司、杭州抖音科技有限公司的工商登记资料、银行账户交易清单、中国人民银行杭州中心支行关于魔蝎公司有关调查情况的说明、委托书、抓获经过、户籍信息、转账凭证等书证以及移动硬盘、电子证物检查工作记录、提取的电子数据等证据证实，足以认定。<strong>本院认为，</strong>被告单位杭州魔蝎数据科技有限公司以其他方法非法获取公民个人信息，情节特别严重， 其行为已构成侵犯公民个人信息罪。被告人周某、袁某分别系对被告单位魔蝎公司侵犯公民个人信息行为直接负责的主管人员和其他直接责任人员，其行为均已构成侵犯公民个人信息罪。公诉机关的指控成 立。被告人周某、袁某自侦查阶段如实供述主要犯罪事实，自愿认罪认罚，酌情予以从宽处罚。根据被告人周某、袁某的犯罪情节、悔罪表现以及没有再犯罪的危险，适用缓刑对其所居住社区没有重大不良影响，故依法对其宣告缓刑。辩护人所提相应辩护意见，本院予以采纳。公诉机关的量刑建议适当，应予采纳。据此，依照《中华人民共和国刑法》第二百五十三条之一第三款、第四款、第三十条、第三十一  条、第七十二条第一、三款、第七十三条第二、三款、第五十二条、第五十三条、第六十四条以及《最高人民法院、最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》第五条、第七条、第十二条之规定，判决如下：一、被告单位杭州魔蝎数据科技有限公司犯侵犯公民个人信息罪，判处罚金人民币30000000元（罚金限判决生效后十日内缴清）。二、被告人周某犯侵犯公民个人信息罪，判处有期徒刑三年，缓刑四年，并处罚金人民币<strong>50</strong>0000 元（缓刑考验期限，从判决确定之日起计算；罚金限判决生效后十日内缴清）。三、被告人袁某犯侵犯公民个人信息罪，判处有期徒刑三年，缓刑三年，并处罚金人民币<strong>30</strong>0000元（缓刑考验期限，从判决确定之日起计算；罚金限判决生效后十日内缴清）。 四、扣押于公安机关的作案工具电脑等予以没收，被告单位杭州魔蝎数据科技有限公司退缴至本院的违法所得款人民币30000000元予以没收，并上缴国库。</p>\n<p>如不服本判决，可在接到判决书的第二日起十日内通过本院或直接向浙江省杭州市中级人民法院提出上诉。书面上诉的，应当提交上诉状正本一份，副本两份。审   判   长：陈   琪人民陪审员：王   辉人民陪审员：秦   华书   记   员：周栋栋二Ｏ二一年一月十四日</p>\n<h2>案例 | “网络爬虫”失控，CTO和程序员双双被判刑</h2>\n<p>对程序员、合规、法务等数据行业的从业者来说，本文介绍的案例是一件痛苦的经历，为了你的职业安全，<em>建议你认真读完本文，一定受益匪浅！</em></p>\n<p>KG公司2014年成立，早期做互联网金融，2017年转型做互联网科技公司，主营业务是“助贷”，也就为按揭贷款购房的客户提供赎楼及债务置换贷款等服务。</p>\n<p>这个业务需要经常性地访问政府居住证网站，查询房产地址、房屋编码和学区房的使用情况，用于做房产的市场评估和客户风险评估。</p>\n<p>因为手动查询效率低下，公司产品组经讨论后提出了一个建议——用爬虫软件自动查询。</p>\n<p>2017年12月，CTO安排新入职的程序员负责这个项目，要求他研发一个自动定时抓取的小程序，主要用来查询、下载网上的数据。</p>\n<p>2018年1月，项目经理给程序员一个抓取数据的程序源代码，程序员开始修改。</p>\n<p>2018年3月，小程序被部署在阿某云服务器上自动运行，其内置的“网络爬虫”可以：</p>\n<p>链接某市居住证网站，也就是某市公安局人口管理处的居住证系统；</p>\n<p>可以在某市居住证网站上查询到房产地址、房屋编码等对应的资料；</p>\n<p>软件对网站访问量能达到每小时数十万次。</p>\n<p>查询的信息都被下载保存到公司购买的阿某云服务器上。</p>\n<p>这个程序还被用于查询房地产中介（中原地产、链家地产、Q房网等）在网上挂盘的房子信息，主要是查询房价、用作参考。</p>\n<p>2018年4月27日10:43-12:00左右，居住证系统的承建单位发现系统出现宕机现象，追踪到请求应用服务器端口编号，但因日志缺失而无法定位IP来源，当时怀疑是人为攻击。</p>\n<p>2018年5月2日10:00-12:00左右，系统再次遭遇攻击，这次管理人员成功地截取了IP地址并报案。</p>\n<p>此时，公司这边还不知道惹祸了，直到2018年5月17日晚上11点，服务器维护人员接到了阿某云客服的电话。阿某云说他们公司的服务器IP被网警锁定了，因有攻击行为，让他们赶紧联系网警。CTO随即电话联系研发人员（应该是指程序员），对方说估计是因为居住证网站加了验证码，但公司程序没做相应的更新，就造成了程序出错发出攻击行为。</p>\n<p>5月攻击事件的影响很大。</p>\n<p>案发时，某市居住证服务平台的注册用户超过530万，服务面包括：</p>\n<p>所有市民的网上自助受理系统；</p>\n<p>151个派出所、街道办居住证受理点的现场受理系统；</p>\n<p>后台接口为市网格办、市交警局、市民政局，市交委等多个政府部门提供居住证、居住登记条件查询和审核。</p>\n<p>居住证系统受攻击瘫痪期间：</p>\n<p>软件对某市居住证系统查询访问量为每秒183次，共计查询信息约151万条次，窃取大量建筑物编码数据，造成政府信息泄漏；</p>\n<p>所有居住证办理、居住登记申报、信息查询、对外服务功能均无法正常工作，影响面极广；</p>\n<p>市民无法办理居住证和居住登记，相关生产生活秩序受到严重影响。</p>\n<p>除了此次攻击，还有一些派出所出具证明证实5月期间经常出现系统无法登陆，录入过程频繁出现掉线、系统数据异常等情况。居住证系统无法正常使用、出现异常情况的时间长达一个多月。</p>\n<p>2018年8月，CTO、程序员被捕。</p>\n<p>公安分局依法对公司进行搜查，提取应用程序源程序，应用程序日志及运行在服务器获取的数据。经司法鉴定所鉴定确认：</p>\n<p>导出的库备份中检出多个包含房产信息的数据表，包括房产的所处位置、楼宇编号、房间编号等信息，约有2905万条；</p>\n<p>在程序员的电脑上检测出爬虫程序的源代码；</p>\n<p>在IP地址为XXXX的服务器检出爬虫程序，这两个爬虫软件程序均使用遍历查询的方式短时间向目标网址URL地址“......”发起大量查询请求，从而实现非授权下载数据库内容。</p>\n<p>针对某市居住证网站及服务器的司法鉴定意见确认：</p>\n<p>网站遭受自动化程序攻击。</p>\n<p>IPXXXX对居住证服务器的持续大量的访问造成了平台在……期间无法正常对外提供服务，服务器无法正常运行。</p>\n<p>CTO供述和辩解时说：</p>\n<p>爬取的是公开信息，没有任何恶意去攻击网站和系统，只是为了提高查询效率。</p>\n<p>没有爬取个人信息，没有在市场上买卖或者和其他公司搞资源置换，没有通过查询某市居住证网站信息获利。</p>\n<p>软件是公司管理层开会决定开发的，由法定代表人交代技术部研发，系统里的查询和下载功能是程序员程序员负责开发的。</p>\n<p>程序员设定的是每周三次自动查询，后面怎么实施的我也不清楚，主要是程序员负责。</p>\n<p>他还说自己也知道“从技术上来讲，如果超过服务器承载能力的查询肯定会引起系统卡顿或瘫痪”，但因不清楚网站和系统的承载能力，加上心存侥幸，就只是口头提醒同事在服务器晚间相对空闲的时候去查询，控制一下频率。</p>\n<p>程序员供述和辩解时称：</p>\n<p>不清楚抓取数据的原程序是谁研发的，没有因查询居住证网站而获利，这是工作任务。</p>\n<p>3月份后就去做公司安排的其他任务了，这个程序在服务器上启动后，也没有对程序做修改和更新，也没有进入服务器的权限，权限在运维部门。</p>\n<p>没有爬取个人信息，没有在市场上买卖或者和其他公司搞资源置换，只是用于公司业务上的参考。</p>\n<p>4月27日在公司，5月2日在日本，当时没对程序作出修改，猜测是因为居住证平台更新了验证码登陆功能，而我们的查询软件未做相应的更新，导致程序出错，发出攻击行为。</p>\n<p>二被告对起诉状中指控的罪名没有异议，只是希望能轻判。做罪轻辩护时：</p>\n<p>都提出自己只是过失、疏忽大意，没有预见可能会造成的后果，主观上完全没有破坏系统的故意；</p>\n<p>都提出爬取的是公开信息，只是为了让公司业务更高效，并没有以此牟利；</p>\n<p>CTO认为自己授权程序员开发爬虫程序，只是一次性爬取，并未要求每天自动爬取，不是主犯；</p>\n<p>程序员认为自己只是按领导指示、完成工作任务……</p>\n<p>法院认为，二人违反国家规定，对计算机信息系统进行干扰，造成为5万以上用户提供服务的计算机信息系统不能正常运行累计1小时以上，属于后果特别严重，应以破坏计算机信息系统罪追究其刑事责任。</p>\n<p>CTO，负责并授权程序员开发涉案爬虫软件，系主犯，判处有期徒刑三年</p>\n<p>程序员受指派开发爬虫软件，在共同犯罪中起次要作用，系从犯，判处有期徒刑一年六个月。</p>\n<p>最高人民法院、最高人民检察院关于办理危害计算机信息系统安全刑事案件应用法律若千问题的解释</p>\n<p>至于这个案子里的其他人，从公司的法定代表人、提出建议的产品经理、传达任务和给源代码的项目经理，到使用数据的业务部门的同事，都没责任，法务/合规/风控看起来更是从未出现。</p>\n<p>总体来说，正常经营的公司，网络爬取数据引发民事纠纷的常见，涉刑的不常见。立项时多问一句“我们这么做有没有风险”“会不会出事”没坏处，毕竟看起来是“集体决策”的决策最后往往并不是集体买单。</p>\n<p>从这个案例来看，技术永远都是这类事件最后的背锅侠，去哪说理去！！！</p>\n<p>曾经目睹过一场如何从客户拿数据的讨论，我们需要数据，但客户受限于政策法规要求不给，然后讨论拿数据的技术方案。不管你方案再高明，只是盗窃手法高级而已，依然没有改变盗窃的定性，有这个想法就是要被制止住的，特别去年国家出台了一系列的法律法规保障个人隐私，这就是一条红线，要牢记在我们的心头。</p>\n<p>我们要通过合理的产品设计，符合政策法规需求，做两情相悦的事！</p>\n<p>警钟长鸣，愿各位珍重，做一个守法、护法、有原则的技术人员。</p>\n<h2>网络爬虫行为的刑事风险与处罚边界</h2>\n<p>随着科技网络、信息技术发展进程的突飞猛进，我们已然踏入大数据时代。大数据作为生产资料已经成为各产业的商战资本，商业价值越来越高，人们对数据需求也越来越大，但因为互联网上的数据信息庞杂，因此为满足人们在互联网上高效的完成数据检索的需要，网络爬虫技术应运而生。</p>\n<p>华东政法大学张勇教授表示“技术是中立的，但技术应用永远不是中立的。”网络爬虫作为数据收集环节的一项重要的中立技术，其创建之初是为了帮助搜索引擎高效收集数据，本身并无好坏之分。然而，一些人在应用爬虫技术的同时附加了行为人自己的主观意志，这使得网络爬虫行为有了善恶之分。人类滥用网络爬虫技术违法爬取网站获取数据来左右互联网领域内竞争格局，危害网络安全，导致不正当竞争和数据泄露事件频发，引发市场恶性竞争，造成了危害后果，也因此落入了刑法的调整范畴，网络爬虫行为在某些情况下也具有了刑事风险。现如今，各种利用网络爬虫技术爬取网站数据的行为正处于难以界定其行为性质的灰色地带，导致不正当竞争和数据泄露事件频发，在此背景下，刑法规制恶意的网络爬虫行为是审时度势之举。</p>\n<h3>网络爬虫</h3>\n<p>网络爬虫，也称网络机器人或网络蜘蛛，是一种按照一定的规则，通过模拟人（网络用户）的行为，自动且高效地浏览互联网并抓取所需数据的计算机程序。通俗理解，网络爬虫是一个模拟人类用户请求网站行为的程序，根据设定的规则自动请求网页并将数据抓取下来，然后使用一定的规则提取、存储有价值的数据。通常来说该技术具有三种基本功能，分别是：访问、下载、解析。</p>\n<p>就纯粹的网络爬虫技术而言，很难说这项技术是善意的技术或者恶意的技术，因为其在不同的应用场景下所发挥的作用不同。自1993年12月首个基于爬虫技术的网络搜索引擎——JumpStation诞生之后，网络爬虫技术已被使用了二十余年，之前一直被视为没有问题的中立技术，随着作为数据收集环节的一项重要技术的网络爬虫技术的广泛应用，今天已经逐渐成为“道德上可疑的并可被视为违法”的技术，并从涉嫌民事违法的技术发展为涉嫌构成刑事犯罪的技术。</p>\n<h3>网络爬虫行为</h3>\n<p>网络爬虫行为是行为人运用爬虫技术从网站平台上搜索、收集和抓取数据的行为。它并不等同于网络爬虫技术，因为技术本身具有中立性，无所谓好与坏，不涉及违法犯罪的问题而网络爬虫行为反映了行为人的主观意志，因此存在善意爬虫行为和恶意爬虫行为的界分，爬虫行为是否违法需要根据具体的应用场景和使用情况进行法律评价。</p>\n<p>网络爬虫行为是善意还是恶意，主要从网络爬虫在工作状态下为获取数据而根据爬取逻辑对服务器实施的一系列行为是否合法以及数据后续使用行为是否合法两方面来考虑。在信息爆炸时代，网络爬虫技术渗透在工作生活的方方面面，以各种不易察觉的形式向我们提供着便利服务。善意爬虫行为比如：”Baiduspider”间隔不久就会遍布互联网抓取网页数据以供用户使用，不仅促进数据流通与共享，同时也为各个被扫的网站增加了曝光度和流量。恶意爬虫行为，比如:专门用于抢票的外挂软件类爬虫,据相关报道，12306被爬取次数，最高峰时1天内页面浏览量达 813.4 亿次，1小时最高点击量59.3亿次，平均每秒164.8 万次。2020年春运期间，12306高峰日网络点击量高达1495亿次，对网站的维护和正常运行造成了严重威胁。恶意爬虫行为不仅威胁个人信息、知识产权等数据安全，还对计算机系统安全、社会公共秩序、国家安全造成了严重影响。</p>\n<h3>“Robots”协议</h3>\n<p>“Robots”协议（也称为爬虫协议、机器人协议等）的全称是“网络爬虫排除标准”（Robots Exclusion Protocol），“Robots”协议是网站所有者提示网络爬虫允许爬取的数据范围和数据种类的公开声明文件。简言之，网站通过Robots协议告诉搜索引擎哪些页面可以抓取，哪些页面不能抓取。</p>\n<h3><em>【上海晟品网络科技有限公司网络爬虫案件】</em></h3>\n<p>被告单位上海晟品网络科技有限公司系有限责任公司，经营计算机网络科技领域内相关业务。被告人张某某、宋某、侯某某经共谋，于2016年至2017年间采用技术手段抓取被害单位北京字节跳动网络技术有限公司服务器中存储的视频数据，并由侯某某指使被告人郭某破解北京字节跳动网络技术有限公司的防抓取措施，使用“tt_spider”文件实施视频数据抓取行为，造成被害单位北京字节跳动网络技术有限公司损失技术服务费人民币2万元。</p>\n<p>经鉴定，“tt_spider”文件中包含通过头条号视频列表、分类视频列表、相关视频及评论3个接口对今日头条服务器进行数据抓取，并将结果存入到数据库中的逻辑。在数据抓取的过程中使用伪造device_id绕过服务器的身份校验，使用伪造UA及IP绕过服务器的访问频率限制。</p>\n<p>2017年2月27日，被告人宋某、侯某某被公安机关抓获；3月4日，被告人张某某、郭某被公安机关抓获。</p>\n<p>2017年11月24日，海淀法院判决，被告单位上海晟品网络科技有限公司犯非法获取计算机信息系统数据罪，判处罚金人民币二十万元。被告人张某某犯非法获取计算机信息系统数据罪，判处有期徒刑一年，缓刑一年，罚金人民币五万元。被告人宋某犯非法获取计算机信息系统数据罪，判处有期徒刑十个月，罚金人民币四万元。被告人侯某某犯非法获取计算机信息系统数据罪，判处有期徒刑十个月，罚金人民币四万元。被告人郭某犯非法获取计算机信息系统数据罪，判处有期徒刑九个月，罚金人民币三万元。</p>\n<p>回顾本案案情，上海晟品网络科技有限公司的三名被告人，通过网络爬虫强行破解了北京字节跳动网络技术有限公司（以下简称字节跳动公司）的防火墙，从而获取了“字节跳动公司”服务器中的相关视频数据。审判法官认为“字节跳动公司”所设立的防火墙，本身就是为了防止他人通过网络爬虫技术侵入公司计算机系统的安全措施。而被告人侵入该反爬机制的行为，实质上已经实现了侵入计算机系统的危害结果。之前的此类案件大多被认定为不正当竞争案，被告人仅仅承担民事赔偿责任，这一判决通过强调私人计算机系统内的数据安全，以保障计算机系统得以安全顺利运行的合法权益。为刑法规制网络爬虫涉刑行为提供了新的方案。</p>\n<p>从上表数据可以看出，在2017年首例网络爬虫入刑案件之后，网络爬虫涉刑案件的数量相较于以前已经明显增多。从相关案件的判决书推断，对此种行为的规制路径也从民法逐渐向刑法靠拢。这足以说明，恶意爬取数据造成被害人经济利益受损的危害结果，已经超出反不正当竞争法的规制范畴，进入到刑法规制的领域，其社会危害性也不言而喻。因此，在对相关案件进行刑事风险的评价时，更加注重考量此类行为的社会危害性与刑事违法性。</p>\n<h3>四、刑事风险</h3>\n<p>从刑法角度判断网络爬虫行为的非法性，恶意网络爬虫行为本质上属于网络犯罪。我国刑法对网络犯罪的立法目的在于保护网络安全和数据安全，因此网络爬虫行为的刑法规制聚焦于网络爬虫在工作状态下为获取数据而根据爬取逻辑对服务器实施的一系列行为、所抓取的”数据“的类型以及数据后续使用行为三方面，基于这三个层面的考虑，网络爬虫行为可能涉及以下刑事风险：</p>\n<p><em>（一）网络爬虫的非法侵入行为可能侵犯计算机系统安全</em></p>\n<p><em>1.</em><em>非法侵入计算机信息系统罪</em></p>\n<p>非法侵入计算机信息系统罪，是指违反国家规定，侵入国家事务、国防事务、国防建设、尖端科学技术领域的计算机信息系统的行为。网络爬虫侵入系统是爬取数据的前置行为，如果未经授权或超越授权进入涉及国家安全和国家秘密的政府内网、国防建设、尖端科学技术领域的计算机信息系统，则具有构成非法侵入计算机信息系统罪的刑事风险。立法者设立本罪的目的是为了重点保护国家事务、经济建没、国防建设、尖端科学技术等重要领域的计算机信息系统安全，若未取得国家有关主管部门依法授权或批准，通过计算机终端侵入国家重要计算机信息系统抓取数据，则会导致其中的重要数据或者某些重要、敏感的信息泄露，不但系统内可能产生灾难性的连锁反应，还会造成严重的政治、经济损失，甚至还可能危及人民的生命财产安全。本罪是行为犯，因此只需考虑是否有授权以及侵入计算机系统的性质，不论侵入行为之后是否有非法获取或非法控制计算机的行为，其实施的侵入行为本身就具有刑事违法性。</p>\n<p><em>2.</em><em>破坏计算机信息系统罪</em></p>\n<p>破坏计算机信息系统罪，是指违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，以及对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，或者故意制作、传播计算机病毒等破坏性程序，影响计算机系统正常运行，后果严重的行为。</p>\n<p>网络爬虫侵入系统后，如果实施了删除、修改、增加计算机信息系统中存储数据，或者暴力破解计算机信息系统安全防护系统，或者恶意攻击网站等影响计算机系统正常运行等行为，则具有构成破坏计算机信息系统罪的刑事风险。本罪保护的法益是计算机信息系统的正常运行，数据和应用程序的真实性、完整性与可利用性，以及他人对数据和应用程序的占有、使用、处分等权利。网络爬虫在访问网站获取数据的过程中，由于本身就占据宽带流量，如果访问量过大或抓取大量数据，就会导致网站拥堵甚至网络瘫痪；在获取数据时，如果对数据进行了删除、修改、增加，不仅失去了数据本身价值，也导致他人查看到的数据有误；如果未经授权通过暴力破解计算机信息安全防护系统的方式进入系统，也会影响系统的正常运行；网络爬虫恶意攻击网站如恶意抢票、恶意评论等操作，会导致网站崩溃，不能正常运行。根据刑法第286条规定，上述行为侵犯了破坏计算机信息系统罪所保护的法益，后果严重的，则可能构成破坏计算机信息系统罪。</p>\n<p><strong>3.</strong><strong>提供侵入、非法控制计算机信息系统程序、工具罪</strong></p>\n<p>2011年《最高人民法院、最高人民检察院关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》第二条规定了“专门用于侵入、非法控制计算机信息系统的程序、工具”是指：（1）具有避开或者突破计算机信息系统安全保护措施，未经授权或者超越授权获取计算机信息系统数据的功能的；（2）具有避开或者突破计算机信息系统安全保护措施，未经授权或者超越授权对计算机信息系统实施控制的功能的；（3）其他专门设计用于侵入、非法控制计算机信息系统、非法获取计算机信息系统数据的程序、工具。</p>\n<p>网络爬虫技术作为爬取网站数据的一项重要技术，对于编写并出售可以绕过系统安全防护措施的爬虫软件，为他人犯罪提供工具的，则可能会构成提供侵入、非法控制计算机信息系统程序、工具罪。</p>\n<p><em>（二</em><em>)</em><em>网络爬虫的非法抓取数据行为可能侵犯数据安全</em></p>\n<p>互联网数据类型多种多样，按照法律属性分类大致可分为公民个人信息、商业秘密、著作权作品、财产性数据及其他计算机信息系统数据，根据所抓取的数据类型不同，可构成的罪名也不同。</p>\n<p><em>1.</em><em>侵犯公民个人信息罪</em></p>\n<p>侵犯公民个人信息，是指违反国家有关规定，向他人出售或者提供公民个人信息，情节严重的行为以及窃取或者以其他方法非法获取公民个人信息的行为。</p>\n<p>本罪保护的法益是公民个人身份信息的安全和公民身份管理秩序。若所抓取的数据属于公民个人信息，可能构成侵犯公民个人信息罪。刑法第253条之一规定中，将公民个人信息定义为“以电子或者其他方式记录的能够单独或者与其他信息结合识别特定自然人身份或者反应特定自然人活动情况的各种信息，包括姓名、身份证件号码、通信通讯联系方式、住址、账号密码、财富状况、行踪轨迹等”。互联网时代，为了生存与交流，并不是所有的公民个人信息不被公开，公民个人信息又分为”公开个人信息“与”非公开个人信息“，网络爬虫进入计算机信息系统，获取受到保护或者不予公开的个人信息行为，则可能构成刑法第253条之一侵犯公民个人信息罪。</p>\n<p><em>2.</em><em>侵犯商业秘密罪</em></p>\n<p>侵犯商业秘密罪，是指侵犯商业秘密权利人的商业秘密，情节严重的行为。</p>\n<p>本罪保护的法益是他人的商业秘密权，若所抓取的数据属于商业秘密，可能构成侵犯商业秘密罪。商业秘密是指不为公众所知悉，具有商业价值，并经权利人采取相应保密措施的技术信息、经营信息等商业信息，其内涵与特征在于“秘密性”，即不为公众所知悉且被采取保密措施进行保护的数据，不能通过公开渠道直接获取。商业秘密的运用对于技术的进步、企业的发展至关重要，若商业秘密泄露可能会给企业带来灭顶之灾。因此，刑法第219条专门设立侵犯商业秘密罪来保护商业秘密权利人所享有的商业秘密权和国家正常的市场经济秩序，网络爬虫在未经授权或超越授权抓取具有商业秘密属性的数据，情节严重的，可能构成侵犯商业秘密罪。</p>\n<p><em>3.</em><em>侵犯著作权罪</em></p>\n<p>侵犯著作权罪，是指以营利为目的，未经著作权人许可复制发行其文字、音像、计算机软件等作品，出版他人享有专有出版权的图书，未经制作者许可复制发行其制作的音像制品，制作、出告假冒他人署名的美术作品，违法所得数额较大或者有其他严重情节的行为。</p>\n<p>若所抓取的数据涉及具有独创性的文学、艺术和科学作品时，可能构成侵犯著作权罪。通过中国裁判文书网检索到的网络爬虫侵犯他人著作权刑事案件中，网络爬虫数据获取使用的行为基本上是侵犯著作权人的“复制权”和“网络信息传播权”。对于平台数据而言，无论是网页还是里面的图片、文字、视频，其本身就具有独创性，虽然多数情况下此类数据处于公开状态，大家可以随意浏览，网络爬虫获取数据也是通过公开的搜索引擎，但这并不代表可以随意对此类数据进行复制、储存、传播，若未经著作权人许可，以营利为目的抓取此类数据后进行使用或者通过网络公开传播，极有可能会构成侵犯著作权罪。</p>\n<p><em>4.</em><em>非法获取计算机信息系统数据罪</em></p>\n<p>若抓取的数据属于上述数据类型之外的其他数据，则可能构成非法获取计算机信息系统数据罪。根据刑法第285条第二款规定，侵入国家事务、国防建设、尖端科学技术领域以外的计算机信息系统或者采用其他技术手段，获取该计算机信息系统中存储、处理或者传输的数据的构成本罪。值得注意的有两点：第一，网络爬虫未经授权或超越授权进入国家事务、国防建设、尖端科学技术领域以外的计算机信息系统。第二，“数据”是公民个人信息、商业秘密、具有著作权的数据以外的的存放在计算机系统的其他数据，主要是指身份认证信息和数据产品，身份认证信息是指账号、口令、密码、数字证书等，普通数据产品主要包括医院用药统方数据、客户订单数据、考试成绩、考试志愿、环保监测数据、生产经营数据等。</p>\n<p><em>（三）网络</em><em>爬虫爬取数据</em><em>后利用数据实行其他犯罪可能构成诈骗罪、盗窃罪、传播淫秽物品罪等等</em></p>\n<p>通过网络爬虫技术爬取数据的行为不单单只有爬取数据的行为具有刑事风险，对爬取数据的后续使用行为也有触犯刑法的其他罪名的可能性。行为人利用网络爬虫软件获取数据的行为本身不构成犯罪，但将网络爬虫当作是实施下游犯罪的工具，利用所抓取数据进行诈骗、盗窃、传播淫秽物品的，则有可能构成诈骗罪、盗窃罪、传播淫秽物品罪。比如利用网络爬虫收集淫秽视频进行储存，允许他人搜索下载，情节严重的，构成传播淫秽物品罪，如果行为人有牟利的目的，还有可能构成传播淫秽物品牟利罪。</p>\n<p><em>（一）网络爬虫行为的立法保护</em></p>\n<p>随着数字经济的发展，近年来我国制定并完善了一系列的网络安全法律法规维护网络安全与数据安全，为网络爬虫行为划定了严格的法律边界。如《网络安全法》第44条 任何个人和组织不得窃取或者以其他非法方式获取个人信息。《民法典》第111条 自然人的个人信息受法律保护。任何组织和个人需要获取他人个人信息的，应当依法取得并确保信息安全，不得非法收集、使用、加工、传输他人个人信息，不得非法买卖、提供或者公开他人个人信息。《刑法》设立了非法侵入计算机信息系统罪、侵犯公民个人信息、非法获取计算机信息系统数据罪、侵犯商业秘密罪等罪名规制恶意网络爬虫行为。</p>\n<p>现如今，网络爬虫已是互联网企业采集数据的重要技术之一，刑法在严厉打击恶意网络爬虫行为的同时，也为数据流动、数据共享创造了法律障碍与技术壁垒。从“上海晟品公司非法抓取视频数据案”作为全国首例网络爬虫入刑之后，再到“魔蝎公司侵犯公民个人信息案”，再到“快啊答题”侵入腾讯公司服务器案，可以看出我国立法及司法对数据抓取的规制日趋严厉，几个经典案例几乎给网络爬虫打上了“犯罪嫌疑人”的烙印。恶意网络爬虫行为处罚范围不当扩大，既不利于爬虫技术发展、网络数据共享与最大化利用，也与互联网的公益性质不相符合，处罚范围不当缩小，会助长恶意网络爬虫行为的发生。因此，如何有效明确越界网络爬虫行为的刑事处罚边界，需进一步研究。</p>\n<p><em>（二）网络爬虫行为的处罚难题</em></p>\n<p>虽然，《网络安全法》《个人信息保护法》《反不正当竞争法》《刑法》等都通过立法对网络安全、数据安全进行了保护，可对于何种爬虫行为只承担民事责任，何种程度的爬虫行为构成刑事犯罪的问题并未得到解答。由此，学界对与网络爬虫行为的处罚边界展开了讨论，主要聚焦于应否对被抓取数据进行类型化分析以及应否对抓取数据的行为特征进行类型化分析。笔者认为，对被抓取数据进行类型化分析与对抓取数据的行为特征进行类型化分析可以清晰网络爬虫行为的社会危害性以及对所保护的法益的侵害程度，进而明确恶意网络爬虫行为的民事责任与刑事责任的界限。</p>\n<p><em>（三）网络爬虫行为的入罪要件</em></p>\n<p>通过对司法案例的分析与刑法罪名构成要件的梳理，司法实践对网络爬虫行为往往采取具有主观故意和客观违法行为而予以入罪的规制路径。只要符合主观上的恶意与客观不法即行为人违反“robots”协议利用爬虫抓取数据或者绕过反爬虫措施抓取数据，则构成犯罪。由此来看，笔者认为，明确越界网络爬虫行为的刑事处罚边界关键在于明确界定“客观不法”行为。根据往年司法实践来看，网络爬虫行为客观不法主要体现为未经授权或超越授权，以及避开或突破“反爬措施”抓取数据。</p>\n<p><em>1.</em><em>抓取数据的行为特征的类型化</em></p>\n<p>（1）未经授权或超越授权</p>\n<p>网络爬虫行为是否未经授权或超越授权，主要是看数据控制方或数据所有方有无通过单方意思表示授予数据需求方以访问数据的权限，或者数据控制方或数据所有方与数据需求方之间通过双方的意思表示产生授权合意。数据控制方授权访问数据的方式，前者包括警告、弹窗、“Robots”协议等，后者包括用户协议、服务条款、权责声明等。例如日常生活中进入某一网站访问数据，数据需求方需要对使用条款进行阅读并勾选确保数据需求方已知晓，否则无法访问数据，表明数据所有方授权数据访问者访问数据的意愿。</p>\n<p>目前，对于“Robots”协议是否具有法律属性即违反Robots协议对网络爬虫行为人与数据所有方是否有约束力的合同在实务中尚且存在争议。一些学者认为”Robots“协议具有法律效力，违反该协议则构成违约。有些学者则认为，该协议并不能作为判断爬虫行为违法的标准。目前我国法律并未明确规定Robots协议的法律属性，但在司法实践中普遍认可通过爬虫协议来确认网络爬虫行为是否获得了数据控制者的授权，并以此作为判断网络爬虫行为是否“非法”的标准。</p>\n<p>此外，“对于‘未经授权’或者‘超越授权’不能仅作形式判断，还需要结合被抓取的数据类型来进行实质违法性判断，考察网络爬虫抓取数据行为对法益的侵害或者威胁是否达到刑事可罚的程度“[1]。</p>\n<p>（2）避开或突破“反爬措施”</p>\n<p>网络爬虫行为是否避开或突破“反爬措施”，关键明确“反爬措施”的方式。反爬虫措施是指监控并防止网络爬虫肆意抓取数据的一些措施。常见的有文本混淆、页面动态渲染、验证码校验、请求签名校验、大数据风控、js混淆和蜜罐等，比如验证码反爬虫，当在用户注册和登录时或者网站访问频率过高或行为异常时，会弹出验证码让用户进行识别，以确保该操作为人类行为，这是我们生活中最常见的反爬虫手段。</p>\n<p><em>2.</em><em>被抓取数据的类型化</em></p>\n<p>（1）抓取、使用公开的普通数据</p>\n<p>网络爬虫行为抓取此类数据，由于数据所有方将数据公开并不采取相应的“反爬取”“限制使用”“反爬取措施”，应当能够预见到此类数据会被浏览者抓取、使用，并且此类数据属于普通数据，随意抓取、使用并不会造成严重的危害后果，所以，抓取、使用公开的普通数据一般不具有违法性。</p>\n<p>（2）抓取、使用公开但限制另行使用数据，根据其社会危害性大小分别进行民事、行政、刑事处罚。</p>\n<p>虽然爬虫技术本身属于中立的技术手段，但一旦使用不当，将面临被认定为不正当竞争的风险。在网络爬虫入刑之前，爬虫行为爬取公开但限制另行使用数据被认定为不正当竞争行为的情况居多，当前司法实践关于爬虫行为的反不正当竞争法规制，主要集中在《反不正当竞争法》第二条第二款规定的“一般不正当竞争行为”及第十二条规定的“特殊不正当竞争行为”两类。</p>\n<p>通过对往年爬虫行为引发的不正当纠纷案件进行分析，若具有竞争关系的涉案双方利用网络爬虫爬取公开但是另行使用的数据，以至被爬取方遭受损失，属于《反不正当竞争法》规定的不正当竞争行为，则只需承担民事责任或行政责任即可。对于以合理正当技术手段爬取公开数据，未对被爬取方平台服务器造成较大压力，且爬取后非直接聚合呈现于自身平台而需跳转至原被爬取平台的行为而言，一般不属于不正当竞争。但是，若爬虫行为符合上文所述的几种犯罪构成要件，具有严重社会危害性时，则需要承担刑事责任。</p>\n<p>（3）抓取、使用采取保护措施进行保密的数据</p>\n<p>数据所有方对数据采取了保密措施，则说明此类数据具有“保密性”，随意抓取、使用的危害程度较大，因此抓取、使用此类数据构成刑事犯罪的风险较高，如侵犯商业秘密罪、非法获取国家秘密罪。</p>\n<p>回顾网络爬虫行为的法律规制历程，过去网络爬虫行为往往被视为企业间不正当竞争的手段之一，而仅采用民法进行规制。随着网络爬虫行为的社会危害性的加重，从民事侵权逐渐过渡到刑法处罚，但是过度限制网络爬虫行为为数据流通创造了法律障碍与技术壁垒，不利于数据共享与利用。对于上述网络爬虫行为所蕴含的刑事风险，刑法作为一部保障法，应当秉持刑法谦抑性的精神，能用民法、行政法等其他部门法进行规制的，则刑法不介入，将刑事处罚作为恶意网络爬虫行为法律规制的最后一道防线。</p>\n<h3><em>参考文献</em></h3>\n<p>【1】刘艳红,杨志琼.网络爬虫的入罪标准与路径研究[J].人民检察,2020,(15):26-31.</p>\n<p>【2】杨志琼.数据时代网络爬虫的刑法规制[J].比较法研究,2020,(04):185-200.</p>\n<p>【3】杨志琼.我国数据犯罪的司法困境与出路:以数据安全法益为中心[J].环球法律评论,2019,41(06):151-171.</p>\n<p>【4】刘宪权,石雄.网络数据犯罪刑法规制体系的构建[J].法治研究,2021,(06):44-55.</p>\n<p>【5】胡立平.网络爬虫行为的刑法规制[J].人民检察,2022(11):72-73.</p>\n<p>【6】王丹. 论网络爬虫的刑法规制[D].黑龙江大学,2022.</p>\n<p>【7】郏梦蝶. 网络爬虫行为刑法规制研究[D].华东政法大学,2021.</p>\n<p>【8】刘艳红.网络爬虫行为的刑事规制研究——以侵犯公民个人信息犯罪为视角[J].政治与法律,2019(11):16-29.</p>\n<p>【9】李谦.数据爬取刑事责任的认定难题及其解决方案——源自规范完善的探索[J].北京邮电大学学报(社会科学版),2021,23(06):13-21.</p>\n<p>【10】石经海,苏桑妮.爬取公开数据行为的刑法规制误区与匡正——从全国首例“爬虫”入刑案切入[J].北京理工大学学报(社会科学版),2021,23(04):154-164+172.</p>\n<p>【11】张勇.数据安全分类分级的刑法保护[J].法治研究,2021,(03):17-27.</p>\n<p><em>老师点评</em></p>\n<p>1、我们需要进一步明确网络爬虫的<em>未授权是否等同于不同意</em>，是否应当排除默示情况？</p>\n<p>2、进一步明确网络数据<em>合理使用和刑事风险的界限</em>，对网络爬虫入罪进行合理的界定。</p>\n<p>3、非法提取公民信息的<em>罪数的</em><em>认定问题</em>又如何明确，在涉及数罪并罚的问题上更应该慎重。</p>\n<h2>第108期丨网络爬虫技术刑法规制研究</h2>\n<p>在大数据时代背景下，利用网络爬虫抓取公开数据是常见的方式之一，不断涌现的与网络爬虫相关的诉讼纠纷引发热议。中立、合法的技术被非正当、恶意使用时，就会对网络数据的安全造成影响。若要中立技术持续良好发展，必然需要有效引导，要让“使用者”清晰界限，因此，在司法实践中明确入罪标准和入罪路径是亟需解决的问题。</p>\n<p>互联网时代，数据就是核心竞争力，数据作为新的生产要素，对市场走向判断、交易行为调控等方面发挥着重要作用。在大数据时代背景下，利用网络爬虫抓取公开数据是常见的方式之一，不断涌现的与网络爬虫相关的诉讼纠纷引发了学界和司法实践中的热议。事实上，爬虫行为作为一项新兴的互联网技术是在不断发展成熟的，其本身并不违法，大多数信息类网站的基础技术就是爬虫程序，比如百度、搜狗等大型搜索引擎就是通过网络爬虫，定时在网站搜索并向用户提供需要的网页信息。然而，中立、合法的技术被非正当、恶意使用时，就会对网络数据的安全造成影响，会侵犯到知识产权造成不正当竞争，甚至侵犯公民个人信息，破坏计算机信息系统，触犯法律，引发犯罪。数字经济时代，流动的数据倡导共享，但数据的权利化和分享性本身就是并存的冲突理念，若要中立技术持续良好的发展，必然需要有效引导，要让“使用者”清晰界限，因此在司法实践中明确入罪标准和入罪路径是亟需解决的问题。</p>\n<h3>一、网络爬虫技术概述</h3>\n<p>（一）网络爬虫的概念与功能</p>\n<p>网络爬虫（Web Crawler），也被称为网络蜘蛛、蜘蛛爬虫（Web Spider）或网络机器人（Web Robot），是按照一定的规则，自动在网络中抓取数据的程序与脚本。该项技术最早用于搜索引擎，随着数据和互联网爆炸式的发展，网络爬虫的应用场景和范围不断扩大，从我们日常浏览的新闻平台的内容汇总，到网页、APP平台中数据、价格的对比都离不开网络爬虫。</p>\n<p>共享是互联网最主要的特点之一，网络爬虫技术大大减少了共享成本。网络爬虫的使用者若善意、合法的抓取数据，可以给网站带来流量，也能够给使用者带来收益，符合被抓取者预期的“共赢”局面。网络数据有别于传统的有形资产，在互联网领域中的数据是目前商业竞争的主要内容之一，因此网络爬虫产业迅猛发展，吸引了不少的公司和个人从事该行业，但同时也给互联网经济的发展带来了挑战。</p>\n<p>（二）网络爬虫的运行原理和分类</p>\n<p>网络爬虫是可以自动提取网页的程序，根据其设定好的机制和算法，一步步进行“筛选--过滤--采用”。不同的搜索引擎具有不同的“爬取机制”和“爬虫机器人”，二者决定着爬取数据的效率和质量，直接影响着用户的体验。简单来讲，网络爬虫运行过程中一般会选取一个网页地址作为集合根，在根网页的基础上不断抓取新的网址，将网址的种子（URL：统一资源定位系统“uniform resource locator”，URL是因特网的万维网服务程序上用于指定信息位置的表示方法）排队下载，从中获取相应数据，存储在集合根网址中，反复操作至满足设定条件为止。</p>\n<p>网络爬虫可以分为通用网络爬虫、聚焦网络爬虫和增量式网络爬虫。1、通用网络爬虫的特点是爬行范围和数量大，作用是为用户站点搜索引擎采集数据，相对刷新时间长；2、聚焦网络爬虫的特点是可以优先爬行设定的相关网页，且有选择性的爬行关联的网页；3、增量式网络爬虫的特点是在爬取网页基础上进行实时更新，减少无用下载。</p>\n<p>（三）爬虫协议与技术保障措施</p>\n<p>与网络爬虫密不可分的另一个概念就是爬虫协议（Robots协议），全称为“网络爬虫排除标准”，Robots协议也叫Robots.txt，是一种存放于网站根目录下的ASCII编码的文本文件，它通常告诉网络搜索引擎的漫游器（又称网络蜘蛛），此网站中的哪些内容是不应被搜索引擎的漫游器获取的，哪些是可以被漫游器获取的。该协议虽然是国际公认的标准，但其本身尚不具备法律强制力。</p>\n<p>对于网络爬虫爬取的网站数据主要分为两种情形，一部分数据是网站本身就接受被合法爬取的，主要原因在于该类数据被爬取的同时可以给网站本身带来流量和收益；另一部分数据是网站不接受爬取的，这时网站往往会采取一些反爬虫措施来防止网页信息和数据被爬取，这些反爬虫措施即为“技术保障措施”。一般常见的措施有设置网页访问口令、设置JS脚本（例如我们常见的数字加减验证、拼图滑动验证等）。采用技术保障措施后的网站中的数据，正常情况下网络爬虫是无法爬取的，对于本身加密的数据即使被爬取，不进行密码破解也无法使用。爬虫协议与技术保障措施能够部分有效的保护网站的数据权利。</p>\n<h3>二、网络爬虫行为从民事违法到刑事犯罪的递进演变</h3>\n<p>“谷米公司诉元光公司案”“北京字节跳动公司诉上海晟品网络科技有限公司案”两起案件，是研究网络爬虫法律规制的经典案例。第一起案件主要展现网络爬虫是如何从中立技术转变为民事违法的，第二起案件主要说明网络爬虫从民事违法到刑事违法到司法认定过程。</p>\n<p>（一）“谷米公司诉元光公司案”</p>\n<p>2015年11月左右，元光公司为提高其开发的智能公交APP“车来了”在中国市场的用户量及信息查询的准确度，保证公司更好的经营，公司员工利用网络爬虫软件获取包括谷米公司在内的竞争对手公司服务器里的公交车行驶信息、到站时间等实时数据。据查，元光公司爬取谷米公司开发的智能公交APP“酷米客”的实时数据日均300万至400万条。广东省深圳市中级法院经审理后判决，被告元光公司于向原告谷米公司赔偿经济损失及合理维权费用50万元。案件中的相关人员被法院以非法获取计算机信息系统数据罪分别判处刑罚。</p>\n<p>以此案为参照，我们在结合“百度诉奇虎360案”和“大众点评诉百度案”对比分析，发现虽然这三起案件最终均以“不正当竞争”为判决结果，但对爬虫这一行为认定和构成不正竞争的认定过程却有不同。“百度诉奇虎360案”中，法院判决的逻辑基础是相关行为是否违反已经存在的网络公约；“大众点评诉百度案”中，法院对爬虫协议做了区分，以爬取数据后的使用行为进行认定。而“谷米公司诉元光公司案”一案与上述两起案件均有不同，法院的判决书中未提及Robots协议，对于元光公司在爬取过程中的破解涉密行为也未过多阐述，而是把判断标准转向是否涉及知识产权保护领域的产品。通过分析可以看出，目前司法实践中对于网络爬虫涉及的民事纠纷并未形成统一的认定标准，当然其中也有个案案情不同的因素。</p>\n<p>笔者认为，对于爬取数据是否构成不正当竞争要遵循的原则包括但不限于以下三点：1、爬取行为不能违反Robots协议；2、爬取数据过程中，不能突破原数据所有者采取的技术保障措施；3、爬取行为不能对原数据所有者生产、运行、经营上造成影响。</p>\n<p>“谷米公司诉元光公司案”对于网络爬虫的行为规范上起到了一定的推动作用，对于已经具有权利保护的数据，在未经授权许可情况下的爬取行为，明确了民事违法性，同时对于“大数据不构成作品时，持有者通常会选择不正当竞争来制止他人的未经许可使用行为”。</p>\n<p>（二）“北京字节跳动公司诉上海晟品网络科技有限公司案”</p>\n<p>被告单位上海晟品网络公司的法定代表人张某禹等被告人经共谋，于2016年至2017年间采用技术手段抓取被害单位北京字节跳动网络技术有限公司服务器中存储的视频数据，并由侯某强指使被告人郭某破解北京字节跳动网络技术有限公司的防抓取措施，使用“tt_spider”文件实施视频数据抓取行为，造成被害单位北京字节跳动网络技术有限公司损失技术服务费人民币2万元。经审理，法院以非法获取计算机信息系统数据罪判处被告单位罚金、被告人徒刑刑罚。</p>\n<p>虽然“谷米公司诉元光公司案”中，对于实施爬虫的行为人也进行了刑事处罚，但其影响力和意义远不及本案。该起案件中，被告人使用了“tt_spider”文件进行抓取行为，“tt_spider”文件中包含通过头条号视频列表、分类视频列表、相关视频及评论3个接口对今日头条服务器进行数据抓取，并将结果存入到数据库中的逻辑。在数据抓取的过程中使用伪造device_id绕过服务器的身份校验，使用伪造UA及IP绕过服务器的访问频率限制。法官明确了爬虫技术作为一项搜索引擎常用技术，“有效使用有利于数据的共享和分析，造就了互联网生态的繁荣，但并不意味该技术的使用没有边界”。</p>\n<p>“北京字节跳动公司诉上海晟品网络有限公司案”对于网络爬虫行为刑事违法性的认定，主要涉及以下三个问题：1、网络爬虫行为的使用边界；2、网络爬虫获取数据是否属于非法获取计算机信息系统数据罪中“侵入”行为；3、网络公开信息是否属于非法获取计算机信息系统数据罪的犯罪对象。笔者认为，本案中被告单位和被告人爬取数据的行为，一是规避、破解了被害单位采取的技术保障措施，已经超过了合法的使用边界，二是未经许可进入了被害单位的计算机系统，属于“侵入”行为，三是被害单位的公开信息并非共享数据，据此认定案件中的爬虫行为具有刑事违法性，侵犯了被害单位计算机信息系统和数据的保密性法益，依法应当追究刑事责任。</p>\n<p>（三）民事违法与刑事犯罪的界限</p>\n<p>民刑交叉问题一直是法律理论和实践中的热议话题，如民事欺诈和刑事诈骗一般，因为刑法的谦抑性使二者在大部分时候可以清晰区分。探究网络爬虫的刑法规制，自然也无法回避此问题。</p>\n<p>自网络爬虫的法律问题凸显后，相关案件无论是民事中不正当竞争案件，亦或是刑事上的违法犯罪，数量上都在不断增加，法律本身的滞后性使其必然无法紧跟社会快速发展的脚步。上述两起典型案例让我们清楚的看到，随着商业模式和市场的发展，原本作为中立技术的网络爬虫，是如何步入民事违法后再进入刑法领域。好的技术需要以有效的制度进行引导，审慎入刑才能给予新兴技术发展空间。因此网络爬虫行为的民刑界限问题，俨然转变成网络爬虫入罪范围研究和犯罪边界界定。</p>\n<h3>三、网络爬虫的刑罚规制</h3>\n<p>(一)爬虫行为涉及的相关刑法罪名</p>\n<p>爬虫技术的刑事违法性主要从爬虫技术本身的运作过程以及数据的后续使用来分析。下面笔者从各个环节进行讨论网络爬虫可能涉及的相关刑法罪名：</p>\n<p>1.侵入行为。侵入行为在世界各国的刑事立法中，都被列入严格的管控当中，不同国家的表述虽有不同，但较为统一的表示了 “未经授权禁止进入”的意思。爬虫软件侵入计算机系统即可能涉及刑事违法。若违反国家规定，利用爬虫技术侵入国家事务、国防建设、尖端科学技术领域的计算机信息系统，则可能构成《刑法》第二百八十五规定的非法侵入计算机信息系统罪。</p>\n<p>2.控制行为。利用爬虫技术侵入除国家事务、国防建设、尖端科学技术领域以外的计算机信息系统，控制该计算机信息系统，可能构成《刑法》第二百八十五条第二款规定的非法控制计算机信息系统罪。</p>\n<p>3.破坏行为。爬虫技术的运用可能对计算机系统功能造成一定破坏。若违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，或者对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，可能构成《刑法》第二百八十六条规定的破坏计算机信息系统罪。</p>\n<p>4.获取行为。利用爬虫技术窃取国家秘密的，可能构成《刑法》第二百八十二条规定的非法获取国家秘密罪；利用爬虫技术侵入除国家事务、国防建设、尖端科学技术领域以外的计算机信息系统，获取该计算机信息系统中存储、处理或者传输的数据，可能构成《刑法》第二百八十五条第二款规定的非法获取计算机信息系统数据罪；利用爬虫技术非法窃取、获取公民个人信息的，可能构成《刑法》第二百五十三条之一规定的侵犯公民个人信息罪；非法获取商业秘密的，可能构成《刑法》第二百一十九条规定的侵犯商业秘密罪。</p>\n<p>5.获取数据的后续行为。对利用爬虫技术获得的数据进行传播、提供等行为也会触犯刑法边界。根据数据性质不同，所涉及的罪名也不同，可能涉及传播淫秽物品罪、传播淫秽物品牟利罪、非法经营罪、侵犯公民个人信息罪、侵犯商业秘密罪、侵犯著作权罪、诈骗罪等。例如上海市宝山区人民法院审理的一起利用网络爬虫实施的诈骗案件，案件中被告人雇佣他人使用购买的爬虫软件获取淘宝网新开店店家信息，冒充淘宝客服人员向店家发送店铺未激活、交易关闭等虚假信息，以帮助店家解决问题为由，诱骗被害人同意其进行远程协助并提供支付宝账户及密码，后其通过电脑远程操作的方式，骗取被害人钱款。</p>\n<p>（二）非法获取计算机信息系统数据罪与侵犯公民个人信息罪</p>\n<p>网络爬虫根据行为侵犯的法益不同，可能面临着不同的刑事风险。司法实践中，最为常见两类即为非法获取计算机信息系统数据案件和侵犯公民个人信息案件。</p>\n<p>“北京字节跳动公司诉上海晟品网络科技有限公司案”被“互联网大会”列为全国首例利用爬虫侵入计算机系统抓取数据案件，法院以“非法获取计算机信息系统数据罪”对被告人定罪处罚。上文中笔者已经明确分析了网络爬虫构成“非法获取计算机信息系统数据罪”的三个核心问题，入罪的逻辑首先要看网络爬虫的爬取行为是否被允许，即是否获得合法授权；其次要看爬取行为是否属于“非法获取计算机信息系统数据罪”中的“侵入行为”；最后要看犯罪对象，该罪的犯罪对象按照刑法规定是计算机信息系统中存储、处理和传输的数据。</p>\n<p>在实践案例中，也常遇到两个罪名的罪数问题。行为人若利用爬虫爬取公民个人信息，这个犯罪过程不仅获取了公民个人信息，也侵入了被害单位的计算机信息系统，笔者认为在此类情形下，爬取公民个人信息和非法获取计算机系统数据系非重复的同性质行为，而爬取的信息和获取的数据大部分也有交叉，因此，在行为人的爬取行为均构成上述两个罪名的情况下，属于法条竞合，应按照刑法的原则择一重罪处罚。</p>\n<p>（三）“以其他方法非法获取公民个人信息”之“非法”性判断</p>\n<p>网络爬虫涉及最多的刑事案由是侵犯公民个人信息罪，我国刑法第二百五十三条之一以列举的方式，明确了“向他人出售或者提供公民个人信息，情节严重的”、“违反国家有关规定，将在履行职责或者提供服务过程中获得的公民个人信息，出售或者提供给他人的”和“窃取”三种方式为侵犯公民个人信息罪禁止的行为，但其中第三款的兜底表述为“或以其他方法获取公民个人信息的”。显而易见，网络爬虫行为是否构成侵犯公民个人信息罪，主要看其是否属于“以其他方法获取公民个人信息”。</p>\n<p>网络爬虫在面对侵犯公民个人信息罪的兜底条款“其他方法”时，是否在刑事上违法，核心问题在于如何认定爬虫行为的违法性，即爬虫行为获取个人信息的过程是不是“非法“的。关于“非法”性的判断要从形式上和实质上同时判断。</p>\n<p>1.形式上的判断</p>\n<p>（1）违反前置法。刑法第二百五十三条之一的条文表述中，前提是“违反国家规定”，这里的“国家规定”即为前置法。所以网络爬虫爬取信息的行为，只有在“违反国家规定”的情形下，才有可能构罪。</p>\n<p>“国家规定”根据《最高人民法院、最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》第二条的规定，是指“法律、行政法规、部门规章有关公民个人信息保护的规定”。对于侵犯公民个人信息罪保护的客体“公民的个人信息”而言，其最主要的前置法应为《个人信息保护法》（2021年11月1日），作为前置法的”国家规定”包括：《关于加强网络信息保护的决定》（2012年12月28）、《电信和互联网用户个人信息保护规定》（2013年7月16日）、《网络安全法》（2016年11月7日）、《信息安全技术个人信息安全规范》（2017年12月29日）等。上述决定、规定中均不同程度的对个人信息或其他网络数据安全作出了原则上和详细的规定，若行为人利用网络爬虫爬取数据，违反了相关的前置法，即可以认定该爬虫行为具有非法性，将可能构成刑事犯罪。</p>\n<p>（2）违反行业规则。在网络中利用爬虫抓取数据就应当遵守网络行业规则，这个规则笔者在上文中已经阐明，即Robots协议（网络爬虫排除标准）。网站所有者根据Robots协议，在自己的网站根目录中会设置文本文件，主要对网站中数据是否可以被爬取予以指明，这样爬虫在爬取数据时就不会触及网站想要保护的数据。“在遵循Robots协议的前提下，公开爬取数据的行为既不会侵犯信息提供者的权利，也不会构成不正当竞争。反之，如果违反Robots协议，强行爬取他人的数据，则可能被认定为违反诚实信用和商业道德，构成不正当竞争”。正当、合法的爬虫行为在爬取数据的同时给网站所有者带来曝光率和流量，这个对于网站来说是被允许甚至是欢迎的，但若是无视Robots协议，爬取网站深处不被允许的数据，就可能涉及网站的商业秘密或个人信息。这样恶意的爬虫行为往往采用规避、破解的方式进行数据爬取，或者对于部分已经爬取的加密数据在抓取后，再进行破解使用。</p>\n<p>虽然Robots协议在法律上尚不具备强制力，但爬虫行为违反Robots协议爬取数据的过程，往往伴随着对网站已经采取的技术保护措施进行突破。因此笔者认为，对于“以爬取方式获取公民个人信息”，首先要看爬取数据的过程有无突破网站的技术壁垒，其次判断爬取中的突破行为是否违反Robots协议，从而确定行为的“非法性”。</p>\n<p>2.实质性判断</p>\n<p>以网络爬虫的方式侵犯公民个人信息的入罪判断，不仅要从形式上看是否符合构成要件，也要在实质上判断行为侵害的法益是否应当受到刑罚。形式上的判断主要针对爬虫行为的合法性和正当性，而实质上的判断主要看是否具有“正当化阻却事由”。</p>\n<p>（1）权限许可范围内使用。爬虫行为人若是在权限许可范围内爬取数据，则不具有“非法性”，不能认定为刑事犯罪。“爬虫”二字以抓取数据的过程形象化描述而得，其实我们每天都在接触网络爬虫，例如我们在百度等搜索网站内的查询，就是在对公开数据的爬取，通常是不会被认定为侵权或者违法的，这个就是最为常见的“权限许可范围内的数据爬取”。</p>\n<p>（2）“公民个人信息”的界定。关于“公民个人信息”，根据《最高人民法院、最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》第一条，明确规定了我国刑法第二百五十三条之一规定的“公民个人信息”是指以电子或者其他方式记录的能够单独或者与其他信息结合识别特定自然人身份或者反映特定自然人活动情况的各种信息，包括姓名、身份证号码、通信通讯联系方式、住址、账号密码、财产状况、行踪轨迹等。司法解释第三条，明确规定了未经被收集者同意，将合法收集的公民个人信息向他人提供的，属于刑法第二百五十三条规定的提供公民个人信息，但是经过处理无法识别特定个人且不能复原的除外。根据上面两条司法解释的条款，我们可以清晰找到其中的关键词：“识别”、“反映特定自然人”，所以在司法实践当中，我们对于网络爬虫爬取的相关公民个人信息直接比照“是否可以识别特定自然人身份或反映特定自然人活动情况”的标准即可判断。</p>\n<p>因此，在可能涉及“侵犯公民个人信息罪”的爬虫行为中，“权限许可范围内使用”或爬取的数据非“公民个人信息”两种情况，均不能以“侵犯公民个人信息罪”定罪处罚。对于利用爬虫侵犯个人信息的行为，要在形式上判断犯罪构成要件的基础上，实质上判断有无阻却事由。</p>\n<p>世界的本质是数据，数据对于飞速发展的经济时代意义重大，利用网络爬虫进行数据抓取的法律研究，可以为爬虫技术和数字经济的发展营造良好环境。法律不禁止技术创新，但网络爬虫作为一种新兴中立技术，不能逾越法律的边界，不然就要面对民事违法或刑事犯罪的风险。网络爬虫只是浩瀚的互联网世界中的一个缩影，针对不断新兴的互联网技术、行为，在刑事角度上要做到严谨认定、审慎入罪，在保证其合理生长的前提下，以预防为主要目的，但若不法分子利用技术作出违法行为必然要受到应有的惩处。同时，技术的发展总是一个不断试错、经验积累的过程，法律的发展也是一个及时引导、填补空白的过程，发现问题解决问题，保护公民合法权益，维护网络运行安全，共同营造良好的互联网发展环境。</p>\n<h2>要过年了，中国爬虫违法违规案例汇总！不要被钱财蒙蔽你的双眼</h2>\n<p>最近的爬虫真的有点火哦，博客上总有网友私信我，希望我能帮忙爬取一些数据。我思来想去，作为一个小小的博客主，何德何能得到这么多命运的垂青，于是就扒了扒自己以前写过的文章，发现都是因为我之前写的一篇爬取某程民宿数据的博客惹的祸。对于朋友们的请求，我本来想一口答应的，后面发现，这块还真的是个法律雷区。而我在全球最大同性交友网站交流的时候，也发现了一个关于爬虫违法案例汇总的项目，特来分享给有志于从事爬虫事业的小伙伴们。一定要避坑哦。</p>\n<h3>爬虫禁区1：为违法违规组织提供爬虫相关服务（验证码识别服务贩卖、SEO……）</h3>\n<p>这种比较坑，经常有小伙伴问我，我能不能爬某某数据，我们经理安排我爬的，经理说这个没问题。对于这种情况，请坚决说NO，并请你的上级好好去读一下相关法律法规，而且，这种情况出了事，老板反而可能是最没责任的，而你们爬虫程序员，我只能说呵呵。</p>\n<p>CASE1:知乎某极验破解者自述被抓（已删除）</p>\n<p>CASE2:“快啊答题”AI破解验证码服务开发者被判刑</p>\n<p>CASE9:永嘉警方揪出“黑”百度黑客团伙 干扰搜索引擎牟利超七千万元</p>\n<h3>爬虫禁区2：个人隐私数据抓取与贩卖</h3>\n<p>这个最严重，曾经有朋友让我帮忙爬取公安系统的个人数据，还说他们的项目是公安局的项目，没事的，公安局那边都同意了，吓得我赶紧把这哥们的微信都删了，也不知道他现在过的怎么样，唉，甚是想念啊！</p>\n<p>CASE3:简历大数据公司“巧达科技”被一锅端</p>\n<p>CASE4:社保掌上通被下架 用户的信息很容易泄露太不安全了</p>\n<p>CASE5:爬虫为何受关注？业内：大数据服务商或因合作方涉套路贷犯罪而被牵连</p>\n<p>忠告一句，国家特别关注个人隐私的数据泄露问题，抓到了，就是大事情。</p>\n<h3>爬虫禁区3：利用无版权的商业数据获利</h3>\n<p>这种情况，也是很严重的，爬取商业竞争对手的数据，并进行商用，车来了这个事件，老板被罚款，程序员一审进去了。你看看到底谁吃亏？从这个事情就能看出资本家的本质。</p>\n<p>CASE6:“车来了”涉嫌偷数据被警方立案</p>\n<p>CASE8:裁判文书网数据竟被售卖：爬虫程序抓取 或成侵权</p>\n<p>有朋友问我，某网站的音乐不错，某网站的视频不错，我能不能爬下来放到我个人的小站上供亲戚朋友使用，其实这也是不行的。如果对方追究，也是痴不了兜着走。</p>\n<h3>爬虫禁区4：爬取未经授权的资源</h3>\n<p>从上家公司离职了，千万不要因为对上家公司的系统比较熟悉，而非法获取数据，数据都是很敏感的，下面这个就是如此。</p>\n<p>CASE7:头疼大战前传：头条前高管反噬被判刑</p>\n<h3>三、相关法律法规介绍</h3>\n<p>下面的法律法规为必读必会内容，一定请重视！</p>\n<h3>非法获取计算机系统数据罪</h3>\n<p>根据《中华人民共和国刑法》第二百八十五条规定，非法获取计算机信息系统数据、非法控制计算机信息系统罪，是指违反国家规定，<strong>侵入国家事务、国防建设、尖端科学技术领</strong><strong>域以外的计算机信息系统或者采用其他技术手段，获取该计算机信息系统中存储、处理或者传输的数据</strong>，情节严重的行为。刑法第285条第2款明确规定，犯本罪的，<strong>处三年以下有期徒刑或者拘役，并处或者单处罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。</strong></p>\n<h3>非法侵入计算机信息系统罪</h3>\n<p>《刑法》第二百八十六条还规定，违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，后果严重的，构成犯罪，处五年以下有期徒刑或者拘役；后果特别严重的，处五年以上有期徒刑。而违反国家规定，对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，后果严重的，也构成犯罪，依照前款的规定处罚。</p>\n<h3>侵犯公民个人信息罪</h3>\n<p>《刑法》修正案（九）中将刑法第二百五十三条进行了修订，明确规定违反国家有关规定，向他人出售或者提供公民个人信息，情节严重的，构成犯罪；在未经用户许可的情况下，非法获取用户的个人信息，情节严重的也将构成“侵犯公民个人信息罪”。 根据《最高人民法院 最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》第五条规定，对“情节严重”的解释，（1）非法获取、出售或者提供行踪轨迹信息、通信内容、征信信息、财产信息五十条以上的；（2）非法获取、出售或者提供住宿信息、通信记录、健康生理信息、交易信息等其他可能影响人身、财产安全的公民个人信息五百条以上的；（3）非法获取、出售或者提供第三项、第四项规定以外的公民个人信息五千条以上的便构成“侵犯公民个人信息罪”所要求的“情节严重”。</p>\n<h3>侵犯商业秘密罪</h3>\n<p>《反不正当竞争法》第九条，以不正当手段获取他人商业秘密的行为即已经构成侵犯商业秘密。而后续如果进一步利用，或者公开该等信息，则构成对他人商业秘密的披露和使用，同样构成对权利人的商业秘密的侵犯。</p>\n<h3>网络安全法</h3>\n<p>《网络安全法》第四十四条 任何个人和组织不得窃取或者以其他非法方式获取个人信息。因此，如果爬虫在未经用户同意的情况下大量抓取用户的个人信息，则有可能构成非法收集个人信息的违法行为。</p>\n<h3>民法总则</h3>\n<p>《民法总则》第111条任何组织和个人需要获取他人个人信息的，应当依法取得并确保信息安全。不得非法收集、使用、加工、传输他人个人信息</p>\n<p>这些都要熟记于心，心中时刻有个高压线，一定不能去触碰，不然持久的注定是自己。</p>\n<h3>核心无非是这么几个：</h3>\n<p>你用爬虫有没有获利，不同的金额有不同的判罚档位</p>\n<p>你利用爬虫获取了多少数据，不同的数量有不同的档位</p>\n<p>你是具体的执行者，那你和你的领导如何定责，可以很负责任地告诉你，你占大头，老板罚点钱</p>\n<p>你用获取的数据做了什么，有没有泄露给其他人，如果有，那你的麻烦大了。</p>\n<h2>专栏丨《网络犯罪案例分析》第十五</h2>\n<p>本期概述：被告人超出用户授权，非法存储用户个人信息，触犯侵犯公民个人信息罪，判处罚金人民币三千万元。</p>\n<p>1、侵犯公民个人信息罪；</p>\n<p>2、爬虫程序。</p>\n<p>被告单位杭州魔蝎数据科技有限公司，住所地杭州市滨江区滨安路。法定代表人周某，总经理。</p>\n<p>被告人周某。因本案于2019年9月7日被刑事拘留，同年10月13日被逮捕。</p>\n<p>被告人袁某。因本案于2019年9月7日被刑事拘留，同年10月13日被逮捕。</p>\n<p>2016年初，被告单位魔蝎公司由周某等人出资成立，被告人周某系魔蝎公司法定代表人、总经理，负责公司整体运营，被告人袁某系魔蝎公司技术总监，系技术负责人，负责相关程序设计。</p>\n<p>魔蝎公司主要与各网络贷款公司、小型银行进行合作，为网络贷款公司、银行提供需要贷款的用户的个人信息及多维度信用数据，方式是魔蝎公司将其开发的前端插件嵌入上述网贷平台APP中。在网贷平台用户使用网贷平台的APP借款时，贷款用户需要在魔蝎公司提供的前端插件上，输入其通讯运营商、社保、公积金、淘宝、京东、学信网、征信中心等网站的账号、密码，经过贷款用户授权后，魔蝎公司的爬虫程序代替贷款用户登录上述网站，进入其个人账户，利用各类爬虫技术，爬取（复制）上述企、事业单位网站上贷款用户本人账户内的通话记录、社保、公积金等各类数据，并按与用户的约定提供给网贷平台用于判断用户的资信情况，并从网贷平台获取每笔0.1元至0.3元不等的费用。</p>\n<p>期间，魔蝎公司在和个人贷款用户签订的《数据采集服务协议》中明确告知贷款用户“不会保存用户账号密码，仅在用户每次单独授权的情况下采集信息”，但未经用户许可仍采用技术手段长期保存用户各类账号和密码在自己租用的阿里云服务器上。</p>\n<p>被告人周某明知公司存在保存用户账户密码的行为，未尽管理职责；被告人袁某负责编写具有保存用户账户密码功能的网关程序。截至2019年9月案发时，对魔蝎公司租用的阿里云服务器进行勘验检查，发现以明文形式非法保存的个人贷款用户各类账号和密码条数多达21241504条。其中大部分账号密码，如淘宝、京东等，无法二次使用，仅有邮箱等部分账号密码存在未经用户授权被魔蝎公司二次使用的情况。</p>\n<p>2019年9月6日下午，被告人周某、袁某被抓获归案。</p>\n<p>被告单位杭州魔蝎数据科技有限公司以其他方法非法获取公民个人信息，情节特别严重， 其行为已构成侵犯公民个人信息罪。被告人周某、袁某分别系对被告单位魔蝎公司侵犯公民个人信息行为直接负责的主管人员和其他直接责任人员，其行为均已构成侵犯公民个人信息罪。公诉机关的指控成 立。被告人周某、袁某自侦查阶段如实供述主要犯罪事实，自愿认罪认罚，酌情予以从宽处罚。根据被告人周某、袁某的犯罪情节、悔罪表现以及没有再犯罪的危险，适用缓刑对其所居住社区没有重大不良影响，故依法对其宣告缓刑。辩护人所提相应辩护意见，本院予以采纳。公诉机关的量刑建议适当，应予采纳。</p>\n<p>据此，依照《中华人民共和国刑法》第二百五十三条之一第三款、第四款、第三十条、第三十一条、第七十二条第一、三款、第七十三条第二、三款、第五十二条、第五十三条、第六十四条以及《最高人民法院、最高人民检察院关于办_理侵犯公民个人信息刑事案件适用法律若干问题的解释》第五条、第七条、第十二条之规定，判决如下：</p>\n<p>一、被告单位杭州魔蝎数据科技有限公司犯侵犯公民个人信息罪，判处罚金人民币30000000元（罚金限判决生效后十日内缴清）。</p>\n<p>二、被告人周某犯侵犯公民个人信息罪，判处有期徒刑三年，缓刑四年，并处罚金人民币500000 元（缓刑考验期限，从判决确定之日起计算；罚金限判决生效后十日内缴清）。</p>\n<p>三、被告人袁某犯侵犯公民个人信息罪，判处有期徒刑三年，缓刑三年，并处罚金人民币300000元（缓刑考验期限，从判决确定之日起计算；罚金限判决生效后十日内缴清）。</p>\n<p>四、扣押于公安机关的作案工具电脑等予以没收，被告单位杭州魔蝎数据科技有限公司退缴至本院的违法所得款人民币30000000元予以没收，并上缴国库。</p>\n<p>总得来说公司还是正规的，魔蝎公司在个人贷款用户使用贷款APP之前签订的《数据采集服务协议》中明确告知贷款用户“不会保存用户账号密码，仅在用户每次单独授权的情况下采集信息”，但是，在未经用户许可仍采用技术手段长期保存用户各类账号和密码在自己租用的阿里云服务器上，这就超出用户授权，符合以其他方法非法获取公民个人信息。</p>\n<p>类似的案例也有不少，比如某公司开发人员为了公司业务，调用API批量爬取某招聘网站的简历信息，最后被公安机关立案侦查。</p>\n<p>我们安全从业者因为工作需要很多时候也会自行编写或者互联网下载爬虫工具，普通的新闻、商品信息等不构成侵犯公民个人信息罪，但是涉及到公开的个人信息的时候一定要注意了，不能因为它是公开的你就可以随意收集。</p>\n<p>相关法律规定</p>\n<h2>《中华人民共和国刑法》</h2>\n<p>第二百五十三条之一 【侵犯公民个人信息罪】</p>\n<p>（第一款）违反国家有关规定，向他人出售或者提供公民个人信息，情节严重的，处三年以下有期徒刑或者拘役，并处或者单处罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。</p>\n<p>（第二款）违反国家有关规定，将在履行职责或者提供服务过程中获得的公民个人信息，出售或者提供给他人的，依照前款的规定从重处罚。</p>\n<p>（第三款）窃取或者以其他方法非法获取公民个人信息的，依照第一款的规定处罚。</p>\n<h2>《最高人民法院、最高人民检察院关于办_理危害计算机信息系统安全刑事案件应用法律若干问题的解释》</h2>\n<p>第一条</p>\n<p>刑法第二百五十三条之一规定的“公民个人信息”，是指以电子或者其他方式记录的能够单独或者与其他信息结合识别特定自然人身份或者反映特定自然人活动情况的各种信息，包括姓名、身份_证件号码、通信通讯联系方式、住址、账号密码、财产状况、行踪轨迹等。</p>\n<p>第五条</p>\n<p>非法获取、出售或者提供公民个人信息，具有下列情形之一的，应当认定为刑法第二百五十三条之一规定的“情节严重”：</p>\n<p>（一）出售或者提供行踪轨迹信息，被他人用于犯罪的；</p>\n<p>（二）知道或者应当知道他人利用公民个人信息实施犯罪，向其出售或者提供的；</p>\n<p>（三）非法获取、出售或者提供行踪轨迹信息、通信内容、征信信息、财产信息五十条以上的；</p>\n<p>（四）非法获取、出售或者提供住宿信息、通信记录、健康生理信息、交易信息等其他可能影响人身、财产安全的公民个人信息五百条以上的；</p>\n<p>（五）非法获取、出售或者提供第三项、第四项规定以外的公民个人信息五千条以上的；</p>\n<p>（六）数量未达到第三项至第五项规定标准，但是按相应比例合计达到有关数量标准的；</p>\n<p>（七）违法所得五千元以上的；</p>\n<p>（八）将在履行职责或者提供服务过程中获得的公民个人信息出售或者提供给他人，数量或者数额达到第三项至第七项规定标准一半以上的；</p>\n<p>（九）曾因侵犯公民个人信息受过刑事处罚或者二年内受过行政处罚，又非法获取、出售或者提供公民个人信息的；</p>\n<p>（十）其他情节严重的情形。</p>\n<p>实施前款规定的行为，具有下列情形之一的，应当认定为刑法第二百五十三条之一第一款规定的“情节特别严重”：</p>\n<p>（一）造成被害人死亡、重伤、精神失常或者被绑架等严重后果的；</p>\n<p>（二）造成重大经济损失或者恶劣社会影响的；</p>\n<p>（三）数量或者数额达到前款第三项至第八项规定标准十倍以上的；</p>\n<p>（四）其他情节特别严重的情形。</p>\n<h2>百君研析丨爬虫技术应用涉刑犯罪的类型化研究</h2>\n<p>在数字经济社会，数据蕴含的巨大商业价值，如何有效提取数据成为一个挑战。于是，网络爬虫技术应运而生。那么，何为网络爬虫技术？</p>\n<p>网络爬虫（Web Crawler），通常是指一种按照一定的规则，自动地抓取万维网信息的程序或者脚本的技术。另外，也有人称之为网页蜘蛛、网络机器人、蚂蚁、自动索引、模拟程序或者蠕虫等。</p>\n<p>因此，网络爬虫技术本质上属于一种数据收集技术，可以在未经数据主体许可下访问或获取大量数据。其运行需要依赖一套高效的下载系统，针对目标网页的信息数据，高速下载到本地并形成在线网页镜像备份。你可以将其想象成一个二十四小时不间断地访问各种网站，并带回与站点相关的信息同时能自动提取一些数据的“人”。</p>\n<p>然而，爬虫技术的滥用容易引起一系列侵犯数据、信息系统等等现象的发生，这些现象不但涉及民事侵权、不正当竞争，而且有引致刑事犯罪的法律风险。本文以61起相关涉刑案例为样本，对其进行类型化分析研究。</p>\n<h3>一网络爬虫技术应用现状之描述</h3>\n<p>（一）网络爬虫技术的常见应用场景</p>\n<p>目前从网页交互维度来看，网络爬虫分为两种主要方式，分别是常规爬虫和自动化爬虫。常规爬虫必须要要知道所爬取的每个页面的具体位置，而且只能逐个网页爬取，不能整站爬取；自动化爬虫能模拟大部分的用户操作，因此只需知道一个网站的首页地址就可以爬取整个网站的数据。</p>\n<p>网络爬虫技术常见的应用场景有：一是抓取网页数据，例如比价网站，通过爬虫技术获取到各大电商平台的商品价格，再集中整理。二是热搜排行、舆情追踪也通过爬虫技术获取用户浏览的新闻关键字，再进行统计排列。三是利用爬虫技术抢票也十分常见。四是搜索引擎的优化，例如百度、谷歌都利用爬虫技术将各个网站最新的页面搬取下来，通过召回排列，再展现给用户。五是在反盗版措施中也常常利用爬虫技术来追踪盗版视频网站，以达到保护自身的知识产权。</p>\n<p>（二）网络爬虫技术涉刑案件的实证分析</p>\n<p>我们通过在中国裁判文书网以“爬虫”为关键词检索，共检索出刑事案件84件，排除与本文章研究主题无关的案件，实得可研究案例61件。从案由分布来看，发现集中分布在对个人数据的侵犯和利用窃取数据进行财产型犯罪。</p>\n<p>主要涉及侵犯公民个人信息罪（19件）、诈骗罪（10件）、制作、复制、出版、贩卖、传播淫秽物品牟利罪（6件）、非法获取计算机信息系统数据、非法控制计算机信息系统罪（5件）、盗窃罪（3件）、破坏计算机信息系统罪（3件），其他种类的犯罪较少（详见图1）。爬虫技术涉刑犯罪罪名分布较为多样，侧面反映出爬虫技术相关犯罪具有手段多样、侵害法律利益复杂的特点。它不仅侵犯公民的个人信息，干扰计算机信息系统的正常运行，而且干扰国事网站的正常访问。在利用爬虫技术时除了手段和目的的合法性面临众多风险，在技术上也可能因为爬虫技术使用过于频繁而导致服务器负荷过大，进而导致计算机信息系统遭到破坏。</p>\n<p>图1  2014年至2022年（截至6月20日）爬虫涉刑案件案由分布</p>\n<p>从案件数量来看，呈现出逐年增长但近两年有所减缓的态势（详见图2）。2014年2件、2015年2件、到2016年1件、2017年2件、2018年11件、2019年16件、2020年24件、2021年9件、2022年1件（截至2022年6月19日）。不难发现在2018年之前爬虫技术涉刑的案件较少，而从2018年开始出现一个短暂的高速增长时期，但在2021年出现骤降，这可能与2021年通过的《个人信息保护法》有关。</p>\n<p>图2 爬虫涉刑案件2014年至2022年（截至6月20日）数量图</p>\n<p>对此，我们通过梳理不同场景下应用爬虫技术涉刑的种类，就爬虫技术应用涉刑问题进行类型化研究。除了利用爬虫技术本身实施犯罪行为之外，根据中国裁判文书网检索结果来看，不少犯罪行为都是以爬虫技术为手段而进行，例如“侯某某、陈达开设赌场案”中，被告人宋某利用自己编写的“爬虫软件”抓取某境外赌博网站的比赛结果、盘口信息等，然后导入平台数据库供平台控盘人员参考，其行为就是利用爬虫技术而进行其他种类的犯罪。</p>\n<p>从上述两个角度来看有关应用爬虫技术的涉刑案件可以初步分为直接利用爬虫技术实施的信息网络犯罪活动和利用爬虫技术实施其他种类犯罪的犯罪行为。</p>\n<h3>二直接利用爬虫技术进行信息网络犯罪之行为</h3>\n<p>在这一类型的犯罪行为中被告人通常是将爬虫技术作为其犯罪的最主要工具，违反相应的授权协议，或者超越授权协议的范围，非法获取数据并加以不当使用构成刑事犯罪的行为。</p>\n<p>（一）爬取用户个人信息场景下的涉刑分析</p>\n<p>通过在中国裁判文书网全文检索“爬虫”和“公民个人信息”，共检索出19起侵犯公民个人信息罪案件和1起起出售、非法提供公民个人信息罪案件。</p>\n<p>在20起爬取用户个人信息场景下的案件中，17起案件是利用爬虫技术主动爬取各大网站或借贷平台，例如淘宝、京东、天猫等，来获取包括姓名、手机号码、地址等在内的公民个人信息。在这17起侵犯公民个人信息罪案件中，大部分被告人在窃取到公民个人信息之后，都会以直接售卖的方式来获利。值得注意的是，在“被告人周华侵犯公民个人信息案”中，被告称自身是为其私自研究程序所需而获取公民个人信息，使用自己编写的爬虫程序窃取了4万余条学生信息，将其转存在自己的服务器之后便公布了服务器地址，使不特定人都能访问其服务器。因此在应用爬虫技术侵犯到公民个人信息时，似乎并不考虑被告人的主观故意性。</p>\n<p>同时，在17起侵犯公民个人信息罪中，有5起案件都是涉及数据科技公司中相关技术人员操作不当或不当处理。例如，在“李威侵犯公民个人信息案”中，被告人李威系某资产管理有限公司区域经理，在任职期间利用公司内网，通过爬虫软件获取到全北京客户信息之后，再将其发送给其他公司管理人员。在“王小鹏、薛凯鹏、张涛等侵犯公民个人信息案”中，北京万界数据科技有限责任公司在进行公民个人信息修复业务时，其内部工作人员多次利用爬虫软件获取到用户个人信息之后再提供给下游技术人员进行修复业务。综上所述，上述两个案件中，个人信息处理者在对公民个人信息进行传输时，由于未明确告知用户，已经违反《个人信息保护法》第十七条的规定；加之数据科技有限公司处理用户个人信息数量巨大，极易触犯刑法侵犯公民个人信息罪的相关规定。</p>\n<p>因此，从个人信息处理者角度来讲，公司应当积极开展数据合规审查，审查范围包含到整个数据生命周期，用以防范公司相关技术人员操作不当或不当处理而涉及刑事犯罪的法律风险。</p>\n<p>（二）爬取计算机信息系统数据场景下的涉刑分析</p>\n<p>我们通过在中国裁判文书网上检索“爬虫”“非法获取计算机信息系统数据”和“非法控制计算机信息系统”共检索出8篇相关文书，其中5起案例涉及非法获取计算机信息系统数据、非法控制计算机信息系统罪，2起案例涉及非法获取计算机信息系统数据罪，1起案例涉及提供侵入、非法控制计算机信息系统程序、工具罪。</p>\n<p>在对比5起涉及非法获取计算机信息系统数据、非法控制计算机信息系统罪案例中被告人的犯罪目的发现：所有被告人均是利用爬虫技术从第三方获取到相关用户个人信息或相关数据之后，用于自身运营或其他使用，并未将其出售或提供给他人。例如在“马骏、张伟非法获取计算机信息系统数据、非法控制计算机信息系统案”中，马骏和张伟在加盟某教育机构后，萌生模仿其运营模式运营网络英语教育平台的想法，于是利用爬虫技术爬取某教育机构系统中的英语学习内容以此作为自己教育平台的内容。在“吴世斌、皮冠铮等非法获取计算机信息系统数据、非法控制计算机信息系统案”中，被告人非法获取汽车4S店的汽车保养信息和维修信息之后整合到自己运营的APP中。从采集数据的角度来讲，被告人的获取手法毫无疑问也是未得到授权的，甚至也是通过窃取的方式获取到的商业数据。因此，从企业运营角度来讲，在利用爬虫技术获取其他第三方数据时，并不是所有的公开数据都能随意获取，因为相关数据可能涉及知识产权、个人信息、商业秘密等。</p>\n<p>在2起涉及非法获取计算机信息系统数据罪的案例中，案情基本上与上述涉及非法获取计算机信息系统数据、非法控制计算机信息系统罪的案例相似，不过在司法实践中，人们还是区分了非法控制计算机信息系统罪和非法获取计算机信息系统数据罪。此两罪区别的关键点在于是否达到了非法控制的程度。</p>\n<p>非法控制，是指未经授权地控制他人计算机的行为，通常包括不妨害他人使用计算机信息系统与排除他人对计算机系统的控制能力两种情形。</p>\n<p>所谓不妨害他人使用计算计信息系统，是指黑客或其他非法侵入者在计算机系统内植入木马，绕过了杀毒软件和防火墙；此情形下，合法用户并不会因为木马的存在而无法使用被控制的计算机；排除出他人对计算机系统的控制能力是指造成被控制计算机信息系统的合法用户无法登录，或者登录计算机后无法按照其自身意愿完成操作，而黑客或其他非法侵入者却能对受害计算机实现控制。</p>\n<p>（三）爬虫技术破坏计算机信息系统的涉刑分析</p>\n<p>从在中国裁判文书网上查阅到的相关案例来看，应用爬虫技术而触犯破坏计算计信息系统罪的情况分为两个情形：一是利用爬虫技术主动积极地进行破坏，直接用爬虫技术对系统进行攻击，属于主动性破坏。例如“王博一文、黄业兴破坏计算机信息系统案”，被告人利用自己编写的爬虫技术入侵到全运会系统管理后台，并对系统进行攻击，删除里该系统内大量参赛运动员及技术官员的抵离信息、酒店住宿信息、人员简要身份信息，造成严重影响。</p>\n<p>二是在应用爬虫技术时导致计算机信息系统受影响而被破坏，通常是因为爬虫技术使用过于频繁而导致被爬虫服务器负荷过大，从而导致被爬虫服务器瘫痪，进而造成计算机系统被破坏。例如“杨杰明、张国栋破坏计算机信息系统案”，案中被告人利用爬虫技术对深圳市居住证网站的信息进行爬取，并应用于自身开发的APP中，但是因为其使用爬虫技术的频率极高，达到每秒183次，致使深圳市居住证系统无法正常运作，极大地影响了该居住证系统使用方深圳市公安局人口管理处的日常运作。</p>\n<h3>三利用爬虫技术实施其他种类犯罪的犯罪行为</h3>\n<p>（一）利用爬虫技术实施与诈骗有关行为的涉刑分析</p>\n<p>在中国裁判文书网上我们以“爬虫”“诈骗罪”为关键词进行检索，其中一审案件共8件。从检索出的案例来看，不难发现利用爬虫技术的一方往往是上游犯罪的一方。</p>\n<p>被告人在前期通过爬虫技术非法获取到大量的公民个人信息后，将其出售到需要实施诈骗行为的人的手中。因为掌握大量公民个人信息，其中不乏个人敏感信息，所以下游实施诈骗犯罪往往更精准，往往比传统电信诈骗更加容易得手。例如在“张国义、谢志敏等诈骗案”中，被告人李某程即利用爬虫技术获取圆通快递公司客户快递丢失件和催收件等问题件信息卖给用以诈骗的林某某。需要注意的是：在此情况下，我们一般不将利用爬虫技术获取公民个人信息的行为列入诈骗罪的共同犯罪中，而是直接以侵犯公民个人信息罪判处。</p>\n<p>此外，也有被告人利用爬虫技术爬取的是常规数据，再利用这些数据完完全全复制一个可以以假乱真的网站，以此实施诈骗行为。例如在“徐林峰、江萧佐诈骗案”中，被告人就是以伪装正规网站为目的爬取原网站的数据，同时依靠这些数据制作一个伪装网站，再将伪装网站提供给实施诈骗的一方，来达到诈骗的目的。同样地，利用爬虫技术制作伪装网站的行为也并没有列入诈骗罪的共同犯罪。</p>\n<p>（二）利用爬虫技术爬取特殊信息的涉刑分析</p>\n<p>在中国裁判文书网上我们以“爬虫”和“制作、复制、出版、贩卖、传播淫秽物品牟利罪”为关键词进行检索，共检索到6起案件。以“爬虫”和“传播淫秽物品罪”为关键词进行检索，共检索到2起案件。</p>\n<p>由于数据与知识产权的“无形财产”具有天然契合性，以数字代码形式储存、利用、传输，因而几乎所有的网络知识产权都可以被网络爬虫抓取。从诉讼案由分布来看，有关爬虫技术爬取网络知识产权的侵权大部分还属于民事纠纷，只有极少数上升到刑事的层面。不过值得关注的是，在整个爬虫技术涉刑犯罪中，制作、复制、出版、贩卖、传播淫秽物品牟利罪占比10%。</p>\n<p>通过对比检索到的6件案例发现：犯罪过程通常是通过爬虫技术爬取到境外其他色情网站的数据，然后再提供到国内网站或者直接向用户提供BT磁力链接并从中广告或收取会员费获利。例如在“龚礼仪制作、复制、出版、贩卖、传播淫秽物品牟利案”中，被告人龚礼仪在主观方面与典型意义上的传播淫秽物品牟利罪的直接故意不同，他设立的网站基于爬虫技术而自动获取互联网上的BT种子文件信息，并且在明知这可能用于下载淫秽视频，但却为了增加广告浏览进而增加广告收入，而放任这一结果发生。</p>\n<p>另外，与上述情况相似的是涉及传播淫秽物品罪，此罪与制作、复制、出版、贩卖、传播淫秽物品牟利罪一个重要区分点就是是否有牟利的目的。由于爬虫是自动获取资源并收录到指定地址中，其本身不具有辨别内容是否违法的能力。因此，运营磁力链接网站的个人或公司若没有管控好爬取的内容，没有及时删除相关违法内容极有可能触犯传播淫秽物品罪甚至是宣扬恐怖主义罪。例如“刘凯鹏传播淫秽物品案”中被告人明知收集到了大量违法内容，基于技术原因和个人精力有限，放任这些违法内容在其建立的网站上传播，但因为其主观并没有牟利的意图，所以触犯传播淫秽物品罪和宣扬恐怖主义罪。</p>\n<p>在数字经济时代，网络和信息技术的蓬勃发展给我们生产生活都带来了极大的方便，爬虫技术无疑在满足人们对数据检索需要方面提供了极大便利。至于运用爬虫技术的合法性的判断，则需要在具体场景化之下具体分析。我们既不能简单地以技术中立的原则放任不管，也不能以苛责的眼光去求全责备，从而有碍数据经济价值的释放。</p>\n<p>另外，我们通过对爬虫技术涉刑案件的分析发现：爬虫技术涉刑事犯罪呈现出罪名多样性的特点。因此，我们不能仅仅只着眼于爬虫技术爬取这个初始阶段，更要从整个数据生命周期着眼，结合案涉犯罪全过程加以评判更为合理。当然，爬虫技术涉刑案件罪名是否妥当？这关涉到罪数理论、共犯理论等刑法理论问题，本处不加论述。</p>\n<p>最后，从犯罪预防角度出发，我们认为合理规范爬虫技术的适用仅靠法律的手段较难实现，更重要地要从个人、平台、政府等主体的多方主体协作监督，共同治理的方向推进。</p>\n<h2>专栏丨《网络犯罪案例分析》第三十五期：爬虫抢票</h2>\n<p>随着互联网的迅速普及和广泛应用，网络安全问题日益凸显，为了规范和约束网络运营者的行为，保障基础设施和网络空间的安全，国家相继出台了《网络安全法》、《密码法》、《数据安全法》、《个人信息保护法》等诸多法律法规。</p>\n<p>正在从事或即将入门网络安全行业的从业者，一定要严格遵守法律法规，坚决不触碰法律红线，切实做到知法、懂法、尊法。</p>\n<p>i春秋“网络犯罪案例分析”专栏每周更新1个真实案件，通过剖析真实的网络犯罪案例，加强网络安全从业者的法律意识。</p>\n<p>本期概述：被告人开发爬虫进行抢票，非法获利12万元，触犯提供侵入、非法控制计算机信息系统程序、工具罪，判处有期徒刑三年。</p>\n<p>1、提供侵入、非法控制计算机信息系统程序、工具罪；</p>\n<p>2、爬虫抢票。</p>\n<p>被告人陈某，男，1985年4月15日出生于河南省信阳市，汉族，大专文化，务工人员。</p>\n<p>2017年至2019年间，被告人陈辉为牟取非法利益，编写“爬虫”软件用于在浙江淘宝网络有限公司旗下的“大麦网”平台上抢票，并以人民币1888元到6888元不等的价格向他人出售该软件，非法获利人民币12万余元。2019年7月11日，被告人陈辉被公安机关抓获。经鉴定，上述“爬虫”软件具有以非常规的方式构造和发送网络请求，模拟用户在大麦网平台手动下单和购买商品的功能；具有以非常规手段模拟用户识别和输入图形验证码的功能，该功能可绕过大麦网平台的人机识别验证机制，以非常规方式访问大麦网平台的资源。诉讼过程和结果</p>\n<p>本院认为，被告人陈某提供专门用于侵入、非法控制计算机信息系统程序、工具，情节特别严重，依法应予惩处。被告人陈辉认罪认罚且在庭前签署《认罪认罚具结协议》，依法可以从宽处理。辩护人所提意见于法有据部分，予以采纳。公诉机关量刑建议适当，予以采纳。综合本案的性质、情节、危害后果及被告人陈辉的认罪态度，依照《中华人民共和国刑法》第二百八十五条第三款、第五十三条、第六十四条、第六十七条第三款、第七十二条第一款、第三款、第七十三条第二款、第三款及《最高人民法院、最高人民检察院关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》第二条、第三条、第十一条，《最高人民法院关于适用财产刑若干问题的规定》第一条、第二条第一款、第五条的规定，判决如下：</p>\n<p>一、被告人陈辉犯提供侵入、非法控制计算机信息系统程序、工具罪，判处有期徒刑三年，缓刑四年，并处罚金人民币二万元。</p>\n<p>二、继续追缴被告人陈辉的违法所得人民币12万元，上缴国库。</p>\n<p>三、扣押在案的U盘1个、手机1台、电脑主机1台、移动硬盘1个等作案工具予以没收、上缴国库（由广州市公安局南沙区分局代为执行）。</p>\n<p>本案涉及利用爬虫抢票，属于最近几年很常见的犯罪情形，同时还有类似爬虫抓取数据涉及侵犯公民信息的犯罪。</p>\n<p>在本案中最重要的定罪依据如下，能够绕过平台的人机识别验证机制，已经满足《最高人民法院、最高人民检察院关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》第二条第（二）点的构成要件，同时非法获利12万元，属于犯罪情节特别严重。</p>\n<p>具有以非常规手段模拟用户识别和输入图形验证码的功能，该功能可绕过大麦网平台的人机识别验证机制，以非常规方式访问大麦网平台的资源。相关法律规定</p>\n<h2>《中华人民共和国刑法》</h2>\n<p>第二百八十五条　</p>\n<p>（第一款）【非法侵入计算机信息系统罪】违反国家规定，侵入国家事务、国防建设、尖端科学技术领域的计算机信息系统的，处三年以下有期徒刑或者拘役。</p>\n<p>（第二款）【非法获取计算机信息系统数据、非法控制计算机信息系统罪】违反国家规定，侵入前款规定以外的计算机信息系统或者采用其他技术手段，获取该计算机信息系统中存储、处理或者传输的数据，或者对该计算机信息系统实施非法控制，情节严重的，处三年以下有期徒刑或者拘役，并处或者单处罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。</p>\n<p>（第三款）【提供侵入、非法控制计算机信息系统程序、工具罪】提供专门用于侵入、非法控制计算机信息系统的程序、工具，或者明知他人实施侵入、非法控制计算机信息系统的违法犯罪行为而为其提供程序、工具，情节严重的，依照前款的规定处罚。</p>\n<p>（第四款）单位犯前三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照各该款的规定处罚。</p>\n<h2>《最高人民法院、最高人民检察院关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》</h2>\n<p>第二条</p>\n<p>具有下列情形之一的程序、工具，应当认定为刑法第二百八十五条第三款规定的“专门用于侵入、非法控制计算机信息系统的程序、工具”：</p>\n<p>（一）具有避开或者突破计算机信息系统安全保护措施，未经授权或者超越授权获取计算机信息系统数据的功能的；</p>\n<p>（二）具有避开或者突破计算机信息系统安全保护措施，未经授权或者超越授权对计算机信息系统实施控制的功能的；</p>\n<p>（三）其他专门设计用于侵入、非法控制计算机信息系统、非法获取计算机信息系统数据的程序、工具。</p>\n<p>第三条</p>\n<p>提供侵入、非法控制计算机信息系统的程序、工具，具有下列情形之一的，应当认定为刑法第二百八十五条第三款规定的“情节严重”：</p>\n<p>（一）提供能够用于非法获取支付结算、证券交易、期货交易等网络金融服务身份认证信息的专门性程序、工具五人次以上的；</p>\n<p>（二）提供第（一）项以外的专门用于侵入、非法控制计算机信息系统的程序、工具二十人次以上的；</p>\n<p>（三）明知他人实施非法获取支付结算、证券交易、期货交易等网络金融服务身份认证信息的违法犯罪行为而为其提供程序、工具五人次以上的；</p>\n<p>（四）明知他人实施第（三）项以外的侵入、非法控制计算机信息系统的违法犯罪行为而为其提供程序、工具二十人次以上的；</p>\n<p>（五）违法所得五千元以上或者造成经济损失一万元以上的；</p>\n<p>（六）其他情节严重的情形。</p>\n<p>实施前款规定行为，具有下列情形之一的，应当认定为提供侵入、非法控制计算机信息系统的程序、工具“情节特别严重”：</p>\n<p>（一）数量或者数额达到前款第（一）项至第（五）项规定标准五倍以上的；</p>\n<p>（二）其他情节特别严重的情形。</p>\n<h2>全国首例短视频爬虫案宣判：涉爬虫技术的刑法案件分析</h2>\n<p>前言：国内首个短视频平台领域爬虫案件宣判，被告人丁某因犯提供侵入计算机信息系统程序罪，被判有期徒刑一年六个月，缓刑两年，并处罚金3万元。</p>\n<p>在“互联网 +”时代，互联网成为大量信息的载体，如何有效地提取并利用这些信息成为一个巨大的挑战。无论是搜索引擎，还是个人或单位获取目标数据，都需要从公开网站上爬取大量数据，在此需求下，爬虫技术应运而生，并迅速成为一门成熟的技术。</p>\n<p>华东政法大学高富平教授曾表示，数据爬取是实现数据流通的重要方式。毫不夸张地说，没有数据爬虫技术，现阶段的大数据产业可能会限于停滞状态。 </p>\n<p>欧莱雅中国区数字化负责人刘煜晨也曾表示，数字经济时代，随着各种商业模式的不断创新，经营者运用爬虫技术开发的应用场景和商业模式越来越多。 </p>\n<p>网络爬虫本身作为一项技术手段本身并不违法。但当网络爬虫使用者为了获取经济利益，将爬虫作为一种犯罪工具，可能严重扰乱计算机信息系统的运行秩序，同时还可能侵害到公民的个人信息，从而构成犯罪。</p>\n<h3>刷个短视频就泄露了个人信息和需求</h3>\n<p>近日，国内首个短视频平台领域爬虫案件宣判，被告人丁某因犯提供侵入计算机信息系统程序罪，被判有期徒刑一年六个月，缓刑两年，并处罚金3万元。 </p>\n<p>起因：2021年9月，某信息公司员工在网上巡查时发现一款叫“汇易获客”的软件，购买使用后发现软件居然可以“爬取”公司后台数据和直播间用户的相关信息，随即报警。</p>\n<p>经查，2021年中，被告人丁某从他人处以9800元的价格购进“汇易获客”软件成为代理商，利用软件入侵某些短视频平台的服务器，通过关键词搜索可以快速抓取平台信息，主要包括用户名、UID、签名及评论等，再通过软件把UID转换成二维码，来精准定位客户。丁某对该软件进行了重新包装后销售，违法所得2.4万余元。</p>\n<p>办理该案的检察官林虹介绍：“‘网络爬虫’作为一项技术手段本身并不违法，但由于本案的软件采取了避开或突破计算机信息系统的安全保护措施，未经许可进入被害单位的计算机系统，即属于非法获取计算机信息系统数据罪中的‘侵入’行为。”</p>\n<h3>非法使用爬虫技术涉及的刑事犯罪</h3>\n<p>编者以“爬虫”、“网络”作为关键词检索裁判文书网，截止5月17日，共显示499份案例。其中刑事案件62件。经过分析裁判文书，发现在司法实践中，使用爬虫技术主要涉及几类刑事犯罪： </p>\n<p>（一）侵犯公民个人信息罪</p>\n<p>案情：谢某等人通过爬虫软件非法侵入京东商城“WIS旗舰店”等商户的账户维护后台，窃取交易类个人信息共计240372条，谢某等人将窃取的个人信息卖给从事网络诈骗的人从中牟利。 </p>\n<p>结果：谢某等人因犯侵犯公民个人信息罪，判处有期徒刑三年六个月，并处罚金7万元。</p>\n<p>（二）非法获取计算机信息系统数据罪</p>\n<p>案情：某网络公司使用网络爬虫技术非法获取某信息技术公司所经营网站中的房源数据，并将非法获取的房产数据存放在自己的服务器中供“推房神器”APP调用，并向该APP用户收取会员费盈利。给该公司造成直接损失共计人民币10万余元。 </p>\n<p>结果：网络公司及公司责任相关人犯非法获取计算机信息系统数据罪。公司被判罚二十万，3名被告人被判处有期徒刑八个月至一年零六个月不等刑罚。</p>\n<p>（三）破坏计算机信息系统罪</p>\n<p>案情：王某某为获得全运会接待服务管理系统安全维护业务，利用提供美工服务时掌握的系统管理后台的 URL、管理员用户名及密码，让黄某将“爬虫”程序植入全运会组委会接待服务管理系统。由于“爬虫”程序在运行中自动点击了“删除”按钮，导致该系统内存储的4000余条参赛运动员及技术官员来津抵离信息、酒店住宿信息、人员身份信息被删除，致使组委会接待服务部工作人员使用的多台计算机在当日一段时间内无法正常登录接待服务管理系统，造成严重影响。 </p>\n<p>结果：王某某、黄某均构成破坏计算机信息系统罪，分别被法院判处两年六个月。</p>\n<p>（四）非法侵入计算机信息系统罪</p>\n<p>案情：李某等人使用“爬虫”软件，大量爬取全国各地及凉山州公安局交警支队车管所公告的车牌放号信息，使用软件采用多线程提交、批量刷单、验证码自动识别等方式，突破系统安全保护措施，将爬取的车牌号提交至“交通安全服务管理平台”车辆报废查询系统，进行对比，并根据反馈情况自动记录未注册车牌号，建立全国未注册车牌号数据库。</p>\n<p>此后编写客户端查询软件，通过QQ、淘宝、微信等方式，以300-3000元每月的价格，分省市贩卖数据库实现查库、选号功能。 </p>\n<p>结果：6名被告人因犯非法侵入计算机信息系统罪，被法院判处有期徒刑十个月至一年四个月零十五日不等刑罚。</p>\n<p>（五）侵犯著作权罪</p>\n<p>案情：王某利用自己所学知识利用爬虫技术将未经著作权人授权许可的电影、电视剧、综艺、动漫表演等视频资源链接到自己建立的网站上，案发时未发现实际广告收入。 </p>\n<p>结果：法院认为，王某以营利为目的，未经著作权人、录音录像制作者许可，通过互联网向公众传播他人电影600余部，情节严重，构成侵犯著作权罪。王某因犯侵犯著作权罪，被判处有期徒刑一年零六个月，并处罚金人民币5000元。</p>\n<h3>目前，非法使用“爬虫”可能涉及的刑事相关的法律及司法解释</h3>\n<p>一、《刑法》及《刑法修正案》</p>\n<p>1.《刑法》第二百五十三条之一规定的侵犯公民个人信息罪</p>\n<p>2. 《刑法》第二百八十五条规定的非法侵入计算机信息系统罪 《刑法》第二百八十五条第二款非法获取计算机信息系统数据、非法控制计算机信息系统罪 《刑法》增设二百八十五条第三款提供侵入、非法控制计算机信息系统程序、工具罪</p>\n<p>3.《刑法》第二百八十六条规定的破坏计算机信息系统罪</p>\n<p>4.《刑法》第二百一十九条规定的侵犯商业秘密罪</p>\n<p>5.《刑法》第二百一十七条规定的侵犯著作权罪</p>\n<p>二、《最高人民法院、最高人民检察院关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》第二条规定了具有三种情形的程序、工具，应当认定为刑法第二百八十五条第三款规定的“专门用于侵入、非法控制计算机信息系统的程序、工具”</p>\n<p>三、《最高人民法院、最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》</p>\n<p>“爬虫”的法律规制困境</p>\n<p>《网络爬虫行为的合法性基础与法律规制研究》一文中提到，采用《刑法》来对网络爬虫类案件进行规制，主要有两大困境。</p>\n<p>第一，体现在内部层面，即网络爬虫行为的违法边界不清晰，难以明确罪与非罪，此罪与彼罪之间的关系。如何精准对网络爬虫行为进行定性，是目前亟待解决的问题。</p>\n<p>第二，体现在外部层面，即对网络爬虫行为进行规制的相关法律规范屈指可数。对于一个新兴技术的法律规制，立法的保守性和法律出台的滞后性难以避免。网络爬虫技术也处于起步阶段，所以网络爬虫行为的刑事规制缺少其他部门法作支撑的现状是无法避免的。</p>\n<p>网络爬虫作为一项新兴技术，法律规制还需进一步完善。</p>\n<h2>网络爬虫技术泛化的涉刑风险——以非法获取计算机信息系统数据罪为视角</h2>\n<p>时代在进步，爆发式的数据信息铺天盖地而来，为获取有效信息，网络爬虫技术应运而生。“网络爬虫”技术，原本是一种中立的技术，是用设计的程序，在遵守robots协议的情况下对网站、手机APP、小程序或搜索引擎等进行数据的浏览和抓取，由此获得自己所需要的相关数据的过程。数据获得者从获得数据中分析数据并推测出互联网用户的喜好，将有关信息推送给互联网用户，以提高平台的客户粘性，从而达到提升知名度或盈利的目的。在数据抓取上，行业内通用的规则是robots协议，也称网络爬虫排除协议：通过爬虫技术可以访问和收集互联网站点的诸多信息，为了维护互联网秩序，尊重信息提供者的意志和隐私等，信息提供者可以在自己的站点设置robots协议，以告知爬虫控制者哪些信息是提供者不希望被爬取的。①</p>\n<p>robots协议属于行业规则，其效力并未在法律上获得确认。一般认为只要遵守robots协议，就不涉及侵权问题。但是，在可观的数据红利面前，一些互联网公司往往选择挣脱该协议的束缚，强行爬取相关数据。因此，被强行爬取数据的公司便开始运用反爬技术以限制其他互联网企业的爬虫行为。随之而来是互联网数据安全的风险逐渐浮出水面，不仅互联网公司会被分流掉用户及流量，个人用户也将面临信息被盗用的风险。在这种背景下，互联网公司所得的数据及个人信息应受刑法保护的呼声与日俱增，而数据被广泛利用的现实与信息数据全面保护的需求间的冲突日渐凸显。笔者拟从非法获取计算机信息系统数据的相关案例，在刑法层面评价网络爬虫技术，并对其提出规制性建议，这在网络信息技术高速发展的时代具有重要意义。</p>\n<p>研究大数据时代爬虫技术是否具备合法性基础的核心问题，是明确信息权益和数据产权的归属。基于数据与信息之间高度关联但又有所区别的特点，极易在概念上造成混淆，进而因权属不明引发争议，因此，有必要厘清数据与信息这一组概念的内涵与外延。</p>\n<p>从信息与数据的概念界分角度出发，数据是信息的具体表现形式，是信息的载体，信息需要经过数据化转变成数据才能存储和运输，用公式化的语言表达也就是——“数据=信息+数据冗余”。②具体而言，以视频数据为例，指的是数字化的视频信息记忆处理、加工视频信息过程中冗余的计算机语言、文字、代码、字符等；而视频信息，指的是视频所反映的可视化内容。③</p>\n<p>将数据进行分类有助于明确数据权益的归属问题。根据数据所承载的信息来源不同，数据可以分为获得数据和形成数据两大类，最通俗的说法就是原始数据和二次加工数据。获得数据是指，数据控制者对信息所有者授权的个人身份信息、系统设备权限、位置权限等相关信息进行数据化记载而产生的数据。此数据为原始数据，系基于信息所有者授权，数据控制者仅享有用户授权范围内的数据自用权，不能脱离授权范围进行利用或者对外再授权。而形成数据是指，数据控制者通过对信息所有者授权的信息进行整理、摘编、储存、分析之后所记载的数据，为二次加工后的数据。例如，美团对于用户储存于平台的购买记录中的消费品类、价格、购买位置等信息进行统计，经过算法加工整理出用户消费喜好的数据。美团对于此类数据享有自用权以及向第三方再授权的权益。</p>\n<p>数据控制者在数据红利的驱使下尽可能的挖掘数据价值，并期待所承载的信息能够充分共享与关联利用，这就是一种对数据进行处分的行为。但对数据进行处分的过程中，所伴随的信息泄露、隐私侵害、数据不当采集、转移与使用乃至数据垄断或数据滥用等弊端，且个人用户也难以分享数据红利，造成了数据运用的广泛外部性，即数据泛化和信息保护的隐秘性需求极具对抗，在实践中不仅会引发民事纠纷，并极有可能涉及刑事犯罪。以非法获取计算机信息系统数据罪为例，在中国裁判文书网检索到的一审裁判文书2018年243篇，2019年244篇、2020年214篇、2021年97篇，均为有罪判决（下图所示）。</p>\n<h3>案例一：上海晟品网络科技有限公司等非法获取计算机信息系统数据案</h3>\n<p>2017年全国首例爬虫行为入罪案——上海晟品网络科技有限公司等非法获取计算机信息系统数据案，此典型案例预示着爬虫行为不仅存在民事违法的可能，已上升到刑事入罪的层面。该案中，上海晟品网络科技有限公司的主管人员，成功破解北京字节跳动公司的防范措施，采用爬虫技术抓取北京字节跳动公司服务器中存储的视频数据，造成北京字节跳动公司损失技术服务费人民币2万元。法院认为，“tt_spider”文件中包含通过头条号视频列表、分类视频列表、相关视频及评论3个接口对今日头条服务器进行数据抓取，并将结果存入到数据库中的逻辑。在数据抓取的过程中使用伪造device_id绕过服务器的身份校验，使用伪造UA及IP绕过服务器的访问频率限制，构成非法获取计算机信息系统数据罪。④</p>\n<p>这种未经许可，未经允许强行突破或者绕过反爬技术，侵入“国家事务、国防建设、极端科学技术领域”之外的计算机信息系统，采用爬虫技术获取该计算机信息系统内部数据的行为，构成我国《刑法》第285条第2款非法获取计算机信息系统数据罪。</p>\n<h3>案例二：易某非法获取计算机信息系统数据、非法控制计算机信息系统案</h3>\n<p>被告人易某从华为公司线缆物控部调任后，未按公司的要求将ＥＲＰ账户线缆类编码物料价格的查询权限清理，违反规定多次通过越权查询、借用同事账号登录的方式在ＥＲＰ系统内获取线缆物料的价格信息。之后，易某发现ＥＲＰ系统中的ＰＯＬ采购小程序存在漏洞，能通过特定操作绕过权限控制查看系统数据，便以此方式获取线缆物料的价格信息。易某将非法获取的价格数据以发短信、打电话、发电子邮件的方式告知深圳市金信诺高新技术股份有限公司（华为技术有限公司的供应商，以下简称金信诺公司），从而帮助金信诺公司在华为公司的招标项目中提高中标率。</p>\n<p>法院认为，该行为符合最高人民检察院公布的第九批指导性案例检例第36号：卫梦龙、龚旭、薛东东非法获取计算
