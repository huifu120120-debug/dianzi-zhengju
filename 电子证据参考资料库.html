*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#eef2f7;color:#1f2a37}

.m-body .ref-render h1{font-size:21px;text-align:center;color:#1e5eb8;margin:8px 0 18px}

<script>
const ITEMS = [{"cat": "电子书", "title": "内存取证的艺术（The Art of Memory Forensics，Wiley · 2014）", "src": "Wiley 出版社 · 英文原著 · 点击直接打开 PDF", "file": "../电子证据知识库/16-电子书/Wiley.The.Art.of.Memory.Forensics.Jul.2014.pdf"},{"cat": "研究解析", "title": "计算机犯罪研究系列（三十一）：计算机犯罪定罪量刑标准（截至2021年9月）", "html": "<div class=\"ref-render\"><h2>计算机犯罪研究系列（三十一）计算机犯罪定罪量刑标准（截至2021年9月）</h2>\n<p>根据刑法第二百八十五条至第二百八十七条规定的关于计算机系列的犯罪，笔者分别从情节严重、情节特别严重、后果严重、后果特别严重及构罪的情形和构罪标准出发，对计算机犯罪定罪量刑标准进行分析和归纳，整理成以下表格，仅供各办案人员、辩护律师和当事人参考。</p>\n<p><strong>01</strong>非法侵入计算机信息系统罪（第二百八十五条第一款）</p>\n<table class=\"tbl\"><tr><td><p>量刑</p></td><td><p>备注</p></td></tr><tr><td><p>三年以下有期徒刑或者拘役</p></td><td><p>违反国家规定，侵入国家事务、国防建设、尖端科学技术领域的计算机信息系统的，处三年以下有期徒刑或者拘役。</p></td></tr></table>\n<p>注：</p>\n<p>对是否属于该条规定的“国家事务、国防建设、尖端科学技术领域的计算机信息系统”、“专门用于侵入、非法控制计算机信息系统的程序、工具”难以确定的，应当委托省级以上负责计算机信息系统安全保护管理工作的部门检验。司法机关根据检验结论，并结合案件具体情况认定。</p>\n<p><strong>02</strong>非法获取计算机信息系统数据罪、非法控制计算机信息系统罪（第二百八十五条第二款）</p>\n<table class=\"tbl\"><tr><td><p>序号</p></td><td><p>情节严重</p></td><td><p>情节特别严重</p></td></tr><tr><td><p>1</p></td><td><p>获取支付结算、证券交易、期货交易等网络金融服务的身份认证信息10组以上的</p></td><td><p>获取支付结算、证券交易、期货交易等网络金融服务的身份认证信息50组以上的</p></td></tr><tr><td><p>2</p></td><td><p>获取第（一）项以外的身份认证信息500组以上的</p></td><td><p>获取前款规定以外的身份认证信息2500组以上的</p></td></tr><tr><td><p>3</p></td><td><p>非法控制计算机信息系统20台以上的</p></td><td><p>非法控制计算机信息系统100台以上的</p></td></tr><tr><td><p>4</p></td><td><p>违法所得5000元以上或者造成经济损失1万元以上的</p></td><td><p>违法所得25000元以上或者造成经济损失5万元以上的</p></td></tr><tr><td><p>5</p></td><td><p>其他情节严重的情形</p></td><td><p>其他情节特别严重的情形</p></td></tr><tr><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②情节特别严重：三年以上七年以下有期徒刑，并处罚金</p></td><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②情节特别严重：三年以上七年以下有期徒刑，并处罚金</p></td><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②情节特别严重：三年以上七年以下有期徒刑，并处罚金</p></td></tr></table>\n<p>注：</p>\n<p>1.“身份认证信息”是指用于确认用户在计算机信息系统上操作权限的数据，包括账号、口令、密码、数字证书等。</p>\n<p>2.“计算机信息系统”、“计算机系统”，是指具备自动处理数据功能的系统，包括计算机、网络设备、通信设备、自动化控制设备等。</p>\n<p>3.本解释所称“经济损失”，包括危害计算机信息系统犯罪行为给用户直接造成的经济损失，以及用户为恢复数据、功能而支出的必要费用。</p>\n<p><strong>03</strong>提供侵入、非法控制计算机信息系统程序、工具罪（第二百八十五条第三款）</p>\n<table class=\"tbl\"><tr><td><p>序号</p></td><td><p>情节严重</p></td><td><p>情节特别严重</p></td></tr><tr><td><p>1</p></td><td><p>提供能够用于非法获取支付结算、证券交易、期货交易等网络金融服务身份认证信息的专门性程序、工具5人次以上的</p></td><td><p>提供能够用于非法获取支付结算、证券交易、期货交易等网络金融服务身份认证信息的专门性程序、工具25人次以上的</p></td></tr><tr><td><p>2</p></td><td><p>提供第（一）项以外的专门用于侵入、非法控制计算机信息系统的程序、工具20人次以上的</p></td><td><p>提供第（一）项以外的专门用于侵入、非法控制计算机信息系统的程序、工具100人次以上的</p></td></tr><tr><td><p>3</p></td><td><p>明知他人实施非法获取支付结算、证券交易、期货交易等网络金融服务身份认证信息的违法犯罪行为而为其提供程序、工具5人次以上的</p></td><td><p>明知他人实施非法获取支付结算、证券交易、期货交易等网络金融服务身份认证信息的违法犯罪行为而为其提供程序、工具25人次以上的</p></td></tr><tr><td><p>4</p></td><td><p>明知他人实施第（三）项以外的侵入、非法控制计算机信息系统的违法犯罪行为而为其提供程序、工具20人次以上的</p></td><td><p>明知他人实施第（三）项以外的侵入、非法控制计算机信息系统的违法犯罪行为而为其提供程序、工具100人次以上的</p></td></tr><tr><td><p>5</p></td><td><p>违法所得5000元以上或者造成经济损失1万元以上的</p></td><td><p>违法所得25000元以上或者造成经济损失5万元以上的</p></td></tr><tr><td><p>6</p></td><td><p>其他情节严重的情形</p></td><td><p>其他情节特别严重的情形</p></td></tr><tr><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②情节特别严重：三年以上七年以下有期徒刑，并处罚金</p><p>③单位犯第二百八十五条规定的三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照各该款的规定处罚</p></td><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②情节特别严重：三年以上七年以下有期徒刑，并处罚金</p><p>③单位犯第二百八十五条规定的三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照各该款的规定处罚</p></td><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②情节特别严重：三年以上七年以下有期徒刑，并处罚金</p><p>③单位犯第二百八十五条规定的三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照各该款的规定处罚</p></td></tr></table>\n<p><strong>04</strong>破坏计算机信息系统罪（第二百八十六条）</p>\n<p>本罪共有三款，分别规定如下：</p>\n<p><strong>第二百八十六条第一款</strong> 违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，后果严重的，处五年以下有期徒刑或者拘役；后果特别严重的，处五年以上有期徒刑。</p>\n<p><strong>第二百八十六条第二款</strong> 违反国家规定，对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，后果严重的，依照前款的规定处罚。</p>\n<p><strong>第二百八十六条第三款</strong> 故意制作、传播计算机病毒等破坏性程序，影响计算机系统正常运行，后果严重的，依照第一款的规定处罚。</p>\n<p>笔者根据以上三款情形分别整理如下：</p>\n<p>4.1第二百八十六条第一款和第二款</p>\n<table class=\"tbl\"><tr><td><p>序号</p></td><td><p>后果严重</p></td><td><p>后果特别严重</p></td></tr><tr><td><p>1</p></td><td><p>造成10台以上计算机信息系统的主要软件或者硬件不能正常运行的</p></td><td><p>造成50台以上计算机信息系统的主要软件或者硬件不能正常运行的</p></td></tr><tr><td><p>2</p></td><td><p>对20台以上计算机信息系统中存储、处理或者传输的数据进行删除、修改、增加操作的</p></td><td><p>对100台以上计算机信息系统中存储、处理或者传输的数据进行删除、修改、增加操作的</p></td></tr><tr><td><p>3</p></td><td><p>违法所得5000元以上或者造成经济损失1万元以上的</p></td><td><p>违法所得25000元以上或者造成经济损失5万元以上的</p></td></tr><tr><td><p>4</p></td><td><p>造成为100台以上计算机信息系统提供域名解析、身份认证、计费等基础服务或者为1万元以上用户提供服务的计算机信息系统不能正常运行累计1小时以上</p></td><td><p>造成为500台以上计算机信息系统提供域名解析、身份认证、计费等基础服务或者为5万元以上用户提供服务的计算机信息系统不能正常运行累计5小时以上</p></td></tr><tr><td><p>5</p></td><td><p>造成其他严重后果的</p></td><td><p>造成其他特别严重后果的</p></td></tr><tr><td><p>量刑：</p><p>①后果严重：五年以下有期徒刑或者拘役</p><p>②后果特别严重：五年以上有期徒刑</p><p>③单位犯前三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p></td><td><p>量刑：</p><p>①后果严重：五年以下有期徒刑或者拘役</p><p>②后果特别严重：五年以上有期徒刑</p><p>③单位犯前三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p></td><td><p>量刑：</p><p>①后果严重：五年以下有期徒刑或者拘役</p><p>②后果特别严重：五年以上有期徒刑</p><p>③单位犯前三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p></td></tr></table>\n<p>4.2第二百八十六条第三款</p>\n<table class=\"tbl\"><tr><td><p>序号</p></td><td><p>后果严重</p></td><td><p>后果特别严重</p></td></tr><tr><td><p>1</p></td><td><p>制作、提供、传输能够通过网络、存储介质、文件等媒介，将自身的部分、全部或者变种进行复制、传播，并破坏计算机系统功能、数据或者应用程序，导致该程序通过网络、存储介质、文件等媒介传播的</p></td><td><p>制作、提供、传输能够通过网络、存储介质、文件等媒介，将自身的部分、全部或者变种进行复制、传播，并破坏计算机系统功能、数据或者应用程序，导致该程序通过网络、存储介质、文件等媒介传播，致使生产、生活受到严重影响或者造成恶劣社会影响的</p></td></tr><tr><td><p>2</p></td><td><p>造成20台以上计算机系统被植入能够在预先设定条件下自动触发，并破坏计算机系统功能、数据或者应用程序的或其他专门设计用于破坏计算机系统功能、数据或者应用程序的程序</p></td><td><p>造成100台以上计算机系统被植入能够在预先设定条件下自动触发，并破坏计算机系统功能、数据或者应用程序的或其他专门设计用于破坏计算机系统功能、数据或者应用程序的程序</p></td></tr><tr><td><p>3</p></td><td><p>提供计算机病毒等破坏性程序10人次以上</p></td><td><p>提供计算机病毒等破坏性程序50人次以上</p></td></tr><tr><td><p>4</p></td><td><p>违法所得5000元以上或者造成经济损失1万元以上的</p></td><td><p>违法所得25000元以上或者造成经济损失5万元以上的</p></td></tr><tr><td><p>5</p></td><td><p>造成其他严重后果的</p></td><td><p>造成其他特别严重后果的</p></td></tr><tr><td><p>量刑：</p><p>①后果严重：五年以下有期徒刑或者拘役</p><p>②后果特别严重：五年以上有期徒刑</p><p>③单位犯前三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p></td><td><p>量刑：</p><p>①后果严重：五年以下有期徒刑或者拘役</p><p>②后果特别严重：五年以上有期徒刑</p><p>③单位犯前三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p></td><td><p>量刑：</p><p>①后果严重：五年以下有期徒刑或者拘役</p><p>②后果特别严重：五年以上有期徒刑</p><p>③单位犯前三款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p></td></tr></table>\n<p><strong>05</strong>拒不履行信息网络安全管理义务罪（第二百八十六条之一）</p>\n<p>网络服务提供者拒不履行法律、行政法规规定的信息网络安全管理义务，经监管部门责令采取改正措施而拒不改正，有下列情形之一且情节达到相应构罪标准的，则构成该罪。</p>\n<table class=\"tbl\"><tr><td><p>序号</p></td><td><p>构罪情形</p></td><td><p>构罪标准</p></td></tr><tr><td><p>1</p></td><td><p>致使违法信息大量传播的</p></td><td><p>致使违法信息大量传播：</p><p>（一）致使传播违法视频文件200个以上的；</p><p>（二）致使传播违法视频文件以外的其他违法信息2000个以上的；</p><p>（三）致使传播违法信息，数量虽未达到第一项、第二项规定标准，但是按相应比例折算合计达到有关数量标准的；</p><p>（四）致使向2000个以上用户账号传播违法信息的；</p><p>（五）致使利用群组成员账号数累计3000以上的通讯群组或者关注人员账号数累计3万以上的社交网络传播违法信息的；</p><p>（六）致使违法信息实际被点击数达到5万以上的；</p><p>（七）其他致使违法信息大量传播的情形。</p></td></tr><tr><td><p>2</p></td><td><p>致使用户信息泄露，造成严重后果</p></td><td><p>造成严重后果：</p><p>（一）致使泄露行踪轨迹信息、通信内容、征信信息、财产信息500条以上的；</p><p>（二）致使泄露住宿信息、通信记录、健康生理信息、交易信息等其他可能影响人身、财产安全的用户信息5000条以上的；</p><p>（三）致使泄露第一项、第二项规定以外的用户信息5万条以上的；</p><p>（四）数量虽未达到第一项至第三项规定标准，但是按相应比例折算合计达到有关数量标准的；</p><p>（五）造成他人死亡、重伤、精神失常或者被绑架等严重后果的；</p><p>（六）造成重大经济损失的；</p><p>（七）严重扰乱社会秩序的；</p><p>（八）造成其他严重后果的。</p></td></tr><tr><td><p>3</p></td><td><p>致使刑事案件证据灭失，情节严重的</p></td><td><p>情节严重：</p><p>（一）造成危害国家安全犯罪、恐怖活动犯罪、黑社会性质组织犯罪、贪污贿赂犯罪案件的证据灭失的；</p><p>（二）造成可能判处五年有期徒刑以上刑罚犯罪案件的证据灭失的；</p><p>（三）多次造成刑事案件证据灭失的；</p><p>（四）致使刑事诉讼程序受到严重影响的；</p><p>（五）其他情节严重的情形。</p></td></tr><tr><td><p>4</p></td><td><p>有其他严重情节的</p></td><td><p>有其他严重情节：</p><p>（一）对绝大多数用户日志未留存或者未落实真实身份信息认证义务的；</p><p>（二）二年内经多次责令改正拒不改正的；</p><p>（三）致使信息网络服务被主要用于违法犯罪的；</p><p>（四）致使信息网络服务、网络设施被用于实施网络攻击，严重影响生产、生活的；</p><p>（五）致使信息网络服务被用于实施危害国家安全犯罪、恐怖活动犯罪、黑社会性质组织犯罪、贪污贿赂犯罪或者其他重大犯罪的；</p><p>（六）致使国家机关或者通信、能源、交通、水利、金融、教育、医疗等领域提供公共服务的信息网络受到破坏，严重影响生产、生活的；</p><p>（七）其他严重违反信息网络安全管理义务的情形。</p></td></tr><tr><td><p>量刑：</p><p>①有以上情形之一的：三年以下有期徒刑、拘役或者管制，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照前款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td><td><p>量刑：</p><p>①有以上情形之一的：三年以下有期徒刑、拘役或者管制，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照前款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td><td><p>量刑：</p><p>①有以上情形之一的：三年以下有期徒刑、拘役或者管制，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照前款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td></tr></table>\n<p><strong>06</strong>非法利用信息网络罪（第二百八十七条）</p>\n<table class=\"tbl\"><tr><td><p>序号</p></td><td><p>情节严重</p></td><td><p>构罪情形</p></td></tr><tr><td><p>1</p></td><td><p>假冒国家机关、金融机构名义，设立用于实施违法犯罪活动的网站的</p></td><td><p>（一）设立用于实施诈骗、传授犯罪方法、制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组的；</p><p>（二）发布有关制作或者销售毒品、枪支、淫秽物品等违禁物品、管制物品或者其他违法犯罪信息的；</p><p>（三）为实施诈骗等违法犯罪活动发布信息的。</p></td></tr><tr><td><p>2</p></td><td><p>设立用于实施违法犯罪活动的网站，数量达到3个以上或者注册账号数累计达到2000以上的</p></td><td><p>（一）设立用于实施诈骗、传授犯罪方法、制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组的；</p><p>（二）发布有关制作或者销售毒品、枪支、淫秽物品等违禁物品、管制物品或者其他违法犯罪信息的；</p><p>（三）为实施诈骗等违法犯罪活动发布信息的。</p></td></tr><tr><td><p>3</p></td><td><p>设立用于实施违法犯罪活动的通讯群组，数量达到5个以上或者群组成员账号数累计达到1000以上的；</p></td><td><p>（一）设立用于实施诈骗、传授犯罪方法、制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组的；</p><p>（二）发布有关制作或者销售毒品、枪支、淫秽物品等违禁物品、管制物品或者其他违法犯罪信息的；</p><p>（三）为实施诈骗等违法犯罪活动发布信息的。</p></td></tr><tr><td><p>4</p></td><td><p>发布有关违法犯罪的信息或者为实施违法犯罪活动发布信息，具有下列情形之一的：</p><p>1.在网站上发布有关信息100条以上的；</p><p>2.向2000个以上用户账号发送有关信息的；</p><p>3.向群组成员数累计达到3000以上的通讯群组发送有关信息的；</p><p>4.利用关注人员账号数累计达到3万以上的社交网络传播有关信息的；</p></td><td><p>（一）设立用于实施诈骗、传授犯罪方法、制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组的；</p><p>（二）发布有关制作或者销售毒品、枪支、淫秽物品等违禁物品、管制物品或者其他违法犯罪信息的；</p><p>（三）为实施诈骗等违法犯罪活动发布信息的。</p></td></tr><tr><td><p>5</p></td><td><p>违法所得1万元以上</p></td><td><p>（一）设立用于实施诈骗、传授犯罪方法、制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组的；</p><p>（二）发布有关制作或者销售毒品、枪支、淫秽物品等违禁物品、管制物品或者其他违法犯罪信息的；</p><p>（三）为实施诈骗等违法犯罪活动发布信息的。</p></td></tr><tr><td><p>6</p></td><td><p>二年内曾因非法利用信息网络、帮助信息网络犯罪活动、危害计算机信息系统安全受过行政处罚，又非法利用信息网络的</p></td><td><p>（一）设立用于实施诈骗、传授犯罪方法、制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组的；</p><p>（二）发布有关制作或者销售毒品、枪支、淫秽物品等违禁物品、管制物品或者其他违法犯罪信息的；</p><p>（三）为实施诈骗等违法犯罪活动发布信息的。</p></td></tr><tr><td><p>7</p></td><td><p>其他情节严重的情形</p></td><td><p>（一）设立用于实施诈骗、传授犯罪方法、制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组的；</p><p>（二）发布有关制作或者销售毒品、枪支、淫秽物品等违禁物品、管制物品或者其他违法犯罪信息的；</p><p>（三）为实施诈骗等违法犯罪活动发布信息的。</p></td></tr><tr><td><p>量刑：</p><p>①有以上情形之一的：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td><td><p>量刑：</p><p>①有以上情形之一的：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td><td><p>量刑：</p><p>①有以上情形之一的：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td></tr></table>\n<p><strong>07</strong>帮助信息网络犯罪活动罪（第<strong>网络</strong><strong>爬虫</strong></p>\n<p>条之二）</p>\n<table class=\"tbl\"><tr><td><p>序号</p></td><td><p>情节严重</p></td><td><p>构罪情形</p></td></tr><tr><td><p>1</p></td><td><p>为3个以上对象提供帮助的</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>2</p></td><td><p>支付结算金额20万元以上的</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>3</p></td><td><p>以投放广告等方式提供资金5万元以上的</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>4</p></td><td><p>违法所得1万元以上的</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>5</p></td><td><p>二年内曾因非法利用信息网络、帮助信息网络犯罪活动、危害计算机信息系统安全受过行政处罚，又帮助信息网络犯罪活动的</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>6</p></td><td><p>被帮助对象实施的犯罪造成严重后果的</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>7</p></td><td><p>其他情节严重的情形</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>8</p></td><td><p>实施前款规定的行为，确因客观条件限制无法查证被帮助对象是否达到犯罪的程度，但相关数额总计达到前款第二项至第四项规定标准五倍以上，或者造成特别严重后果的，应当以帮助信息网络犯罪活动罪追究行为人的刑事责任。</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>9</p></td><td><p>收购、出售、出租信用卡、银行账户、非银行支付账户、具有支付结算功能的互联网账号密码、网络支付接口、网上银行数字证书5张（个）以上的</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>10</p></td><td><p>收购、出售、出租他人手机卡、流量卡、物联网卡20张以上的</p></td><td><p>明知他人利用信息网络实施犯罪，为其犯罪提供互联网接入、服务器托管、网络存储、通讯传输等技术支持，或者提供广告推广、支付结算等帮助</p></td></tr><tr><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td><td><p>量刑：</p><p>①情节严重：三年以下有期徒刑或者拘役，并处或者单处罚金</p><p>②单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照第一款的规定处罚</p><p>③有前两款行为，同时构成其他犯罪的，依照处罚较重的规定定罪处罚</p></td></tr></table></div>", "src": "《计算机犯罪》合集提取"}, {"cat": "研究解析", "title": "计算机犯罪研究系列（二十二）", "html": "<div class=\"ref-render\"><h2>计算机犯罪研究系列（二十二）</h2>\n<p>利用爬虫技术获取网络公开信息涉嫌非法获取计算机信息系统数据罪的辩护要点</p>\n<p>网络爬虫是按照一定规则，自动抓取网络信息的程序或者脚本。网络的发展，使得许多网站经营者出于各种目的对爬虫的态度存在禁止爬取或者欢迎爬取的两种截然相反的态度。这就使得确定爬虫技术使用的边界和如何正确认定爬虫技术使用者的刑事责任成为该领域绕不开的话题。</p>\n<p>生活中也存在一些与普通大众的“常识”相违背的边界，举例而言，某短视频app的视频向其app的注册用户免费开放，注册用户在观看数量、次数等方面均没有限制，该app的短视频等信息处于公开的状态。那么利用爬虫技术爬取该部分“公开视频”的行为是否具有刑事风险呢？如果有的话，是否构成非法获取计算机信息系统数据罪？</p>\n<p>答案是的确可能涉嫌非法获取计算机信息系统数据罪。</p>\n<p>原因在于，网络公开信息不代表数据公开，获取网络公开信息和获取数据是两个不同概念。如果行为人通过“侵入”的方式“获取”“数据”，自然是属于非法获取计算机信息系统数据罪禁止的范畴。</p>\n<p>如果将合法的爬取行为错误定性为非法获取计算机信息系统数据罪，势必会侵犯该行业从业者的合法权益。为了避免此种情形发生，本律师将与爬虫爬取网络公开信息行为定性相关的几个要点阐述如下：</p>\n<p>1.考察爬取行为是否获得了被爬取者的合法授权</p>\n<p>是否具有合法授权，需要考虑到“反爬虫”技术或措施。如果爬取者通过技术或其他手段突破或避开了“反爬虫”技术或措施，就可以判断该爬取行为是超越了被爬取者的合法授权的。</p>\n<p>正是因为存在一些网站经营者不希望自己的网页信息被爬虫提取，或者并不希望自己所有的所有信息均会被提取，才会产生“反爬虫”的技术需求。</p>\n<p>常见的“反爬虫”技术主要包括robots协议、User-Agent、JS脚本，但是也包括一些经营者对端口、接口的禁止或限制访问等措施。</p>\n<p>在前文所列举例子中，如果爬取者在爬取时已经发现了被爬取者采取了“反爬虫”技术，比如明确禁止爬取视频网页，那么就不能对该app中的视频信息进行爬取。</p>\n<p>实务中，考察是否允许爬取部分或全部信息的“合法授权”主要体现在两个方面，一个是被爬取公司制定并公布的《用户协议》，一个是在计算机信息系统中所设置的《robots.txt协议》。经营者一般都会从这两个方面来确定爬虫技术的授权范围，即确定哪些属于允许爬取的部分，哪些属于不被允许的爬取范围。按照爬虫技术正确的运行机制，爬取之前应该访问检查根目录之下是否存在《robots.txt协议》，然后按照该协议中的允许范围进行爬取。 </p>\n<p>2.考察爬取行为是否“获取”了非法获取计算机信息系统数据中规定的“数据”</p>\n<p>何种情形下属于“数据”？</p>\n<p>关于这一点，有个前提需要明确，爬取信息不代表爬取数据，信息和数据是两个不同的概念。因此，爬取公开信息是否具有刑事风险的关键不在于该信息是否属于网络“公开信息”，而应考察爬取行为是否爬取了数据。</p>\n<p>事实上，数据是反映客观事物属性的记录，是信息的一种表现形式。信息是数据经过加工之后的产物，主要是指信息需要经过数字化转变成数据才能存储和传输。我们日常生活中在上传下载视频时，传输的本质上是视频数据，该视频数据指的是数字化的视频信息以及处理、加工视频信息过程中冗余的计算机语言、文字、代码、字符等。</p>\n<p>回归到前文提到的例子，某短视频app允许注册用户播放观看的只是视频信息而非视频数据，也就是说该app所公开的只是视频信息而非视频数据。</p>\n<p>何种情形下属于“获取”？</p>\n<p> “获取”是指行为人对数据进行复制和创建的行为，如果行为人只是得到了信息但是没有获取数据，则不能理解为非法获取计算机信息系统数据罪中所要求的“获取”。</p>\n<p>那么，可以分析发现，在某短视频app中，如果通过技术设置禁止他人下载复制视频，一般意味着该公司对视频数据采取了技术保护措施，而爬取者通过各种手段突破该技术保护措施后下载视频数据的行为则属于“获取”数据。而如果该app允许用户复制或者下载，则意味着视频数据的公开，爬取者通过爬虫程序爬取该部分数据的行为自然不属于非法“获取”数据。</p>\n<p>3. 考察爬取行为是否属于“侵入”行为</p>\n<p>按照非法获取计算机信息系统数据的规定，构成该罪要求具有“侵入”、“获取”、“数据”等特征，所谓侵入就是违背反爬者的意愿进入他人计算机信息系统的行为，该行为不仅仅包含了利用技术手段也包括了未经过他人同意或者授权进入他人计算机信息系统的行为。</p>\n<p>后者主要是指通过各种手段获取他们计算机信息系统账号和密码进行登录的行为。</p>\n<p>在考察是否存在“侵入”行为的时候，主要考察行为人进入他人的计算机信息系统是否是正常的路径，如果在进入的过程中存在利用技术等手段欺骗、绕过、避开、突破的方式则容易被认定的确存在“侵入”的行为。还是以某短视频app为例，如果该短视频app的经营者在技术设置上只允许app注册用户登录和访问视频数据，“侵入”行为人就存在利用技术手段“欺骗”该视频app服务器身份认证技术的可能，只有这样才能符合短视频app的技术设置进而可以实现对该短视频app视频数据库的访问进而获得视频数据。</p>\n<p>要判断该视频数据是否属于公开的可以爬取的范围，就需要参考前文提及的第一点即考察爬取行为是否获得了被爬取者的合法授权。</p>\n<p>由此可以得出结论，如果爬取者没有采用“侵入”的方式超越合法授权的范围爬取“数据”，则不能认定涉嫌非法获取计算机信息系统数据罪，反之则构成该罪。</p>\n<p>关于爬虫的技术原理可以参照本律师撰写的《》一文。</p></div>", "src": "《计算机犯罪》合集提取"}, {"cat": "研究解析", "title": "计算机犯罪研究系列（一）：网络爬虫技术的刑事风险", "html": "<div class=\"ref-render\"><h2>计算机犯罪研究系列（一）网络爬虫技术的刑事风险一、什么是网络爬虫？</h2>\n<p>要认识到网络爬虫的刑事风险，首先需要理解什么是网络爬虫。</p>\n<p>什么是网络爬虫？所谓网络爬虫也称为爬虫（Crawler），本质上是一种程序，该程序运行的逻辑流程包括：数据请求、数据处理、数据存储等三个环节，运行该程序的目的在于使用人通过该程序的运行自动收集并保存网络上符合特定要求的信息。</p>\n<p>可以说，在目前的大数据风控行业，一切的产品开发均与该项技术存在或多或少的联系，为了更为清晰地理解爬虫技术的概念，本律师首先对该技术的逻辑流程绘制了一个清晰的图表：</p>\n<p>从上图可以看出，爬虫的运行本质上是获取数据。整个流程类似于个人利用浏览器搜索信息的过程。爬虫的数据收集过程虽然与个人的上网行为类似但又有不同。爬虫的“上网”过程类似于从虚拟浏览器发送请求(获取网页代码)-&gt;提取有用的数据-&gt;存放于数据库或文件中。</p>\n<p>爬虫技术存在的刑事风险就是存在于上面的数据获取和保存的过程中。本律师结合自己的实务经验针对爬虫技术包含的刑事风险予以总结，具体如下：</p>\n<p>二、与数据来源有关的刑事风险</p>\n<p>利用爬虫技术获取数据的行为可能涉嫌非法获取计算机信息系统数据罪</p>\n<p>爬虫技术的使用过程中，如果所爬取的是公开的网络信息，利用爬虫技术获得的该部分数据行为则不存在违法犯罪的刑事风险。但是如果爬取的数据是经过他人“加密”或者需要“授权”的数据时则存在涉嫌构成非法获取计算机信息系统数据罪的刑事风险。</p>\n<p>该种行为的风险在于爬虫技术使用了“侵入”的方法进入他人的计算机信息系统来获取数据。这种行为表现为破解或绕开了他人的“反爬虫技术”，因为正常的数据抓取行为是无法抓取到他人采取了“反爬虫技术”措施予以防御的数据的。以（2017）京0108刑初2384号《刑事判决书》为例，在该案中被告人宋健、侯明强等人正是利用爬虫“tt_spider”技术来对被害单位的数据库中的视频数据进行抓取。在该《一审判决书》的“本院查明”部分法院明确指出了被告人爬虫技术的“侵入”行为的具体表现：“在数据抓取的过程中使用伪造device_id绕过服务器的身份校验，使用伪造UA及IP绕过服务器的访问频率限制。”该部分内容表明了视频数据的获取需要经过被害人所设置的身份校验和频率限制等技术，该部分技术就是所谓的“反爬虫技术”，也是被害人对所拥有的数据所采取的技术防御手段。案件中的被告人则不顾该类技术保护措施，采用技术手段来破解或避开进而获取他人服务器中保存的视频数据，属于比较典型的侵入他人计算机信息系统获取数据的行为。</p>\n<p>三、与数据使用有关的刑事风险</p>\n<p>既然利用爬虫非法获取数据存在刑事风险，那么经过合法爬虫技术手段获取的数据是否存在刑事风险呢？答案：同样存在风险。</p>\n<p>（一）涉嫌构成侵犯公民个人信息罪的刑事风险</p>\n<p>在这类刑事风险中，常见的是涉案人员或公司利用爬虫技术超越客户授权范围收集公民个人信息后转卖或提供给他人的行为。该类行为涉嫌构成侵犯公民个人信息罪，而且在不超越用户权限的情形下所获得的公民个人信息的转卖和提供行为同样也存在构成侵犯公民个人信息罪的刑事风险。</p>\n<p>在超越用户权限获取信息的情形中，以主要用于网络贷款平台的“同业爬虫”为例，只要提供一个用户在现金贷平台的用户名和密码，“同业爬虫”就可以爬取到用户的基本信息、银行卡信息、职业、联系人、贷款记录、理财信息等与公民个人密切相关的数据。</p>\n<p>以上爬取公民个人信息的行为，往往是超越了用户的授权范围，一般而言用户所授权的信息仅仅是个人所提供的账户和密码，而非更进一步的信息，但是这种超越用户授权的行为并非只能认定具有刑事风险。</p>\n<p>超越用户权限收集公民个人信息的行为首先面临的责任并非刑事责任，其首先面对的是“治安管理处罚”层面的责任或民事责任。在以上行为中，如果爬虫使用者是在提供网络服务的业务活动中收集、使用公民个人信息，那么应该遵守的原则是全国人大常委会《关于加强网络信息保护的决定》的规定中规定的“合法、正当、必要的原则”，而且在获取“授权”范围的时候，一定要对收集、使用信息的“目的、方式、范围”予以明确。避免出现超越权限收集公民个人信息的情形和因为是否超越权限而引发的纠纷。</p>\n<p>什么情形下会产生刑事风险呢？按照我国《刑法》第二百五十三条之一中关于侵犯公民个人信息罪的规定：“违反国家有关规定，将在履行职责或者提供服务过程中获得的公民个人信息，出售或者提供给他人的，依照前款的规定从重处罚。”也就是说在用爬虫技术获取公民个人信息后出售或提供给他人使用的行为才可能涉嫌构成侵犯公民个人信息罪。</p>\n<p>综上，利用爬虫技术所获得的数据如果超越了用户的授权，那么首先承担的是“治安管理处罚”层面的责任，但是如果将该类数据（不论超越权限与否）出售或提供给他人的行为则可能涉嫌侵犯公民个人信息。</p>\n<p>（二）涉嫌构成“套路贷”相关犯罪的刑事风险</p>\n<p>这个类型的刑事风险主要源于一些大数据风控公司所开发的“运营商爬虫”产品。该种爬虫运行所获得的数据主要是跟用户手机业务有关的数据，即可以抓取一些手机卡过往使用情况的信息，包括使用时长、常用联系人、套餐信息等，以此验证机主的真实性来做风控，主要用于网络贷款平台中的反欺诈。按道理这部分业务属于风控业务，只要获得用户授权本不存在刑事风险，但是如果将该类数据提供或出售给他人使用则会产生风险。</p>\n<p>在“套路贷”的犯罪团伙中，采取强收“斩头息”、虚增借款金额、制造虚假银行流水、转单平帐、罚息或强收违约金等所谓“行规”套路，非法占有被害人房产等。在债务人陷入“套路贷”骗局后如果无力“还款”，如何保证“债务”的催收，就成了整个套路贷犯罪中的关键一环。那么如果债务人失去联系更换电话号码，寻找到债务人的需求就产生了利用爬虫技术的空间和土壤。</p>\n<p>在实务中，大数据风控公司与套路贷的人员产生联系的方式主要有两种：</p>\n<p>第一种，作为技术转让方，将爬虫技术转让给网贷平台，由网贷平台利用该爬虫技术自行获得债务人的常用联系人信息进行“爆通讯录”“电话滋扰”等方式的催收。</p>\n<p>第二种，作为技术合作方，直接利用爬虫技术提供“查询”服务。</p>\n<p>无论是第一种还是第二种方式，存在的刑事风险在于，如果爬虫技术转让方或者合作方均“明知”网贷平台会将该技术用于“套路贷”等犯罪活动，则依照《关于办理“套路贷”刑事案件若干问题的意见》的规定有被按照“套路贷”相关犯罪的共同犯罪的可能（与本文相关的罪名主要是诈骗罪、敲诈勒索罪）。</p>\n<p>但是值得注意的是，并非所有的爬虫技术转让方和合作方（以下统称爬虫技术方）均会被认定构成“套路贷”犯罪的共同犯罪。提出这一观点原因在于，一但在“套路贷”案件中认定爬虫技术方“明知”，那么爬虫技术方更为常见的是被认定为诈骗罪的共同犯罪。考虑到“套路贷”犯罪中的诈骗金额往往数额特别巨大，如果按照诈骗罪的量刑规定，爬虫技术方所面临的量刑幅度往往是“十年以上有期徒刑”。这一结果对于只是技术提供者而并未实际参与诈骗活动的爬虫技术方而言，所承担的责任过于严苛。事实上，只要爬虫技术方提供技术的行为，被认定为不明知他人利用该部分爬虫技术实施“套路贷”犯罪，那么该爬虫技术者的行为有很大可能被认定为帮助信息网络犯罪活动罪。而能否实现这一罪名的转变与“明知”与否能否被认定至关重要。</p>\n<p>因此，在实务中辩护律师如何综合在案证据结合爬虫技术方的“认知能力”“既往经历”“行为次数”“手段”“与同案人”“被害人的关系”“获利情况”“是否主观规避查处”等主客观要素综合评估爬虫技术方的“主观”方面是否“明知”是决定案件定性的关键。</p>\n<p>本文是车冲律师根据为爬虫技术方提供法律服务期间所形成的工作成果的实务总结，希望对爬虫技术方的刑事风险的规避提供借鉴。</p>\n<p>随着网游的迅速发展，销售游戏外挂涉刑的案件也日益增多，但对于该行为应适用何种罪名在司法实务中存在较大争议，有的观点认为游戏外挂是一种破坏性程序，销售游戏外挂的行为应当以破坏计算机信息系统罪予以处罚。根据我国《刑法》第286条的规定，破坏计算机信息系统罪最高可判处十五年有期徒刑，相较于计算机犯罪类其他罪名，该罪名是重罪。</p>\n<p>从辩护的角度而言，律师办理销售外挂被控破坏计算机信息系统罪的案件，打掉破坏计算机信息系统罪的指控是常用且实用的辩护策略。</p>\n<p>结合法律法规和办理相关案件的实务经验，笔者认为办理此类案件争取打掉破坏计算机信息系统罪的指控，可从以下两方面入手：第一，外挂的使用没有造成游戏的不能正常运行。《刑法》第二百八十六条第一款所规定的破坏计算机信息系统罪要求通过破坏行为（对功能进行删除、修改、增加、干扰）使计算机信息系统中的软件、硬件即相关配套设备发生故障，造成计算机信息系统不能正常运行。从外挂的运行原理来看，不管是键盘鼠标模拟器辅助性外挂、内挂抓包等修改数据流的外挂，还是更高级的HOOK挂钩，都只是对游戏客户端、数据包、服务器之一施加影响，并不会干扰游戏的正常运行。具体来说，键盘鼠标模拟器辅助性外挂相当于“游戏代练”，本质上是将大量繁琐和重复的游戏动作使用外挂自动完成，在功能上不会突破网络游戏原有设定的规则，在技术实现方式上，它并不会修改、伪造服务器传输中的数据包。至于修改数据流的外挂或者HOOK挂钩，通常都不会造成计算机信息系统不能正常运行。对于未造成系统功能实质性破坏或者不能正常运行的，根据最高人民法院指导案例145号张竣杰等非法控制计算机信息系统案的观点，不应当认定为破坏计算机信息系统罪。司法实务中，以破坏计算机信息系统罪提起公诉的游戏外挂案件，被改判其他罪名的主要理由集中在“外挂是否干扰游戏功能”上，比如成都侠义道游戏外挂案等。第二，行为人所造成的经济损失是否达到入罪标准。根据《刑法》第286条的规定，构成破坏计算机信息系统罪要求满足“后果严重”这一条件，而“后果严重”的标准，则规定在2011年最高检、最高院实施的《关于办理危害计算机信息系统安全形势案件应用法律若干问题的解释》（下称《解释》）第四条中，《解释》列举了五项标准，其中与外挂类案件有关的是第三项“违法所得5000元以上或者造成经济损失1万元以上的”。这里的“经济损失”，根据《解释》第十一条的规定，只包含“危害计算机信息系统犯罪行为给用户直接造成的经济损失，以及用户为恢复数据、功能而支出的必要费用”，这就意味着间接利益损失和可期待利益损失并不属于该罪“经济损失”的范畴。因此，律师办理此类案件时，可从“经济损失”入手，判断在案证据能否证明行为人是否达到“后果严重”的入罪标准，以此寻找辩护空间。综上，笔者认为销售游戏外挂的行为不构成破坏计算机信息系统罪，但不代表该行为不触犯刑律，律师办理此类案件可进行轻罪辩护，争取改判为量刑较轻的提供侵入、非法控制计算机信息系统的程序罪或侵犯著作权罪，为当事人争取最大化的合法权益。</p>\n<h2>典型案例|“网络爬虫”企业合规第一案</h2>\n<h3>Part 1基本案情</h3>\n<p>     上海Z网络科技有限公司（以下简称“Z公司”）成立于2016年1月，系一家为本地商户提供数字化转型服务的互联网大数据公司。Z公司现有员工1000余人，年纳税总额1000余万元，已帮助2万余家商户完成数字化转型，拥有计算机软件著作权10余件，2020年被评定为高新技术企业。被不起诉人陈某某、汤某某、王某某等人分别系该公司首席技术官、核心技术人员。</p>\n<p>     2019年至2020年，在未经上海E信息科技有限公司（以下简称“E公司”，系国内特大型美食外卖平台企业）授权许可的情况下，Z公司为了以提供超范围数据服务吸引更多的客户，由公司首席技术官陈某某指使汤某某等多名公司技术人员，通过“外爬”“内爬”等爬虫程序（按照一定的规则，在网上自动抓取数据的程序），非法获取E公司运营的外卖平台（以下简称“E平台”）数据。其中，汤某某技术团队实施“外爬”，以非法技术手段，或利用E平台网页漏洞，突破、绕开E公司设置的IP限制、验证码验证等网络安全措施，通过爬虫程序大量获取E公司存储的店铺信息等数据。王某某技术团队实施“内爬”，利用掌握的登录E平台商户端的账号、密码及自行设计的浏览器插件，违反E平台商户端协议，通过爬虫程序大量获取E公司存储的订单信息等数据。上述行为造成E公司存储的具有巨大商业价值的海量商户信息被非法获取，同时造成E公司流量成本增加，直接经济损失人民币4万余元。</p>\n<p>     案发后，Z公司、陈某某等人均认罪认罚，Z公司积极赔偿被害单位经济损失并取得谅解。2020年8月14日，上海市公安局普陀分局以陈某某等人涉嫌非法获取计算机信息系统数据罪提请上海市普陀区检察院审查逮捕。8月21日，普陀区检察院经审查认为，陈某某等人不具有法律规定的社会危险性，依法决定不批准逮捕。2021年6月25日，上海市公安局普陀分局以陈某某等人涉嫌非法获取计算机信息系统数据罪移送普陀区检察院审查起诉。2022年5月，普陀区检察院依法对犯罪嫌疑单位Z公司、犯罪嫌疑人陈某某等14人作出不起诉决定。</p>\n<h3>Part 2案件特点</h3>\n<p>     检察机关针对互联网科创企业的数据合规漏洞，深入开展社会调查，积极引导涉案企业开展数据合规。综合考虑涉案企业行业属性、技术行为合规规则，组建独立、专业的第三方组织，提升涉案企业数据合规监督评估有效性。能动创新优化合规考察模式，在疫情期间灵活运用智慧检务开展“云听证”，兼顾办案的公开与效率，助力复工复产。多措并举推动行业治理，促进互联网行业建立健全数据合规经营体系，助力构建健康清朗的网络生态环境。</p>\n<h3>Part 3典型意义</h3>\n<p> 合规准备工作前移，积极推动侦查过程中合规准备工作，为审查起诉阶段的合规监督考察奠定基础。</p>\n<p>     本案中检察机关积极利用提前介入侦查，引导公安机关收集合规信息与材料，为后续合规工作的高效开展奠定坚实基础。对于挽救企业而言，早合规优于晚合规，检察机关应当与侦查机关密切配合、相向而行，综合运用好介入侦查引导取证、审查逮捕、强制性措施适用等法定职权，把促进合规的工作做在前面，推动合规改革释放出最优效果。</p>\n<p>组建专业化第三方组织，提升涉案企业数据合规监督评估的有效性。</p>\n<p>     检察机关立足区域内互联网产业集聚特点，推动设立涉互联网第三方专业人员名录库。针对涉及“网络爬虫”等数据合规专业领域情况，检察机关经社会调查认定涉案企业符合企业合规第三方机制适用条件，商请第三方机制管委会从专类名录库中抽取了由互联网行业管理部门、行业龙头企业和专业协会人员组成的第三方组织，为第三方机制运转提供专业性、公正性、协同性支撑。检察机关依托第三方组织的专业优势，以召开评估工作现场会的形式对涉案企业合规计划的可信性、有效性与全面性进行充分审查，围绕案件反映的数据获取问题开展“因罪施救”“因案明规”，督促涉案企业构建有效的数据合规整改体系，做到“真合身”“真管用”。</p>\n<p>能动履职强化审查把关，多措并举保障企业有效推进合规整改。</p>\n<p>     本案中，检察机关在依法适用第三方机制的基础上，一是强化主导责任，因案制宜加强合规考察的审查把关，主动听取第三方组织对企业合规整改的考察情况，协调有关行政机关将涉案企业纳入监测平台，统筹数据专项合规与全面合规，确保企业合规整改措施全方位落实落细，避免出现“纸面合规”“形式合规”。二是延伸合规激励，秉持惩治与挽救并重，加强检企沟通对接，充分听取被害企业意见，积极推动双方企业实现和解，促成涉案企业与数据来源方达成合规数据交互协议，确保数据来源的合法化，最大限度维护涉案企业正常生产经营。三是深化科技赋能，立足疫情防控常态化下的办案要求，通过“云听证”审查方式兼顾办案公开与效率，召开由全国人大代表、第三方组织、涉案企业参加的线上座谈，听取各方意见，延伸办案效果，实现线上线下对接、场内场外联动，以公开促公正赢公信。</p>\n<p><strong> </strong><strong>由点及</strong><strong>面推动</strong><strong>行业治理，助力构建健康清朗的网络生态环境。</strong>推动网络空间法治化治理，促进互联网企业守法经营，是检察机关依法能动履职、促进诉源治理肩负的重要责任。数字化转型背景下衍生出的数据侵权、网络犯罪问题，亟需规范引导以保障数字经济高质量发展。</p>\n<p>     本案中，涉案企业与被害企业均为大型互联网科创企业，普陀区检察院深化社会综合治理，依法打击网络灰黑产业链的同时，推动促进互联网行业建立数据合规经营体系。一方面，通过案件办理、检察建议、法治宣传等方式，深入涉案企业所在园区引导广大互联网企业树立数据合规意识，从源头防止再次发生类似违法犯罪。另一方面，以“我管”促“都管”助力营造企业合规文化，推动区政府相关部门、司法机关及30余家区内互联网企业深入落实《普陀区互联网企业合规共识框架》，发布《互联网企业常见刑事法律风险防控提示》，为企业风险防范、合规经营提供法律支持，努力实现“办理一个案件、形成一个合规标准、规范一个行业”的良好效果。</p>\n<h2>网络爬虫过界维度的刑事规制路径</h2>\n<p> 2023-05-30 21:14 发表于北京</p>\n<p> 文｜姚梦悦</p>\n<p>自20世纪90年代首个爬虫搜索引擎诞生至今，网络爬虫被运用了近二十年，成为一项不可替代的互联网数据采集、加工工具，并从之前一直被视为没有污点的中立技术，经历了从受反不正当竞争法调整的民事违法行为，到受刑法侵犯公民个人信息罪等规范刑事规制的过界行为。人们不禁发出质疑：是刑事政策的趋向严厉使爬虫入刑？还是爬虫功能的异化使之出界？对网络爬虫行为如何进行刑事规制、区分网络爬虫过界维度是本文需要探讨的问题。</p>\n<p>手段过界</p>\n<p>——利用不法手段实施的危害行为</p>\n<p>合法的爬虫不应避开或突破系统安全防护措施。从网络爬虫的技术原理来讲，网络爬虫所爬取的应是网页上的数据，但在多数由网络爬虫行为入罪的案件中，网络爬虫针对的均是服务器内的非公开数据，侵入性特征明显，并且被学者评价为“爬虫+”技术。</p>\n<p>网络爬虫刑事违法性的重要表现是侵入性，从司法解释的角度出发，评价侵入性的标准是是否违背计算机信息系统安全保护措施，未经合法授权取得数据。现有研究范例往往均从侵入性评价爬虫行为刑事责任，甚至有学者从中美规制比较研究中认为，是否突破安全保护措施是网络爬虫民刑界分的形式标准①。从刑事裁判来看，除上述论及的反爬措施在侵入性上存在一定争议外，其他针对计算机信息系统实施或是利用计算机信息系统对非公开数据实施的爬虫犯罪，绝大多数都具有显著的侵入性特征，符合司法解释对侵入性的手段界定。但如果从刑民区分的角度，仅以手段的侵入性为标杆，是远远不充分的，如前述案例中涉及的侵犯公民个人信息、侵犯著作权等，所获取的数据本身受刑法特殊保护的情况下，则非法获取数据行为即已达入罪标准，且非法并不仅限于手段的非法，权限的非法也同样构成。</p>\n<p>尽管如此，手段过界的数据爬取行为必然是违法的。在此基础上，我们可以把针对一般数据实施且具有侵入性特征的爬虫行为界定为单一性侵入行为，该类行为一般受危害计算机信息系统安全犯罪调整；把针对受刑法特殊保护数据实施的且具有侵入性特征的爬虫行为界定为复合型侵入行为，如利用侵入性爬虫获取公民个人信息，在这种情景下，行为人以侵入性手段获取计算机信息系统数据的行为符合危害计算机信息系统安全犯罪的构成，而其以其他方法非法获取公民个人信息的行为又涉及侵犯公民个人信息罪，虽然按照竞合犯的处理择一重归罪，但罪状呈复合形态。</p>\n<p>对象过界</p>\n<p>——危害数据安全</p>\n<p>1.已被采取保护措施的数据安全</p>\n<p>在大数据时代，数据作为生产要素之一，总是存在着开放与保护之间的博弈。数字化发展建立在数据开放和共享的基石上。基于数据流通的需要，总有一部分数据处于公开状态，相关数据可查询、复制和利用。对公开数据，一般情况下并不会采取特殊的保护措施，所以对公开数据的爬虫行为一般并不会涉及刑事犯罪，对于公开且未被采取保护措施的数据，只有在手段行为严重过界，即上述野蛮地破坏访问，造成严重后果情况下，才有可能构成破坏计算机信息系统犯罪。概言之，对爬虫行为数据对象过界的判定，一般应针对受保护的数据。如果未对数据采取保护性手段，则不论数据公开与否，不会构成危害计算机信息系统、数据犯罪，是否涉及其他犯罪，则取决于数据本身是否属于刑法特殊保护对象，与爬虫行为的技术入罪标准无关。</p>\n<p>实践中，政府机构或者科研院所对于非公开的数据会采取较为严格的防护措施，这种情况下网络爬虫的侵入性特征显著，往往不存在刑事规制争议，刑事裁判反映的现实样态亦是如此。争议问题主要集中在爬取如晟品案、元光案等商业领域的公开数据。本文认为，如果仅将对象的过界限定于非公开数据，则会使数据控制者更倾向于封闭数据或使数据控制者对公开数据所采取的保护措施形同虚设，从根本上而言，会使数据垄断越甚，不利于数据流通的大局，所以，在判断爬虫对象是否过界时，不应仅考虑数据的公开性，更为核心的要素是数据是否被采取受刑法规范的保护措施。  </p>\n<p>2.受刑法特别保护的数据安全</p>\n<p>如前所述，国家秘密、商业机密、公民个人信息、著作权等在刑法上均具有特殊的权利内涵，对该类数据实施的非法爬取行为，不论手段是否过界，均具有刑事违法性，应受刑法规制，并且若采取侵入行为实施，则对法益的侵害更甚于对一般性数据实施的越界爬取行为，刑事制裁的力度应大于前者。</p>\n<p>刑民分界维度</p>\n<p>——违反合同协议的爬虫行为</p>\n<p>数据网站不可避免地出于维护数据安全和竞争优势的需要，倾向于对所控制的数据采取保护措施，就如同企业对商业秘密的保护和普通人维护自身财产安全一般。这种维护最简单的表现形式就是网站使用协议，也就是Robots协议②，通过Robots协议向使用者宣示，访问行为允许的限度。</p>\n<p>就Robots协议这类授权规则能否作为刑事入罪的依据，曾经引起过争议。</p>\n<p>有学者指出，早期美国判例中，法官认定访问是否不符合授权的判断标准来自于数据网站对爬取行为“不满的信号”，而违反网站使用协议即是其中之一，个别判例甚至将数据网站的控诉作为评价依据，使得入罪的标准过分宽泛③。如果将违背数据网站意愿的数据获取、使用行为都认定为犯罪，实质上是将网络数据侵害行为违法犯罪的判断委托给数据网站④，不仅使刑事入罪标准完全置于主观评价范围，而且有违罪刑法定原则，显然不足取。</p>\n<p>网站使用协议等合同协议是网站和使用者之间的契约规则，不应上升至刑事规范的高度。从性质上而言，其仅明确了允许访问和不允许访问的范围，但并不会从技术的角度设置壁垒，在具体实施层面限制或束缚网络爬虫，故合同协议不属于刑法意义上的计算机安全保护措施，仅违反合同协议的数据爬取行为与侵入性行为有本质的区别。</p>\n<p>由此，对未采取符合“侵入性”标准的计算机信息系统安全保护措施，与使用者之间仅以合同协议形式明确权利界限的一般性数据保护行为，应当由反不正当竞争法等民事法律规范和调整，与刑事规制区分维度，以构建权责分明的网络数据法律保护机制。</p>\n<p>缺位和补充</p>\n<p>数据财产化保护的立法前瞻</p>\n<p>数字经济就是要降低每一个人作出选择的机会成本，提高自由度，帮助人们决策，而决策建立在大数据的计算和分析上。2009年甲型H1N1流感传播，在全球公共卫生机构对这种疾病预测显得无所适从的时候，谷歌工程师利用人们在网上的搜索记录完成了预测，令世人震惊⑤。那时候的人们可能才刚开始认识到大数据的价值，而现在我们的每一次网上购物、订机票、招车出行、就医问诊，都依赖于大数据的辅助决策功能，大数据看似无形，却无时无刻不在环绕着我们，深刻的变革着我们的社会和生活。在法律领域，大数据的财产化保护已成为不绝于耳的话题。刑法当如何回应？</p>\n<p>在现有的刑法体系中，刑法分别从国家安全、社会秩序、经济秩序、公民人身权利层面，对数据树立了刑法保护的屏障，如对国家秘密、情报、商业秘密、计算机信息系统、公民个人信息的保护，此类之外的，大数据的刑法保护是匮乏的，不法行为可直接游离于刑事制裁半径之外。有观点认为，将非法获取数据与盗窃相比较，数据的价值不能靠本身实现，还需要通过存储数据库，并经过对数据的处理和分析后才能获得有价值的信息，所以与普通财产存在区别⑥。但前述“加工数据=价值”的观点并不全面，原始数据并非无用之物，加工只是整合了数据的价值，放大了价值的效应，不能以数据切割的观点，否认数据整体的财产价值，好比否认了量变和质变的关系。实践中，大量的网络数据都是零散的，如我们的浏览痕迹、运动轨迹、购物记录等等，但这些数据整合之后，可以作为整个社会运行的判断基础，蔚为壮观，如何在刑法中周延对该类碎片数据的保护，决定了在大数据时代刑法是否作出了前瞻性的回应。基于此，对于达到一定规模的为他人控制使用，并能实际产生经济价值的数据资产，还是应当在刑法上肯定数据资产的财产属性，从保护财产权的角度对不法行为进行刑事规制，以弥补现行刑法制度中对数据财产属性保护的不足。</p>\n<p>注释：</p>\n<p>①参见杨志琼：《数据时代网络爬虫的刑法规制》，载《比较法研究》2020年第4期。</p>\n<p>②爬虫协议是通过在ICP网站的根目录下放置robots.txt文件，用具体的语法规则设定禁止或允许访问、抓取数据的具体内容并告知搜索方，以实现其对搜索引擎的指引、宣示作用。</p>\n<p>③参见杨志琼：《美国数据犯罪的刑法规制：争议及其启示》，载《中国人民大学学报》2021年第６期。</p>\n<p>④转引自杨志琼：《数据时代网络爬虫的刑法规制》，载《比较法研究》2020年第4期。</p>\n<p>⑤参见维克托迈尔·迈尔-舍恩伯格，肯尼斯·库克耶（周涛译）：《大数据时代：生活、工作与思维的大变革》，浙江人民出版社2013年第1版。</p>\n<p>⑥参见刘宪权、汤君：《人工智能时代数据犯罪的刑法规制》，载《人民检察》2019年第13期。</p>\n<p>作者系江苏省苏州市姑苏区人民法院刑事审判庭副庭长</p>\n<h2>中国网络爬虫违法违规案例收集与总结：商家售卖裁判文书网数据构成侵权？</h2>\n<p>HiddenStrawberry  2020-07-14 23:16</p>\n<p>Collection of China illegal cases about web crawler 本项目用来整理所有中国大陆爬虫开发者涉诉与违规相关的新闻、资料与法律法规。致力于帮助在中国大陆工作的爬虫行业从业者了解我国相关法律，避免触碰数据合规红线。</p>\n<p>违法违规案例汇总</p>\n<h3>爬虫禁区1：为违法违规组织提供爬虫相关服务（验证码识别服务贩卖、SEO……）</h3>\n<p>CASE1:知乎某极验破解者自述被抓（已删除）CASE2:“快啊答题”AI破解验证码服务开发者被判刑CASE9:永嘉警方揪出“黑”百度黑客团伙 干扰搜索引擎牟利超七千万元</p>\n<h3>爬虫禁区2：个人隐私数据抓取与贩卖</h3>\n<p>CASE3:简历大数据公司“巧达科技”被一锅端</p>\n<p>CASE4:社保掌上通被下架 用户的信息很容易泄露太不安全了</p>\n<p>CASE5:爬虫为何受关注？业内：大数据服务商或因合作方涉套路贷犯罪而被牵连</p>\n<h3>爬虫禁区3：利用无版权的商业数据获利</h3>\n<p>CASE6:“车来了”涉嫌偷数据被警方立案</p>\n<p>CASE8:裁判文书网数据竟被售卖：爬虫程序抓取或成侵权</p>\n<h3>爬虫禁区4：？</h3>\n<p>CASE7:头疼大战前传：头条前高管反噬被判刑</p>\n<h3>部分案例详情</h3>\n<p>CASE8:裁判文书网数据竟被售卖：爬虫程序抓取或成侵权</p>\n<p>北京青年报8月2日消息，1日，北京青年报从某网购商城看到，最高人民法院裁判文书网的数据被标价0.1元到1元不等出售。裁判文书网发布的判决书都是公开的，为什么会被售卖？获取裁判文书网数据的手段对于网站是否有危害呢？</p>\n<p>网售数据，价格需“私聊”获取</p>\n<p>北青报记者在某网络商城中看到，有标注来自湖南、广东、山东等多地的商家均声称出售裁判文书网的数据，其中不少商家声称其数据量超6000万条。而据裁判文书网公开数据显示，目前裁判文书网上公开的文书总量为7395万多篇，如果商家所称的数量属实，则商家能够提供绝大多数已经公开的文书数据。</p>\n<p>不少声称能够出售裁判文书网数据的商家在商品文字描述中称，其数据是通过“网络爬虫”的方式获取的。所谓“网络爬虫”，又称网页蜘蛛、网页机器人，是一种按照一定的规则，自动地抓取万维网信息的程序或者脚本。相当于一个自动访问网页并进行相关操作的小机器人。</p>\n<p>北青报记者注意到，尽管每名商家均在商品页面标示称，其数据售价为0.1元至1元，但每名商家均在文字描述中表示，数据的售价并不以标示为准，而是需要“私聊”获取。</p>\n<p>一名售卖裁判文书数据的商家说，购买裁判文书数据的买家所需要的数据量从几千篇到几千万篇不等，有的买家是因为无法打开裁判文书网而不得不来求助于数据卖家，“还有很多学生买数据用于论文写作，这种情况几千条就够了，商用的话可能需要几百万条甚至上千万条。”商家还称，每个月他们能接到四五个文书数据采集的订单，而价格和买家需要的数据量有关，“几百万条数据大概要几千块钱，现在加密技术很严格，所以要贵一些。”</p>\n<p>“爬虫”系统，曾致正常用户无法访问</p>\n<p>北青报记者了解到，部分技术机构通过网络爬虫系统获取裁判文书网数据的行为，已经给裁判文书网正常用户的访问带来了不便。不少网友曾在网上发帖称，自己搜索裁判文书时，常常遭遇裁判文书网网站显示因为系统原因，无法查询的情况。</p>\n<p>对此，最高人民法院在其官网回应网友对于裁判文书网运行慢、故障频繁等情况时表示，由于中国裁判文书网公开文书数量和影响力不断增加，访问用户数不断增长。同时，2018年5月初以来，大量技术公司通过爬虫系统无限制并发访问非法获取裁判文书数据，造成网站负荷过大，大量正常用户请求堵塞，访问出现速度慢或部分页面无法显示等现象。</p>\n<p>2019年5月，最高人民法院信息中心主任许建峰在接受媒体采访时表示：“中国裁判文书网目前每天的访问量可以达到几千万的量级，其中还包括数据爬虫的攻击，我们的中心服务器承受着巨大压力。”</p>\n<p>“我们每时每刻都在监控着它的应用情况，希望遇到问题立即采取措施，但是的确还不能完全跟得上步子，所以会出现停网维护运营的情况。”许建峰说，最高法已成立了专门的运维保障团队去维护管理中国裁判文书网，也将在技术与人力上投入更多的力量。</p>\n<p>律师分析：强行突破“反爬”技术或构成犯罪</p>\n<p>金杜律师事务所从事IP类法律业务的律师瞿淼曾发文阐述了网络爬虫所涉及的法律问题。瞿淼称，从技术中立的角度而言，爬虫技术本身并无违法违规之处。但是，随着数据产业的发展，数据爬取带来的各种问题和顾虑日渐增加。过于野蛮的爬虫可能造成网站负荷过大，从而导致网站瘫痪、不能访问等。</p>\n<p>“由于爬虫的批量访问会给网站带来巨大的压力和负担，因此许多网站经营者会采取技术手段，以阻止爬虫批量获取自己网站信息。而针对这些技术手段，爬虫开发者可以通过优化自己的代码、使用IP池等多种方式规避上述技术措施，实现对网站信息的批量抓取和复制。”瞿淼说，由于网络爬虫会根据特定策略尽可能多地访问页面，因而爬虫的使用将占用被访问网站的网络带宽并增加网络服务器的处理开销，甚至无法正常提供服务。</p>\n<p>瞿淼认为，根据《反不正当竞争法》关于网络的相关条款，如果网站运营者已经采取了一定的反爬虫措施，而爬虫控制者基于经营目的、强行突破网站运营者采取的反爬虫技术措施，并客观导致被抓取网站无法正常运行，则可能构成不正当竞争行为。此外，强行突破某些特定被爬方的技术措施，还可能构成刑事犯罪行为。</p>\n<p>针对此情况，北京市社会组织法律调解中心副理事长张新年律师认为，“这些裁判文书基于司法公开目的，是免费的公共资源，未经最高人民法院授权，商家售卖裁判文书网数据构成侵权。”</p>\n<p>商家售卖裁判文书网数据到底是否构成侵权？欢迎文后留言发表你的看法！</p>\n<p>CASE2:“快啊答题”AI破解验证码服务开发者被判刑</p>\n<p>判决：一、关于上诉人李琦、杨克群及辩护人提出的相关意见。1.司法鉴定意见书系具有电子数据鉴定资质的机构依照法定程序所作，鉴定意见客观真实，结合腾讯公司安全管理部出具的情况说明、被告人张鑫、林江、陈天明、周阳等人供述，足以证实涉案平台、程序、软件通过各自实现功能绕过QQ登陆验证码保护措施，批量验证QQ账号密码是否一致的事实。2、上诉人李琦、杨克群均供述，虽然不清楚这些原始数据的来源和用途，但有意识到正常情况下不会有那么多原始数据需要识别，大量使用打码服务的人有可能用于网络违法活动；收集在案的杨克群与平台创建者李琦、软件提供者张鑫等人的聊天记录亦能证实二人应当知晓相关软件接入平台后通过图文识别程序用于批量识别腾讯QQ验证码的事实。上述证据足以认定二人主观上明知自己提供的平台、程序可能用于侵入腾讯服务器获取相关信息，即主观上存在提供侵入计算机信息系统的程序、工具的故意。3.原审被告人张鑫、林江、陈天明等人将批量登录腾讯QQ账号功能的软件接入上诉人李琦创建的“快啊答题”平台，通过上诉人杨克群提供的图文验证码识别技术快速批量识别验证码筛选出账密一致的QQ号码信息，从而达到侵入腾讯服务器获取数据的目的。软件提供者、**图文识别技术提供者和平台创建者虽然未经事先商谋，但主观对上述过程均系明知，在此认知下相互配合，共同完成绕过验证码安全保护措施，筛选账密一致的QQ号码，为侵入腾讯服务器获取数据提供了帮助，属共同犯罪，程序或软件本身是否具备侵入计算机信息系统功能或是否合法不影响对上述事实的认定。**故上诉人李琦、杨克群提出主观上无犯罪故意，客观上无共同犯罪行为的意见，与事实不符，不予采纳。</p>\n<p>CASE9:永嘉警方揪出“黑”百度黑客团伙 干扰搜索引擎牟利超七千万元</p>\n<p>2017年５月，永嘉公安治安大队在办理一起假烟案时，发现犯罪嫌疑人詹某的假烟销售网站在百度搜索“高仿烟”关键词时排名第一，而国家禁止销售高仿烟的相关政策信息竟在此之后。</p>\n<p>这一现象引起办案民警警觉。民警在抓获詹某后，了解到其以网页SEO向扬州一网络公司支付高昂费用后，便可在百度搜索“高仿烟”关键词排名第一。</p>\n<p>据永嘉警方介绍，SEO是指通过技术提高网站的关键词排名及公司产品的曝光度，正常的SEO无法实现百度搜索引擎的快速提升及长期排名第一。随后，民警向百度核实，发现该公司在扬州并无竞价排名合作商，且“高仿烟”等关键词不符合其竞价排名标准。</p>\n<p>警方最终发现扬州赶游网络公司以黑客手段干扰百度公司搜索引擎的后台数据。据介绍，该公司共有50多名员工，对外宣称从事正规网页SEO业务，实际组织大规模的百度搜索快速排名优化。</p>\n<p>经调查，该公司相关犯罪嫌疑人刘某、卜某等人2015自行研发可进行模拟百度搜索点击特定关键词及指定网页的软件，并聘用陈某等20余人。他们招徕全国各地有需要网站排名优化的客户，开展非法的排名优化，牟取巨额利润。刘某开发的百度搜索点击软件具有模拟搜索点击特点关键词和网站的功能，软件能短时间内急速提升特定网站的点击量，达到干扰、破坏百度公司后台数据、非法提升特定网页百度搜索排名的目的。</p>\n<p>2017年６月以来，警方先后抓获刘某、卜某、张某等26人，查封扣押服务器80余台。目前，案件正在进一步侦办中。</p>\n<p>中国网络管理越来越严格，做网络爬虫，还十分有必要了解以下相关法律介绍。</p>\n<h3>非法获取计算机系统数据罪</h3>\n<p>根据《中华人民共和国刑法》第二百八十五条规定，非法获取计算机信息系统数据、非法控制计算机信息系统罪，是指违反国家规定，侵入国家事务、国防建设、尖端科学技术领域以外的计算机信息系统或者采用其他技术手段，获取该计算机信息系统中存储、处理或者传输的数据，情节严重的行为。刑法第285条第2款明确规定，犯本罪的，处三年以下有期徒刑或者拘役，并处或者单处罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。</p>\n<h3>侵犯商业秘密罪</h3>\n<p>《反不正当竞争法》第九条，以不正当手段获取他人商业秘密的行为即已经构成侵犯商业秘密。而后续如果进一步利用，或者公开该等信息，则构成对他人商业秘密的披露和使用，同样构成对权利人的商业秘密的侵犯。</p>\n<h3>非法侵入计算机信息系统罪</h3>\n<p>《刑法》第二百八十六条还规定，违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，后果严重的，构成犯罪，处五年以下有期徒刑或者拘役；后果特别严重的，处五年以上有期徒刑。而违反国家规定，对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，后果严重的，也构成犯罪，依照前款的规定处罚。</p>\n<h3>网络安全法</h3>\n<p>《网络安全法》第四十四条 任何个人和组织不得窃取或者以其他非法方式获取个人信息。因此，如果爬虫在未经用户同意的情况下大量抓取用户的个人信息，则有可能构成非法收集个人信息的违法行为。</p>\n<h3>民法总则</h3>\n<p>《民法总则》第111条任何组织和个人需要获取他人个人信息的，应当依法取得并确保信息安全。不得非法收集、使用、加工、传输他人个人信息</p>\n<h3>侵犯公民个人信息罪</h3>\n<p>《刑法》修正案（九）中将刑法第二百五十三条进行了修订，明确规定违反国家有关规定，向他人出售或者提供公民个人信息，情节严重的，构成犯罪；在未经用户许可的情况下，非法获取用户的个人信息，情节严重的也将构成“侵犯公民个人信息罪”。根据《最高人民法院 最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》第五条规定，对“情节严重”的解释，（1）非法获取、出售或者提供行踪轨迹信息、通信内容、征信信息、财产信息五十条以上的；（2）非法获取、出售或者提供住宿信息、通信记录、健康生理信息、交易信息等其他可能影响人身、财产安全的公民个人信息五百条以上的；（3）非法获取、出售或者提供第三项、第四项规定以外的公民个人信息五千条以上的便构成“侵犯公民个人信息罪”所要求的“情节严重”。</p>\n<p>钻漏洞，他用爬虫非法获取 1500 万余条个人信息，倒卖获利 54 万被判 5 年</p>\n<p>划重点：</p>\n<p>SQL注入 + 爬虫非法获取 1500 万余条个人信息，倒卖获利 54 万</p>\n<p>这是2020 年 4 月二审宣判的一个刑事案件。</p>\n<p>2018 年 1 月至 7 月期间，被告人呙某某<strong>通过</strong><strong> SQL 注入漏洞以及编写爬虫脚本的方式，侵入计算机信息系统</strong>，获取计算机系统内存储的大量数据，其中涉及到<strong>公民个人信息</strong>的数量约为1500万余条，该将其获取的个人信息通过QQ销售给“Versace”、“同花顺”、“FF”、“糖果”等人，从中获利约 54 万余元。</p>\n<p>一审法院以非法获取计算机信息系统数据罪，判处被告人呙某某有期徒刑 5 年，并处罚金人民币 2 万元。对被告人呙某某违法所得人民币 54 万元依法予以追缴或责令退赔。</p>\n<p>一审结果出来后，呙某某提出上诉。其主要上由及其辩护人的主要辩护意见是，</p>\n<p>编写爬虫脚本获取计算机信息系统数据的行为不具有违法性，采用此手段获取的信息数量及对应的犯罪数额应当扣除；一审判决认定呙某某非法获取的个人信息数量错误，对应的犯罪数额应予扣除。</p>\n<p>二审法院（青岛市中级人民法院）认为，</p>\n<p>原审判决认定上诉人呙某某犯非法获取计算机信息系统数据罪的事实清楚，证据确实、充分，定性准确，量刑适当，审判程序合法。关于上诉人呙某某及其辩护人所提呙某某编写爬虫脚本获取计算机信息系统数据的行为不具有违法性，采用此手段获取的信息数量及对应的犯罪数额应当扣除的上诉理由及辩护意见，经查，上诉人呙某某未经网站授权，利用特定网站的漏洞，通过编写爬虫脚本入侵特定网站的方式，批量获取计算机信息系统中公民信息数据并用于出售。该采取的技术手段具有非法性，用该手段获取的信息数量及对应的犯罪数额均不应扣除。该上诉理由及辩护意见不成立，不予采纳。</p>\n<p>二审驳回上诉，维持原判，并且是终审裁定。</p>\n<p>案件划重点</p>\n<p>利用漏洞搞 SQL 注入攻击、非授权获取公民信息并倒卖，都是非法的。</p>\n<p>相关知识</p>\n<p>《信息安全技术个人信息安全规范》，2018 年 5 月 1 日起正式实施，其中对「个人信息」和「个人敏感信息」早有明确说明：</p>\n<p>【个人信息】以电子或者其他方式记录的能够单独或者与其他信息结合识别特定自然人身份或者反映特定自然人活动情况的各种信息。</p>\n<p>包括：姓名、出生日期、身份证件号码、个人生物识别信息、住址、通信通讯联系方式、通信记录和内容、账号密码、财产信息、征信信息、行踪轨迹、住宿信息、健康生理信息、交易信息等；</p>\n<p>【个人敏感信息】一旦泄露、非法提供或滥用可能危害人身和财产安全，极易导致个人名誉、身心健康受到损害或歧视性待遇等的个人信息。</p>\n<p>包括：身份证件号码、个人生物识别信息、银行账号、通信记录和内容、财产信息、征信信息、行踪轨迹、住宿信息、健康生理信息、交易信息、14 岁以下（含）儿童的个人信息等。</p>\n<p>此外，《规范》也对个人信息使用做出明确规定，如当直接收集用户个人信息时，需要有明确个人授权；而当间接收取个人信息，应了解个人信息提供方已获得的个人信息处理的授权同意范围，包括使用目的，个人信息主体是否授权同意转让、共享、公开披露等。</p>\n<h2>中国爬虫违法违规案例汇总！</h2>\n<p>目前收纳了违法爬虫四类共 9 个项目：</p>\n<h3>爬虫禁区1：为违法违规组织提供爬虫相关服务（验证码识别服务贩卖、SEO……）</h3>\n<p>CASE1:知乎某极验破解者自述被抓（已删除）</p>\n<p>知乎部分内容.png</p>\n<p>CASE2:“快啊答题”AI破解验证码服务开发者被判刑</p>\n<p>CASE9:永嘉警方揪出“黑”百度黑客团伙 干扰搜索引擎牟利超七千万元</p>\n<h3>爬虫禁区2：个人隐私数据抓取与贩卖</h3>\n<p>CASE3:简历大数据公司“巧达科技”被一锅端</p>\n<p>CASE4:社保掌上通被下架 用户的信息很容易泄露太不安全了</p>\n<p>CASE5:爬虫为何受关注？业内：大数据服务商或因合作方涉套路贷犯罪而被牵连</p>\n<h3>爬虫禁区3：利用无版权的商业数据获利</h3>\n<p>CASE6:“车来了”涉嫌偷数据被警方立案</p>\n<p>CASE8:裁判文书网数据竟被售卖：爬虫程序抓取 或成侵权</p>\n<h3>爬虫禁区4</h3>\n<p>CASE7:头疼大战前传：头条前高管反噬被判刑</p>\n<p>知道了爬虫的禁区，还十分有必要了解以下相关法律介绍。</p>\n<h3>非法获取计算机系统数据罪</h3>\n<p>根据《中华人民共和国刑法》第二百八十五条规定，非法获取计算机信息系统数据、非法控制计算机信息系统罪，是指违反国家规定，<strong>侵入国家事务、国防建设、尖端科学技术领域以外的计算机信息系统或者采用其他技术手段，获取该计算机信息系统中存储、处理或者传输的数据</strong>，情节严重的行为。刑法第285条第2款明确规定，犯本罪的，<strong>处三年以下有期徒刑或者拘役，并处或者单处罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。</strong></p>\n<h3>侵犯商业秘密罪</h3>\n<p>《反不正当竞争法》第九条，以不正当手段获取他人商业秘密的行为即已经构成侵犯商业秘密。而后续如果进一步利用，或者公开该等信息，则构成对他人商业秘密的披露和使用，同样构成对权利人的商业秘密的侵犯。</p>\n<h3>非法侵入计算机信息系统罪</h3>\n<p>《刑法》第二百八十六条还规定，违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，后果严重的，构成犯罪，处五年以下有期徒刑或者拘役；后果特别严重的，处五年以上有期徒刑。而违反国家规定，对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，后果严重的，也构成犯罪，依照前款的规定处罚。</p>\n<h3>网络安全法</h3>\n<p>《网络安全法》第四十四条 任何个人和组织不得窃取或者以其他非法方式获取个人信息。因此，如果爬虫在未经用户同意的情况下大量抓取用户的个人信息，则有可能构成非法收集个人信息的违法行为。</p>\n<h3>民法总则</h3>\n<p>《民法总则》第111条任何组织和个人需要获取他人个人信息的，应当依法取得并确保信息安全。不得非法收集、使用、加工、传输他人个人信息</p>\n<h3>侵犯公民个人信息罪</h3>\n<p>《刑法》修正案（九）中将刑法第二百五十三条进行了修订，明确规定违反国家有关规定，向他人出售或者提供公民个人信息，情节严重的，构成犯罪；在未经用户许可的情况下，非法获取用户的个人信息，情节严重的也将构成“侵犯公民个人信息罪”。根据《最高人民法院 最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》第五条规定，对“情节严重”的解释，（1）非法获取、出售或者提供行踪轨迹信息、通信内容、征信信息、财产信息五十条以上的；（2）非法获取、出售或者提供住宿信息、通信记录、健康生理信息、交易信息等其他可能影响人身、财产安全的公民个人信息五百条以上的；（3）非法获取、出售或者提供第三项、第四项规定以外的公民个人信息五千条以上的便构成“侵犯公民个人信息罪”所要求的“情节严重”。</p>\n<p>近日，邗江区人民检察院对一起侵犯公民个人信息案提起公诉，该案中9名被告人通过出租含有违规获取企业信息的软件以及出售利用软件获取的公民个人信息牟利，分别被判处<strong>有期徒刑7个月至拘役4个月，缓刑7个月不等的刑期，并处或单处罚金。</strong></p>\n<p>客户信息来源得到极大提升</p>\n<p>2021年，供职于某财税代账公司的赵某（另案处理）与公司老板商议后，研发了一款名为“B”的软件，并由其进行维护。通过这个软件，只需要轻点手指，就能获取前一天在各地工商部门登记注册的企业信息，不仅有企业公开的法人信息、企业地址、经营范围等，还包含了并不公开的联系电话等。它也因为这样的功能，在代账公司、网络服务公司中广为流传。</p>\n<p>“我们公司发展业务需要与各个公司对接，特别是新注册的有代账业务需求的，但是如何联系到他们，这是个问题。”赵某原先在某企业信息网站充值了高级会员，批量下载工商注册信息，但是这些信息里并不包含手机号码，于是，赵某便编写了一个“爬虫”工具“A”，利用工商部门网站的漏洞，将新注册公司所留的经办人个人手机号码提取出来。</p>\n<p>就这样，赵某利用企业信息网站导出各地新注册工商登记公司的公司名称、统一社会信用代码并将上述信息导入“A”，同时通过“A”在各地政务网、政府公示网等网站非法获取当地注册工商登记公司的即时信息，并将该信息补充至此前导出的数据中，形成完整的公司信息（含公司名称、公司类型、公司地址、注册资本、法定代表人姓名、成立时间、经营范围、电话号码等），并将该信息导入“B”软件数据库中。</p>\n<p>通过“B”软件，点开后会有登录界面，输入账号、密码就可以进入，每个账号的权限都不一样，赵某根据不同的客户需求以及付费情况，会设置不同的地区数据下载权限和使用时长，客户可以登录进去后下载工商注册信息。</p>\n<p>意外商机通过售卖软件牟利</p>\n<p>赵某与老板商议后，认为既然数据已经是现成的，何不利用“B”来牟利呢？就这样，他们雇佣了几个人，开始向目标人群以包月的方式出售“B”软件，并约定违法所得按照20%-40%不等的销售分成归销售人员所有，剩余部分由赵某及其老板平分。</p>\n<p>销售员小张此前靠老板拿来的名单，联系客户咨询是否需要“代账”业务，有了“B”软件后，工作内容则变成了推销该软件。小张等人通过电话的方式，联系靠“B”软件获取的企业名单，并咨询对方是否需要“新企业名单”拓展业务，如果对方需要，则根据对方的需要进行报价，达成交易意向后，对方付款，销售员则将赵某设置好的账号密码交给对方，对方便可以登录使用了。</p>\n<p>销售员通过此种方式获取提成，对于购买了“B”软件的买家而言，同样发现了新“商机”。他们在充值购买了软件的使用权后，将获得的企业信息又通过按条计算或按月出租的方式，转手牟利。</p>\n<p>就这样，2021年3月以来，赵某等以牟利为目的，编写爬虫工具“A”及“B”软件，利用上述软件进入河南、江苏、海南等地工商局网站，非法获取该区域新注册公司所留的经办人个人手机号码，同时将上述号码编入“B”软件并设置用户名和密码等使用权限。后赵某老板招聘小张等人对外销售该软件。在此期间，从小张等人手中购买了“B”软件的买家又向他人出售从“B”软件中获得的公民个人信息及其他非法获取的公民个人信息。</p>\n<p>多人因侵犯个人隐私罪获刑</p>\n<p>案件被移送至邗江区人民检察院审查起诉，检察机关将小张等9名出售“B”软件及出售从“B”软件中获得的公民个人信息及其他非法获取的公民个人信息的被告人提起公诉。法院审理后认为，9名被告人违反国家有关规定，向他人出售公民个人信息，情节严重，其行为均已构成侵犯公民个人信息罪。综合其他情节，法院以侵犯公民个人信息罪对9名被告人判处有期徒刑7个月至拘役4个月，缓刑7个月不等的刑期，均并处或单处罚金。</p>\n<p>“公民个人信息受法律保护。”该案承办检察官介绍，公民个人信息关系到每个人日常生活的开展、正常生活状态的维持，不仅关涉个人名誉，同时影响个人的社会评价。公民个人信息的破坏或侵害，既可能给公民带来物质上的损失，也可能造成精神上的伤害，并影响公民在社会经济生活、社会政治生活中各项权利的实现，“网络时代，公民个人信息泄露时有发生，未免造成更为恶劣的后果，对此类犯罪应当予以严厉打击，切实维护网络空间秩序和人民群众生命财产安全。”</p>\n<h2>网络犯罪的技术中立问题——从网络爬虫第一案谈起</h2>\n<p>刘品新l网眼观法  2021-10-08 10:04 发表于重庆</p>\n<p>2021年9月29日19:30-21:30，电子证据与网络犯罪检察论坛系列讲座第十四讲在线上顺利举办。本次讲座由最高人民检察院检察理论研究所学术研究部主任陈磊担任主持人，浙江省杭州市人民检察院检察委员会专职委员兼第一检察部主任、浙江省法学会常务理事、中国检察学会理事、全国检察业务专家、首届全国优秀公诉人、最高人民检察院检察教育讲师团成员桑涛担任主讲人。北京航空航天大学法学院副教授裴炜、天津大学法学院副教授王燃、中国社会科学院法学研究所助理研究员胡昌明参与评议。</p>\n<p>讲座伊始，主持人陈磊主任介绍了主讲人桑涛主任、讲解人裴炜副教授、王燃副教授、胡昌明研究员的背景及其学术成就。在今晚的论坛中，桑涛主任对自己亲历的网络爬虫第一案——“魔蝎公司侵犯公民个人信息案”进行解读，结合自己的办案经验，分享他对网络中的技术中立这一在实践中颇具争议的问题的理解和认识。</p>\n<p>绪论</p>\n<p>与传统的刑事犯罪相比，网络犯罪具有主体的智能性、行为的隐蔽性、手段的多样性、犯罪成本低，后果难以控制和预测等等特点 ，并且呈现迅速蔓延的趋势。司法机关应把握这类案件的特点并且调整侦查策略。</p>\n<p>1、何为技术中立？</p>\n<p>目前，网络犯罪的突出问题是该种犯罪的分工日益细化，这就引出了今天的主题：技术在网络犯罪中发挥了不可替代的作用，那么技术中立可否成为免罪的条件？对网络犯罪中的技术中立应如何理解？</p>\n<p>桑涛主任认为，在一般情况下，技术无所谓是否犯罪中立，然而<strong>当一个人把技术作为犯罪工具时，就会产生技术是否是一种犯罪手段的问题</strong>。所以当评价技术是否为犯罪工具时，应评价的不是技术本身，而是使用技术的人。</p>\n<p>由此可以得出结论：技术中立免责是仅针对技术提供者而言，若技术提供者未参与侵权，且不明知他人运用其所提供的技术实行侵权，则可以免责。</p>\n<p>对于爬虫技术而言，其本身不当然违法，在读取、搜集互联网信息时，数据爬取行为本质上是对信息内容的复制。本着互联网开放共享精神，这种临时复制行为若未采取破坏手段、未违背爬虫协议约定则是被允许的；其他互联网技术也是如此。</p>\n<p>2、原则——“避风港规则”</p>\n<p>技术中立可以用知识产权法领域中的“避风港规则”来加以理解。避风港规则是指对于不提供信息内容，只提供技术服务、网络空间的网络服务提供者，在目的合法的情况下，一般不对使用其服务的网络用户的侵权行为承担法律责任。</p>\n<p>3、何为网络爬虫？</p>\n<p>所谓网络爬虫，是指按照一定的预设规则，自动抓取互联网上相关信息的程序或者脚本。这项技术可以实现资源的流通共享。对于网络爬虫技术，既要看到它对信息资源流通共享的不可或缺性，也要意识到它的滥用对个人信息权益造成的严重侵犯。</p>\n<p>根据我国现行法律法规的规定，利用网络爬虫技术爬取个人信息行为是否涉嫌违法犯罪，主要看两点：一是<strong>个人信息的</strong><strong>爬取是否</strong><strong>符合法律规定</strong>。二是<strong>利用爬虫技术</strong><strong>爬取个人</strong><strong>信息时是否突破了他人设置的技术保护措施</strong>。</p>\n<p># 网络爬虫第一案 #</p>\n<p>案情简介</p>\n<p>2016年3月开始至2019年9月期间，杭州某数据科技有限公司和各网络贷款公司进行合作，为网络贷款公司提供数据采集服务，在网络贷款公司开设的手机APP中通过用户授权，利用各类爬虫技术，抓取支付宝、京东、学信网、淘宝等公司的个人用户数据，销售给各网络贷款公司盈利。</p>\n<p>其中，由用户确认的授权协议中，明确告知用户“不会保存用户账号密码，仅在用户每次单独授权的情况下采集信息”，然而某公司仍采用技术手段将用户各类账号和密码保存在自己租用的某服务器上。经对某数据科技公司租用的某服务器进行勘验检查发现，该公司以明文形式保存的个人贷款用户账户和密码条数多达<strong>2124万条</strong>。</p>\n<p>2016年3月开始至2019年9月期间，某数据科技公司在为各网络贷款公司提供需要贷款个人用户的多维度信用数据过程中，针对支付宝、淘宝、京东、学信网等不同互联网公司的反爬源代码程序编写爬虫程序利用H5和SDK通道模拟贷款用户个人手机的登录环境、模拟用户操作个人手机贷款软件的行为、租用VPS服务器不断变更海量IP地址等方式，绕过支付宝、淘宝、京东、学信网等互联网公司的反爬机制，在未得到前述互联网公司的授权下，非法获取某芝麻分、花X、某淘气值、XX小白信用分等由前述公司通过程序建模、大数据分析得出的信用评分数据，且将此类评分数据提供给网络贷款公司牟利，为全国上百家网络贷款公司提供风险分析贷后预警、催收智能运筹等金融全生命周期风险管理服务，某数据科技公司以此<strong>非法获利人民币213694226.76元</strong>，共计<strong>获取数据22600775条</strong>。</p>\n<p>案件分析</p>\n<p>1、行为模式</p>\n<p>某公司与网贷平台进行合作(由某公司为网贷平台提供风控服务)，某公司将其开发的前端插件嵌入网贷APP中，用户在网贷APP中借款时须在某公司的插件上，填写其淘宝、京东等网站的账号密码，某公司在授权协议中明确告知用户不会保存其账户密码。但前端插件将该账户密码传至某公司服务器并上传到某服务器保存，数量共计21241504条。某公司在用户强授权下，在用户填写账号密码后，代替用户登录通过淘宝、京东等网站，使用机器人程序，复制下载用户账户内的淘气值、小白信用分、支付宝余额、花呗额度等数据，提供给网贷公司，获取收益。其间，公司技术部门所开发的ofs-Service爬虫程序，未经淘宝等公司的授权，需要破解(绕过)上述网站的反抓取措施（实际就是人工操作允许，机器人自行操作不允许）。只要网站提出异议，均停止爬取。</p>\n<p>2、定罪分歧</p>\n<p>①是否构成侵犯公民个人信息罪</p>\n<p>依照《刑法》第二百五十三条之一第三款的规定，窃取或者以其他方法非法获取公民个人信息的，构成侵犯公民个人信息罪。</p>\n<p>两高《关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》规定，“账户密码”等能够单独或者与其他信息结合识别特定自然人或者反映特定自然人活动情况的各种信息，属于公民个人信息。同时规定，在提供服务过程中收集公民个人信息的，属于《刑法》第二百五十三条之一第三款规定的“以其他方法非法获取公民个人信息”。</p>\n<p>本案中，犯罪单位某公司在与用户的授权协议中明确告知用户不会保存用户的淘宝、京东等账户密码，却仍将用户的账户密码保存在服务器中，经勘验，保存的账户密码数量共计21241504组，属于违反国家有关的规定，在提供服务过程中收集公民个人信息，构成侵犯公民个人信息罪。</p>\n<p>②是否构成非法获取计算机信息系统数据罪</p>\n<p>对于某公司绕过支付宝等第三方平台的反爬风控措施，在用户授权下，采用自动化程序复制支付宝等平台用户账户内的数据行为的定性，有两个可能涉及的罪名：</p>\n<p>Ⅰ 可能构成破坏计算机信息系统罪</p>\n<p>此罪条件是违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成计算机信息系统不能正常运行，后果严重的。</p>\n<p>本案是否属于实行反爬措施，违反国家规定，干扰平台系统，造成系统不能正常运行，后果严重的情况？</p>\n<p>目前不属于此类情形，理由如下：</p>\n<p>（1）绕过反爬风控措施主要有变化IP地址，模拟真人操作程序等措施，均满足用户授权下的访问，其只是骗过了平台的这些措施，并未对平台的计算机信息系统产生影响。</p>\n<p>反爬虫措施本质上不是网络安全的技术措施，只是“防范用户授权第三方登录”的一种技术措施，实质上只是平台与用户对于用户专属空间的访问控制权问题的协议安排，主要针对特定系统的访问控制问题,这样设置的目的实际是限制同业竞争对手，其合法性值得商榷。</p>\n<p>从表面手段行为上看，其有绕过（骗过）技术措施的行为，但实质上，其绕过的措施并非是与网络安全等级相同的措施，因为根据《计算机信息系统安全保护等级划分准则》对于系统安全进行分类,认定的标准主要有三个方面：<strong>自主访问控制、用户身份鉴别、数据完整性</strong>。</p>\n<p>从这三方面来看，如果公司在用户授权下，使用用户身份及密码进入用户可自主访问控制的空间或者在部分情况下绕过支付宝等第三方网站设置的反授权登录措施，该行为并未对上述三个系统安全重要方面破坏，不会危害计算机信息系统安全。</p>\n<p>（2）支付宝等平台称如果达到一定数量规模同时对一个平台进行登录，可能会增加平台服务器负担。但在用户授权的角度分析，其实只是把用户的人工操作过程变成了程序机器人操作过程，登录的数量是一样的，且目前并没有造成负担的相应结果数据；且支付宝、人民银行发出函告后，某公司均停止爬取行为，故目前也无法认定其对平台的计算机系统造成干扰。</p>\n<p>（3）关键要素是“违反国家规定”，但目前此类行为违反何种国家规定尚不明确，故无法认定。</p>\n<p>Ⅱ 可能构成非法获取计算机信息系统数据罪</p>\n<p>依照《刑法》第二百八十五条第二款的规定，违反国家规定，侵入或采用其他技术手段，获取计算机信息系统中存储的数据，情节严重的，构成非法获取计算机信息系统数据罪。</p>\n<p>本案不构成非法获取计算机信息系统数据罪。理由如下：</p>\n<p>（1）在行为层面，某公司已经得到了用户的授权，并非非法侵入计算机信息系统。根据目前的司法解释及相关案例,从手段行为构罪均表现两个要点，一是非法用户侵入系统，二是合法用户的越权访问。就本案而言，两者均不符合。</p>\n<p>目标网站设置反爬措施的目的是限制用户使用自动化程序这种方式登录，而不是限制非授权用户的登录，因为用户的账户密码本身就代表授权,网络爬虫如果得到用户的账户密码,其实也就是得到了授权。</p>\n<p>退一步讲，即使目标网站和用户之间约定了用户不能将账户密码交给别人使用，但这并不是国家规定，只能构成违约。</p>\n<p>（2）本罪法益是计算机信息系统的数据安全，而目前的立法对数据权属未作出明确规定。目前立法只对用户和数据网站之间的权利框架进行了拟定，但具体的权利义务关系尚未明晰，因此是否需要得到网站的授权尚且存疑。</p>\n<p>第一，根据《民法典》第一千零三十七条“自然人可以依法向信息处理者查阅或者复制其个人信息”的规定，用户在目标网站上的数据应判定为双方均拥有权益，且应当以用户的个人信息权为主、网站的数据使用权为辅。用户既然拥有一定的查阅和复制权,那么用户授权某公司去爬取自己的用户信息，也就是在一定程度上“让渡”了数据权利，行为的危害性就大大降低。</p>\n<p>第二，某公司所爬取的数据大部分是用户的初始数据，而不是目标网站基于初始数据加工而成的数据。数据分为原始数据和衍生数据（即数据网站在原始数据的基础上通过算法、数据模型等形成的抽象化、去标识化数据)，数据越靠近原始数据，用户对数据的权利越大，网站对数据的权利越小。</p>\n<p>本案中，用户自身授权某公司获取其在目标网站的数据，既有原始数据也有一定的衍生数据（如芝麻信用分、小白分）。对于原始数据，不应认定某公司对用户的数据安全法益造成了危害；对于衍生数据，应当存疑。</p>\n<p>基于<strong>数据创新和共享</strong>的考虑，应鼓励对原始数据的自由流通。当被爬虫的一方数据体量巨大，而其中的数据又属于原始数据或基础数据时，此时应当更多允许第三方的数据爬虫与数据合理使用。原因在于，当超级网络平台收集海量数据后，数据的潜在垄断就成为可能。</p>\n<p>第三，爬虫程序的存在具有合理性，且现有证据无法认定某公司影响了网站的正常运行。现行立法并没有对爬虫程序（即自动化程序）作出规定，但中央网信办2019年5月发布的《数据安全管理办法征求意见稿》第16条，首次以规范性文件的形式对爬虫（即自动化程序）进行界定：网络经营者采取自动化手段访问收集网络数据，不得妨碍网站正常运行，此类行为严重影响网站运行，如自动化访问收集流量超过日均流量三分之一，网站要求停止自动化访问收集时，应当停止。该意见稿条文只是对爬虫程序施加了不得影响网站运行的义务，但没有禁止爬虫的存在及其访问收集行为，故<strong>可以认为爬虫程序在不影响网站正常运行的前提下是合理的存在</strong>。</p>\n<p>本案中，现有证据无法认定某公司影响了网站的正常运行，虽然支付宝等网站表示未经许可的数据爬取行为占用了支付宝的网络和服务器资源，但无法证明此种“占用”影响了网站运行：</p>\n<p>一、某公司的爬取是在用户“一事一授权”下进行的，用户本身就有登录服务器查看自己数据的需求,即使某公司不代替用户爬取数据，用户也会自己登录网站查看数据，其对服务器的“占用”并无二致，甚至某公司的爬虫程序效率更高。</p>\n<p>二、参考《数据安全管理办法征求意见稿》,如果要认定某公司的爬取行为违法，应当证明其对淘宝等网站的运行造成了影响，如自动化访问收集流量超过日均流量三分之一等情形，但淘宝等网站出具的情况说明只表明某公司的爬取行为会占有服务器资源，但占用了多少服务器资源，日均流量是否超过三分之一，是否对网站运行造成影响，现有证据无法证明。</p>\n<p>三、违法所得或者经济损失无法计算。由于本案中某公司获取的数据并非“身份认证信息”，因此，依照两高《关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释》，本案适用的“情节严重”的标准应当是违法所得五千元以上或者造成经济损失一万元以上。</p>\n<p>本案中，某公司既爬取了有反爬措施的淘宝、京东等网站的数据，也爬取了没有反爬措施的公积金、车险等网站的数据，而某公司的收费是以用户为单位，每个用户的所有信息（既包括有反爬措施的信息，也包括没有反爬措施的数据）混合在一起提供给网贷公司，以此作为其营利手段之一，故其每次的收费项目中既包含营利手段之一，故其每次的收费项目中既包含没有反爬措施情况下爬取的数据，也包含有反爬措施情况下爬取的数据，难以加以区分。</p>\n<p>“爬虫第一案”的判决结果</p>\n<p>被告单位杭州某数据科技有限公司犯侵犯公民个人信息罪，判处罚金。</p>\n<p>被告人周某犯侵犯公民个人信息罪,判处有期徒刑三年，缓刑四年，并处罚金。</p>\n<p>被告人袁某犯侵犯公民个人信息罪，判处有期徒刑三年，缓刑三年，并处罚金。</p>\n<p>结论</p>\n<p>技术中立并非侵犯公民个人信息的挡箭牌。对于网络爬虫技术，既要看到它对信息资源流通共享的不可或缺性，也要意识到它的滥用对个人信息权益造成的严重侵犯。科技企业在使用网络爬虫技术的过程中，需要严格遵守现行法律法规，遵循爬虫技术规则，尊重爬虫对象设置的技术保护措施。唯有如此，才能在法治逻辑下使爬虫回归技术本质，推动整个行业健康有序发展。</p>\n<p>点评 &amp; 与谈</p>\n<p>01</p>\n<p>北京航空航天大学法学院 </p>\n<p>裴炜 副教授</p>\n<p>网络信息时代处理网络信息纠纷时所面临的新问题、新挑战对立法者、司法者和行业从业人员都产生了一系列的冲击和影响。因此，急需各方相互协作来为这些新问题提出新方案。</p>\n<p>关于本案，网络爬虫技术本身是被需要的，其被广泛运用于社会生活的方方面面。虽然传统行业对网络技术的使用十分有限，但由于社会的进步，社会需求发生了改变，这使得对数据的处理和应用逐渐成为了一种专门的行业。</p>\n<p>1.关于这一领域的法律规定还处于不断建构之中。要不断完善不同法律规定的契合衔接问题。</p>\n<p>2.不同行为的法律责任分界还不明晰。不同的行为在侵犯个人信息的程度上存在差别。</p>\n<p>3.在整体的社会治理层面越来越依赖公权力机关和私主体的合作。私主体在配合公权力机关管理社会公共事务时，如何把握个人信息处理的边界、强度、方式、途径等问题，当前立法方面对此的回应还有所欠缺。因此，立法应当规范网络侦查措施。</p>\n<p>02</p>\n<p>天津大学法学院 </p>\n<p>王燃 副教授</p>\n<p>王燃副教授分享了她对解决海量证据这一难题的思考。她认为，对于大数据证据，现有的解决方案是综合认定、等约计量、推定、抽样等证明方法，这些方法或降低了证明标准，或转移了证明责任的分配，有些则属于非证据证明方法。由此，可以转变思路，将海量证据按照数据生成类型加以区分。不同形态的数据由于存在的法律问题不同，其解决方案也各不相同。</p>\n<p>03</p>\n<p>中国社会科学院法学研究所 </p>\n<p>胡昌明 助理研究员</p>\n<p>胡昌明研究员认为，如何利用新技术很重要。虽然技术本身中立，但是技术的使用也可能会引发犯罪——公司创业过程中的创新点如果没有相应的合规或法律人士的纠偏，就可能会触犯法律。</p>\n<p>除此之外，个人信息保护也很重要。信息爆炸时代，个人信息的泄露防不胜防，如申领健康码时需要填写大量个人信息、在跳转第三方程序、以及使用人脸识别时也可能造成信息泄漏，但是，一些网站/软件的免责声明却称如果遭到黑客攻击而引发信息泄漏，网站/软件是免责的，而如果用户在注册时不点击“同意免责声明”就无法接受其服务。可见，日常生活中个人信息的保护还是相当薄弱的。因此，民法典、个人信息保护法甚至是刑法的对个人信息的保护就显得尤为重要。</p>\n<p>最后，胡昌明研究员就以下两个问题向桑涛主任提出了自己的疑问：</p>\n<p>1、魔蝎公司除了刑事责任外，相应的民事责任应如何承担？</p>\n<p>2、如果魔蝎公司明确告知客户会保存账户和密码，客户也进行了承诺，还是违法犯罪行为吗？</p>\n<p>观众提问</p>\n<p>问</p>\n<p>如果访问过度，造成了服务器的崩溃，构成破坏吗？</p>\n<p>一般情况下，只有恶意的入侵访问或者在特殊时期的访问才会构成破坏。在本案中，魔蝎公司的访问不构成对计算机信息系统的破坏。当然如果是恶意的侵入，则可以认定为对计算机信息系统的破坏。应当区分不同的情况。</p>\n<p>答</p>\n<p>问</p>\n<p>网络平台的数据属于用户还是网络平台所有？</p>\n<p>要将“信息”与“数据”区分开。信息归属于公民个人，但数据可能是经过平台处理过的信息，则不可将其简单归于公民个人。还需要通过对数据的内容以及数据经过平台的工作而加以区分。</p>\n<p>答</p>\n<p>问</p>\n<p>如何认定动态数据的数量？数据的起点、终点如何选取？</p>\n<p>机器的行为可以被大数据所识别。一些互联网公司会研发系统来识别出此类机器行为。但这仍然是一个司法机关和犯罪分子不断博弈的过程。</p>\n<p>答</p>\n<p>案例|爬虫行为的刑事风险之侵犯著作权罪</p>\n<p>中国裁判文书网  2020-09-28 22:32</p>\n<p>在金某某、潘某侵犯著作权案（上海市杨浦区人民法院（2018）沪0110刑初150号刑事判决书）中，法院查明，“被告人金某某、潘某合谋成立冰豆公司，以冰豆公司的名义雇佣员工开发“免费小说书城”手机APP软件(安卓端)，在该APP软件上提供各类网络小说的在线阅读服务。被告人潘某负责编写爬虫软件从互联网上抓取小说数据储存至租用的阿里云服务器内(阿里云账号：jinkelei@aliyun.com)。当用户在该手机APP软件上点击阅读某小说(仅有书名和目录)时，爬虫软件即从互联网上抓取用户所需的小说内容，发送并缓存至上述服务器内，供用户免费阅读。被告人金某某负责对该软件进行推广并联系广告商在该APP软件上登载广告，通过用户点击量牟取广告收益。”</p>\n<p>法院认为：“本院认为，被告人金某某、潘某结伙，以营利为目的，未经玄霆公司许可，复制玄霆公司享有信息网络传播权的文字作品1,024部，并通过信息网络向公众传播，情节严重，其行为均已构成侵犯著作权罪，公诉机关指控的罪名成立，对被告人金某某、潘某依法应予惩处。”</p>\n<p>附判决书全文：</p>\n<p>金某某、潘某侵犯著作权一审刑事判决书</p>\n<p>上海市杨浦区人民法院</p>\n<p>刑事判决书</p>\n<p>（2018）沪0110刑初150号</p>\n<p>公诉机关上海市虹口区人民检察院。</p>\n<p>被告人金某某，男，1987年2月13日出生，汉族，户籍在浙江省宁波市，暂住浙江省杭州市。</p>\n<p>辩护人曾智红、张镒铭，上海汉路律师事务所律师。</p>\n<p>被告人潘某，男，1987年11月26日出生，汉族，住浙江省杭州市。</p>\n<p>辩护人赵勤犇、严轶韬，浙江京衡律师事务所律师。</p>\n<p>上海市虹口区人民检察院以沪虹检航金刑诉〔2018〕12号起诉书指控被告人金某某、潘某犯侵犯著作权罪提起公诉。本院于2018年2月27日受理后，经审查发现，被告人金某某、潘某的犯罪地及户籍地均不在本市虹口区，本院遂请示上级法院，经指定，本案由本院审判。本院依法组成合议庭，公开开庭审理了本案。上海市虹口区人民检察院指派检察员段某出庭支持公诉，被告人金某某及其辩护人曾智红、被告人潘某及其辩护人严轶韬到庭参加诉讼。本案现已审理终结。</p>\n<p>公诉机关指控，上海玄霆娱乐信息科技有限公司(以下简称“玄霆公司”)住所在本市浦东新区张江镇中心路XXX号XXX-XXX室，系依法取得互联网出版和网络文化经营许可资质的有限责任公司。玄霆公司通过与《斗罗大陆》等文字作品的作者签订协议，取得上述作品永久的独家信息网络传播权，并将上述作品在其经营的“起点中文网”(域名：www.qidian.com)上登载。</p>\n<p>2015年1月，被告人金某某、潘某合伙成立杭州冰豆科技有限公司(以下简称“冰豆公司”)，雇佣员工开发“免费小说书城”手机APP软件(安卓端)，在该APP软件上提供各类网络小说的在线阅读服务。被告人潘某负责编写爬虫软件从互联网上抓取小说数据储存至其租用的阿里云服务器内(阿里云账号：jinkelei@aliyun.com)。当用户在该手机APP软件上点击阅读某小说(仅有书名和目录)时，爬虫软件即从互联网上抓取用户所需的小说内容，发送并缓存至上述服务器内，供用户免费阅读。被告人金某某负责对该软件进行推广并联系广告商在该APP软件上登载广告，通过用户点击量牟取广告收益。经盘石软件(上海)有限公司计算机司法鉴定所鉴定，上述阿里云服务器内存储的3,507部文字作品与玄霆公司同名电子书存在实质性相似。其中，《斗罗大陆》等1,024部小说经玄霆公司确认侵犯其信息网络传播权。</p>\n<p>2017年8月1日，被告人金某某、潘某在其公司经营地杭州市滨江区江虹路XXX号国际创意园6E-705室被公安人员抓获归案。到案后，被告人金某某、潘某向玄霆公司予以经济赔偿，并取得该公司谅解。</p>\n<p>公诉机关确认，被告人金某某、潘某结伙，以营利为目的，未经著作权人许可，复制发行其文字作品，情节严重，其行为均应当以侵犯著作权罪分别追究其刑事责任。被告人金某某、潘某到案后均如实供述自己的罪行，可以从轻处罚。案发后，被告人金某某、潘某均对玄霆公司作出经济赔偿并获得谅解，可以酌情从轻处罚。提请依法惩处。</p>\n<p>被告人金某某、潘某对起诉书指控的犯罪事实及罪名均无异议。</p>\n<p>被告人金某某的辩护人对起诉书指控的犯罪事实及罪名无异议，同时提出，被告人金某某系初犯，主观恶性较小；能如实交代罪行，认罪悔罪态度较好；对玄霆公司进行了赔偿，获得被害单位的谅解；孩子幼小，是家庭的主要经营来源，请求对被告人金某某从轻处罚并适用缓刑。</p>\n<p>被告人潘某的辩护人对起诉书指控的犯罪事实及罪名无异议，同时提出，被告人潘某系初犯、偶犯，到案后对自己的罪行供认不讳，竭尽所能对玄霆公司进行了赔偿，请求对被告人潘某从轻处罚并适用缓刑。</p>\n<p>经审理查明，玄霆公司系依法取得互联网出版和网络文化经营许可资质的有限责任公司。玄霆公司通过与《斗罗大陆》等文字作品的作者签订协议，取得上述作品永久的独家信息网络传播权，并将上述作品在其经营的“起点中文网”(域名：www.qidian.com)上登载。</p>\n<p>2015年1月，被告人金某某、潘某合谋成立冰豆公司，以冰豆公司的名义雇佣员工开发“免费小说书城”手机APP软件(安卓端)，在该APP软件上提供各类网络小说的在线阅读服务。被告人潘某负责编写爬虫软件从互联网上抓取小说数据储存至租用的阿里云服务器内(阿里云账号：jinkelei@aliyun.com)。当用户在该手机APP软件上点击阅读某小说(仅有书名和目录)时，爬虫软件即从互联网上抓取用户所需的小说内容，发送并缓存至上述服务器内，供用户免费阅读。被告人金某某负责对该软件进行推广并联系广告商在该APP软件上登载广告，通过用户点击量牟取广告收益。</p>\n<p>经盘石软件(上海)有限公司计算机司法鉴定所鉴定并经玄霆公司确认，“免费小说书城”所关联的阿里云服务器内存储的3,507部文字作品与玄霆公司提供的同名电子书样本进行相似度比对，其中《斗罗大陆》等1,024部小说侵犯玄霆公司的作品信息网络传播权。</p>\n<p>2017年8月1日，被告人金某某、潘某在其公司经营地杭州市滨江区江虹路XXX号国际创意园6E-705室被公安人员抓获归案。到案后，被告人金某某、潘某向玄霆公司予以经济赔偿，并取得该公司谅解。</p>\n<p>审理中，被告人金某某、潘某分别退出违法所得人民币120万元、70万元，并分别向本院交纳人民币130万元、45万元。</p>\n<p>以上事实，有下列证据予以证实：</p>\n<p>1、玄霆公司营业执照、互联网出版许可证、网络文化经营许可证、增值电信业务经营许可证、电信业务经营许可证年检情况记录表、作品协议、声明、情况说明等，证实玄霆公司具有运营“起点中文网”的资质，并享有《斗罗大陆》等文字作品永久的信息网络传播权，有权在“起点中文网”上登载。</p>\n<p>2、杭州市下城区市场监督管理局出具的冰豆公司登记基本情况、公司登记申请书、营业执照等，证实被告人金某某系该公司法定代表人，潘某系股东。</p>\n<p>3、上海市公安局虹口分局搜查笔录、扣押清单，证实冰豆公司的营业执照复印件、公章等物被公安机关扣押的事实。</p>\n<p>4、玄霆公司出具的授权委托书及情况说明、证人赵某的证言、上海惠瀚资产管理有限公司出具的营业执照及授权委托书等，证实被告人金某某、潘某在未经玄霆公司许可的情况下，通过“免费小说书城”手机APP软件传播其享有著作权的文字作品的事实。</p>\n<p>5、上海惠瀚资产管理有限公司报案材料、百度联盟广告收益网页截图，证实被告人金某某、潘某通过“免费小说书城”手机APP软件登载广告牟取广告收益的事实。</p>\n<p>6、上海市公安局虹口分局调取证据清单、盘石软件(上海)有限公司计算机司法鉴定所司法鉴定意见书、补充鉴定意见书、玄霆公司出具的情况说明书、作品权利证明文件清单及刻录光盘，证实“免费小说书城”关联的阿里云服务器内存储的3,507部电子书与玄霆公司提供的同名样本电子书进行相似度比对，其中1,024部电子书经玄霆公司确认侵犯其信息网络传播权。</p>\n<p>7、证人刘1、项某、刘某2、岳某某的证言，证实被告人金某某、潘某雇佣他人通过开发“免费小说书城”手机APP软件提供用户免费小说阅读服务,并在APP中登载广告获取收益。</p>\n<p>8、玄霆公司出具的谅解书及相关银行转账汇款凭证复印件等，证实被告人金某某、潘某到案后已对玄霆公司予以经济赔偿并获得玄霆公司谅解。</p>\n<p>9、上海市公安局虹口分局网络安全保卫支队、曲阳路派出所分别出具的受案登记表、工作情况、案发经过，证实本案的案发过程及被告人金某某、潘某的到案情况。</p>\n<p>10、被告人金某某、潘某的供述，证实其对上述犯罪事实供认不讳。</p>\n<p>上述证据均经庭审质证属实，足以认定。</p>\n<p>本院认为，被告人金某某、潘某结伙，以营利为目的，未经玄霆公司许可，复制玄霆公司享有信息网络传播权的文字作品1,024部，并通过信息网络向公众传播，情节严重，其行为均已构成侵犯著作权罪，公诉机关指控的罪名成立，对被告人金某某、潘某依法应予惩处。被告人金某某、潘某到案后均如实供述自己的罪行，依法可以从轻处罚。鉴于被告人金某某、潘某对玄霆公司作出经济赔偿并获得了谅解，审理中两被告人退出了违法所得，被告人金某某预交了罚金、被告人潘某预交了部分罚金，故对被告人金某某、潘某均可酌情从轻处罚。为严肃国法，维护市场经济秩序，保护知识产权，根据被告人金某某、潘某的犯罪情节、社会危害性、认罪悔罪态度等，依照《中华人民共和国刑法》第二百一十七条第(一)项、第二十五条第一款、第六十七条第三款、第七十二条第一款及第三款、第七十三条第二款及第三款、第五十三条、第六十四条，《最高人民法院、最高人民检察院关于办理侵犯知识产权刑事案件具体应用法律若干问题的解释》第十一条，《最高人民法院、最高人民检察院关于办理侵犯知识产权刑事案件具体应用法律若干问题的解释(二)》第一条、第二条第一款及第三款、第四条之规定，判决如下：</p>\n<p>一、被告人金某某犯侵犯著作权罪，判处有期徒刑十个月，缓刑一年，罚金人民币一百三十万元(已预缴)；</p>\n<p>二、被告人潘某犯侵犯著作权罪，判处有期徒刑十个月，缓刑一年，罚金人民币八十万元(已预缴四十五万元)；</p>\n<p>(上述二名被告人的缓刑考验期限，均从判决确定之日起计算;罚金自本判决发生法律效力之日起十日内向本院缴纳。)</p>\n<p>三、扣押在案的违法所得人民币一百九十万元、犯罪工具oppo手机、MEIZU手机、mi手机等均予以没收。</p>\n<p>金某某、潘某回到社区后，应当遵守法律、法规，服从监督管理，接受教育，完成公益劳动，做一名有益社会的公民。</p>\n<p>如不服本判决，可在接到判决书的第二日起十日内，通过本院或者直接向上海市第三中级人民法院提出上诉。书面上诉的，应当提交上诉状正本一份，副本一份。</p>\n<p>审判长  陈蔓莉</p>\n<p>审判员  刘燕萍</p>\n<p>人民陪审员  吴奎丽</p>\n<p>二〇一八年五月十六日</p>\n<p>书记员  周恒</p>\n<h2>两人因使用爬虫非法爬取、使用淘宝11.8亿用户数据获罪</h2>\n<p>近日，河南省商丘市睢阳区人民法院公布了一份刑事判决书。判决书显示，被告人逯某长期使用爬虫非法爬取淘宝用户数据，被告人黎某将该用户数据用于公司经营活动，两人的行为已构成侵犯公民个人信息罪，分别被判处有期徒刑三年三个月与有期徒刑三年六个月。</p>\n<p>据判决书内容显示，该案件中淘宝遭爬取的这些数据包括了用户的ID、昵称、注册时间甚至是手机号，而在阿里巴巴注意到该问题前，已有11.8亿条用户信息数据遭泄露。</p>\n<p>2020年8月14日淘宝（中国）软件有限公司报警称，在2020年7月6日到2020年7月13日，有黑产通过mtop订单评价接口绕过平台风控批量爬取加密数据，爬取字段量巨大，平均每天爬取数量500万。警方立案调查后于2020年8月15日将逯某抓获归案。2020年8月21日将黎某抓获归案。</p>\n<p>自2019年以来，被告人逯某受雇于被告人黎某，作为黎某公司的技术员，一直在家远程办公，逯某在商丘市睢阳区其家中利用自己开发的爬虫软件，通过淘宝网页接口爬取淘宝客户的信息，并将其中淘宝客户的手机号码提供给被告人黎某开设的浏阳市泰创网络科技有限公司用于经营活动。</p>\n<p>黎某在收到逯某提供的用户数据后，将这些数据导入“微信加人”软件，将用户拉入建好的微信群，群里有公司的员工负责发送广告链接。这些淘宝用户在该公司的微信群里购买商品，该公司则以此收取淘宝网佣金和商家服务费，公司从中获利约34万元。</p>\n<p>据证人王某证实，浏阳市泰创网络科技有限公司约有1100个微信群，每个微信群最多有200人，最少约90人。淘宝客户资源由老板黎某自己负责，公司的其他人甚至不知道有逯某这个人。</p>\n<p>被告人逯某辩称，十一亿八千万条用户数据中他只采集了五千万条，其余不是他采集的，而是从其它地方下载的，他采集的信息没有传播，只有电话号码，没有身份信息，没有联系任何一个用户，没有得到利润。获利只有黎某转给他的六七万或七八万元。</p>\n<p>虽然二人未将信息用非法目的，主观恶性小，有坦白情节，但法院认为，被告人逯某受雇于被告人黎某，二人违反国家规定，非法获取公民个人信息，情节特别严重，其行为均已构成<strong>侵犯公民个人信息罪</strong>。</p>\n<p>公诉机关指控罪名成立，且系共同犯罪。逯某获有期徒刑三年三个月，并处罚金人民币十万元；黎某获有期徒刑三年六个月，并处罚金人民币三十五万元。</p>\n<p>网络爬虫技术本身具有技术中立性，但非法抓取数据可能构成多种犯罪。近年来被判刑的爬虫相关案件有几个共同点：</p>\n<p>一是未经对方许可爬取数据；</p>\n<p>二是爬取了与用户隐私相关的数据；</p>\n<p>三是扰乱了对方网站的正常经营；</p>\n<p>四是利用非法爬取的数据牟利。</p>\n<p>根据相关法律法规，网络爬虫入罪的关键在于访问、抓取数据行为是否获得许可、授权。网络爬虫入罪的基本标准是，网络爬虫客观上有突破数据保护措施的行为，行为人主观上有突破数据保护措施的故意。</p>\n<h2>技术无罪，但法律有红线</h2>\n<p>互联网领域有一句话“互联网上的信息超过一半信息是爬虫获取的”。这句话伴随互联网的蓬勃发展，正越来越变得真实且大有愈演愈烈之势。同样是利用爬虫技术爬取他人数据信息，为何会分别出现刑事打击和民事赔偿两种不同的结果呢？本文拟通过对两个典型案例的对比分析，探讨数据类企业在数据爬取过程中的合规边界及风险应对。</p>\n<p>案例1，2017年11月，北京市海淀区人民法院就上海晟品网络科技有限公司及公司高管犯非法获取计算机信息系统数据罪公开进行宣判（2017）京0108刑初2384号。该公司被判处罚金20万元，5名成员分别被判处有期徒刑1年到9个月，并处罚金3万到5万不等。本案荣获2019年度人民法院十大刑事案件，也被业界获评“爬取入刑第一案”。</p>\n<p>在该案中，被告人侯某强等5人作为该公司员工，经过共谋，于2016年至2017年间采用技术手段抓取被害单位北京字节跳动网络技术有限公司服务器中存储的视频数据，并由侯某强指使被告人郭某破解北京字节跳动网络技术有限公司的防抓取措施，使用“tt_spider”文件实施视频数据抓取行为，造成被害单位北京字节跳动网络技术有限公司损失技术服务费人民币2万元。经鉴定，“tt_spider”文件中包含通过头条号视频列表、分类视频列表、相关视频及评论3个接口对今日头条服务器进行数据抓取，并将结果存入到数据库中的逻辑。在数据抓取的过程中使用伪造device_id绕过服务器的身份校验，使用伪造UA及IP绕过服务器的访问频率限制。</p>\n<p>在本案中，北京市海淀区人民法院认为，被告人单位采用爬虫技术手段，破解了受害人单位的反爬措施，抓取受害人单位计算机系统中的存储的数据，并造成了2万元的技术费损失，属于情节严重，其行为构成构成非法获取计算机信息系统罪。</p>\n<p>案例2，2021年9月14日上午，杭州互联网法院依法公开审理了原告深圳市腾讯计算机系统有限公司（以下简称“腾讯公司”）、腾讯科技（深圳）有限公司（以下简称“腾讯科技公司”）与被告某新媒体公司不正当竞争纠纷案，并当庭宣判。该案系不正当使用网络爬虫工具抓取微信公众号相关数据的典型案例。本案中，原告以被告公司爬取微信公众号数据的行为构成不正当竞争将其诉至法院，称被告利用被控侵权产品，突破微信公众平台的数据防护措施进行数据抓取，并进行商业化利用，妨碍平台正常运行。而被告辩称爬取并提供公众号数据服务的行为不构成不正当竞争。被告爬取的文章并非腾讯公司的数据，而是登录微信公众号的用户数据，且其网站获利较少，现已关闭。其后，经法院查明，被告某新媒体公司，利用爬虫技术抓取腾讯公司开发的微信公众号平台信息内容及数据，并通过其网站对外提供公众号搜索、导航及排行等数据服务的行为构成不正当竞争；遂判决被告立即停止数据抓取行为、消除影响并赔偿损失60万元。</p>\n<p>以上两案件共同的特点是，爬取一方均是利用网络爬虫技术突破、绕开了被爬取方的反爬措施，进而对被爬取方方系统内的数据信息进行非法获取；被爬取方均对其自身的计算机系统采取了一定的防护措施；同时，爬取一方均对被爬取方造成了一定的经济损失；</p>\n<p>两案不同的地方在于，在今日头条案中，上海晟品公司造成的经济损失仅有2万元, 而今日头条却选择了刑事打击的手段进行维权，并且一举成功；而在腾讯公司与某新媒体公司一案中，腾讯公司选择了民事诉讼的手段维权，最后被判赔的损失高达60万元。这其中究竟存在怎样的考量？在面对数据爬取的时候如何维权才是最符合企业需求的，或者如何才能合法合规的爬取他人数据，值得每一位数据类企业家思考!</p>\n<p>从以上两个案例中看，不管是突破计算机信息系统还是绕开计算机系统的防爬措施，在没有合法授权的情况下，均会涉嫌违法；同时再结合造成的后果的严重程度，最终判断是否构成刑事犯罪或者构成民事侵权。那么，“爬取”的合规边界到底在哪里呢？从技术中立的角度来看，爬虫技术本身并无违法违规之处，因此“如何使用”爬虫技术，是判断爬虫行为是否合法的标准之一。另外，从生效判例来看，当司法机关在无法证明行为人的爬虫行为突破或绕开了反爬措施，那么一般认为此种犯罪是不成立的，从而落入民事侵权的管辖范畴。此外，行为人如果绕开的技术措施强度较低（如token数值常年不变），司法机关也一般不做犯罪处理。</p>\n<p>关于爬虫的规制，目前尚无单独的法律规范，但司法实践中已经诞生了诸多案例；但作为被爬取的对象—数据，在刚刚颁布的《数据安全法》中对数据的安全及发展进行了全面的规定；即将生效的《个人信息保护法》也从个人信息保护的角度，对数据的保护及合规使用进行详细规定；结合《民法典》及《刑法》中关于数据、个人信息保护的有关规定，我国对数据的保护已经形成了一套完整的法律体系；但由于上述法律法规对数据的保护侧重点各有不同，因此，数据类企业在数据爬取方面将面临着更高的合规风险，承担更多的合规义务。</p>\n<p>回到今天的话题，在今日头条案诞生以前，爬虫类案件多以民事诉讼程序解决，案由均以反不正当竞争为主。然今日头条却以一己之力将此前归属民事案件范畴的数据纠纷，一举引入刑事打击的范畴。据中国裁判文书网显示，自“爬虫第一案”诞生以来，已经有85例爬虫类刑事案件产生；“爬虫第一案”的诞生使得数据平台拥有了核武般的维权手段；面对巨量的数据爬取者，数据平台的维权手段更加多样化，更加犀利；数据平台可以根据自己的不同场景需求及目的，采用不同的维权手段以达到不同的效果；而数据平台的不同选择和不同司法裁判者的不同裁判，不但给数据爬取的行为带来了更为严格的合规法律风险，也给数据行业的发展带来了新的变化。而对于数据爬取企业而言，如何在合法合规的前提下开展数据爬取业务，将是一个值得长期思考的主题。</p>\n<h2>全国首例！兜售“爬虫”软件？判刑！</h2>\n<p>明明只是进直播间看了眼带货，结果其他销售同类产品的商家就精准找上了门，这是巧合吗？如果遇到这种情况，请注意，你的信息可能已被非法“爬取”！近日，无锡市梁溪区人民法院就审结了这样一起案件，这是全国首例短视频平台领域的网络“爬虫”案件。</p>\n<p>案件详情</p>\n<p>2021年9月，无锡市梁溪区的丁某甲在网上结识了丁某乙，丁某乙表示其有一款“爬虫”软件<strong>可以</strong><strong>获取某短视频</strong><strong>平台的用户数据</strong>，通过输入关键词搜索，可以<strong>快速抓取用户信息</strong>，主要包括用户名、评论、账户UID等。如果丁某甲感兴趣，可以购买代理权，做软件的推广，从中赚取差价。丁某甲在试用后觉得不错，便决定代理，并对软件“改头换面”后<strong>对外进行销售</strong>。2021年10月到12月期间，丁某甲组织公司销售人员通过网络<strong>向多人销售</strong>这款软件，<strong>违法所得共计24360元</strong>。后某信息公司员工发现了这款“爬虫”软件居然可以“爬取”自己公司后台数据和直播间用户的相关信息，随即报警。经侦查，公安机关很快锁定了丁某甲。</p>\n<p>案件审理</p>\n<p>梁溪法院审理认为，丁某甲的行为已经构成<strong>提供侵入计算机信息系统程序罪</strong>，判处丁某甲有期徒刑1年6个月，缓刑2年，并处罚金3万元，没收丁某甲的违法所得。同时，禁止丁某甲<strong>在缓刑考验期内从事互联网相关经营活动</strong>。（丁某乙另案处理）</p>\n<h2>什么是“提供侵入计算机信息系统程序罪”？</h2>\n<p>提供侵入计算机信息系统程序是指，<strong>提供专门用于侵入计算机信息系统的程序</strong>，或者<strong>明知</strong>他人实施侵入计算机信息系统的违法犯罪行为而为其<strong>提供程序</strong>，情节严重的行为。本案中，丁某甲在<strong>明知</strong>该“爬虫”软件<strong>未得到相关短视频平台授权</strong>，且通过<strong>非法手段</strong>侵入短视频服务器，获取平台用户的相关信息后，仍<strong>对外</strong><strong>销售</strong>这款软件，从中<strong>赚取利润</strong>，已经构成了提供侵入计算机信息系统程序罪。</p>\n<p>提供侵入计算机信息系统程序罪的量刑是怎样的？</p>\n<p>提供专门用于侵入计算机信息系统的程序，或者明知他人实施侵入计算机信息系统的违法犯罪行为而为其提供程序，情节严重的，<strong>处三年以下有期徒刑或者拘役</strong><strong>，</strong><strong>并处或者单处罚金</strong>；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。本案中，丁某甲从丁某乙处购买了“爬虫”软件的代理权，并作为该软件的推广销售方，将软件在市面上推出销售赚取差价，共获得违法所得24360元，<strong>属“情节严重”</strong>。因此，法院判处丁某甲有期徒刑1年6个月，缓刑2年，并处罚金3万元，并没收违法所得，是合理的。</p>\n<p>律师寄语</p>\n<p>互联网已经渗透到我们每个人生活的点点滴滴，对互联网大数据的保护是每一个互联网参与者都应予以重视的。首先，每一位互联网参与者在享受互联网带给我们生活便捷的同时，都要增强法律意识，<strong>遵守行业协议</strong>，<strong>正确使用爬虫软件</strong>，为整个互联网营造一个合理、合法的运营环境。其次，各大互联网平台也应<strong>做好用户信息数据的保护工作</strong>，保障每一位用户在平台上的个人信息安全，防止违法人员以非法手段窃取牟利。我们必须时刻谨记：互联网不是法外之地，任何利用互联网危害网络安全的违法犯罪行为，都将会受到法律的制裁。</p>\n<h2>合法爬虫行为的入罪思考——大数据环境下公民个人信息保护视角</h2>\n<p>要目</p>\n<p>一、爬虫行为对公民个人信息可能带来的侵害二、爬虫行为侵犯公民个人信息的两个面向三、大数据背景下爬虫行为侵犯公民个人信息的规制路径结语</p>\n<p>网络爬虫行为目前已进入刑法视野，而爬虫技术的不当使用也会损害到公民的权利。公民个人信息具有其特殊性，在经过大数据处理后可用性极高，传播能力极强，会给其他犯罪提供便利，必须要谨慎对待。符合协议的多次爬虫目前不存在形式违法性，所以现有的法律法规很难针对性地进行规制，但其具有的实质违法性不可忽视，出于防患于未然的需要，有必进行入罪的思考。大数据爬虫行为入罪具有理论正当性和现实可能性。现有的刑法分则并不需要修改，通过对相关行政法规的解释和补充即可完成入罪。</p>\n<p>网络爬虫，是指于计算机技术和互联网技术，能够按照一定的规则或者要求，自动地、批量地从互联网上下载、拷贝或获取信息的程序，也可以说是一种技术。爬虫技术在最初产生的时候是为了弥补通用搜索引擎的不足，辅助人们从大量的互联网数据中获取有用的信息，具有技术中立的属性。这里说的中立，是相对于所有使用者而言的，因为爬虫本身在技术上就必然会侵犯互联网信息中有关版权的部分，所以网络社会上达成了一个共识，就是robots（Robots Exclusion Protocol网络爬虫排除标准）协议，这个协议可指示爬虫程序，目标网站是否允许进行信息的抓取行为，结合自动化处理，就可以正确地进行信息的获取，而不损害到其他人的权利。但这个协议就如同计算机领域的许多其他协议一样，可以说是“君子协议”，不是什么技术壁垒，是行业从业者互相尊重的体现，好比私家花园的门口挂着“闲人免进”，尊重者绕道而行，不尊重者依然可以推门而入。虽然目前国内外对爬虫协议的效力尚无定论，但表明了如果不遵守则有可能有承担法律责任的风险。</p>\n<p>近年来，随着互联网和计算机的不断普及，这项技术愈发广泛地被使用，如许多互联网公司运用爬虫来获取用户位置、喜好等信息，结合大数据处理就可以针对性进行产品推广，提高效率，是一种双向互利的应用。但也有许多不法分子利欲熏心，利用这项技术实施了损害他人利益的行为。如2012年360搜索违反协议，非法抓取百度公司旗下若干网站信息，被裁定赔偿70万元。2016年，百度公司未经大众点评授权，在自己旗下的若干网站中非法使用了大众点评的用户点评信息，被裁定赔偿300万元。2017年，晟品网络科技有限公司负责人违反协议，破解了今日头条服务器的保护措施并抓取信息，被判决非法获取计算机信息数据罪，处有期徒刑和罚金刑，是国内首起“爬虫入刑”案件。由此，可以看出，爬虫技术作为犯罪工具已存在相当规模，对其进行刑法上的规制也事不宜迟。但从广义上来说，上述案例中被侵害的大多是企业的商业利益，而笔者认为，爬虫技术对于公民个人信息的侵害也是必须要加以考虑的，甚至应当是刑法就爬虫行为着重关注的部分。</p>\n<p>一、爬虫行为对公民个人信息可能带来的侵害</p>\n<p>就涉及公民个人信息的爬虫行为而言，目前已经发生诸多案例。例如，2019年北京巧达科技因其简历数据业务被查封，原因在于通过大数据和爬虫技术获取并汇总了多家招聘网站的账号信息，并提供相关功能，为企业类用户提供了大量便利，存在同时侵犯商业利益和公民个人信息之嫌。2019年央视315点名“社保掌上通”，因为该app涉嫌窃取用户社保信息并使用，随后该app从应用商城下架，所属公司也被深交所下发询问函。瑞智华胜公司通过爬虫软件非法抓取30亿条公民个人信息、用户账户密码，并进行使用、贩卖来谋取巨额非法利润，相关非法经营人员被判有期徒刑或罚金。上述案例都是在爬虫抓去的信息内容上都涉及了公民个人信息，在司法实践中多以计算机相关犯罪或商业机 密相关犯罪进行认定，笔者认为，这在司法实践上是没有问题的，在形式上它们都违反了爬虫协议和相关法律法规，在实质上也对其他公司和国家利益造成了损害，根据罪刑法定原则被认定为相关罪名 是合理合法的。但笔者想在这里提出的是，在不违反爬虫协议的情况下，以合法的手段从其他网站抓 取用户个人信息并加以利用，在刑法上该如何看待？</p>\n<p>根据2016年发布、2017年实施的网络安全法第41条和42条的规定，“网络运营者收集、使用个人信息，应当遵循合法、正当、必要的原则，公开收集、使用规则，明示收集、使用信息的目的、方式和范围，并经被收集者同意”“网络运营者不得泄露、篡改、毁损其收集的个人信息；未经被收集者同意，不得向他人提供个人信息”，都在形式上对爬虫抓取个人信息及其使用进行的规制，在一定程度上对公民个人信息起到了保护的作用。但笔者认为，该条文可能存在缺漏，即该法规中的抓取行为，是发生在网络运营者和个人用户之间的，而根据现实来看，即使网络运营者在用户协议中明确醒目地表示会开放爬 虫协议，或者说是允许信息的二次“被抓取”，用户也不会对其提出异议。因为，在用户可见的范围内，其信息的可用性是有限的，并不足以谨慎对待。而笔者在此则要提出一个概念，就是在二次抓取的情况下，公民个人信息的“量变与质变”，即公民个人信息相对于其他爬虫可获取信息的特殊性，以下就这一概念展开论述。</p>\n<p>笔者认为，公民个人信息在互联网上流通并被使用的，分为三个形态，分别是统计态、识别态、可信态。第一形态，统计态，具有统计学上的价值，就如网络安全法第42条中规定，这些信息是“经过处理无法识别特定个人且不能复原的”，所以商业公司在运用这些信息的时候，大多是用大数据处理的方式，来得出某一地区、某一行业、某一时间段的信息价值，也就是非个人的某一群体的信息价值，这样的信息利用只要在符合爬虫协议及相关法律法规的情况下是没有问题的，也是应当从技术革新的角度加以提倡的。而如果第一形态的信息是通过非法手段，违反协议获取的，实际上只存在对其他互联网运营者权益的侵害，存在不当竞争等行为之嫌，而很难说是侵害了公民个人信息背后隐含的个人法益，或者说是公民权利。第二形态，也就是识别态，则是能识别特定个人的指定信息，如某人的姓名、身份证与其工作场所的结合；某人的学生证号与其专业、所在学校的结合。这种信息一般是通过某些特定网站，如就业招聘网、考研辅导网等，在一次获取时一般都是合法的，并且在信息可用性上范围狭窄。</p>\n<p>而如前文所述，这种特定网站有可能在用户授权的情况下允许二次爬虫（可能用以规避相关法律法规以出售信息牟利，这种情形在此并不展开），从而用户个人信息的泄露，常见的二次使用场景就是产品推销、辅导产品定向推销等，危害性也是有限的。而第三形态，可信态，则是通过爬虫收集的识别态个人信息的结合体，经过大数据处理后的状态。在获取手段非法的情况下，获取这些信息自然不具有合法性，并无太大的论述空间。而在合法获取，也就是满足二次或多次爬虫协议的情况下，这种信息就会具有很大的可用性，在犯罪分子手中也就具有了很大的破坏性。最简单的例子，就是诈骗类行为，如校园贷、电信诈骗。一般的个人信息结合体，在犯罪人的手中具有局限性，因为信息过于简单，犯罪 人在诈骗、敲诈、勒索等行为中很容易被受害人识破而失手，即使有较多的信息组合使用，也只是处于 “量变”的阶段，在可用性上仍然受限。而一旦公民个人信息经过大数据处理，密切地结合起来时，信息的可用性就产生了“质变”。如在校园贷中，犯罪人通过大数据处理的爬虫信息，获取的学生的家庭信息、财务状况、学籍信息、消费习惯等，很容易针对性地选择被害人，犯罪成功的概率以及造成的损害会大大加强。而在电信诈骗中，通过收集公民个人信息如常居地、家庭成员、财务状况、犯罪史、投资喜好等，精通“表演”的诈骗人可以轻而易举地在电话的另一头扮演任何角色，假警察、假销售、假银行柜员都不在话下。再谨慎地普通公民在一连串紧密相关、真实有效的信息面前也会放下防备。此时，大数据环境下爬虫信息的超强可用性使得公民的人身安全、财产安全等重要权益都完完整整地“裸露”在了互联网社会上，任何有不法企图之人都能加以利用。</p>\n<p>除此之外，公民个人信息还具有其他常见犯罪客体，或者说是被侵害法益所不具有另一特殊性质，即可复制性。可复制性是计算机数据的一个重要特性，不同于著作权犯罪中的常见复制行为，计算机数据的复制可以说是无成本、无时效、无难度限制地，任何普通人都能够轻易地通过的下载工具、计算机自带的复制粘贴功能对公民个人信息进行备份。这与“制作、复制、贩卖、传播淫秽电子信息牟利行为”中的复制行为看似类似，但在结构上完全不同。淫秽电子信息如色情视频、色情文学作品，对其进行打击是因为它们损害了国家对于淫秽物品的管理秩序，而不是因为色情内容传播损害了公民的某些权利，本质上亦是基于高速的科技、社会发展对刑法第363条做出的合理的扩大解释，它们是同源的。淫秽电子信息离开犯罪牟利者或者是网络监管者掌控后，其造成的影响并不会扩大，正如我国刑法并不处罚个人仅持有或使用淫秽物品的行为，淫秽物品本身造成的损害也极其有限。对于公民个人信息则不同，如果把互联网社会比作统一的意识体的话，公民个人信息在经过传播和备份之后，由于其特殊的可用性，会像记忆一样存在于互联网上。而这一点也是有迹可循的，比如前些年引起社会各界重视的“裸贷门”事件，间接导致了“套路贷”的爆发，在公检法强势介入后才得以收尾。裸贷门中的公民个人信息仅仅是借贷人所拥有的部分联系人信息及个人私密照片，就已经足以引起社会动荡，而经过互联网的消化记忆，这些信息甚至在今天还可以轻易地获取到，导致借贷人的权益持续受到损害。“裸贷门”中仍处于识别态的公民个人信息，经过传播、复制就有如此“杀伤力”，那么经过爬虫批量获取，以及大数据处理的可信态公民个人信息，可能，抑或是在未来必将带来的损害显而易见。</p>\n<p>综上，笔者认为，那些借爬虫协议和法律法规所赋予“合法性”，掩盖自身违法性质的大数据爬虫行为，有必要进入刑法的视野。</p>\n<p>二、爬虫行为侵犯公民个人信息的两个面向</p>\n<p>形式违法的爬虫行为及刑法规制</p>\n<p>在公民个人信息保护方面，形式违法的爬虫犯罪，实际上就是违反了合法性原则或爬虫协议的行为，其考察的核心是“非法”要素。违反合法性原则，指的就是我国刑法第253条之一“侵犯公民个人信息罪”中的“违反国家规定”。爬虫本身作为中立技术，在进行数据抓取行为时应当符合国家法律、行政法规、部门规章等有关收集、处理、利用数据信息的规定。我国刑法第253条之一规定，构成侵犯公民个人信息罪的行为，必须首先是“违反国家规定”的行为，这里的“国家规定”，根据2017年6月1日施行的《最高人民法院、最高 人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》（以下简称《信息犯罪司法解释》）第2条的规定，是指“违反法律、行政法规、部门规章有关公民个人信息保护的规定”。作为该罪前置法的国家规定， 主要包括2016年11月7日全国人大常委会通过的网络安全法、2017年12月29日全国信息安全标准化技术委员会制定的《信息安全技术个人信息安全规范》、2013年7月16日工业和信息化部制定的《电信和互联网用户个人信息保护规定》、2012年12月28日全国人大常委会通过的《关于加强网络信息保护的决定》等。这些法律法规基本都确立了个人信息数据的取得使用等要遵循合法性原则。比如，《电信和互联网用户个人信息保护规定》第5条规定：“电信业务经营者、互联网信息服务提供者在提供服务的过程中收集、使用用户个人信息，应当遵循合法、正当、必要的原则。”《关于加强网络信息保护的决定》第1条规定：“任何组织和个人不得窃取或者以其他非法方式获取公民个人电子信息，不得出售或者非法向他人提供公民个人电子信息。”这些规定表明，技术中立的网络爬虫行为只要不当使用，也有认定其违法性的法律根据。除了这些前置法律法规外，2021年通过的个人信息保护法 也对公民个人信息相关事宜进行了规定。违反爬虫协议，指的是违反robots协议进行的爬虫行为。如前文所述，robots协议作为一种“君子协议”，通过设置目录文件来“指示”爬虫程序什么数据可以被抓取，什么数据不可以。但由于其不具有强制力，可以视为互联网运营中的行业规则。而违反行业规则的爬虫行为，根据通说，可以认定是“以其他方法非法获取公民个人信息”之“非法”。上述两个层次，即形式违法的爬虫犯罪，在实践中通常会同时侵犯多种法益，如抓取友商合法获取的一手公民个人信息，同时侵害了友商的商业秘密、计算机相关权利等，又侵害了作为信息所有者的公民个体的权，此时就需要进一步判断是否构成想象竞合、法条竞合，进而以一罪从重处罚或数罪并罚。不过，这并非本文讨论的重点，如刘艳红教授等学者也对这种情况进行了分析，此处便不再赘述。</p>\n<p>实质违法的爬虫行为及刑法规制</p>\n<p>对于实质违法的爬虫行为的讨论，笔者赞同法益侵害说。为了论证本文对形式合法的爬虫行为的入罪观点，达成逻辑的连贯，在此先讨论不具备实质违法性，而具有形式违法性的爬虫行为。如刘艳红教授指出，行为人在权限许可范围内使用爬虫行为获取公民个人信息的，不属于“非法”，不应认定为犯罪。典型的情况就是行为人在有权限进行一定范围内数据抓取，而为了提高数据抓取的效率，采用了违反爬虫协议，也就是具有一部分形式违法性的行为，不应当认为构成侵犯公民个人信息罪。如公司内部负责程序的员工，为了提高工作效率，在系统允许其手动查看其他员工个人信息的情况下，该员工使用爬虫程序，破解了公司服务器的防爬设置，并不构成犯罪。首先是相对于公司而言，获取其他员工的信息是公司赋予其员工的数据权利，利用爬虫软件批量抓取和手动查看在行为的性质和结果上不存在差异，没有造成法益侵害，故不构成犯罪。而对于其他公司员工而言，所有员工都具有这种数据权利，可以推定在公司内部获取其他员工信息是符合知情同意原则的，亦不构成犯罪。由此可见，信息的获取范围，在判断合法爬虫行为是否侵害法益、构成犯罪的关键点。但本文同时认为，信息的可用性也很重要，对于爬虫行为的定性，考察范围不能仅限于“获取”阶段，更要涉及信息的“使用”阶段。</p>\n<p>如前文所述，公民个人信息可以分为三个形态，其可用性，也就是识别力递增。在统计态中，合法手段抓取的公民个人信息由于失去的识别力，如果作为后续犯罪的原材料，很难产生破坏力，通常只涉及对其他主体财产权的损害。在识别态中，合法手段抓取的公民个人信息存在有限识别力，如果排除了形式违法性，其作为后续犯罪的原材料，能够造成的破坏力亦有限，如用于电话骚扰等，对于公民个人法益的侵害程度远不足以进入刑法的视野，大多由其他法律如治安管理处罚法来规制。而第三个层次，则是笔者着重关注的部分。在前文中，笔者提出了两个论断，即“允许信息的二次‘被抓取’，用户也不会对其提出异议，因为在用户可见的范围内，其信息的可用性是有限的，并不足以谨慎对待”。“一旦公民个人信息经过大数据处理，密切地结合起来时，信息的可用性就产生了‘质变’。”第一个论断是为了设定形式完全合法的情形。在以往情况下，公民授权信息被二次抓去，并不违反法律法规以及行业规则，信息的可用性也并没有产生质的变化，只是在互联网上传播的更为广泛了。但随着大数据行业的兴起，只要有足够的数据源，即使信息之间并不严格关联，也能够通过大量的计算来挖掘信息的可用性。在商业公司手里，这些被挖掘出的信息可以更好地为用户提供便利，让服务业更加个性化，是合法合规的，但在不法分子手里，就如前文所述，可信态的信息会使得传统犯罪的成功率更高，所以笔者希望去论证这种数据抓取行为，是应当受到管制的，也是有可能构成犯罪的。而在这种入罪化的论证路径上，笔者认为，存在这样一个“靶子”，即存在社会危害性的是对大数据处理过后的信息进行利用的其他犯罪行为，法益侵害并不是由爬虫行为造成的，而一定条件下的数据抓取、大数据处理行为本身又完全不存在形式违法性，此时对数据抓取行为进行刑法角度的规制，就引起了是否会违背罪刑法定原则，或有损刑法谦抑性的思考。对此，可以从以下几个角度进行考察。</p>\n<p>1.是否存在理论正当性</p>\n<p>首先是行为是否具备社会危害性。社会危害性这个概念在近年来的刑法学界中饱受批判。如有学者指出，如果社会危害性是犯罪的本质属性，而显然具有社会危害性的行为并不全都会收到刑法的规制，那么社会危害性就需要依赖刑事违法性，就变成了一种形式上的属性，产生了循环论证的困境。但笔者赞同社会危害性的判断也是有标准的，社会危害性解释了违法行为的本质，是主观恶性和客观危害的统一。有学者认为是客观实害或现实威胁，也是类似的观点。就上述大数据爬虫行为而言，考察主观恶性，就是要考察行为人是否明知自己所抓取的数据是否具有“质变”的可用性、是否明知这些信息有可能被他人所利用、是否明知他人的后续犯罪行为会造成法不容许的损害。如果行为人在 “明知”的情况下进行数据的抓取，即使不存在前文所述的形式违法性，合法的爬虫行为也会因为他人的犯罪结果而变得“无价值”，作为后续犯罪原材料的信息也是如此，主观恶性也得以证明。而入罪标准的客观危害性判断，应当从两个方面展开：一是行为现有或可能产生的规模。根据历次刑法修正案来看，许多在现实生活中极少数发生的犯罪行为都被予以了除罪化或轻罪化，就说明一种行为在社会上具有一定规模才会进入刑法的视野。笔者认为，大数据爬虫行为是符合这个标准的，前文中已经给出了目前民法、刑法领域对获取公民个人信息的案例，并不是个案。而作为后续犯罪的套路贷、校园贷、电话诈骗也已对许多公民造成了损害，刑法也已经介入。那么相比于在后续犯罪发生之后再进行规制，在信息传播的源头为何不可以进行规制呢？笔者是持肯定态度的，由于公民个人信息的特殊性，爬虫获取的公民个人信息经过大数据处理后，如果进入互联网流通，会造成非常严重的抽象危险。所以大数据爬虫行为满足社会危害性的标准。其次是刑罚的不可避免性。刑法作为最为严苛的法律，具有补充性、辅助性的特征。如果民法或其他部门法可以对某类行为进行规制的情况下，刑法不应当介入，非则会造成犯罪圈的不当扩大，侵犯公民权利。而目前从民法角度来看，目前只能够规制有限主体之间的权利义务，而大数据爬虫行为的特点就是全面，获取的公民个人信息动辄以百万、千万记，涉及的对象和客体众多，在行为的规制上民法实在无能为力。网络安全法、个人信息保护法等也只能作为前置法，为行政法和刑法提供支撑，而上文已经论证了大数据爬虫行为的社会危害性，行政法的处罚力度并不足以治理该类犯罪，所以刑法有必要对大数据爬虫行为进行规制。</p>\n<p>2.是否存在现实可能性</p>\n<p>首先是技术可能性，即有没有可能在大数据爬虫行为入罪后对其进行惩罚。在技术上包括犯罪人有没有被抓捕的可能。目前来看，随着互联网技术的发展，在网络上进行数据的交易在侦查阶段是具有难度的，但这并不代表不可能进行抓捕。从计算机技术的角度看，公民个人信息作为一个数据包，往往是通过文件或者链接的形式转移的，载体包括论坛、社交媒体、网盘等等，这和淫秽电子信息的存在和转移方式并无不同，而对后者的打击治理早已成为常态。并且，随着区块链理论逐渐普及，如果公民个人信息的流通能够在互联网上留下痕迹，网警自然可以追溯到源头进行抓捕。而就成本而言，比照跨国电信诈骗等需要耗费大量人力财力的犯罪，公民个人信息因为其受到国家的管制，大数据爬虫犯罪也应如此。再者，就是司法上的可能性，目前计算机相关犯罪已在司法实践上提供了大量经验，信息和数据在司法活动中也有其独特地位，综上，运用刑法来规制大数据爬虫行为是具有技术可能性的。</p>\n<p>其次是社会的接受可能性。将原本并非刑法规制对象的行为纳入，需要考虑到社会各界的接受能力。对于民众而言，犯罪圈的扩大不能损害到他们朴素的法意识，要基于社会风俗、文化基础来判断民众是否能够接受，如果绝大多数民众都对此类行为持积极态度，刑法的介入就存在原则性问题，不过上文已经论述了大数据爬虫行为导致的后续犯罪的危害性，所以进行有限度的入罪是符合一般民众利益的。对于市场经济而言，大数据爬虫行为首先是一个技术，并不只针对公民个人信息，而一些对民众、社会有利的互联网功能依赖于这项技术，所以在犯罪行为的认定上不能与整个市场经济的利益冲突。不过，目前看来，绝大多数大数据爬虫行为是同时侵害了公民权利和商业利益的，并不是市场经济所认可的，所以在社会对于该行为的入罪化是有接受可能性的。</p>\n<p>综上，在同时具备理论正当性和现实可能性的情况下，大数据爬虫行为应当予以犯罪化，但必须要符合罪刑法定等原则，在程序正当性上不能存在纰漏。</p>\n<p>三、大数据背景下爬虫行为侵犯公民个人信息的规制路径</p>\n<p>立法层面</p>\n<p>前文已述，刑法对于公民个人信息的保护主要依赖于网络安全法和相关行政法规、规章，个人信息保护法、《数据安全管理办法》也将成为其规范的支撑。所以，就刑法分则而言，笔者认为无须进行改动。大数据爬虫行为的规制，即对遵守协议的多次爬虫的规制，笔者认为可以通过多种路径开展。</p>\n<p><strong>一是在行政法规中明确规定公民个人信息的收集必须得到一手授权，也就是否定爬虫协议对公民个人信息抓取所赋予的合法性。</strong>关于包括网络爬虫方式在内的数据收集行为的规制文件，根据笔者的检索，目前最新是国家互联网信息办公室发布的《数据安全管理办法》。该办法在第9条规定：“另仅当用户知悉收集使用规则并明确同意后，网络运营者方可收集个人信息。”概括的来说，该条规定即一手授权规定，要求网络运营商在收集用户一手信息前必须得到明确的授权，是十分有必要的。但该条规定仍然存在模糊之处，这一点可以结合第30条来思考，第30条规定：“网络运营者对接入其平台的第三方应用，应明确数据安全要求和责任，督促监督第三方应用运营者加强数据安全管理。”在典型情况下，接入第三方应用，指的就是没有一手授权的运营商使用有一手授权运营商收集的数据，但从该条字面意思来看，“接入”这一行为是在多方网络运营商合作运营下发生的，而根据前文的论述，这种情况只是公民个人信息在一手授权方收集后转移可能情况的一小部分。第三方应用与网络运营商之间的桥梁是二者的商业协议，而非爬虫协议或者说是爬虫行为。从这一点上看，《数据安全管理办法》并未在条文上对本文所指出的大数据爬虫行为，也就是符合爬虫协议的多次涉公民个人信息收集行为进行规制，是存在一定缺陷的。不过从第14条：“网络运营者从其他途径获得个人信息，与直接收集个人信息负有同等的保护责任和义务。”可以看出，无论从何处、以何种方式获取公民个人信息，数据的保护义务都是必须遵守的。而结合前文对公民个人信息特殊性的论述，笔者建议该办法原则上禁止第三方或其他网络运营商通过任何方式抓取涉及公民个人信息的数据。若第三方需要公民个人信息以供运转，那么在用户使用第三方功能，或第三方应用接入时必须重新以符合《数据安全管理办法》规定的用户协议或者同意书的方式来获取合法性。若有其他的运营商需要使用第三方获取的信息，同理也必须重新申请公民授权。当然，在涉及公共利益、国家安全等情况下原则上不需要一手授权，法律明文规定或国家机关发布的信息也不需要一手授权。</p>\n<p><strong>二是设定保密义务，要求经过法律授权或公民授权抓取一手信息的主体必须严格履行保密义务。</strong>按照前文的论述，需要法律法规严格监管的公民个人信息，应当是识别态和可信态的信息。可信态的信息往往需要处理，并非一手数据，而识别态信息则不然。识别态信息作为可信态信息的原材料，不应当以任何方式在网络上流通，所以网络运营商必须设置严格的防爬程序、信息加密手段，防止其他的互联网主体获取这些信息，这是由公民个人信息的特殊性决定的。如果负有保密义务的主体在具备期待可能性的情况下故意或过失的违反了保密义务，同样有承担刑事责任的风险。</p>\n<p><strong>三是法律法规应当以明文的方式否定爬虫协议对公民个人信息收集行为的效力。</strong>公民个人信息对于互联网正常运转来说是必不可少的，不应当过度限制网络运营商对其的收集和使用，但一手授权的申请已足以满足这种需要。从计算机技术的角度看，爬虫技术是为了大批量、自动的获取数据，这种技术如果用于公民个人信息的抓取，会导致大规模的公民个人信息暴露在网络之上。以如家、汉庭等酒店开房记录泄露为例，规模达到2000万的公民个人信息，如果落入不法之徒的手中是极其危险的。数据的收集就是为了使用，而互联网本身并不能保证数据的安全性，所以有必要在数据的收集阶段就进行规制。在笔者看来，公民个人信息如果以一定规模出现，其可能给公共利益带来的危险不小于放火、投毒等犯罪，应当以抽象危险犯的角度来看待大数据爬虫行为，将其严格的限制在国家治理或者科学研究领域。四是严格限制大数据处理技术与爬虫技术的结合，如前文所述，爬虫抓取公民个人信息的行为原本并不会带来多大的损害，但随着大数据处理技术和计算机硬件的突飞猛进，上亿的数据在短时间内 也能完成匹配。如果某一主体对多个网络运营商公开的公民个人信息进行抓取，并通过大数据进行处理，很容易就可以将公民个人信息转化至可信态。比如，在购物网站中抓取某公民住址、喜好、财力、购物频率，在外卖平台上抓取其作息、饮食习惯、三餐规律，在微博等互动媒体上抓取其观点表达、联系人、行动轨迹，这些信息经过大数据处理比对后，可以轻易地掌握一个公民的生活、工作状况，从而针对性地开展犯罪计划，下至入户盗窃上至电信诈骗。所以，法律法规应当明文禁止使用大数据技术对通过爬虫批量获取的公民个人信息进行处理，在符合其他规定的情况下，原则上仅允许爬虫爬取单个平台的数据，或者允许用大数据技术处理非批量获取的数据。法律法规的明文规定并不能阻止大数据爬虫行为的发生，就像设置故意杀人罪并不能阻止犯罪分子杀人一样。但通过技术和法律的双重角度考察，对大数据爬虫行为进行细致的规定，可以引导社会公众，警示潜在的犯罪人，这种行为并不被法律所允许，一意孤行必将得到法律的制裁，同时也为后续的司法活动提供了支撑。</p>\n<p>司法层面</p>\n<p>司法层面的规制，主要就是讨论前文所述的靶子行为，即符合多次爬虫协议的数据抓取、对公民个人信息的大数据处理行为等。</p>\n<p>在靶子行为中，行为主体通过符合爬虫协议的方式抓取其他网络运营商的数据，或者抓取了网络运营商公开在互联网上的数据，如淘宝网的商品评价相关信息。此时这种行为在表面上并不具有违法性，但如果该信息可以作为原材料，经过大数据处理而使可用性上升，则根据立法层面第三点，应当否定其合法性。根据刑法修正案（九）修改后的刑法第253条，以及2017年《最高人民法院、最高人民检察院关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释》关于情节严重和情节特别严重规定的，应当依法判处刑罚。如果行为人不仅获取、出售上述信息，并且使用该信息取得作为数据源头的网络运营商的市场优势，则已超出牵连犯的概念，在符合其他要件的情况下，应当同时构成侵犯公民个人信息罪和侵犯商业秘密罪，数罪并罚。其次，需要讨论的是利用大数据对公民个人信息的处理行为。根据《数据安全管理办法》第27条第1款规定：“从合法公开渠道收集且不明显违背个人信息主体意愿”，可见收集、处理、使用公民个人信息是否具有合法性，一定程度上依赖于信息主体的意愿如何。笔者认为，这种意愿一方面是通过用户协议或者同意书来判断的，另一方面则是需要通过法律来推定的。在繁忙快速的社会生活中，绝大多数互联网用户为了节省时间和精力，并不会对用户协议进行阅读，这是非常常见的现象，也是通过法律法规无法解决的，此时就需要法律法规来承担保护公民个人信息安全的功能，替互联网使用者作出判断。即法律法规可以推定他们并不愿意自己的个人信息被大量的收集，不愿意自己的信息被大数据技术比对处理从而获得识别性。从这种角度看，笔者认为，哪怕是在获取来源上合法的数据，如果经过了大数据技术处理，也会造成公民个人权利的损害。那么，当行为人对一定规模的数据进行处理，使得识别态数据朝着可信态数据转化的话，即使其没有主动出售、使用处理后的数据，也应当认为其行为具有危害性，因为一旦其进入互联网则无法被消除，所以亦应当以侵犯公民个人信息罪论处。</p>\n<p>结语</p>\n<p>随着科技的不断发展，公民个人信息也愈发得到重视，也正是因为如此，本文在许多论述、观点表达上采取了比较激进的态度。公民个人信息的特殊性，使得其在互联网环境下非常容易造成危害。传统观念下，公民个人信息是否具有危害性取决于其是否具有识别力，而爬虫技术和大数据处理技术的发展，使得这种表面的识别力不再可靠。公民个人信息在量上的不断增加，最终会在大数据技术的催化下质变，不仅会对公民的隐私权造成损害，当这些信息成为其他犯罪的原料或工具时会造成更大的损害。公民个人信息应当牢牢地把握在公民自身和国家政权的手中。互联网是有记忆的，数据是可以被无限复制、永久保存的，本文观点或许存在偏颇，但是对于这种关乎民生、社会安定的事项，采取激进一点的态度利大于弊。既然数据无法从互联网上被消除，那么就从数据的创建和获取入手，通过刑法、行政法、民法多重角度的规制，不断寻找新兴技术和公民权益之间的平衡点，进行更加细致和全面的研究，最终能够让科技造福于人民。</p>\n<p>一、信息与数据的进化二、法学上的个人信息三、法学上的个人数据</p>\n<p>四、结论：个人信息与个人数据法学上的一致性</p>\n<p>数据与信息的价值不仅仅体现在人格利益上，在数据经济时代，更突出体现在其财产利益上。法学上有个人信息”与“个人数据”之概念，二者有何区别？如何从法学上准确界定二者？有无必要区分二者的法学含义？从数据与信息的财产价值分析引入，深入分析个人信息和个人数据的法学定位，并最终论证了个人信息与个人数据作为法学概念，其所指向的保护对象是一致的，并无严格区分的必要。 </p>\n<p>一、信息与数据的进化</p>\n<p>在人工智能、大数据和云计算等新技术驱动下，数据的价值被充分挖掘。数据成为经济增长的生产要素，数字经济成为全球经济的新贵族。大数据时代是信息社会的高级阶段。从二十世纪七十年代人们读到丹尼尔·贝尔《后工业社会的来临》一书开始，信息社会的概念迅速引起西方国家的热烈讨论。信息社会是人类社会继农业社会、工业社会之后的第三次社会变革，而大数据、人工智能的应用是信息社会经历了信息化和互联网之后的又一次信息革命，是人类在经历了蒸汽机和电力两次工业革命之后的第三次革命，可以称为信息革命。从“信息成为社会资源”到“数据成为社会资源”，反映的均是信息社会一种新型的财富的出现，数据成为财富。数据被认为是新的石油，因它通过微信和脸书等社交平台创造巨大利润，同时它也为百度和谷歌等网站以广告形式获得巨大收益。 </p>\n<p>数据蕴含着丰富的潜在价值，已成为核心资源、数据平台的依托性资源、数字经济发展的支撑。数据已成为核心谋生手段。控制了更多的数据，便掌握了更多的无形资产、更多的财富。有个公认的观点：数据被称为“21世纪的石油”。数据是信息社会的一种特殊资源，是与物质、能源并列的基础性资源，但数据的获得与物质和能源的获得所依赖的工具不同，它依赖互联网、存储、传输、接收和利用。大数据等信息资源日益成为重要的生产要素和社会财富。通过数据平台的应用，人们的生产和生活成本大大降低；通过数据分析，利用数据与实体经济的融合，促进实体经济发展，形成新的经济增长点，已成为近五年来我国各省市拉动经济增长的新引擎。个人数据的使用价值被充分挖掘，创造财富。非法获取个人数据谋取暴利的案例，诸如倒卖个人数据的非法行为从国内到国外屡禁不止。快递小哥非法销售客户个人信息等是因为数据财富价值而爆发的案例。在Radio Shack Bankruptcy Case中，律师反对出售消费者个人信息，并获得了其他州的赞同。</p>\n<p>二、法学上的个人信息</p>\n<p>“个人信息”法学概念综合说的提出 </p>\n<p>对个人信息的概念，从立法上，世界范围内主要有三种模式的规定。第一种是概括式立法，以总括式方式规定个人信息是权利客体；第二种是列举式，尽可能具体地列举个人信息的范围和类型作为权利保护的客体；第三种是折中式，即通过概括式和列举式结合的方式来界定个人信息的范围。选用哪种立法模式以及采用哪种学说在理论上对“个人信息”进行法学概念界定，需要科学考究。 </p>\n<p>在我国民法典人格权编中，个人信息和隐私权放在一起予以规定。法学界在普遍认可“个人信息”概念之前，用“个人隐私”或“隐私权”概念来包含个人信息的内容。何谓个人信息，法学理论界主流观点有以下三种学说：隐私说、关联说、识别说。隐私说没有区分私密信息和非私密信息。民法典第1032条对隐私进行了具体规定“隐私是自然人的私人生活安宁和不愿为他人知晓的私密空间、私密活动、私密信息。”第1034条对个人信息进行了规定“个人信息是以电子或者其他方式记录的能够单独或者与其他信息结合识别特定自然人的各种信息，包括自然人的姓名、出生日期、身份证件号码、生物识别信息、住址、电话号码、电子邮箱、健康信息、行踪信息等。个人信息中的私密信息，适用有关隐私权的规定；没有规定的，适用有关个人信息保护的规定。”从民法典的立法条文，可以明确地肯定，隐私说已经不符合大数据时代“个人信息”的概念所应包括的内涵。关联说认为凡是与个人相关的信息均是个人信息。此定义范围又显过于宽泛，不利于个人信息保护的落实。例如某人上午坐了某车牌号的出租车，与之产生了关联，下午坐了另一车牌号的出租车，与此车也产生了关联，如若按关联说，这两辆出租车信息均应属于该人的个人信息，显然不合情理，不合法意。关联说不仅不会保护个人信息，相反会给自然人带来极大的麻烦。识别说在学术界的认可度高于隐私说和关联说。识别说是指通过客观的信息可以具体地确定到某一自然人。1990年的联邦个人资料保护法和我国台湾地区所谓“个人资料保护法”便是采用识别说。根据识别标准的不同，分为间接识别和直接识别。间接识别是指需要借助其他信息辅助才能识别出信息主体，该信息单独无法识别出信息主体，例如身高、体重、学历。直接识别是指能够通过该信息单独直接地识别出信息主体，而不需要其他信息辅助，例如指纹，照片。本文认为直接识别说是狭义的识别说，间接识别说是通过关联性信息识别信息主体。所以，法学上的个人信息应采取“识别说”和“关联说”相结合的综合说。从民法典第1034条对个人信息的定义也可以判断出，我国立法上采取的是“狭义的识别说+关联说”的综合说。 </p>\n<p>“个人信息权”具体人格权的提出</p>\n<p>个人信息的法学属性是指个人信息所承载的利益的法学属性。抛开其承载的利益，单独谈个人信息的法学属性是没有意义的。法律保护的不是个人信息本身，而是个人信息上承载的利益。学术界主要观点有：财产权说，认为个人信息的价值体现在其承载的财产利益，而非人格利益，此学说以偏概全，过于注重个人信息的经济价值，而忽视了其本有的人格价值，将个人信息划分为财产权是本末倒置；一般人格权说，认为个人信息应当纳入一般人格权的保护范围，认为个人信息是自然人享有的人格上的独立、自由、平等和尊严，但此学说与财产权似乎背道而驰，走向了另外一个极端，难以保护个人信息上承载的财产利益；隐私权说，认为个人信息承载的利益属于具体人格权保护的对象，属于隐私内容，但随着人们对个人信息与隐私概念认识的加深，这种学说逐渐被抛弃；具体人格权说，认为个人信息可以权利化，个人信息权应为一种独立的具体人格权，将其作为具体人格权予以法律定位，并不会妨碍其财产价值的实现，例法人没有一般人格权，但法人有名称权、名誉权和荣誉权三项具体人格权，名称权尽管是一项具体人格权，却也承载着商业价值，有经济利益，由此类推，个人信息权可以被定为一项具体人格权并不会妨碍个人信息商业价值的实现，不妨碍个人信息经济利益的保护此外，根据人身权优先于财产权受保护，人格利益优先于财产利益受保护的法理精神和法学位阶，将个人信息从法律上定位为具体人格权是最优的保护模式。 </p>\n<p>三、法学上的个人数据</p>\n<p>“个人数据”概念的提出</p>\n<p>“个人数据”与“个人信息”以及“个人资料”概念在不同国家、地区的立法中均有使用。香港地区对于个人数据的定义记载于“个人资料条例”，指的是“符合以下说明的任何数据：（a）直接或者间接与一名在世的个人有关的；（b）从这些数据直接或间接确定有关的人的身份是切实可行的；（c）此类数据的存在需要进行审查和处理。”我国台湾地区2010年所谓“个人资料保护法”以及1995年所谓“电脑处理个人资料保护法”规定个人资料是“指自然人的姓名，出生日期，身份证的统一编号，特征，指纹，婚姻，家庭，教育，职业，健康，病史，财务状况，社会活动和其他足以识别个人的数据。”英国、欧盟立法中更是直接使用“personal Data”。我国民法典和个人信息保护法使用的是“个人信息”概念，但其所表达的内容和欧盟GDPR中规定的“personal Data”是一致的。笔者认为个人数据概念的提出，是更严谨地符合翻译语义，但其内涵与个人信息并无实质区分的必要。</p>\n<p>考虑将个人信息与个人数据区分开来的观点是受美国隐私权理论的影响。通说认为，美国立法中将个人数据保护放在隐私权中，但随着国际交流的广泛渗透和世界数据经济的猛势发展，美国学术界近年来也关注到个人数据的独立概念。尤其是个人数据中也有部分内容是数据主体愿意公开或用来交易换取商业利益的。数据不仅包括可以归类为个人信息的数据，即个人数据，还包括非个人的数据，如商业数据、公共数据等，所以，立法上在侧重私法权益保护时，将“个人数据”用“个人信息”替代，而在侧重公共利益保护时，使用“商业数据”和“公共数据”概念。个人数据概念的提出，是与商业数据、公共数据予以对应的需要。 </p>\n<p>从法学上对数据予以定义，是保障数据成为法律概念的前提。法律只规范可以成为法学研究对象的现象。根据数据开放的流程，先分解数据产生的内在逻辑和外在表现，可以分为源生数据、衍生数据和数据产品三个进阶。源生数据是没有经过加工的数据，衍生数据是经过加工、匿名化处理的数据，数据产品是经过加工的数据最后向外界呈现的状态，该状态可能是有独创性的知识产权成果，也有可能仅仅是信息的再表达，并无独创性，不属于知识产权范畴。法学上的数据可被定义为：数据是指源生数据、衍生数据和数据产品的总称，具体是指，某种客观事物经过人的主观意识加工，以某种客观样态表达出来的信息。根据其是否具有独创性，有不同的法律属性，或是知识产权保护的客体，或是民法典中保护的一般民事法律关系客体。公共数据开放中的数据是指不具有独创性，不被归为知识产权客体，但可以被纳入民法典中民事法律关系客体的数据。而个人数据只是数据概念中的一个下位概念。个人数据概念的提出是建立在数据可以成为法学概念的基础上的。</p>\n<p>“个人数据”人格权属性的提出</p>\n<p>学术界尚存在强调区分“个人信息”与“个人数据”的观点，并对“个人数据”的法律属性进行了分析，提出不同学说，如虚拟财产说，知识产权说，人格权说等。数据作为虚拟财产的学说观点在我国民法典第127条得以认可。在国外也有学者提出“个人数据财产权”概念，如美国有不少学者认为，数据主体所享有的关于个人数据的权利理所当然地包括数据的财产权，并且应该得到法律的保护。立法中规定的数据作为虚拟财产予以保护在我国司法实践中起到了指引作用，为法官判案提供了依据，但并不能认为个人数据从属性上讲是财产权。数据能够被归为财产权的客体是只商业数据和公共数据，不应保护个人数据。个人数据承载的首先是个人利益，是人格利益，个人数据与商业数据和公共数据不同在于其承载的利益属性不同。</p>\n<p>笔者在上文已经提出了将个人信息权作为一项独立的具体人格权予以定位，鉴于个人数据与个人信息在法学概念上的同义性，笔者认为可以将个人数据定位为人格权保护的客体，但没有必要再提出“个人数据权”这样一个法律概念，有“个人信息权”一个法律概念足矣。</p>\n<p>四、结论：个人信息与个人数据法学上的一致性</p>\n<p>法学界对于“个人信息”和“个人数据”的区分依然纠结不清，其原因在于自然科学研究成果中对“信息”“数据”进行区分。信息和数据最早被认为是信息科学、计算机科学范畴的术语。但是，在大数据时代，数据早已不再是单纯的信息载体，数据本身就是具体的信息，如影像、图片、音频、表格等。二者保护的对象均是数据或信息承载的人格利益和财产利益，而并非数据或信息本身。故没有必要从法学概念上区分个人数据与个人信息。二者的区别是在应用场景中。在强调人格利益保护的场景中用“个人信息”更准确，例如姓名、身高、住所等。在强调财产利益保护的场景中用“个人数据”更准确，例如对个人数据的抓取，用于匿名化清晰，进而用于大数据分析，大数据交易。</p>\n<p>无论是“信息”还是“数据”，在大数据时代，从财富形式的角度看，其区分的意义不大。尽管从情报学的角度分析，数据是一种原始的记录，本身不具有任何意义，而信息是对数据进行加工后的描述，是“相互关联的数据”，但随着大数据概念的提出，数据已经不仅仅是指一种记录，它不仅仅是数字，还包括文字、图片、影像等。从法学保护角度，“信息”与“数据”的概念几乎可以互换。从欧盟到美国、从日本到韩国等等国家或地区的数据保护立法，均没有在“信息”与“数据”的概念上过于纠缠。根据国际流行的用语，“DATA”一词更普遍。在信息社会的高级阶段，即大数据应用成为信息开发和利用的主要手段的阶段，用“数据”取代“信息”来描述新型的财富形式，更符合时代特征。例如，在GDPR中，立法者用“DATA”而不是“INFORMATION”；在美国，近几年各州立法均采用DATA；中国的互联网公司阿里巴巴创始人马云在2014年就提出观点，我们这个时代已经从IT（Information Time）步入DT（Data Time），也就是从信息技术时代步入数据技术时代，用数据创造财富价值，实现经济增长是未来经济发展的核心。 </p>\n<p>个人信息和个人数据在实质内容方面并无区别，之所以会出现文字上的区别，是由于我国学者在研读外文文献时翻译的不统一。在域外立法中，并无区分个人信息与个人数据的立法，例如欧盟对数据保护历史悠久，但并无一部法律保护个人信息，而是保护个人数据，但这不意味着个人信息在欧盟不受保护，而是因为在欧盟法中，个人数据就是个人信息。</p>\n<h2>葛彩慧｜个人信息处理原则的历史考察与比较研究</h2>\n<p>个人信息处理原则的历史考察与比较研究</p>\n<p>要目</p>\n<p>一、背景引入二、个人信息保护原则的发展演变与比较分析三、总结——规则设计的殊途同归</p>\n<p>原则条款所涵盖的信息处理关系主体权责以及对信息流通中各阶段行为的规制 要求等内容，使其对整个个人信息保护法体系发挥着宏观层面提挈作用。1973年有域外法以保障信息主体权益为基本导向，围绕信息处理的“公平性”和“公开性”要求所建立的公平信息实践原则体系成了此后个人信息处理原则设计的框架基础。随后，信息流通速度的加快和跨区域组织的推动使得公平信息实践原则在全球范围内进一步传播，并在此基础上逐渐形成了以合法正当、目的限制以及主体参与原则等为代表的一系列被广泛接受的立法价值理念，统一的机制构建已成为目前世界个人信息保护立法中信息处理原则的发展趋势。</p>\n<p>一、背景引入</p>\n<p>随着人类进入信息化时代，从日常生活乃至社会治理，大数据通过对数据的规模化收集、存储和利用，以达到最大限度地提升效率、改善社会治理方式和实现经济利益最大化的目的。在这一过程中，公民作为独立个体，其个人信息因具有可识别性而与身份、隐私息息相关，对于个人信息的保护关乎公民人格利益与尊严的保障；保护个人信息不受非法侵害是在大数据时代信息泄露与非法利用现象日益严重这一背景下对立法提出的重要挑战。自1970年以来，各国纷纷制定个人信息（数据）保护法规，个人信息保护立法逐渐成为20年代末至今新信息技术快速发展过程中的一项重要议题。其中，个人信息的处理原则条款的设置为涉及隐私和信息保护的国家法律提供了基本政策指引，同时又关 涉到个人信息的受保护范围、程度和处理条件等内容，我国在制定个人信息保护法时亦将其置于起到提挈作用的“总则”一章，由此可见其在个人信息保护问题上的宏观指导意义。</p>\n<p>据澳大利亚学者Graham Greenleaf统计，截至2021年1月，世界上共有145个国家和地区制定了个人信息保护法规。从这些法规的制定和颁布时间来看，个人信息保护的立法工作启动于20世纪70年代，德国黑森州于1970年制定了首部数据保护法令，随后美国、奥地利、荷兰、澳大利亚等9个国家也在这段时间内出台了个人信息保护法律。总体而言，这一时期的信息保护立法仍处于初级阶段，虽然对于个人信息的保护在范围、条件等规定的设置上不够清晰，有待于随信息技术的发展做进一步扩充与完善，但其中某些信息处理原则的确立，如“信息公平实践”原则，对后续立法产生了重要影响。</p>\n<p>随后在20世纪80年代到20世纪90年代，更多的国家开始重视个人信息保护并相继出台了相应法规。据统计，这一时期共有35部信息保护相关的法规颁布，值得一提的是，除了部分国家和地区以外，一些主要的国际组织也开始制定区域性的个人信息保护法，如亚太经合组织与欧洲议会和欧洲理事会分别于1980年和1995年先后颁布的相关规范文件均从信息主体权益保护和信息处理与流通等角度对个人信息处理行为作出了规制。这一阶段的信息保护法所确立的信息处理原则进一步在信息公平实践原则基础上构建的基本框架，并直接推动了世界范围内信息处理原则条款制定的统一化。</p>\n<p>21世纪，计算机技术的飞速发展为个人信息保护提出了前所未有的严峻挑战，世界主要国家为应对这种挑战纷纷制定或修订个人信息保护法，以适应个人信息保护需求。截止到2021年1月，共有87部个人信息保护法实施。这一时期立法的特点是数量多、发展快和趋同性，某些特定的处理原则被接纳成为共识，成为各国普遍接受的立法价值理念，其中最具代表性的是由欧盟制定的统一数据保护条例，其所采取的合法正当、目的限制以及完整性和保密性等个人信息处理原则对各国信息保护立法具有重要的总结归纳和借鉴意义。同时，其他立法也在此前构建起的完整框架基础上，形成合法正当、最小必要以及主体参与等共同要素，并以此指引本国个人信息保护法的实施。</p>\n<p>基于上述统计，下文将分别从纵向和横向两个维度出发，分别以个人信息处理原则的历史演进，以及当下在世界范围内普遍接受的个人信息处理原则比较分析为切入点，展开进一步的研究。</p>\n<p>二、个人信息保护原则的发展演变与比较分析</p>\n<p>20世纪70年代：以强调信息主体权益保障为导向的公平信息实践原则</p>\n<p>始于20世纪60年代的第五次信息技术革命以电子计算机的普及应用及计算机与现代通信技术的有机结合为标志。为了解决资源共享问题，由单一计算机发展而来的计算机联网技术实现了数据通信与数据共享，自动化信息处理技术的发展也提高了信息行为效率，个人数据作为一种非以典型形式存在的信息开始显露出其价值所在，部分国家由此开始着手制定个人信息保护相关法律规范。</p>\n<p>20世纪70年代被称为个人信息保护立法的“黄金十年”，这一时期最有代表性的立法是由美国于1973年出台的《记录、计算机和公民权利》（又称“HEW报告”）这一报告由卫生、教育和福利部为了对计算机时代的记录保存实践进行研究成立的“个人数据自动化系统咨询委员会”制定，其所确定的个人信息保护的公平信息实践原则（Fair Information Practices，简称“FIPs规则”），不仅为美国之后包括1974年隐私法中的个人信息处理原则确立了框架，也影响着之后其他国家信息处理原则的确定——无论是此后经济合作与开发组织制定的《隐私保护和个人数据跨境流通指南》还是欧盟的《关于涉及个人数据处理的个人保护以及此类数据自由流通的第95/46/EC/号指令》和《一般数据通用条例》均在此基础上继受了并发展了这一原则。</p>\n<p>委员会将“公平的信息实践”解释为信息处理行为“遵守特定的保障要求”，并且“这将禁止一切违反要求的不正当的信息实践，对不正当的信息实践实施民事和刑事处罚，或提供禁令以防止违反任何保障要求的行为；最后，将允许无论是个人还是集体诉讼，都可以要求实际支付违约金和惩罚性赔偿”。HEW报告中确立的公平信息实践原则包含如下要求：</p>\n<p>1.绝对不能出现秘密存在的个人数据记录系统</p>\n<p>这一原则体现了个人信息收集的公开性要求，它要求收集个人信息必须是为信息主体所知悉的，主体必须意识到自己的个人信息正在被相关个人或机构所收集，不得未经告知擅自进行收集处理。</p>\n<p>2.个人必须有一种方法来查找记录中存在有关他的哪些信息以及将被如何使用</p>\n<p>这一原则体现了对信息主体查询权利的保障，即在信息被收集后，信息主体应当有明确的途径可以对自己被收集的信息内容、范围和处理、使用方式进行查询，这样既保障了个人信息权利，又构成了对信息收集者的监督，可以避免个人信息被不正当地收集利用。</p>\n<p>3.个人必须有一种方法可以防止未经其同意而将出于某目的获得的有关他的信息用于其他目的或将其用于其他目的</p>\n<p>这一规定是对信息收集利用目的进行限制的体现，它要求信息收集者在获取个人信息后，必须严格按照收集目的作进一步处理或使用，不得作超出收集目的范围以外的处理、使用，一旦超出，则必须再次就该超出目的获得信息主体的同意。这实际上赋予了信息主体保护自己的信息不受超出收集目的以外目的的处理、使用的权利，同时也是主体知情同意原则的体现。</p>\n<p>4.个人必须有一种方法可以更正或修改有关他的可识别信息的记录</p>\n<p>这一原则赋予了信息主体更正和修改被收集的个人信息的权利，当信息收集者或处理者持有的个人信息不正确或有待更新时，信息主体必须有明确的途径可以对这些错误或待更新的信息进行更正修改，以保护自己的权益。</p>\n<p>5.任何创建、维护、使用或传播可识别个人数据记录的组织，都必须确保其数据预期用途的可靠性，并且必须采取合理的预防措施，以防止滥用数据</p>\n<p>委员会认为，公平信息实践原则代表了个人应享有的最低限度的权利，并建议建立一个中央联邦机构，负责管理所有自动化个人数据系统，该机构负责注册或许可对此类系统的运行，并建立特定的保护措施作为注册或许可的条件。通常，建议的代理机构将成为公共和私人数据库的监督者。</p>\n<p>HEW报告提出了早期的信息处理原则，这些规定从总体上为个人信息收集、处理或使用组织设定了应有义务，包括确保个人信息不作超出收集时确定的范围的使用；保证信息准确和及时更新；采取必要措施防止滥用数据，造成主体权益损害等。其中既涉及对信息主体查询、更正权利的保障，又有对个人信息控制者的强制性要求。然而，某些条文仍然不够完善，如没有按照实际情况为个人信息收集的同意原则创设例外情形、没有涉及对个人信息的匿名化处理、 对信息采集范围未做必要性限缩等。此外，信息公平实践原则在实际运行过程中，法规或信息控制者级别可以相差很大，具体取决于地区、信息控制者、数据类型以及其他因素。例如，问责制可以通过许多不同的机制来实现，包括刑事或民事处罚、各种形式的自治法规、行业法规和隐私政策等。同样，为信息主体提供对自己的访问权限记录可能有不同的例外情况，具体取决于记录是否为雇佣、教育、信用或执法记录等内容，这也进一步导致了原则在适用中的模糊性和不确定性。</p>\n<p>20世纪80-90年代：信息流通加快趋势下的跨区域信息处理原则</p>\n<p>20世纪80年代末，人类开始由工业社会转入信息社会，各国纷纷投入大量资金用于信息技术研究，与此相对应的是个人信息保护立法工作步伐的加快。这一时期，在世界具有较大影响力的两大组织——经济合作与开发组织和欧盟分别于1980年和1995年出台了《隐私保护和个人数据跨境流通指南》和《关于涉及个人数据处理的个人保护以及此类数据自由流通的第95/46/EC/号指令》，在现有立法的基础上顺应信息跨境流通新潮流，对个人信息处理作出了更明确和详细的规定。</p>\n<p>1.《隐私保护和个人数据跨境流通指南》（1980）（以下简称“《OECD指南》”）</p>\n<p>《OECD指南》在第二部分7-14条中对个人信息处理原则作出了规定，具体条文内容如下：</p>\n<p>（1）收集限制原则：个人数据的收集应受限制，必须以合法和正当的方式获取数据，并经主体知晓或同意。（2）数据质量原则：这一原则实际上同时涵盖了两方面的要求，一是目的限定，即获取的个人数据应当与利用目的有关，并进行限于该目的处理；二是数据准确性，要求个人数据应当准确、完整并适时保持更新。（3）目的特定化原则：个人数据的收集目的应当在收集时确定，随后对其的使用应当被限制在实现该目的所必要的范围内，或用于其他与实现该目的不冲突和每次更改时确定的目的。（4）使用限制原则：该原则再一次地强调了个人数据不得被超出前款规定目的地进行使用，但同时又规定了两项例外情形，即已获得数据主体同意或存在法律授权的情形。（5）安全保 护原则：即数据控制者应当采取合理措施确保个人数据安全，防止丢失、损毁、泄露或未经授权的访问和使用等情形发生。（6）公开原则：要求数据控制者公开处理相关的一般政策，同时还需提供现实可行的手段使数据主体得以确定其数据处理情况以及数据控制者的身份等信息。（7）个人参与原则：确认数据主体有从数据控制者或其他人处获得控制者是否持有其相关数据的确认函的权利，并能够在合理时间内，以合理费用和方式、可辨识的形式被告知与其有关的数据信息。同时，还赋予了数据主体删除和更正等权能。（8）责任原则：数据控制者应当就其是否有效地遵守了上述原则承担责任。</p>\n<p>《OECD指南》虽然没有使用信息公平实践原则（FIPs）这一术语，但通过条文比较可以看出，《OECD指南》在针对信息主体权利保障的同时，也分配了信息控制者的职责，实际上仍是在以FI
